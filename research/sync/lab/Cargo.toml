[package]
name = "nsync-lab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measurement harness for nerve cross-device sync research (Nostr, iroh, plain WS over Tailscale)"

# Standalone: not part of the nerve crate's build.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nostr-sdk = { version = "0.45", features = ["local-relay"] }
nostr = { version = "0.45", features = ["nip44", "nip59"] }
iroh = "1.3"
hex = "0.4"
rand = "0.9"
