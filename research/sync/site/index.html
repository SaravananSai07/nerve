<header>
<h1>nerve sync guide</h1>
<p class="lede">Follow, steer and move Claude Code sessions across your Mac, Pi and phone. This page covers how it works and what crosses the wire, what was measured, what's still untested, and how to try it on each device.</p>
</header>

<div class="tldr">
<b>Where it stands (round 2, 2026-10-12)</b>
<ul>
  <li><b>One command per device.</b> <code>nerve setup</code> on the first device prints a code. <code>nerve setup &lt;code&gt;</code> on each other device does everything else: identity, relays, the Claude mod, a background service, and pairing in both directions. Joining took <span class="num">4–7 s</span> (E17, E23).</li>
  <li><b>Claude Code mods are in.</b> A small mod runs inside each Claude session. It does three things:
    <ul>
      <li>submits prompts from other devices, queued safely if Claude is busy;</li>
      <li>answers permission prompts and questions from anywhere, while the dialog stays on screen locally;</li>
      <li>reports each turn as it finishes.</li>
    </ul>
    Questions no longer need "away mode". Terminal paste and settings hooks remain as fallbacks.</li>
  <li><b>Hand-offs are incremental.</b> Only commits the target lacks, plus content-addressed chunks of everything else.
    <ul>
      <li>First hand-off: <span class="num">694 KiB</span>.</li>
      <li>The same session one turn and one commit later: <span class="num">16–19 KiB</span>.</li>
    </ul>
  </li>
  <li><b>The Devices view was rebuilt.</b> Two panes on a laptop, tabs on a phone-sized terminal, with "needs you" first.</li>
  <li><b>Tested:</b> one-Mac runs (E17–E22) and Mac ⇄ Pi over public relays only (E23–E26, E25b), plus 223 unit tests. Clippy is clean.</li>
  <li><b>Still missing:</b> a native phone app; iPhone remains SSH-only.</li>
</ul>
</div>

<h2 id="setup">1. Setting up a device</h2>

<p><b>On the first device</b> (say your Mac):</p>
<pre><code>./install.sh --sync          # from the repo: builds nerve with sync, then runs `nerve setup`
# or, with nerve already built:  nerve setup</code></pre>
<p>It prints a block like this, then waits for another device to join:</p>
<pre><code>nerve setup
  ✓ created device 'mac' (npub1dc6d7h0…cmuflx), relays: wss://relay.primal.net wss://relay.snort.social
  ✓ nerve mod installed for Claude Code 2.1.295 (new sessions load it)
  ✓ background agent runs at login (launchd dev.nerve.sync; log …/sync/agent.log)

Add another device: on it, run

    nerve setup nerve1eyJ2IjoxLCJuIjoibWFjIi…

[QR code of the same text]
The code works once, for the next hour. Anyone holding it can pair a device, so treat it like a password.</code></pre>

<p><b>On every other device:</b></p>
<pre><code>./install.sh nerve1eyJ2IjoxLCJuIjoibWFjIi…      # or: nerve setup nerve1eyJ2…</code></pre>
<pre><code>  ✓ created device 'pi' (npub1hrdrlnv…a3s8km), relays: wss://relay.primal.net wss://relay.snort.social
  … asking mac to pair back
  ✓ paired with mac: mac now trusts 'pi'
  ✓ background agent runs as systemd user service nerve-sync (also while logged out)</code></pre>

<p><b>Each step, and what it does:</b></p>
<div class="layers">
  <div class="layer"><b>Identity</b><span>Creates a secp256k1 key (<code>&lt;config&gt;/sync/device.key</code>, mode 0600) and <code>fleet.toml</code>. The default relays are the two that reliably delivered for brand-new keys in testing. Joining adopts the inviter's relays, including a private one.</span></div>
  <div class="layer"><b>Claude</b><span>On Claude Code ≥ 2.1.287, installs the nerve mod as a local plugin (<code>claude plugin install nerve@nerve-local</code>), loaded by new sessions. On older Claude, writes settings hooks instead and tells you how to enable them.</span></div>
  <div class="layer"><b>Background agent</b><span>The service depends on the OS:
    <ul>
      <li>macOS: a launchd LaunchAgent.</li>
      <li>Linux: a systemd user unit, plus <code>loginctl enable-linger</code> so a headless Pi keeps it after you log out.</li>
      <li>Termux and containers: a detached process, plus a Termux:Boot script.</li>
    </ul></span></div>
  <div class="layer"><b>Pairing</b><span>The joiner trusts the inviter's key, then proves the invite's one-time secret. The inviter's agent trusts the joiner back and acks. A used or expired code gets a clear refusal.</span></div>
</div>

<p><b>Re-running</b> <code>nerve setup</code> is safe: every step checks what's already in place. To check a device later, run <code>nerve sync doctor</code>. It reports the agent, the mod socket, the mod install, every relay, and every peer's freshness, one line each with what to do about a failure. To add a third device, run <code>nerve sync invite</code> for a fresh code.</p>

<h2 id="how">2. How it fits together</h2>

<div class="diagram">  Mac                                                   Raspberry Pi
 ┌────────────────────────────────────┐               ┌────────────────────────────────────┐
 │ claude ──[nerve mod]──┐            │               │ claude ──[nerve mod]──┐            │
 │ claude (no mod: tmux paste/hooks)  │               │ claude --bg  (mod only)│            │
 │                       ▼ unix socket│               │                       ▼            │
 │   nerve sync agent (launchd)       │               │   nerve sync agent (systemd)       │
 │   · scans sessions every 3 s       │               │                                    │
 │   · chunk store  · activity log    │               │                                    │
 │   nerve TUI → D (reads the agent)  │               │                                    │
 └──────────────┬─────────────────────┘               └──────────────┬─────────────────────┘
                │   NIP-44 encrypted, signed Nostr events            │
                ▼                                                    ▼
      ┌───────────────────────────────────────────────────────────────────────┐
      │ relays: wss://relay.primal.net, wss://relay.snort.social (public)     │
      │         ws://&lt;relay-host&gt;:7777 (optional private, nerve sync serve-relay) │
      └───────────────────────────────────────────────────────────────────────┘
                ▲
      phone: SSH (Tailscale) into the Pi → `nerve` → D        Android: Termux can also be a device</div>

<p>Every device runs one <b>agent</b>. It does four things:</p>
<ul>
  <li><b>Publishes</b> a snapshot of its sessions to each paired device whenever something changes, and at least once a minute.</li>
  <li><b>Receives</b> commands from paired devices and carries them out: send text, answer, fetch, hand off, run a job.</li>
  <li><b>Hosts the mod socket</b>, so Claude sessions on the same machine can reach it.</li>
  <li><b>Acks every command</b> end to end. A relay saying "OK" is not proof of delivery: two public relays were measured accepting and then dropping everything.</li>
</ul>
<p>The TUI and the <code>nerve sync …</code> commands talk to the agent through a spool directory, and follow its activity log until the ack arrives.</p>

<h2 id="mods">3. Claude Code mods: what changed</h2>

<p>Mods shipped in Claude Code 2.1.287. A mod is a plugin whose JavaScript runs <i>inside</i> the Claude process and hooks its events. That means it can do things nerve could only approximate from outside before. The full API lives in the type declarations Claude writes into a mod's <code>.claude-plugin/types/</code> on first load: 16,000 lines, read for this round.</p>

<table>
<tr><th>Job</th><th>Before (round 1)</th><th>Now, with the mod</th><th>Why it's better</th></tr>
<tr><td>Send a prompt</td><td>Paste into the tmux pane or Ghostty tab, then press Enter</td><td><code>$.prompt.submit({text, asUser: true})</code></td><td>Queued while a turn runs, never typed into an open dialog (E18b). Works for <code>claude --bg</code> sessions, which have no terminal.</td></tr>
<tr><td>Answer a permission</td><td>Settings hook <code>nerve sync hook</code> + file mailbox</td><td><code>classic.PermissionRequest</code> hook ⇄ agent socket</td><td>Same race with the local dialog, but no shell process per prompt, and the request is withdrawn reliably when answered locally (E21).</td></tr>
<tr><td>Answer a question</td><td>Only in away mode, because the hook hid the dialog</td><td>Races Claude's own <code>AskUserQuestion</code> dialog</td><td>The dialog stays on screen locally. Answer it there or from any device (E20).</td></tr>
<tr><td>Progress</td><td>Inferred from the transcript every 3 s</td><td><code>turn.start</code> / <code>turn.complete</code> with duration and tokens</td><td>Exact turn timing and token use per session, shown in the Devices view.</td></tr>
<tr><td>Status in Claude</td><td>none</td><td><code>$.ui.status</code>: <code>⚠ nerve: ⇄ nerve · pi 4s · 1 waiting on another device</code></td><td>You can see sync is live from inside the session.</td></tr>
</table>

<details><summary>How the mod talks to the agent (protocol)</summary>
<p>HTTP/1.1 over a Unix socket (<code>&lt;sync&gt;/agent.sock</code>, mode 0600) via <code>$.http.fetch(url, {socketPath})</code>. No TCP port is opened. Routes:</p>
<table>
<tr><th>Call</th><th>Purpose</th></tr>
<tr><td><code>POST /v1/hello</code></td><td>Session id, cwd and surface (terminal/desktop) on start.</td></tr>
<tr><td><code>GET /v1/poll</code></td><td>Long-poll (8 s) for prompts from other devices; also carries the status line.</td></tr>
<tr><td><code>POST /v1/request</code></td><td>"This permission or question is pending", with Claude's tool input.</td></tr>
<tr><td><code>GET /v1/wait</code></td><td>Long-poll (2 s) for the remote answer to one request.</td></tr>
<tr><td><code>POST /v1/resolved</code></td><td>"Answered here", so the request is withdrawn everywhere.</td></tr>
<tr><td><code>POST /v1/event</code></td><td>Turn start and turn complete, with usage.</td></tr>
<tr><td><code>POST /v1/ack</code></td><td>Outcome of a submitted prompt; becomes the end-to-end ack to the sender.</td></tr>
</table>
</details>

<details><summary>Two traps found by testing, and how they're handled</summary>
<ol>
  <li><b>A mod hook has 10 s of its own time.</b>
    <ul>
      <li>The first version waited for remote answers in a <code>$.clock.sleep</code> loop. Claude cut the hook off at 10 s, and the request vanished from other devices.</li>
      <li>Time spent inside another <code>$</code> call doesn't count against the budget. So the hook now waits inside <code>$.http.fetch</code> against <code>/v1/wait</code>.</li>
      <li>E19 deliberately answers 20 s after the prompt appears.</li>
    </ul></li>
  <li><b>Claude doesn't abort the hook when you answer at the keyboard.</b>
    <ul>
      <li><code>next.signal.aborted</code> stayed false for 14 s after "Yes" was pressed.</li>
      <li>The mod now also wraps every <code>tool.call</code>. When the same tool call with the same input settles, the request is withdrawn.</li>
      <li>The agent also drops any request whose hook stops polling for 6 s.</li>
    </ul></li>
</ol>
<p>Also found: returning early from <code>tool.call</code> while Claude's permission dialog is open leaves the dialog stuck, and <code>$.ui.ask</code> can't be cancelled. So the mod answers through Claude's own hooks rather than drawing its own dialogs.</p>
</details>

<p><b>Limits of mods:</b></p>
<ul>
  <li>They need Claude Code 2.1.287 or newer.</li>
  <li>They aren't sandboxed: the nerve mod can approve tool calls, which is its job.</li>
  <li>They load only in folders you've trusted.</li>
  <li>A session started before <code>nerve setup</code> doesn't have the mod until it's restarted. The Devices view shows <code>tty</code> or <code>view</code> for such sessions, and the old paths still work for them.</li>
</ul>

<h2 id="features">4. Each feature: how, what's sent, trade-offs</h2>

<div class="card">
<h3>Progress and "last synced"</h3>
<div class="grid">
<div><b>How</b>The agent scans sessions every 3 s, using the same discovery as the TUI. On a change, or every 60 s, it publishes a <i>state</i> event per peer. That's an addressable Nostr event (kind 30078), so relays keep only the newest copy. A sleeping laptop therefore still shows what it was doing, and since when.</div>
<div><b>Sends</b>
  <ul>
    <li><b>Device:</b> name, OS, architecture, capabilities, away flag.</li>
    <li><b>Per session:</b> id, name, folder, branch, state, what it waits for, cost, subagent count, the last 8 transcript lines, <code>via_mod</code>, and the last turn (time, duration, tokens, model).</li>
    <li><b>Also:</b> pending prompts and job status.</li>
  </ul>
  Typically 2–10 KB.</div>
<div><b>Upside</b>Works across offline periods and needs no polling. Mod sessions add exact turn timing.</div>
<div><b>Downside</b>A snapshot: about 3 s stale at best on the private relay, plus 0.5–1 s on public ones. The tail is a peek; <code>l</code> fetches 200 lines.</div>
</div>
<p><b>Tested:</b> <span class="ok">✓</span> E10b, E14, E23 (Pi seen from the Mac over public relays only).</p>
</div>

<div class="card">
<h3>Send an instruction</h3>
<div class="grid">
<div><b>How</b>
  <ul>
    <li><b>Mod sessions:</b> the agent queues the text, the mod calls <code>$.prompt.submit</code>, and the mod's ack goes back to the sender.</li>
    <li><b>Others:</b> the agent re-checks the PID is still <code>claude</code>, then pastes into its tmux pane or Ghostty tab and presses Enter.</li>
  </ul></div>
<div><b>Sends</b>Session id plus the text, control characters stripped, up to 16,000 characters.</div>
<div><b>Upside</b>Mod path: queued if busy, works in background sessions, and the ack means Claude actually took it.</div>
<div><b>Downside</b>Desktop-app sessions without the mod are view-only. Instructions older than 5 minutes are refused rather than typed, so a stale replay can't fire.</div>
</div>
<p><b>Tested:</b> <span class="ok">✓</span> mod path: ack in 0.37 s on one Mac (E18), 4.8 s Mac→Pi over public relays (E24), queued in order (E18b). <span class="ok">✓</span> tmux path (E10a). <span class="warn">◐</span> Ghostty path: the mechanism works (E9), but it was never run end to end.</p>
</div>

<div class="card">
<h3>Answer permission prompts and questions</h3>
<div class="grid">
<div><b>How</b>The mod reports the prompt and waits. Claude's own dialog stays on screen. The first answer wins:
  <ul>
    <li><b>Remote:</b> from another device, via the agent.</li>
    <li><b>Local:</b> at the keyboard, which withdraws the request everywhere.</li>
  </ul>
  Sessions without the mod use the settings hook as before, where questions still need away mode.</div>
<div><b>Sends</b>The tool name plus a one-line summary (command, file path or URL), or the question with up to 9 options. Back comes allow, deny or the chosen label.</div>
<div><b>Upside</b>Answer from any device without taking the prompt away from whoever is at the keyboard.</div>
<div><b>Downside</b>Waits up to 10 minutes for permissions and 30 for questions, then falls back to local only. Multi-select questions answer only the first option set.</div>
</div>
<p><b>Tested:</b> <span class="ok">✓</span> permission held for 20 s, then answered remotely (E19); question without away mode (E20); local answer withdrawn (E21); across machines over public relays (E25b: visible on the other device after 6 s, file written after the answer).</p>
</div>

<div class="card">
<h3>Read changes, transcript and subagent work</h3>
<div class="grid">
<div><b>How</b>The remote agent runs <code>git status</code> and <code>git diff HEAD</code> (capped at 512 KiB), or reads 200 transcript lines, or each subagent's tail.</div>
<div><b>Sends</b>The text in 32 KiB chunks over the bulk lane: the private relay if connected, otherwise public relays.</div>
<div><b>Upside</b>On demand only. The pager colours diffs and shows line numbers.</div>
<div><b>Downside</b>Large diffs over public relays take about 1–2 s per chunk.</div>
</div>
<p><b>Tested:</b> <span class="ok">✓</span> diff (E10d). <span class="warn">◐</span> log and subagents use the same path but weren't run separately across devices.</p>
</div>

<div class="card">
<h3>Jobs routed by capability</h3>
<div class="grid">
<div><b>How</b><code>nerve sync job --needs linux,aarch64 --verify '…' -- "prompt"</code> picks the least-busy device with every capability. That device runs <code>claude -p</code> headless, then runs the verify command; exit 0 means verified.</div>
<div><b>Sends</b>Prompt, needs, verify command and allowed tools. Back come progress, turns, cost and the session id.</div>
<div><b>Upside</b>Queues for sleeping devices. Another Claude can use it to delegate work (E16).</div>
<div><b>Downside</b>Headless jobs can't ask permission, so pre-allow tools with <code>--allow</code>.</div>
</div>
<p><b>Tested:</b> <span class="ok">✓</span> E13, E15, E16 (round 1, unchanged). <span class="bad">✗</span> Xcode / iOS simulator.</p>
</div>

<h2 id="handoff">5. Hand-off and incremental sync <span class="new">NEW</span></h2>

<p>Round 1 sent one tar every time: a <code>git bundle --all</code> (the whole history), the patch, untracked files and the whole transcript. A repeat hand-off of a busy session resent almost everything. Round 2 replaces that with a short exchange:</p>

<div class="diagram">source (has the session)                         target
  HandoffOffer  {session, repo name, root commit} ──►
                                                  ◄── HandoffHave {tips its checkout already has}
  pack: git bundle --all --not &lt;tips&gt;
        + content-defined chunks of patch, untracked files, transcript, sidecars
  HandoffManifest {index of files → chunk ids}    ──►
  ChunkData × n   {only chunks it isn't known to hold} ──►
                                                  ◄── ChunkWant {anything still missing}   (rare)
                                                  ◄── Ack "resumed in tmux nerve-xxxx"
  both: remember which chunks the other now holds</div>

<dl class="kv">
  <dt>Git</dt><dd>The target names the commits it has; the bundle carries only what lies beyond them. With nothing new there is no bundle at all. The repo is identified by its root commit, so an unrelated checkout at the same path is never treated as having these commits.</dd>
  <dt>Everything else</dt><dd>FastCDC-style content-defined chunking (gear hash; 2 KiB minimum, 8 KiB average, 32 KiB maximum), stored by SHA-256 in <code>&lt;sync&gt;/chunks/</code>. An append or an edit changes only the chunks around it.</dd>
  <dt>Knowledge</dt><dd><code>&lt;sync&gt;/known/&lt;peer&gt;</code> lists chunk ids that peer has confirmed holding. It is updated on the target's ack, and corrected if the peer later asks for a chunk again.</dd>
  <dt>Integrity</dt><dd>Every chunk is checked against its id on arrival, so a corrupt or forged chunk is dropped. The index is itself a chunked file, so big repos don't overflow a message.</dd>
  <dt>Storage</dt><dd>The store is pruned oldest-first above 512 MiB. A pruned chunk costs one extra request later, never correctness.</dd>
</dl>

<table>
<tr><th>Run</th><th>What changed since the last hand-off</th><th>Sent</th><th>Total size</th></tr>
<tr><td>E22 #1 (Mac, local relay)</td><td>first time: new checkout</td><td class="num">694 KiB · 101/101 chunks</td><td class="num">716 KiB</td></tr>
<tr><td>E22 #2</td><td>one turn + one commit</td><td class="num"><b>16–19 KiB</b> · 4–5/100 chunks</td><td class="num">720 KiB</td></tr>
<tr><td>E26 #1 (Pi → Mac, public relays only)</td><td>first time: new checkout</td><td class="num">all 5 chunks, 3.1 s</td><td class="num">≈ 24 KiB (small test repo)</td></tr>
<tr><td>E26 #2</td><td>one commit</td><td class="num"><b>3 of 5 chunks</b>, 2.3 s</td><td class="num">≈ 26 KiB</td></tr>
</table>

<p><b>Upside:</b> repeat hand-offs cost roughly the size of the change, so moving a session back and forth is cheap even over public relays. <b>Downside:</b> the first hand-off of a big repo is still the whole history, and over public relays that is slow (paced to avoid bans). Chunks aren't compressed yet, although transcripts compress about 5×.</p>

<h2 id="wire">6. Wire format and security</h2>

<table>
<tr><th>Event</th><th>Nostr kind</th><th>Kept by relays</th><th>Carries</th></tr>
<tr><td>State</td><td>30078 (addressable, <code>d = nerve/2/state/&lt;recipient&gt;</code>)</td><td>newest only, 7-day expiry</td><td>the device snapshot in §4</td></tr>
<tr><td>Messages</td><td>4590</td><td>24 h (NIP-40 expiry)</td><td><code>Send</code>, <code>Answer</code>, <code>SyncNow</code>, <code>Fetch</code>/<code>Blob</code>, <code>HandoffOffer</code>/<code>Have</code>/<code>Manifest</code>, <code>ChunkWant</code>/<code>ChunkData</code>, <code>JobSubmit</code>/<code>JobUpdate</code>, <code>PairRequest</code>, <code>Ack</code></td></tr>
</table>
<p>Each payload is a JSON envelope <code>{v: 2, id, from, sent_at, body}</code>, NIP-44 v2 encrypted to exactly one device and signed by the sender. Devices on protocol v1 and v2 ignore each other rather than misreading each other.</p>

<table>
<tr><th>Who</th><th>Can see</th><th>Cannot see</th></tr>
<tr><td>Your paired devices</td><td>everything above</td><td>—</td></tr>
<tr><td>A public relay</td><td>which keys talk, when, message sizes; ciphertext for up to 24 h</td><td>any content</td></tr>
<tr><td>Anyone else</td><td>nothing useful</td><td>unknown keys are ignored. The one exception: a <code>PairRequest</code>, accepted only while an invite is open, and only with its secret.</td></tr>
<tr><td>Other users on the same machine</td><td>—</td><td>the mod socket is 0600 in your config directory</td></tr>
</table>
<p><b>Trust model:</b> a paired device can type into your sessions and approve tool calls. That is remote control by design. Treat <code>device.key</code> like an SSH key, and an invite code like a one-hour password.</p>
<p><b>Safety rails:</b></p>
<ul>
  <li>Only keys listed in <code>[peers]</code> are obeyed.</li>
  <li>Message ids are de-duplicated, even across restarts.</li>
  <li>Instructions expire after 5 minutes.</li>
  <li>The PID is re-checked before any typing.</li>
  <li>Control characters are stripped.</li>
  <li>Network strings are sanitised before display.</li>
  <li>Hand-off paths can't escape their directory.</li>
  <li>Chunks are verified by hash.</li>
  <li>Invites are single-use.</li>
</ul>

<h2 id="transport">7. Transport options</h2>
<table>
<tr><th>Setup</th><th>Round trip</th><th>Upside</th><th>Downside</th></tr>
<tr><td><b>Public relays only</b> (the default)</td><td>0.5–0.9 s</td><td>Zero setup, no VPN, works from anywhere</td><td>Rate limits; first hand-offs of big repos are slow; relays see metadata</td></tr>
<tr><td><b>+ private relay on the Pi</b> (<code>nerve sync serve-relay</code>, then <code>nerve sync relay add ws://&lt;relay-host&gt;:7777</code>)</td><td>~16 ms</td><td>No third party; bulk data (hand-offs, diffs) goes there</td><td>Every device must be on your tailnet; the relay is in memory, so a restart drops queued messages (public relays cover for it)</td></tr>
</table>
<details><summary>Alternatives considered (48 surveyed in round 1)</summary>
<ul>
  <li><b>iroh:</b> fastest, but needs Rust 1.91 (nerve's minimum is 1.85) and has no store-and-forward. It is the planned bulk lane.</li>
  <li><b>NATS / MQTT:</b> need a reachable hub and have no end-to-end encryption.</li>
  <li><b>Matrix:</b> heavy SDK, Rust 1.96.</li>
  <li><b>Tailscale + HTTP:</b> fails the "no VPN" goal.</li>
  <li><b>Claude Remote Control:</b> great for phone chat, but no fleet view, hand-off, jobs or API. Use it alongside nerve.</li>
</ul>
</details>

<h2 id="try">9. Try it yourself</h2>

<h3>A. One Mac, no setup (2 minutes)</h3>
<pre><code>research/sync/demo/demo.sh            # relay + "beta" device, then the TUI as "alpha": press D
research/sync/demo/demo.sh --check    # non-interactive; prints status and exits</code></pre>
<p class="expect">Devices shows <b>beta</b>, its sessions, and "synced Ns ago". Both "devices" are this Mac, so its sessions are your real ones. <code>m</code> types into a real session, so pick a throwaway one.</p>

<h3>B. The full mod flow on one Mac (about 3 minutes, a few cents of Haiku)</h3>
<pre><code>research/sync/experiments/e17_mod_e2e.sh</code></pre>
<p>This runs E17–E22 and prints every step, including beta's Claude screen while prompts are pending. It runs in a temp directory, loads the mod only for its own test session, and leaves nothing running.</p>

<h3>C. Mac + Pi</h3>
<div class="steps">
<div class="step">On the Mac: <code>./install.sh --sync</code>. Keep the code it prints.</div>
<div class="step">On the Pi: get the source there (<code>rsync -a --exclude target ~/src/nerve/ &lt;user&gt;@&lt;host&gt;:nerve/</code>, since the branch isn't pushed), then <code>cd nerve &amp;&amp; ./install.sh nerve1…</code>. It builds (4.5 min on a Pi 5), joins and installs the service.</div>
<div class="step">Start Claude on the Pi in any repo (<code>tmux new -s work claude</code>). On the Mac run <code>nerve</code> and press <code>D</code>.</div>
</div>
<table>
<tr><th>Try</th><th>Keys</th><th>You should see</th></tr>
<tr><td>Follow the Pi</td><td><code>D</code>, then <code>Tab</code> to the Pi</td><td>Its sessions ordered waiting → working → idle, each tagged <code>mod</code>, <code>tty</code> or <code>view</code></td></tr>
<tr><td>Send something</td><td>select the session, <code>m</code> (or Enter), type, Enter</td><td>"submitted to the session" in the footer; Claude starts on the Pi</td></tr>
<tr><td>Approve from the Mac</td><td>ask Claude on the Pi to write a file; on the Mac, <code>a</code> on the "wants to run Write" row</td><td>The file appears on the Pi; the Pi's dialog closes</td></tr>
<tr><td>Answer a question</td><td>ask Claude to use AskUserQuestion; <code>1</code>–<code>9</code></td><td>Visible on both screens, answered from either</td></tr>
<tr><td>Move the session</td><td>main grid, select a session, <code>H</code>, pick a device</td><td>A progress bar in Devices; later <code>tmux attach -t nerve-&lt;id&gt;</code> on the target shows the session continuing</td></tr>
<tr><td>Move it again</td><td><code>H</code> after a bit more work</td><td>The log line reads "sent 16 KiB of 720 KiB" rather than the whole thing</td></tr>
<tr><td>Check health</td><td><code>nerve sync doctor</code> on either device</td><td>All ✓, or a ✗ with what to do</td></tr>
</table>

<h3>D. Mac + Pi, scripted (E23–E26)</h3>
<pre><code>PI=&lt;user&gt;@&lt;host&gt; PI_KEY=~/.ssh/&lt;key&gt; research/sync/experiments/e23_pi_e2e.sh</code></pre>
<p>This uses throwaway configs on both machines and only the two public relays. It installs and then removes a test systemd service on the Pi.</p>

<h2 id="phone">10. Phones: Android and iPhone</h2>

<table>
<tr><th></th><th>Android (Termux)</th><th>iPhone (iSH, a-Shell, Blink)</th></tr>
<tr><td>Run nerve on the phone</td><td><b>Yes</b>, as a full device</td><td><b>No.</b> iOS can't run native Linux binaries. iSH emulates x86 slowly and has no working tmux/Claude path; a-Shell runs only WebAssembly.</td></tr>
<tr><td>Run Claude Code on the phone</td><td>Possible with community glibc shims, but unsupported; not needed for nerve</td><td>No</td></tr>
<tr><td>Best way today</td><td>A nerve device in Termux for the Devices view and answering; or SSH into the Pi</td><td>SSH (Blink or Termius) over Tailscale into the Pi or Mac, then <code>nerve</code> → D</td></tr>
</table>

<h3>Android with Termux</h3>
<p>Install <b>Termux</b> from F-Droid or GitHub, not the stale Play Store build. Optionally add <b>Termux:Boot</b> so the agent starts at boot. Then either:</p>
<pre><code># build on the phone: install.sh installs rust, git, tmux, openssh from pkg first
git clone &lt;your fork&gt; nerve &amp;&amp; cd nerve &amp;&amp; ./install.sh nerve1…</code></pre>
<p>or copy the prebuilt static binary (no compiler needed on the phone):</p>
<pre><code># on the Pi, once:  cargo build --release --features sync --target aarch64-unknown-linux-musl
scp &lt;host&gt;:nerve-src/target/aarch64-unknown-linux-musl/release/nerve $PREFIX/bin/
nerve setup nerve1…</code></pre>
<p>That's all you need: setup uses public relays, so the phone needs no Tailscale. Because Termux has no service manager, setup starts the agent as a detached process, takes a wake-lock, and writes <code>~/.termux/boot/nerve-sync</code> for Termux:Boot. Android may still kill background apps, so exempt Termux from battery optimisation. <span class="warn">This path is built but not yet run on a real phone.</span></p>

<h3>iPhone</h3>
<div class="steps">
<div class="step">Install <b>Tailscale</b> and an SSH app (<b>Blink Shell</b> supports mosh, which survives sleep and network changes).</div>
<div class="step"><code>ssh you@&lt;relay-host&gt;</code>, then <code>nerve</code>, then <code>D</code>. The Pi's service agent keeps running, and the TUI attaches to it.</div>
<div class="step">Below 90 columns the view switches to tabs (<code>Tab</code> moves between devices). Landscape helps.</div>
</div>
<p>SSHing into the Mac works for <code>nerve sync …</code> commands. A second <code>nerve</code> TUI is refused while the Mac's own TUI is open, because nerve allows one instance at a time.</p>

<h2 id="gotchas">11. Gotchas</h2>
<ul>
  <li><b>Restart sessions after setup</b> to get the mod. Older sessions still work through tmux and hooks.</li>
  <li><b>One agent per device key.</b> Setup installs it as a service. Don't also run <code>nerve sync agent</code> by hand; the TUI detects the service and becomes a viewer.</li>
  <li><b>macOS can't reach the Pi's LAN IP</b> from an ad-hoc-signed binary (Local Network Privacy). Use the Tailscale address or public relays.</li>
  <li><b>A mod is code inside Claude.</b> Install it only from your own nerve; <code>claude plugin validate</code> lists every API call it makes.</li>
  <li><b>Invite codes are passwords for an hour.</b> Make a fresh one per device with <code>nerve sync invite</code>.</li>
</ul>

<h2 id="next">12. What's next</h2>
<ol>
  <li><b>A phone web app</b> (<code>nostr-tools</code>, same JSON) for iPhone without SSH, plus push notifications via ntfy from the Pi.</li>
  <li><b>Compress chunks</b> (zstd) for public-relay first hand-offs; <b>iroh</b> as the bulk lane once the minimum Rust version allows it.</li>
  <li>Run the <b>launchd</b> path and <b>Termux</b> on real hardware; test across different networks and with three or more devices.</li>
  <li><b>An MCP tool</b> around <code>nerve sync job/send/status</code>, so Claude on one device can drive another; with mods this can be <code>$.tool.register</code> inside the session.</li>
</ol>

<main>
<p class="meta">Branch <code>sync-research</code> · measured 2026-10-09/10 on a Mac (macOS 27) and a Raspberry Pi 5 (Debian 13)</p>
<h1>nerve cross-device sync</h1>
<p class="lede">Can nerve sync, steer, hand off and distribute Claude Code work across your own devices over Nostr, both with and without Tailscale? Below: what was built, what was measured, and what was decided.</p>

<nav><a href="#answer">Answer</a><a href="#reqs">Requirements</a><a href="#numbers">Measurements</a><a href="#findings">Findings</a><a href="#arch">Architecture</a><a href="#landscape">Landscape</a><a href="#decisions">Decisions</a><a href="#use">Try it</a><a href="#next">Limits</a></nav>

<div class="answer" id="answer">
<p><b>Yes, and it runs.</b> Every requirement works end to end between the real Mac and the real Pi.</p>
<p><b>Over public Nostr relays with no VPN</b>, latency is 0.5–1 s per hop. <b>With a private relay on the Pi over Tailscale</b>, the same protocol runs at about 16 ms.</p>
<p>The transport was the easy part. The hard part was <b>getting into a running interactive Claude session</b>. That is solved with Claude's documented hooks plus paste injection, and each edge case was checked empirically.</p>
</div>

<div class="stats">
  <div class="stat"><b>15.8 ms</b><span>RTT through the private relay on the Pi, over Tailscale</span></div>
  <div class="stat"><b>~640 ms</b><span>RTT through public relays, no VPN</span></div>
  <div class="stat"><b>0.6 s</b><span>to move a 730 KiB session from the Mac to the Pi (20.7 s via a public relay)</span></div>
  <div class="stat"><b>48</b><span>protocols and frameworks compared</span></div>
  <div class="stat"><b>16</b><span>experiments, raw output kept</span></div>
  <div class="stat"><b>39</b><span>new unit tests; clippy, MSRV 1.85 and Linux e2e all pass</span></div>
</div>

<h2 id="reqs">Your nine requirements</h2>
<div class="tw"><table>
<tr><th>#</th><th>Requirement</th><th>Status</th><th>How it works</th></tr>
<tr><td>1</td><td>View progress on any device</td><td class="ok">Done</td><td>Each device publishes one encrypted state event per peer, on change and every 60 s. It lists sessions, their state, the waiting reason, branch, cost, subagent count and the last 8 transcript lines.</td></tr>
<tr><td>2</td><td>Send instructions to a running agent elsewhere</td><td class="ok">Done</td><td>The text is pasted into the session's tmux pane or Ghostty tab, then Enter is pressed. Before that, nerve checks the PID still belongs to <code>claude</code>, strips control keys, and refuses anything older than 5 minutes. <code>claude --bg</code> and desktop-app sessions are view-only, because there is no pane to type into.</td></tr>
<tr><td>3</td><td>View and answer pending questions or decisions</td><td class="ok">Done</td><td><code>nerve sync hook</code> runs as a PermissionRequest hook and as a PreToolUse hook on AskUserQuestion. Permission prompts are always answerable remotely. Questions go remote only in away mode (see Findings).</td></tr>
<tr><td>4</td><td>Read changes, progress and subagent work</td><td class="ok">Done</td><td><code>fetch diff | log | subagents</code> sends the content back in chunks. The TUI also shows the transcript tail inline.</td></tr>
<tr><td>5</td><td>Continue the work on another device</td><td class="ok">Done</td><td>Press <code>H</code>, or run <code>nerve sync handoff</code>. It sends a git bundle, the uncommitted patch, untracked files and the transcript. The target runs <code>claude --resume --fork-session</code> in tmux, with an optional follow-up instruction.</td></tr>
<tr><td>6</td><td>Last-synced status per device; manual sync</td><td class="ok">Done</td><td>Each device shows "last synced 4s ago (19:36:46Z)", and the status bar shows <code>⇄ pi 4s · 1 pending</code>. Press <code>r</code> to sync now.</td></tr>
<tr><td>7</td><td>Nostr without WireGuard, compared with Tailscale</td><td class="ok">Both measured</td><td>No-VPN mode uses public relays. Tailscale mode uses a private relay on the Pi. You can configure both at once; the first copy to arrive wins.</td></tr>
<tr><td>8</td><td>TUI management; web UI later</td><td class="ok">TUI done</td><td class="part">The <code>D</code> Devices view and the <code>H</code> handoff picker are done. The wire protocol is plain JSON inside NIP-44, so a nostr-tools PWA can reuse it unchanged.</td></tr>
<tr><td>9</td><td>Distribute work to the device that can do and verify it</td><td class="ok">Done</td><td><code>nerve sync job --needs … --verify …</code> routes by capability and load. In E16, a Claude on the Mac used nerve to delegate verified work to the Pi.</td></tr>
</table></div>

<h2 id="numbers">Measurements</h2>
<p>RTTs are Mac→Pi→Mac round trips timed on one clock, so clock skew can't distort them.</p>
<div class="tw"><table>
<tr><th>Transport</th><th>p50 RTT</th><th>Bulk</th><th>Needs</th></tr>
<tr><td>Private Nostr relay (inside nerve) over Tailscale</td><td class="num">15.8 ms</td><td class="num">730 KiB in 0.6 s</td><td>Tailscale, or any host you can reach</td></tr>
<tr><td>iroh, direct path (found the LAN path by itself)</td><td class="num">8.5 ms</td><td class="num">14.7 MiB/s</td><td>Nothing, but iroh needs Rust 1.91</td></tr>
<tr><td>scp over Tailscale (baseline)</td><td class="num">—</td><td class="num">13.8 MiB/s</td><td>Tailscale + ssh</td></tr>
<tr><td>Public Nostr: relay.snort.social</td><td class="num">538 ms</td><td class="num">—</td><td>Nothing</td></tr>
<tr><td>Public Nostr: relay.primal.net</td><td class="num">640 ms</td><td class="num">32 KB events in 1.7 s</td><td>Nothing</td></tr>
<tr><td>Public Nostr: 3 relays, first copy wins</td><td class="num">721 ms</td><td class="num">—</td><td>Nothing</td></tr>
<tr><td>iroh, forced through the n0 relay</td><td class="num">197 ms</td><td class="num">1.1 MiB/s</td><td>Nothing</td></tr>
</table></div>

<h3>Live runs of the shipped prototype</h3>
<div class="tw"><table>
<tr><th>Run</th><th>What happened</th></tr>
<tr><td>E10</td><td>An instruction sent from the Mac was typed into the Pi's tmux pane. The Pi's Write permission prompt appeared on the Mac about 4 s later. "allow" was sent, and the file was written on the Pi about 3 s later. The diff was then fetched back to the Mac.</td></tr>
<tr><td>E11</td><td>With the Pi in away mode, an AskUserQuestion offering [Namaste, Hola] was answered from the Mac. <code>greet.txt</code> = Namaste.</td></tr>
<tr><td>E12</td><td>A Mac session was handed to the Pi and resumed at a <em>different path</em>. It answered "The secret project codename is BLUE-HERON", which had been told to it on the Mac. It then added <code>mul()</code> on top of the Mac's uncommitted <code>sub()</code>.</td></tr>
<tr><td>E13</td><td>Three jobs: the <code>linux</code> one went to the Pi and passed verification; the <code>macos</code> one ran on the Mac and passed; the <code>gpu</code> one was refused because no device has a GPU.</td></tr>
<tr><td>TUI</td><td><code>D</code> → <code>m</code> → type → Enter. The prompt appeared in the view, <code>a</code> approved it, and <code>tui.txt</code> was written on the Pi. This run also exposed a bug where a reorder sent the instruction to the wrong session; fixed, with a regression test.</td></tr>
<tr><td>E14</td><td>The whole loop again, over public relays only, with no Tailscale.</td></tr>
<tr><td>E15</td><td>A job was sent while the Pi's agent was down. It was delivered from relay storage 1 s after the agent came back, then ran and passed verification.</td></tr>
<tr><td>E16</td><td>A Claude on the Mac, given only the CLI, asked the Pi for proof of its platform. nerve routed the job; <code>plat.txt</code> = <code>aarch64</code>, verified.</td></tr>
</table></div>

<h2 id="findings">Findings that shaped the design</h2>
<div class="finding"><b>Relays acknowledge events they then drop.</b> nos.lol and nostr.mom returned <code>OK</code> for every event from a new key, then neither delivered nor stored them. Damus banned a test key within minutes. So every command gets an end-to-end ack from the receiving device, each device uses several relays, and the docs list relays verified to deliver.</div>
<div class="finding"><b>Real size limits are lower than advertised.</b> Some relays topped out at 60 KB, and one accepted only 8 KB from unknown keys. Events are split into 32 KiB chunks, and bulk data goes only through private relays when one is available.</div>
<div class="finding"><b>Claude's two prompt hooks behave differently.</b> While a PermissionRequest hook waits, the permission dialog stays on screen, so a local keypress and a remote answer race safely. A PreToolUse hook on AskUserQuestion hides the question until it returns. That is why questions only go remote in away mode. Neither hook is told when someone answers locally, so nerve watches the transcript for that.</div>
<div class="finding"><b>Handoff only needs the project slug to match.</b> Absolute paths inside the transcript didn't matter. <code>--fork-session</code> keeps the two devices from writing to the same history.</div>
<div class="finding"><b>macOS blocks ad-hoc-signed binaries from reaching LAN IPs</b> because of Local Network Privacy. Tailscale addresses were unaffected.</div>

<h2 id="arch">Architecture</h2>
<pre><code>Claude session ──PermissionRequest / PreToolUse hook──► nerve sync hook ─┐
(tmux pane / Ghostty tab)                                                 │ mailbox/
     ▲ bracketed paste                                                    ▼
     └─────────────── inject ◄──── sync agent (thread + tokio) ──── handoff / jobs
                                     │ discovery (same code as the TUI)
                                     │ NIP-44 envelopes, one per peer
                  ┌──────────────────┴────────────────────┐
           ws://pi:7777 (private,               wss://primal, wss://snort
           Tailscale, bulk lane)                (public, no VPN)
                  └──────────────────┬────────────────────┘
                                     ▼
                       other devices' agents / TUI `D` view</code></pre>
<p>Two Nostr event kinds:</p>
<ul>
<li><b>Kind 30078</b> (addressable): each device's latest state, one copy per recipient. Because the relay keeps only the newest, a closed laptop still shows what it was last doing.</li>
<li><b>Kind 4590</b> (stored, 24 h expiry): commands, answers, chunked data and jobs. Storage is what lets a sleeping device catch up when it wakes.</li>
</ul>
<p>The code follows nerve's existing rules:</p>
<ul>
<li>all I/O stays in the worker;</li>
<li>everything received from the network is wrapped in <code>Sanitised</code>;</li>
<li>Claude's data dirs come from <code>claude_roots()</code>;</li>
<li>the PID is re-validated before typing;</li>
<li>visibility is <code>pub(crate)</code> only.</li>
</ul>

<h2 id="landscape">Landscape: why Nostr, and what else fits</h2>
<div class="tw"><table>
<tr><th>Option</th><th>Verdict</th></tr>
<tr><td>Claude Code Remote Control</td><td>First-party, excellent for chatting and approving from a phone. It has no handoff, no fleet view and no job routing, and no public API, and it requires a claude.ai login. <b>It complements nerve rather than replacing it.</b></td></tr>
<tr><td>Happy, Paseo, YepAnywhere</td><td>Mature remote UIs, but they <em>own</em> the Claude process through the Agent SDK. nerve monitors sessions it didn't start, which is why it uses hooks and paste.</td></tr>
<tr><td>CodeDeck+, ContextVM</td><td>The closest prior art on Nostr. CodeDeck+'s split of event kinds matches ours. ContextVM (MCP over Nostr) is the route to "agents drive other devices" later.</td></tr>
<tr><td>iroh</td><td>Fastest in testing, with no setup. It needs Rust 1.91 (nerve's MSRV is 1.85) and has no store-and-forward. <b>Planned as the bulk lane.</b></td></tr>
<tr><td>NATS / MQTT / Zenoh</td><td>Mature, but every device must reach a hub, and none encrypts end to end. Without Tailscale the Pi would have to be exposed.</td></tr>
<tr><td>Matrix</td><td>You'd get a phone UI for free, but it needs Rust 1.96 and a heavy SDK.</td></tr>
<tr><td>Tailscale + HTTP</td><td>The simplest option, but it doesn't meet the no-WireGuard goal. Supported here as the fast private-relay setup.</td></tr>
</table></div>
<p class="meta">The full survey of 48 options is in <code>research/sync/reports/02-alternatives-survey.md</code>. The Nostr deep dive and the survey of Claude Code control surfaces are alongside it.</p>

<h2 id="decisions">Key decisions</h2>
<p class="meta">All 14 decisions, with the evidence for each, are in <code>research/sync/DECISIONS.md</code>.</p>
<ol>
<li><b>Hooks, not screen scraping.</b> Prompts are answered through hooks. Keystrokes are used only to type new instructions.</li>
<li><b>Questions go remote only in away mode.</b> Otherwise the person at the keyboard would never see them.</li>
<li><b>A local answer is detected from the transcript.</b> The hook then withdraws its remote request.</li>
<li><b>Nostr, built in, behind a cargo feature.</b> nostr-sdk's MSRV is 1.85, the same as nerve's.</li>
<li><b>Every command is acknowledged end to end.</b> A relay's OK is not proof of delivery.</li>
<li><b>32 KiB chunks.</b> Bulk data goes over private relays only.</li>
<li><b>Handoff resumes with <code>--fork-session</code>, inside tmux.</b> It refuses to overwrite a checkout that has uncommitted work.</li>
<li><b>Replays are blocked twice.</b> Every message type is deduplicated across restarts, and <code>Send</code> has a hard 5-minute age limit.</li>
<li><b>Short-lived CLI runs never execute peer commands.</b> If a long-running agent exists, they queue to it.</li>
<li><b>The Devices view selects rows by identity, not by position.</b></li>
<li><b>MSRV 1.85 is kept</b> by MSRV-aware lock resolution, with zero existing dependencies changed.</li>
</ol>

<h2 id="use">Try it</h2>
<p>On one Mac, with no Pi and no internet: <code>research/sync/demo/demo.sh</code> starts a private relay plus a second "device" and opens the TUI (press <code>D</code>). Across real devices:</p>
<pre><code>cargo build --release --features sync
nerve sync init --name mac --relay wss://relay.primal.net --relay wss://relay.snort.social
nerve sync pair pi npub1…            # the Pi's key; run the reverse on the Pi
nerve sync install-hooks             # start Claude with --settings &lt;printed path&gt;
nerve sync agent                     # on the Pi (or a systemd service)
nerve                                # press D: Devices, H: hand off the selected session

nerve sync status
nerve sync job --needs linux --allow 'Bash(python3 *)' --verify 'grep -q ok out.txt' check -- "write ok to out.txt"</code></pre>

<h2 id="next">Limits and next steps</h2>
<ul>
<li><b>Not built yet:</b>
  <ul>
  <li>a phone or web client (your brief marked this "later");</li>
  <li>the iroh bulk lane, which is blocked by the MSRV;</li>
  <li>NIP-59 gift wrap and NIP-42 relay auth as defaults (both work, but add size and setup);</li>
  <li>key rotation;</li>
  <li>typing into <code>--bg</code> sessions.</li>
  </ul></li>
<li><b>Not tested:</b>
  <ul>
  <li>Two separate networks. Both devices share a home LAN, so the no-VPN runs went through public internet relays, which is the same path a remote laptop would use.</li>
  <li>The iOS simulator. This Mac has no Xcode, so routing was shown with <code>macos</code>/<code>linux</code> capabilities; <code>ios-sim</code> is auto-detected when Xcode is present.</li>
  </ul></li>
<li><b>Next:</b>
  <ul>
  <li>a systemd/launchd agent service;</li>
  <li>a PWA on nostr-tools, with ntfy push from the Pi;</li>
  <li>an MCP or ContextVM server so agents can call <code>job</code>, <code>send</code> and <code>status</code> as tools;</li>
  <li>surfacing Remote Control links in the details view.</li>
  </ul></li>
</ul>
</main>

<script type="text/plain" class="doc" id="d2" data-group="Overview" data-title="Report" data-path="research/sync/REPORT.md"># nerve cross-device sync: research report

Prepared 2026-10-10 on branch `sync-research`.

**Question.** Can nerve keep Claude Code agents in sync across the user's own devices? In scope: progress, instructions, pending questions, diffs and subagents, handoff, per-device sync status, and capability-based job distribution. The setups to cover are with and without Tailscale, preferably over Nostr.

**Short answer: yes.** It is implemented and measured on a real Mac and a real Raspberry Pi 5.

- **Over public Nostr relays, with no VPN at all:** every feature works end to end. The cost is 0.5–1 s of latency per hop, and choosing relays matters.
- **With a private relay on the Pi over Tailscale:** the same protocol runs at ~16 ms.
- **The hard part was not the transport.** It was getting *into* a running interactive Claude Code session. That is solved with documented hooks, and its edge cases were verified empirically.

## Round 2 (2026-10-12)

Feedback on round 1 asked for four things: a simpler setup, smaller repeat syncs, a look at Claude Code mods, and a less prototype-looking UI. Delivered:

- **`nerve setup [code]`.** One command does everything on a device: identity, the mod, a service and pairing. It prints a one-time code (and QR) for the next device. Joining took 4–7 s (E17, E23).
- **The nerve mod.** It runs inside Claude Code ≥ 2.1.287:
  - prompts go in through `$.prompt.submit` (queued while Claude is busy; works for `--bg` sessions);
  - permissions and questions are answerable remotely while Claude's own dialog stays up, so away mode is no longer needed;
  - every turn is reported.

  Two API traps were found and handled: the 10 s hook budget, and `next.signal` not firing on a local answer (D15–D17, E18–E21).
- **Incremental hand-off.** Git sends only `--not <target tips>`; everything else goes as content-defined chunks the target doesn't already hold. A repeat hand-off of a ~700 KiB session moved 16–19 KiB (D18, E22). Pi → Mac now tested (E26).
- **The Devices view, rebuilt.** Two panes on laptops, a tab strip under 90 columns (phones over SSH), "needs you" first (D20).
- **Phones.** Termux can run nerve as a full device; a static aarch64 binary was built. iPhone stays SSH-only, because iOS can't run native Linux binaries.

The guided overview is `GUIDE.html`; measurements are under E17–E26 in `experiments/RESULTS.md`; decisions are D15–D22.

## 1. What was built (round 1)

- **`nerve --features sync`.** About 4,000 lines in `src/sync/`, `src/tui/devices.rs` and `src/app/sync_ui.rs`.
  - 39 new unit tests, including an end-to-end handoff test.
  - Clippy clean.
  - Builds on the MSRV, 1.85.
  - The default build is unchanged.
- **`research/sync/lab`.** A standalone measurement harness, `nsync-lab`. It covers Nostr ping/pong (plain and gift-wrapped), relay size probes, an embedded relay, and iroh direct versus relay paths with bulk transfer.
- **`research/sync/experiments/`.** Shell prototypes that came first, then raw outputs and `RESULTS.md`.
  - The shell prototypes are the mailbox hook, handoff pack and unpack, and relay survey scripts.
  - The raw outputs cover 15 experiments.
- **`reports/`.** Three web-research surveys with sources:
  - Nostr NIPs, crates, relays and prior art;
  - 48 alternative protocols and frameworks;
  - Claude Code's control surfaces and 20+ remote-control projects.

### Prototype versions, in order

| version | what it proved |
|---|---|
| v0: shell + `nak` + `jq` | Relay limits; hook mailbox; handoff by tarball (E1, E5–E7) |
| v1: `nsync-lab` (Rust, standalone) | Latency and loss across public relays, private relay, gift wrap, iroh direct and relay (E2–E4) |
| v2: `nerve sync` CLI + headless agent | Commands, answers, fetch, handoff, jobs between two real devices (E10–E13) |
| v3: TUI Devices view (`D`, `H`) | The same features driven interactively; fixed a real selection bug (D12) |
| v3 on public relays only | No Tailscale; offline store-and-forward (E14, E15) |

| 3 | View and answer pending questions and decisions | ✅ permissions always; ✅ AskUserQuestion in away mode | `nerve sync hook` (PermissionRequest + PreToolUse) ⇄ mailbox ⇄ agent ⇄ Nostr |

## 3. Key measurements

From `experiments/RESULTS.md`. All RTTs are single-clock round trips Mac→Pi→Mac.

| transport | p50 RTT | bulk throughput | needs |
|---|---|---|---|
| Private Nostr relay (embedded in nerve) over Tailscale | **15.8 ms** | 730 KiB handoff in 0.6 s | Tailscale (or any reachable host) |
| iroh, direct LAN path, auto-discovered | 8.5 ms | 14.7 MiB/s | nothing (n0 relays for discovery); MSRV 1.91 |
| scp over Tailscale (baseline) | — | 13.8 MiB/s | Tailscale + ssh |
| Public Nostr, relay.snort.social | 538 ms | — | nothing |
| Public Nostr, relay.primal.net | 640 ms (gift-wrapped: 704 ms) | 32 KB events in 1.7 s; 730 KiB in 20.7 s (paced) | nothing |
| Public Nostr, three relays, first copy wins | 721 ms | — | nothing |
| iroh relay-only path (n0 relay) | 197 ms | 1.1 MiB/s | nothing |

### Findings that shaped the design

1. **Relays lie about delivery.** nos.lol and nostr.mom said OK to every event from a new key, then neither delivered nor stored any of them. Damus and nostr.mom rate-limited or banned test keys within minutes. That led to end-to-end acks, several relays per device, and a list of verified relays (D6).
2. **Size limits are lower than advertised.** The smallest accepted size was 60 KB, and some relays accepted only 8 KB from unknown keys. Hence 32 KiB chunks, and a bulk lane that uses only private relays (D7).
3. **Claude's two prompt kinds behave differently under hooks.**
   - A `PermissionRequest` hook waits while the dialog is shown, so local and remote answers race safely.
   - A `PreToolUse` hook on `AskUserQuestion` hides the dialog until it returns. That is why "away mode" exists (D2).
   - Neither hook is told about a local answer, so the transcript is used to detect one (D3).
4. **Handoff needs only the cwd slug to match.** Absolute paths inside the transcript don't matter. `--fork-session` keeps the two devices' histories apart (D8).
5. **macOS Local Network Privacy blocks ad-hoc-signed binaries from reaching LAN IPs.** Tailscale addresses are unaffected (D14).

## 4. Architecture as built

```
 Claude session ──PermissionRequest/PreToolUse hook──► nerve sync hook ─┐
 (tmux pane / Ghostty tab)                                               │ mailbox/
       ▲ bracketed paste                                                 ▼
       └──────────────── inject ◄──── sync agent (thread, tokio) ──── handoff / jobs
                                       │  discovery (same code as the TUI)
                                       │  NIP-44 per-peer envelopes
                     ┌─────────────────┴───────────────────┐
              ws://pi:7777 (private,             wss://primal, wss://snort
              Tailscale, bulk lane)              (public, no VPN)
                     └─────────────────┬───────────────────┘
                                       ▼
                         other devices' agents / TUI `D` view
```

Event classes:
- **kind 30078:** addressable per-recipient state.
- **kind 4590:** stored commands, answers, blobs and jobs, with a 24 h NIP-40 expiry.

Envelope bodies are `State`, `Send`, `Answer`, `SyncNow`, `Fetch`, `Blob`, `HandoffOffer`, `JobSubmit`, `JobUpdate` and `Ack`. Details are in `docs/SYNC.md` and `src/sync/protocol.rs`.

The design follows nerve's existing rules:
- All I/O stays in the agent thread; the UI reads a snapshot.
- Every network string is `Sanitised` at render time.
- Claude data is located through `claude_roots()`.
- The PID is re-validated as `claude` before typing.
- New items are `pub(crate)` only.
- macOS-only code (Ghostty) is behind `cfg`.

## 5. Landscape and why not X

The full comparison of 48 options is in `reports/02-alternatives-survey.md`.

- **Claude Code Remote Control** is first-party and excellent for phone chat and approvals. It has no handoff, no fleet view, no job routing and no public API, and it requires an Anthropic login. It complements nerve and doesn't replace it.
- **Happy, Paseo and YepAnywhere** are mature remote UIs. They *own* the Claude process through the Agent SDK. nerve monitors sessions it didn't start, which is why the hook and paste approach was chosen.
- **CodeDeck+** (Nostr + NIP-44, Android) is the closest prior art, and its kind split matches ours. **ContextVM** offers MCP over Nostr, and could later expose nerve as an MCP tool that one agent uses to drive another device.
- **iroh** was the best raw performer, but it needs MSRV 1.91 and has no offline delivery. It is the planned bulk lane.
- **NATS and MQTT** need a reachable hub and have no end-to-end encryption.
- **Matrix** gives a free phone UI, but needs MSRV 1.96 and a heavy SDK.
- **Tailscale + HTTP** is simplest, but fails the "no WireGuard" goal.

## 6. Limits and next steps

**Not done, with reasons:**
- Phone and web client: §8 of the brief marks it as later.
- An iroh bulk lane: blocked by MSRV.
- NIP-59 by default and NIP-42 relay auth: they work, but add size and setup cost for a single-owner fleet.
- Key rotation and revocation, beyond editing `[peers]`.
- Injecting into `claude --bg` sessions: there is no pane, and no CLI to send input.

**Untested here:**
- Two different networks with the Pi behind a different NAT. Both devices sat on the same home LAN. The "no Tailscale" runs went through public relays on the internet, which is the same path a remote laptop would take. iroh's relay-only mode was forced to simulate a NAT barrier.
- Xcode or the iOS simulator: this Mac has Command Line Tools only. Routing was shown with the `macos`/`linux` capabilities instead; adding `ios-sim` is detection only.

**Suggested next steps:**
1. A systemd unit and launchd plist for `nerve sync agent`.
2. A PWA that uses nostr-tools plus `protocol.rs`'s JSON. Push via ntfy or UnifiedPush from the Pi.
3. Let agents drive other devices: expose `nerve sync job/send/status` as an MCP server, either over stdio or over ContextVM. Then a Claude on the Mac can say "verify this on the Pi" through nerve, which covers requirement 9's "tell the agents to use the other device" option.
4. Show the Remote Control `bridgeSessionId` in details, and offer "open in Claude app".

## 7. How to reproduce

**Start here:** `research/sync/GUIDE.html` covers setup, how each feature works and what it sends, the mod, incremental hand-off, what was tested and what wasn't, and step-by-step testing on Mac, Pi and phones.

**Browse everything offline:** open `research/sync/site/index.html`. It holds this report, the decision log, results, surveys, raw outputs and prototype source in one file, and is rebuilt with `research/sync/site/build.sh`.

**See it run on one Mac:** `research/sync/demo/demo.sh` starts a private relay and a second "device", then opens the TUI (press `D`). See `demo/README.md`. `experiments/e17_mod_e2e.sh` runs the full mod flow with a real Claude session.

```bash
# measurements
cd research/sync/lab && cargo build --release        # Pi build: see RESULTS.md (Docker linux/arm64)
nsync-lab keys mac; nsync-lab ping --key mac --peer <hex> --relays wss://relay.primal.net
# integrated prototype
cargo build --release --features sync
nerve sync init --name mac --relay wss://relay.primal.net --relay wss://relay.snort.social
nerve sync pair pi npub1...   # and the reverse on the Pi
nerve sync install-hooks      # then start Claude with --settings <printed path>
nerve                          # press D
```
