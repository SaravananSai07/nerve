<script type="text/plain" class="doc" id="d47" data-group="nerve sync source" data-title="sync/places.rs" data-path="src/sync/places.rs">//! Named places: `[places] proj = "/abs/path"` on every device,
//! so a sender names the place and each side resolves its own path.
//!
//! Two things move into a place:
//!
//! - **Files** (`nerve sync put|get`): paths relative to the place, cut
//!   into the same content-defined chunks as a hand-off, so a repeat send
//!   moves only the chunks the peer is not known to hold. Each file is
//!   written to a temp file beside it and renamed into place, with its
//!   mode kept. Nothing is written outside the place, and never through
//!   a symlink.
//! - **Git refs** (`nerve sync refs`): a bundle of only the commits the
//!   target lacks (it reports its tips first, as for a hand-off), whose
//!   objects the target unbundles before pointing exactly the named
//!   destination refs at them. Nothing checks out, and HEAD, the index,
//!   the working tree and every other ref stay as they were.

use std::collections::{BTreeSet, HashSet};
use std::io::Write;
use std::os::unix::fs::{OpenOptionsExt, PermissionsExt};
use std::path::{Path, PathBuf};

use serde::{Deserialize, Serialize};

use super::chunks::{FileRef, Store};
use super::handoff::{git_root, is_sha, repo_id, run, safe_rel, tempdir, text, walk};
use super::protocol::RefMap;

#[derive(Debug, Clone, Default, Serialize, Deserialize, PartialEq)]
pub(crate) struct PlaceFile {
    /// `name` is the path relative to the place.
    pub(crate) file: FileRef,
    pub(crate) mode: u32,
}

#[derive(Debug, Clone, Default, Serialize, Deserialize, PartialEq)]
pub(crate) struct RefTip {
    pub(crate) src: String,
    pub(crate) dst: String,
    pub(crate) sha: String,
}

/// What a transfer into a place carries; travels as the chunked index.
#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
#[serde(tag = "kind", rename_all = "snake_case")]
pub(crate) enum XferPack {
    Files {
        /// The roots that were directories on the sender: the scope of `delete`.
        dirs: Vec<String>,
        delete: bool,
        files: Vec<PlaceFile>,
    },
    Refs {
        refs: Vec<RefTip>,
        /// Absent when the target already had every commit.
        bundle: Option<FileRef>,
    },
}

impl XferPack {
    pub(crate) fn file_refs(&self) -> Vec<FileRef> {
        match self {
            Self::Files { files, .. } => files.iter().map(|f| f.file.clone()).collect(),
            Self::Refs { bundle, .. } => bundle.iter().cloned().collect(),
        }
    }
}

/// A root as given on the command line: relative to the place, inside
/// it; "." (or "") is the whole place.
pub(crate) fn norm_root(root: &str) -> Result<String, String> {
    let r = root.trim_end_matches('/');
    if r.is_empty() || r == "." {
        return Ok(String::new());
    }
    let r = r.strip_prefix("./").unwrap_or(r);
    safe_rel(r).map(String::from).ok_or_else(|| format!("{root}: paths must be relative to the place and stay inside it"))
}

fn join(base: &Path, rel: &str) -> PathBuf {
    if rel.is_empty() {
        base.to_path_buf()
    } else {
        base.join(rel)
    }
}

/// Sender: chunk every regular file under `roots` into `store`.
/// Symlinks are not followed and not sent.
pub(crate) fn pack_files(base: &Path, roots: &[String], delete: bool, store: &Store) -> Result<XferPack, String> {
    if !base.is_dir() {
        return Err(format!("{} is not a directory", base.display()));
    }
    let mut picked: Vec<(String, PathBuf)> = Vec::new();
    let mut dirs = Vec::new();
    for root in roots {
        let rel = norm_root(root)?;
        let p = join(base, &rel);
        let meta = std::fs::symlink_metadata(&p).map_err(|_| format!("{root} does not exist in {}", base.display()))?;
        if meta.file_type().is_symlink() {
            return Err(format!("{root} is a symlink; send what it points at instead"));
        } else if meta.is_dir() {
            walk(&p, &rel, &mut picked);
            dirs.push(rel);
        } else if meta.is_file() {
            picked.push((rel, p));
        }
    }
    let mut seen = HashSet::new();
    picked.retain(|(rel, _)| seen.insert(rel.clone()));
    picked.sort();
    let mut files = Vec::with_capacity(picked.len());
    for (rel, p) in picked {
        let bytes = std::fs::read(&p).map_err(|e| format!("{rel}: {e}"))?;
        let mode = std::fs::metadata(&p).map(|m| m.permissions().mode() & 0o777).unwrap_or(0o644);
        files.push(PlaceFile { file: store.add_file(&rel, &bytes).map_err(|e| e.to_string())?, mode });
    }
    Ok(XferPack::Files { dirs, delete, files })
}

/// What landed, for the ack.
#[derive(Debug, Clone, Copy, Default, PartialEq, Eq)]
pub(crate) struct Applied {
    pub(crate) written: usize,
    pub(crate) unchanged: usize,
    pub(crate) deleted: usize,
}

/// Every existing ancestor of `rel` under `base` must be a real
/// directory: a symlink there could point the write anywhere.
fn check_parents(base: &Path, rel: &str, create: bool) -> Result<(), String> {
    let mut cur = base.to_path_buf();
    let comps: Vec<_> = Path::new(rel).components().collect();
    for c in comps.iter().take(comps.len().saturating_sub(1)) {
        cur.push(c);
        match std::fs::symlink_metadata(&cur) {
            Ok(m) if m.file_type().is_symlink() => return Err(format!("refusing to write through symlink {}", cur.display())),
            Ok(m) if m.is_dir() => {}
            Ok(_) => return Err(format!("{} is a file, not a directory", cur.display())),
            Err(_) if create => std::fs::create_dir(&cur).map_err(|e| format!("{}: {e}", cur.display()))?,
            Err(_) => return Ok(()),
        }
    }
    Ok(())
}

/// Receiver of a bulk transfer, before rsync writes anything: the
/// same refusals as `apply_files`, and the parents rsync cannot make.
pub(crate) fn ready_for(base: &Path, rel: &str) -> Result<(), String> {
    check_parents(base, rel, true)?;
    let p = join(base, rel);
    match std::fs::symlink_metadata(&p) {
        Ok(m) if m.file_type().is_symlink() => Err(format!("refusing to write through symlink {}", p.display())),
        _ => Ok(()),
    }
}

/// Receiver: write the files into the place. Every path is checked
/// before anything is written, so one bad path refuses the whole set.
pub(crate) fn apply_files(pack: &XferPack, base: &Path, store: &Store) -> Result<Applied, String> {
    let XferPack::Files { dirs, delete, files } = pack else {
        return Err("not a file transfer".into());
    };
    std::fs::create_dir_all(base).map_err(|e| format!("{}: {e}", base.display()))?;
    let base = base.canonicalize().map_err(|e| e.to_string())?;
    for f in files {
        safe_rel(&f.file.name).ok_or_else(|| format!("unsafe path in transfer: {}", f.file.name))?;
        check_parents(&base, &f.file.name, false)?;
        if std::fs::symlink_metadata(base.join(&f.file.name)).is_ok_and(|m| m.is_dir()) {
            return Err(format!("{} is a directory here", f.file.name));
        }
    }
    for d in dirs {
        if !d.is_empty() {
            safe_rel(d).ok_or_else(|| format!("unsafe path in transfer: {d}"))?;
        }
    }
    let mut out = Applied::default();
    for f in files {
        let bytes = store.assemble(&f.file).map_err(|m| format!("{} chunk(s) of {} missing", m.len(), f.file.name))?;
        let dest = base.join(&f.file.name);
        let mode = f.mode & 0o777;
        let same = std::fs::symlink_metadata(&dest).is_ok_and(|m| {
            m.is_file() && m.len() == bytes.len() as u64 && m.permissions().mode() & 0o777 == mode
        }) && std::fs::read(&dest).is_ok_and(|b| b == bytes);
        if same {
            out.unchanged += 1;
            continue;
        }
        check_parents(&base, &f.file.name, true)?;
        let parent = dest.parent().unwrap_or(&base);
        let leaf = dest.file_name().map(|n| n.to_string_lossy().into_owned()).unwrap_or_default();
        let tmp = parent.join(format!(".{leaf}.nerve-{}", super::protocol::new_id()));
        let write = || -> std::io::Result<()> {
            let mut fh = std::fs::OpenOptions::new().write(true).create_new(true).mode(0o600).open(&tmp)?;
            fh.write_all(&bytes)?;
            fh.set_permissions(std::fs::Permissions::from_mode(mode))?;
            std::fs::rename(&tmp, &dest)
        };
        if let Err(e) = write() {
            let _ = std::fs::remove_file(&tmp);
            return Err(format!("{}: {e}", f.file.name));
        }
        out.written += 1;
    }
    if *delete {
        let keep: HashSet<&str> = files.iter().map(|f| f.file.name.as_str()).collect();
        for d in dirs {
            let root = join(&base, d);
            if !d.is_empty() && (check_parents(&base, &format!("{d}/x"), false).is_err() || !std::fs::symlink_metadata(&root).is_ok_and(|m| m.is_dir())) {
                continue;
            }
            let mut have = Vec::new();
            walk_all(&root, d, &mut have);
            let mut parents = BTreeSet::new();
            for (rel, p) in have {
                if !keep.contains(rel.as_str()) && std::fs::remove_file(&p).is_ok() {
                    out.deleted += 1;
                    let mut q = p.parent().map(Path::to_path_buf);
                    while let Some(dir) = q.filter(|q| q.starts_with(&root) && *q != root) {
                        parents.insert(dir.clone());
                        q = dir.parent().map(Path::to_path_buf);
                    }
                }
            }
            // Deepest first; remove_dir leaves any directory still in use.
            for dir in parents.iter().rev() {
                let _ = std::fs::remove_dir(dir);
            }
        }
    }
    Ok(out)
}

/// Files *and symlinks* under `dir` (symlinked directories are not
/// entered), for `--delete`.
fn walk_all(dir: &Path, rel: &str, out: &mut Vec<(String, PathBuf)>) {
    let Ok(rd) = std::fs::read_dir(dir) else { return };
    for e in rd.flatten() {
        let name = e.file_name().to_string_lossy().into_owned();
        let r = if rel.is_empty() { name } else { format!("{rel}/{name}") };
        match e.file_type() {
            Ok(t) if t.is_dir() => walk_all(&e.path(), &r, out),
            Ok(_) => out.push((r, e.path())),
            Err(_) => {}
        }
    }
}

// ---- refs ----

/// The repo a place holds (the place may be any directory inside it).
pub(crate) fn place_repo(place: &Path) -> Result<PathBuf, String> {
    git_root(place).map_err(|_| format!("{} is not inside a git repository", place.display()))
}

/// Commits the target already has: its branch and remote-tracking tips,
/// newest first, capped so the answer fits one message.
pub(crate) fn repo_tips(repo: &Path) -> Vec<String> {
    text(repo, &["git", "for-each-ref", "--sort=-committerdate", "--count=500", "--format=%(objectname)", "refs/heads", "refs/remotes"])
        .map(|s| s.lines().filter(|l| is_sha(l)).map(String::from).collect())
        .unwrap_or_default()
}

pub(crate) fn this_repo_id(repo: &Path) -> String {
    repo_id(repo).unwrap_or_default()
}

/// A destination ref the target may write: a full, well-formed ref name
/// that is not what HEAD points at (moving the checked-out branch would
/// leave the working tree out of step with it).
pub(crate) fn check_dst(repo: &Path, dst: &str) -> Result<(), String> {
    if !dst.starts_with("refs/") || run(repo, &["git", "check-ref-format", dst]).is_err() {
        return Err(format!("{dst}: destination must be a full ref name such as refs/remotes/mac/main"));
    }
    if text(repo, &["git", "symbolic-ref", "-q", "HEAD"]).is_ok_and(|h| h == dst) {
        return Err(format!("{dst} is checked out in {}; pick a ref that isn't, such as refs/remotes/<peer>/…", repo.display()));
    }
    Ok(())
}

/// Sender: resolve each source ref and bundle only the commits beyond
/// the target's `have` tips.
pub(crate) fn pack_refs(place: &Path, map: &[RefMap], have: &[String], store: &Store) -> Result<XferPack, String> {
    let repo = place_repo(place)?;
    let mut refs = Vec::new();
    let mut names: Vec<String> = Vec::new();
    for m in map {
        if m.src.is_empty() || m.src.starts_with('-') {
            return Err(format!("bad source ref {:?}", m.src));
        }
        // Bundles list refs by name, so a bare commit id can't be sent.
        let full = text(&repo, &["git", "rev-parse", "--symbolic-full-name", &m.src]).unwrap_or_default();
        if full.is_empty() || full.contains('\n') {
            return Err(format!("{} is not a ref in {} (give a branch, tag or HEAD)", m.src, repo.display()));
        }
        let sha = text(&repo, &["git", "rev-parse", "--verify", "-q", &format!("{}^{{commit}}", m.src)])
            .map_err(|_| format!("{} does not name a commit in {}", m.src, repo.display()))?;
        refs.push(RefTip { src: m.src.clone(), dst: m.dst.clone(), sha });
        if !names.contains(&full) {
            names.push(full);
        }
    }
    let known: Vec<&String> = have
        .iter()
        .filter(|c| is_sha(c) && run(&repo, &["git", "cat-file", "-e", &format!("{c}^{{commit}}")]).is_ok())
        .collect();
    let stage = tempdir()?;
    let file = stage.path().join("refs.bundle");
    let mut argv: Vec<String> = ["git", "bundle", "create", "-q"].map(String::from).to_vec();
    argv.push(file.to_string_lossy().into_owned());
    argv.extend(names);
    if !known.is_empty() {
        argv.push("--not".into());
        argv.extend(known.iter().map(|c| c.to_string()));
    }
    let argv: Vec<&str> = argv.iter().map(String::as_str).collect();
    let bundle = match run(&repo, &argv) {
        Ok(_) => Some(store.add_file("refs.bundle", &std::fs::read(&file).map_err(|e| e.to_string())?).map_err(|e| e.to_string())?),
        Err(e) if e.contains("empty bundle") => None,
        Err(e) => return Err(e),
    };
    Ok(XferPack::Refs { refs, bundle })
}

/// Receiver: add the bundle's objects, then point each destination ref
/// at its commit. Returns one line per ref.
pub(crate) fn apply_refs(pack: &XferPack, place: &Path, store: &Store) -> Result<Vec<String>, String> {
    let XferPack::Refs { refs, bundle } = pack else {
        return Err("not a refs transfer".into());
    };
    let repo = place_repo(place)?;
    for r in refs {
        check_dst(&repo, &r.dst)?;
        if !is_sha(&r.sha) {
            return Err(format!("bad commit id for {}", r.dst));
        }
    }
    if let Some(b) = bundle {
        let bytes = store.assemble(b).map_err(|m| format!("{} chunk(s) of the bundle missing", m.len()))?;
        let stage = tempdir()?;
        let file = stage.path().join("refs.bundle");
        std::fs::write(&file, bytes).map_err(|e| e.to_string())?;
        // Writes objects only; unlike `fetch` it updates no refs at all.
        run(&repo, &["git", "bundle", "unbundle", &file.to_string_lossy()])?;
    }
    let mut lines = Vec::new();
    for r in refs {
        run(&repo, &["git", "cat-file", "-e", &format!("{}^{{commit}}", r.sha)]).map_err(|_| format!("commit {} for {} did not arrive", &r.sha[..12], r.dst))?;
        let old = text(&repo, &["git", "rev-parse", "-q", "--verify", &r.dst]).ok();
        if old.as_deref() == Some(r.sha.as_str()) {
            lines.push(format!("{} = {} (unchanged)", r.dst, &r.sha[..10]));
            continue;
        }
        run(&repo, &["git", "update-ref", "-m", &format!("nerve sync refs: {}", r.src), &r.dst, &r.sha])?;
        lines.push(match old {
            Some(o) => format!("{} {}..{}", r.dst, &o[..10.min(o.len())], &r.sha[..10]),
            None => format!("{} = {} (new)", r.dst, &r.sha[..10]),
        });
    }
    Ok(lines)
}

#[cfg(test)]
mod tests {
    use super::*;
    use std::process::{Command, Stdio};

    fn move_chunks(pack: &XferPack, from: &Store, to: &Store) -> (usize, u64) {
        let (mut n, mut bytes) = (0, 0);
        for id in super::super::chunks::needed(&pack.file_refs(), &Default::default()) {
            if !to.has(&id) {
                let b = from.get(&id).unwrap();
                bytes += b.len() as u64;
                n += 1;
                to.put_verified(&id, &b).unwrap();
            }
        }
        (n, bytes)
    }

    fn mode(p: &Path) -> u32 {
        std::fs::metadata(p).unwrap().permissions().mode() & 0o777
    }

    #[test]
    fn put_writes_inside_the_place_keeps_modes_and_repeats_cheaply() {
        let t = tempfile::tempdir().unwrap();
        let (a, b) = (t.path().join("a"), t.path().join("b"));
        std::fs::create_dir_all(a.join("bin")).unwrap();
        std::fs::create_dir_all(a.join("units/S5")).unwrap();
        for i in 0..40 {
            let body: String = (0..400).map(|j| format!("unit {i} line {j}\n")).collect();
            std::fs::write(a.join(format!("units/S5/f{i}.md")), body).unwrap();
        }
        std::fs::write(a.join("bin/check.mjs"), "#!/usr/bin/env node\n").unwrap();
        std::fs::set_permissions(a.join("bin/check.mjs"), std::fs::Permissions::from_mode(0o755)).unwrap();
        let (sa, sb) = (Store::new(&t.path().join("sa")), Store::new(&t.path().join("sb")));
        let roots = vec!["units".to_string(), "bin/check.mjs".to_string()];

        let p1 = pack_files(&a, &roots, false, &sa).unwrap();
        let (first_n, first_bytes) = move_chunks(&p1, &sa, &sb);
        let got = apply_files(&p1, &b, &sb).unwrap();
        assert_eq!((got.written, got.unchanged), (41, 0));
        assert_eq!(std::fs::read(b.join("units/S5/f7.md")).unwrap(), std::fs::read(a.join("units/S5/f7.md")).unwrap());
        assert_eq!(mode(&b.join("bin/check.mjs")), 0o755);

        // One file changes: only its chunks move, only it is rewritten.
        let mut body = std::fs::read_to_string(a.join("units/S5/f3.md")).unwrap();
        body.push_str("one more line\n");
        std::fs::write(a.join("units/S5/f3.md"), body).unwrap();
        let p2 = pack_files(&a, &roots, false, &sa).unwrap();
        let (n, bytes) = move_chunks(&p2, &sa, &sb);
        assert!(n <= 2 && bytes * 20 < first_bytes, "repeat moved {n} chunks / {bytes} B; first {first_n} / {first_bytes} B");
        let got = apply_files(&p2, &b, &sb).unwrap();
        assert_eq!((got.written, got.unchanged), (1, 40));
        // No temp files left behind.
        assert!(std::fs::read_dir(b.join("units/S5")).unwrap().flatten().all(|e| !e.file_name().to_string_lossy().starts_with('.')));
    }

    #[test]
    fn delete_removes_only_what_the_sender_dropped_under_the_given_dirs() {
        let t = tempfile::tempdir().unwrap();
        let (a, b) = (t.path().join("a"), t.path().join("b"));
        std::fs::create_dir_all(a.join("d/sub")).unwrap();
        std::fs::write(a.join("d/keep.txt"), "k").unwrap();
        std::fs::create_dir_all(b.join("d/sub/deeper")).unwrap();
        std::fs::create_dir_all(b.join("other")).unwrap();
        std::fs::write(b.join("d/stale.txt"), "s").unwrap();
        std::fs::write(b.join("d/sub/deeper/old.txt"), "o").unwrap();
        std::fs::write(b.join("other/untouched.txt"), "u").unwrap();
        let (sa, sb) = (Store::new(&t.path().join("sa")), Store::new(&t.path().join("sb")));
        let p = pack_files(&a, &["d".into()], true, &sa).unwrap();
        move_chunks(&p, &sa, &sb);
        let got = apply_files(&p, &b, &sb).unwrap();
        assert_eq!((got.written, got.deleted), (1, 2));
        assert!(b.join("d/keep.txt").is_file() && !b.join("d/stale.txt").exists());
        assert!(!b.join("d/sub").exists(), "emptied directories go too");
        assert!(b.join("other/untouched.txt").is_file(), "outside the given dirs nothing is deleted");
        // Without --delete, nothing is.
        std::fs::write(b.join("d/stale.txt"), "s").unwrap();
        let p = pack_files(&a, &["d".into()], false, &sa).unwrap();
        assert_eq!(apply_files(&p, &b, &sb).unwrap().deleted, 0);
    }

    #[test]
    fn writes_cannot_escape_the_place() {
        let t = tempfile::tempdir().unwrap();
        let (b, outside) = (t.path().join("b"), t.path().join("outside"));
        std::fs::create_dir_all(&b).unwrap();
        std::fs::create_dir_all(&outside).unwrap();
        std::os::unix::fs::symlink(&outside, b.join("link")).unwrap();
        let s = Store::new(&t.path().join("s"));
        let f = |name: &str| PlaceFile { file: s.add_file(name, b"x").unwrap(), mode: 0o644 };
        let via_link = XferPack::Files { dirs: vec![], delete: false, files: vec![f("ok.txt"), f("link/evil.txt")] };
        assert!(apply_files(&via_link, &b, &s).unwrap_err().contains("symlink"));
        assert!(!b.join("ok.txt").exists(), "checked before anything is written");
        assert!(!outside.join("evil.txt").exists());
        let dotdot = XferPack::Files { dirs: vec![], delete: false, files: vec![f("../evil.txt")] };
        assert!(apply_files(&dotdot, &b, &s).unwrap_err().contains("unsafe"));
        assert!(norm_root("../x").is_err() && norm_root("/etc").is_err());
        assert_eq!(norm_root("./").unwrap(), "");
        // --delete doesn't follow a symlinked dir out of the place either.
        std::fs::write(outside.join("precious.txt"), "p").unwrap();
        let p = XferPack::Files { dirs: vec!["link".into()], delete: true, files: vec![] };
        apply_files(&p, &b, &s).unwrap();
        assert!(outside.join("precious.txt").exists());
    }

    fn git(dir: &Path, args: &[&str]) {
        let ok = Command::new("git")
            .args(["-c", "user.email=t@t", "-c", "user.name=t", "-c", "init.defaultBranch=main"])
            .args(args)
            .current_dir(dir)
            .stdout(Stdio::null())
            .stderr(Stdio::null())
            .status()
            .unwrap()
            .success();
        assert!(ok, "git {args:?}");
    }

    #[test]
    fn refs_land_in_exactly_the_named_refs_and_nothing_else_moves() {
        let t = tempfile::tempdir().unwrap();
        let (a, b) = (t.path().join("a"), t.path().join("b"));
        std::fs::create_dir_all(&a).unwrap();
        git(&a, &["init", "-q"]);
        for i in 0..5 {
            std::fs::write(a.join("f"), format!("{i}\n").repeat(500)).unwrap();
            git(&a, &["add", "."]);
            git(&a, &["commit", "-qm", &format!("c{i}")]);
        }
        git(t.path(), &["clone", "-q", &a.to_string_lossy(), &b.to_string_lossy()]);
        git(&a, &["checkout", "-qb", "feature"]);
        std::fs::write(a.join("g"), "new\n").unwrap();
        git(&a, &["add", "."]);
        git(&a, &["commit", "-qm", "on feature"]);
        std::fs::write(b.join("f"), "local edit\n").unwrap(); // dirty worktree on the target
        let head_before = text(&b, &["git", "rev-parse", "HEAD"]).unwrap();
        let refs_before = text(&b, &["git", "for-each-ref", "--format=%(refname)"]).unwrap();
        let (sa, sb) = (Store::new(&t.path().join("sa")), Store::new(&t.path().join("sb")));

        let map = vec![RefMap { src: "feature".into(), dst: "refs/remotes/laptop/feature".into() }];
        let tips = repo_tips(&b);
        let p = pack_refs(&a, &map, &tips, &sa).unwrap();
        let (n, _) = move_chunks(&p, &sa, &sb);
        assert!(n >= 1);
        let lines = apply_refs(&p, &b, &sb).unwrap();
        assert!(lines[0].contains("refs/remotes/laptop/feature") && lines[0].contains("(new)"), "{lines:?}");
        assert_eq!(text(&b, &["git", "rev-parse", "refs/remotes/laptop/feature"]).unwrap(), text(&a, &["git", "rev-parse", "feature"]).unwrap());
        assert_eq!(text(&b, &["git", "rev-parse", "HEAD"]).unwrap(), head_before, "HEAD did not move");
        assert_eq!(std::fs::read_to_string(b.join("f")).unwrap(), "local edit\n", "worktree untouched");
        assert!(!b.join("g").exists());
        let refs_after = text(&b, &["git", "for-each-ref", "--format=%(refname)"]).unwrap();
        assert_eq!(refs_after.lines().count(), refs_before.lines().count() + 1, "exactly one new ref");

        // Again with nothing new: no bundle, ref unchanged.
        let p = pack_refs(&a, &map, &repo_tips(&b), &sa).unwrap();
        assert!(matches!(&p, XferPack::Refs { bundle: None, .. }));
        assert!(apply_refs(&p, &b, &sb).unwrap()[0].contains("unchanged"));

        // The checked-out branch and malformed names are refused.
        assert!(check_dst(&b, "refs/heads/main").unwrap_err().contains("checked out"));
        assert!(check_dst(&b, "main").is_err() && check_dst(&b, "refs/heads/a..b").is_err());
        let bad = vec![RefMap { src: text(&a, &["git", "rev-parse", "HEAD"]).unwrap(), dst: "refs/x".into() }];
        assert!(pack_refs(&a, &bad, &[], &sa).unwrap_err().contains("not a ref"));
    }
}

<script type="text/plain" class="doc" id="d48" data-group="nerve sync source" data-title="sync/protocol.rs" data-path="src/sync/protocol.rs">//! Wire format for device-to-device sync. Pure data + encoding rules, no
//! I/O, so it's unit-testable and a web client can mirror it.
//!
//! Every payload is JSON, NIP-44 encrypted to exactly one recipient
//! device. Three Nostr event classes carry it:
//!
//! - `KIND_STATE` (addressable, NIP-01 30000-39999): a device's latest
//!   state, one per recipient (`d` = "nerve/1/state/<recipient>"). The
//!   relay keeps only the newest, so a closed laptop's last state stays
//!   readable: "what was it doing when it went away".
//! - `KIND_MSG` (regular, stored) with a NIP-40 expiration: commands,
//!   answers, blobs, job traffic. Stored, so a device that was asleep
//!   catches up on reconnect (store-and-forward).
//! - Acks are ordinary messages: a relay's `OK` is not delivery (public
//!   relays were measured accepting and then silently dropping events).
//!
//! Strings arriving here are untrusted; the receiver wraps anything it
//! renders in `Sanitised`.

use serde::{Deserialize, Serialize};

/// 2: chunked hand-off, invite pairing, mod-backed sessions. Devices on
/// different versions ignore each other rather than misread.
pub(crate) const PROTO_VERSION: u32 = 2;
/// NIP-78 application data: addressable, so relays keep the latest only.
pub(crate) const KIND_STATE: u16 = 30078;
/// Regular (stored) kind in the unassigned 4xxx range.
pub(crate) const KIND_MSG: u16 = 4590;
/// Messages expire after a day; state after a week.
pub(crate) const MSG_TTL_SECS: u64 = 24 * 3600;
pub(crate) const STATE_TTL_SECS: u64 = 7 * 24 * 3600;
/// Raw bytes carried per message. NIP-44 v2 caps plaintext at 64 KiB;
/// 32 KiB of data is ~44 KB once base64'd into the JSON envelope.
pub(crate) const CHUNK_BYTES: usize = 32 * 1024;
/// Lines of transcript preview carried per session in a state.
pub(crate) const TAIL_LINES: usize = 8;

pub(crate) fn state_d_tag(recipient_hex: &str) -> String {
    format!("nerve/{PROTO_VERSION}/state/{}", &recipient_hex[..16.min(recipient_hex.len())])
}

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
pub(crate) struct Envelope {
    pub(crate) v: u32,
    /// Random id; acks and replies point at it.
    pub(crate) id: String,
    /// Sender's device name (informational; identity is the pubkey).
    pub(crate) from: String,
    pub(crate) sent_at: u64,
    pub(crate) body: Body,
}

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
#[serde(tag = "t", rename_all = "snake_case")]
pub(crate) enum Body {
    State(Box<DeviceState>),
    /// Type `text` into a running session's prompt, then Enter.
    Send { session: String, text: String },
    /// Resolve a pending permission prompt or question.
    Answer { request: String, answer: Answer },
    /// Ask the device to republish its state now.
    SyncNow,
    /// Ask for a larger artefact; it comes back as `Blob` chunks.
    Fetch { session: String, what: FetchWhat },
    Blob(Blob),
    /// Continue `session` on the recipient. Starts a short exchange:
    /// offer → `HandoffHave` (what the target's checkout already holds)
    /// → `HandoffManifest` (the files, as chunk ids) → `ChunkWant` (only
    /// the ids the target lacks) → `ChunkData` → `Ack`.
    HandoffOffer(HandoffOffer),
    HandoffHave(HandoffHave),
    HandoffManifest(HandoffManifest),
    /// Ask the sender of `re` for these chunks.
    ChunkWant { re: String, ids: Vec<String> },
    /// Chunks for `re`: (id, base64 bytes), at most `CHUNK_BYTES` raw.
    ChunkData { re: String, chunks: Vec<(String, String)>, last: bool },
    /// Join with an invite code (`nerve setup <code>`): proves knowledge
    /// of the inviter's one-time secret. The only message accepted from
    /// a key that is not yet a peer.
    PairRequest { secret: String, name: String, relays: Vec<String> },
    JobSubmit(JobSpec),
    /// Progress of a job or a run; runs carry `kind = "run"`.
    JobUpdate(JobStatus),
    /// Run one allowlisted command (`nerve sync run`).
    RunSubmit(RunSpec),
    /// Send files or git refs into a named place on the recipient. The
    /// exchange is the hand-off's: `HandoffHave` → `HandoffManifest` →
    /// `ChunkWant`/`ChunkData` → `Ack`.
    XferOffer(XferOffer),
    /// Ask the recipient to send this back as an `XferOffer` (pull).
    XferGet(XferOffer),
    Ack { re: String, ok: bool, msg: String },
}

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
#[serde(tag = "kind", rename_all = "snake_case")]
pub(crate) enum Answer {
    Allow,
    Deny { reason: String },
    /// One label per question, in question order.
    Choose { labels: Vec<String> },
}

#[derive(Debug, Clone, Copy, Serialize, Deserialize, PartialEq, Eq)]
#[serde(rename_all = "snake_case")]
pub(crate) enum FetchWhat {

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
pub(crate) struct Blob {
    /// The message this answers (a Fetch id, or `handoff:<id>`).
    pub(crate) re: String,
    pub(crate) title: String,
    pub(crate) part: u32,
    pub(crate) parts: u32,
    /// base64 of this chunk's bytes.
    pub(crate) data: String,

/// One allowlisted command, run with argv as given (no shell unless the
/// matching `[run] allow` entry says so).
#[derive(Debug, Clone, Default, Serialize, Deserialize, PartialEq)]

#[derive(Debug, Clone, Default, Serialize, Deserialize, PartialEq)]
pub(crate) struct XferOffer {
    /// Names a directory in each device's `[places]`: senders never need

    #[serde(default)]
    pub(crate) for_req: Option<String>,

    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub(crate) bulk: Option<BulkOffer>,
}

    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub(crate) src: Option<String>,
}

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
#[serde(tag = "kind", rename_all = "snake_case")]
pub(crate) enum XferWhat {
    /// Paths relative to the place. `delete` removes files under the
    /// directories among them that the sender no longer has.
    Files { roots: Vec<String>, delete: bool },
    /// Git refs of the place's repo: sender ref → receiver ref.
    Refs { map: Vec<RefMap>, repo_id: String },
}

impl Default for XferWhat {

        Self::Files { roots: Vec::new(), delete: false }
    }
}

impl Envelope {
    pub(crate) fn new(from: &str, body: Body) -> Self {
        Self {
            v: PROTO_VERSION,
            id: new_id(),
            from: from.to_string(),
            sent_at: now_secs(),
            body,
        }
    }

    /// With an id the caller chose, so a CLI can follow its outcome.
    pub(crate) fn with_id(from: &str, id: &str, body: Body) -> Self {
        Self { id: id.to_string(), ..Self::new(from, body) }
    }

    pub(crate) fn encode(&self) -> String {
        serde_json::to_string(self).expect("envelope serialises")
    }

    /// Rejects other protocol versions rather than misreading them.
    pub(crate) fn decode(s: &str) -> Result<Self, String> {
        let e: Self = serde_json::from_str(s).map_err(|e| format!("bad envelope: {e}"))?;
        if e.v != PROTO_VERSION {
            return Err(format!("unsupported protocol v{}", e.v));
        }
        Ok(e)
    }
}

pub(crate) fn now_secs() -> u64 {
    std::time::SystemTime::now()
        .duration_since(std::time::UNIX_EPOCH)
        .map(|d| d.as_secs())
        .unwrap_or(0)
}

/// 16 hex chars from the OS RNG (via the nanosecond clock + pid as a
/// fallback seed — ids only need to be unique, not secret).
pub(crate) fn new_id() -> String {
    let mut buf = [0u8; 8];
    if std::fs::File::open("/dev/urandom")
        .and_then(|mut f| std::io::Read::read_exact(&mut f, &mut buf))
        .is_err()
    {
        let n = std::time::SystemTime::now()
            .duration_since(std::time::UNIX_EPOCH)
            .map(|d| d.as_nanos())
            .unwrap_or(0) as u64
            ^ (std::process::id() as u64) << 32;
        buf = n.to_le_bytes();
    }
    buf.iter().map(|b| format!("{b:02x}")).collect()
}

/// Split bytes into base64 chunks of at most `CHUNK_BYTES` raw bytes.
pub(crate) fn chunk(re: &str, title: &str, bytes: &[u8]) -> Vec<Blob> {
    let pieces: Vec<&[u8]> = if bytes.is_empty() {
        vec![&[][..]]
    } else {
        bytes.chunks(CHUNK_BYTES).collect()
    };
    let parts = pieces.len() as u32;
    pieces
        .into_iter()
        .enumerate()
        .map(|(i, p)| Blob {
            re: re.to_string(),
            title: title.to_string(),
            part: i as u32,
            parts,
            data: base64_encode(p),
        })
        .collect()
}

/// Reassembles chunks that may arrive out of order or twice.
#[derive(Debug, Default)]
pub(crate) struct Reassembly {
    pub(crate) title: String,
    parts: Vec<Option<Vec<u8>>>,
}

impl Reassembly {
    /// Feed one chunk; returns the whole payload once every part is in.
    pub(crate) fn add(&mut self, b: &Blob) -> Result<Option<Vec<u8>>, String> {
        if b.parts == 0 || b.part >= b.parts || b.parts > 100_000 {
            return Err("bad chunk numbering".into());
        }
        if self.parts.is_empty() {
            self.parts = vec![None; b.parts as usize];
            self.title = b.title.clone();
        } else if self.parts.len() != b.parts as usize {
            return Err("chunk count changed mid-stream".into());
        }
        self.parts[b.part as usize] = Some(base64_decode(&b.data)?);
        if self.parts.iter().all(Option::is_some) {
            Ok(Some(self.parts.iter().flatten().flatten().copied().collect()))
        } else {
            Ok(None)
        }
    }

    pub(crate) fn progress(&self) -> (usize, usize) {
        (self.parts.iter().filter(|p| p.is_some()).count(), self.parts.len())
    }
}

const B64: &[u8; 64] = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

pub(crate) fn base64_encode(bytes: &[u8]) -> String {
    let mut out = String::with_capacity(bytes.len().div_ceil(3) * 4);
    for c in bytes.chunks(3) {
        let n = (c[0] as u32) << 16 | (*c.get(1).unwrap_or(&0) as u32) << 8 | *c.get(2).unwrap_or(&0) as u32;
        for i in 0..4 {
            if i <= c.len() {
                out.push(B64[(n >> (18 - 6 * i) & 63) as usize] as char);
            } else {
                out.push('=');
            }
        }
    }
    out
}

pub(crate) fn base64_decode(s: &str) -> Result<Vec<u8>, String> {
    let mut out = Vec::with_capacity(s.len() / 4 * 3);
    let (mut acc, mut bits) = (0u32, 0u32);
    for ch in s.bytes() {
        let v = match ch {
            b'A'..=b'Z' => ch - b'A',
            b'a'..=b'z' => ch - b'a' + 26,
            b'0'..=b'9' => ch - b'0' + 52,
            b'+' => 62,
            b'/' => 63,
            b'=' => break,
            _ => return Err("invalid base64".into()),
        } as u32;
        acc = acc << 6 | v;
        bits += 6;
        if bits >= 8 {
            bits -= 8;
            out.push((acc >> bits) as u8);
            acc &= (1 << bits) - 1;
        }
    }
    Ok(out)
}

/// Claude's project-dir slug: every non-alphanumeric char becomes `-`.
/// The handoff must install the transcript under the *target's* slug.
pub(crate) fn project_slug(cwd: &str) -> String {
    cwd.chars()
        .map(|c| if c.is_ascii_alphanumeric() { c } else { '-' })
        .collect()
}

/// Devices that can run a job: advertise every required capability.
/// Least busy wins; ties go to the name for determinism, so every device
/// computing this agrees.
pub(crate) fn pick_device<'a>(
    candidates: impl IntoIterator<Item = (&'a str, &'a [String], usize)>,
    requires: &[String],
) -> Option<&'a str> {
    candidates
        .into_iter()
        .filter(|(_, caps, _)| requires.iter().all(|r| caps.iter().any(|c| c == r)))
        .min_by(|a, b| a.2.cmp(&b.2).then(a.0.cmp(b.0)))
        .map(|(name, _, _)| name)
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn envelope_round_trips_and_rejects_other_versions() {
        let e = Envelope::new("laptop", Body::Send { session: "s1".into(), text: "hi\nthere".into() });
        let back = Envelope::decode(&e.encode()).unwrap();
        assert_eq!(back, e);
        let future = e.encode().replacen("\"v\":2", "\"v\":9", 1);
        assert!(Envelope::decode(&future).unwrap_err().contains("v9"));
    }

    #[test]
    fn answer_wire_shape_is_stable() {
        let a = Answer::Choose { labels: vec!["Bash".into()] };
        assert_eq!(serde_json::to_string(&a).unwrap(), r#"{"kind":"choose","labels":["Bash"]}"#);
    }

    #[test]
    fn base64_matches_rfc4648_vectors() {
        for (raw, enc) in [("", ""), ("f", "Zg=="), ("fo", "Zm8="), ("foo", "Zm9v"), ("foob", "Zm9vYg=="), ("fooba", "Zm9vYmE="), ("foobar", "Zm9vYmFy")] {
            assert_eq!(base64_encode(raw.as_bytes()), enc);
            assert_eq!(base64_decode(enc).unwrap(), raw.as_bytes());
        }
        assert!(base64_decode("a$b").is_err());
    }

    #[test]
    fn chunks_reassemble_out_of_order_and_tolerate_duplicates() {
        let data: Vec<u8> = (0..(CHUNK_BYTES * 2 + 17)).map(|i| (i * 7 % 251) as u8).collect();
        let mut blobs = chunk("r1", "pack", &data);
        assert_eq!(blobs.len(), 3);
        blobs.reverse();
        let mut r = Reassembly::default();
        assert_eq!(r.add(&blobs[0]).unwrap(), None);
        assert_eq!(r.add(&blobs[0]).unwrap(), None, "duplicate is harmless");
        assert_eq!(r.add(&blobs[1]).unwrap(), None);
        assert_eq!(r.add(&blobs[2]).unwrap().unwrap(), data);
        assert_eq!(r.progress(), (3, 3));
    }

    #[test]
    fn empty_payload_is_one_empty_chunk() {
        let blobs = chunk("r", "t", b"");
        let mut r = Reassembly::default();
        assert_eq!(r.add(&blobs[0]).unwrap().unwrap(), Vec::<u8>::new());
    }

    #[test]
    fn slug_matches_claude_project_dirs() {
        assert_eq!(project_slug("/home/user/lab/ho-plain"), "-home-user-lab-ho-plain");
        assert_eq!(project_slug("/Users/a/SS/x.y"), "-Users-a-SS-x-y");
    }

    #[test]
    fn job_goes_to_least_busy_capable_device() {
        let laptop = ["xcode".to_string(), "ios-sim".to_string()];
        let server = ["linux".to_string(), "arm64".to_string()];
        let devs = [("laptop", &laptop[..], 3), ("server", &server[..], 0)];
        assert_eq!(pick_device(devs, &["ios-sim".into()]), Some("laptop"));
        assert_eq!(pick_device(devs, &[]), Some("server"));
        assert_eq!(pick_device(devs, &["gpu".into()]), None);
    }
}

<script type="text/plain" class="doc" id="d49" data-group="nerve sync source" data-title="sync/runs.rs" data-path="src/sync/runs.rs">//! Plain-command runs (`nerve sync run`): argv as given, in a place or a
//! directory, allowed only by an explicit `[run] allow` rule in this
//! device's fleet.toml. A peer can already type into sessions, but a
//! command runs with no human watching, so nothing runs by default.
//!
//! Progress reuses `JobStatus` (kind "run"): an output tail, the line
//! count, and finally the exit code.

use std::io::{BufRead, BufReader};
use std::path::{Path, PathBuf};
use std::process::{Command, Stdio};
use std::sync::mpsc::{channel, Sender};
use std::time::{Duration, Instant};

use super::fleet::{Fleet, RunRule};
use super::protocol::{now_secs, JobStatus, RunSpec};

/// Output lines carried per update.
pub(crate) const RUN_TAIL: usize = 20;
/// At most one progress update per this, so a chatty command can't
/// flood the relay.
const UPDATE_EVERY: Duration = Duration::from_secs(1);
/// What `timeout(1)` exits with; reported when `--timeout` kills it.
pub(crate) const TIMED_OUT: i32 = 124;

/// How an allowed run executes.
#[derive(Debug, Clone, PartialEq)]
pub(crate) struct Plan {
    pub(crate) cwd: PathBuf,
    pub(crate) argv: Vec<String>,
    pub(crate) shell: bool,
}

/// A rule's argv: literal, with an optional final `"*"` for any trailing
/// arguments. A `*` anywhere else makes the rule invalid (never matches).
pub(crate) fn rule_matches(pattern: &[String], argv: &[String]) -> bool {
    match pattern.split_last() {
        None => false,
        Some((last, head)) if last == "*" => {
            !head.is_empty() && !head.iter().any(|p| p == "*") && argv.len() >= head.len() && argv[..head.len()] == *head
        }
        Some(_) => !pattern.iter().any(|p| p == "*") && pattern == argv,
    }
}

/// Where the run goes and whether a rule allows it; the refusal says
/// what to add to `fleet_file`.
pub(crate) fn authorize(fleet: &Fleet, fleet_file: &Path, spec: &RunSpec) -> Result<Plan, String> {
    if spec.argv.is_empty() || spec.argv.iter().any(|a| a.contains('\0')) {
        return Err("empty or malformed command".into());
    }
    if spec.place.is_some() && spec.cwd.is_some() {
        return Err("give --place or --cwd, not both".into());
    }
    let cwd = match (&spec.place, &spec.cwd) {
        (Some(p), _) => fleet.place(p, fleet_file)?,
        (None, Some(c)) if Path::new(c).is_absolute() => PathBuf::from(c),
        (None, Some(c)) => return Err(format!("--cwd must be absolute: {c}")),
        (None, None) => dirs::home_dir().ok_or("no home directory")?,
    };
    let fits = |r: &RunRule| {
        r.place.as_ref().is_none_or(|p| spec.place.as_ref() == Some(p))
            && r.cwd.as_ref().is_none_or(|c| Path::new(c) == cwd)
            && rule_matches(&r.argv, &spec.argv)
    };
    let Some(rule) = fleet.run.allow.iter().find(|r| fits(r)) else {
        let where_ = match (&spec.place, &spec.cwd) {
            (Some(p), _) => format!("place = \"{p}\", "),
            (None, Some(c)) => format!("cwd = \"{c}\", "),
            _ => String::new(),
        };
        let argv: Vec<String> = spec.argv.iter().map(|a| format!("{a:?}")).collect();
        return Err(format!(
            "not allowed on {}: no [run] allow rule matches. To allow it, add {{ {where_}argv = [{}] }} to `allow` under [run] in {} (a final \"*\" allows any further arguments)",
            fleet.device,
            argv.join(", "),
            fleet_file.display()
        ));
    };
    if !cwd.is_dir() {
        return Err(format!("{} is not a directory on {}", cwd.display(), fleet.device));
    }
    Ok(Plan { cwd, argv: spec.argv.clone(), shell: rule.shell })
}

fn push_tail(st: &mut JobStatus, line: &str) {
    st.tail.push(line.chars().take(240).collect());
    if st.tail.len() > RUN_TAIL {
        st.tail.remove(0);
    }
    st.lines += 1;
}

/// The status a run starts with, before its thread reports.
pub(crate) fn queued(spec: &RunSpec, device: &str) -> JobStatus {
    JobStatus {
        id: spec.id.clone(),
        title: spec.argv.join(" ").chars().take(80).collect(),
        device: device.to_string(),
        phase: "queued".into(),
        kind: "run".into(),
        updated_at: now_secs(),
        ..Default::default()
    }
}

/// Run to completion on this thread, sending throttled status updates
/// and always a final one with the exit code.
pub(crate) fn run(spec: &RunSpec, plan: &Plan, device: &str, tx: &Sender<JobStatus>) {
    let mut st = queued(spec, device);
    st.phase = "running".into();
    let send = |st: &mut JobStatus| {
        st.updated_at = now_secs();
        let _ = tx.send(st.clone());
    };
    send(&mut st);
    // What actually runs: argv as given, or `sh -c` for a shell rule.
    let target: Vec<String> = if plan.shell {
        vec!["/bin/sh".into(), "-c".into(), plan.argv.join(" ")]
    } else {
        // `./bin/x` means the one in the run's directory, not the agent's.
        let prog = &plan.argv[0];
        let prog = if prog.contains('/') && !prog.starts_with('/') { plan.cwd.join(prog).to_string_lossy().into_owned() } else { prog.clone() };
        match super::bins::find(&prog) {
            Ok(exe) => std::iter::once(exe.to_string_lossy().into_owned()).chain(plan.argv[1..].iter().cloned()).collect(),
            Err(e) => {
                st.phase = "failed".into();
                st.result = Some(e);
                return send(&mut st);
            }
        }
    };
    // A process with a SIGCHLD reaper (the TUI hosting an agent) can reap
    // the child before `wait` sees it, losing the exit code. So the
    // command runs under `"$@"` (argv passed through verbatim, nothing
    // parsed) and its status also goes to a file, passed as `$0`.
    let stage = match super::handoff::tempdir() {
        Ok(t) => t,
        Err(e) => {
            st.phase = "failed".into();
            st.result = Some(e);
            return send(&mut st);
        }
    };
    let status_file = stage.path().join("status");
    let mut cmd = Command::new("/bin/sh");
    cmd.arg("-c").arg(r#""$@"; s=$?; echo "$s" >"$0"; exit "$s""#).arg(&status_file).args(&target);
    cmd.current_dir(&plan.cwd).stdin(Stdio::null()).stdout(Stdio::piped()).stderr(Stdio::piped());
    // Its own process group, so a timeout takes its children with it.
    std::os::unix::process::CommandExt::process_group(&mut cmd, 0);
    let mut child = match cmd.spawn() {
        Ok(c) => c,
        Err(e) => {
            st.phase = "failed".into();
            st.result = Some(format!("could not start {}: {e}", plan.argv[0]));
            return send(&mut st);
        }
    };
    let (ltx, lrx) = channel::<String>();
    for out in [child.stdout.take().map(|o| Box::new(o) as Box<dyn std::io::Read + Send>), child.stderr.take().map(|e| Box::new(e) as Box<dyn std::io::Read + Send>)]
        .into_iter()
        .flatten()
    {
        let ltx = ltx.clone();
        std::thread::spawn(move || {
            for l in BufReader::new(out).lines().map_while(Result::ok) {
                if ltx.send(l).is_err() {
                    break;
                }
            }
        });
    }
    drop(ltx);
    let started = Instant::now();
    let deadline = spec.timeout_secs.map(|s| started + Duration::from_secs(s));
    let mut last_sent = Instant::now();
    let mut dirty = false;
    let mut timed_out = false;
    let status = loop {
        match lrx.recv_timeout(Duration::from_millis(200)) {
            Ok(l) => {
                push_tail(&mut st, &l);
                dirty = true;
            }
            Err(std::sync::mpsc::RecvTimeoutError::Timeout) => {}
            // Both pipes closed, but the command may still run: keep
            // polling it below, so the timeout still applies.
            Err(std::sync::mpsc::RecvTimeoutError::Disconnected) => std::thread::sleep(Duration::from_millis(100)),
        }
        if deadline.is_some_and(|d| Instant::now() >= d) && !timed_out {
            timed_out = true;
            kill_group(child.id(), &mut child);
        }
        match child.try_wait() {
            Ok(Some(s)) => {
                // Drain what is already buffered, then stop.
                while let Ok(l) = lrx.recv_timeout(Duration::from_millis(50)) {
                    push_tail(&mut st, &l);
                }
                break Some(s);
            }
            Ok(None) => {}
            // Reaped elsewhere: gone, and its status is in the file.
            Err(_) => {
                while let Ok(l) = lrx.recv_timeout(Duration::from_millis(50)) {
                    push_tail(&mut st, &l);
                }
                break None;
            }
        }
        if dirty && last_sent.elapsed() >= UPDATE_EVERY {
            send(&mut st);
            last_sent = Instant::now();
            dirty = false;
        }
    };
    let code = status
        .map(|s| {
            use std::os::unix::process::ExitStatusExt;
            s.code().unwrap_or_else(|| 128 + s.signal().unwrap_or(0))
        })
        .or_else(|| std::fs::read_to_string(&status_file).ok().and_then(|c| c.trim().parse().ok()));
    st.exit_code = Some(if timed_out { TIMED_OUT } else { code.unwrap_or(-1) });
    st.phase = if st.exit_code == Some(0) { "done" } else { "failed" }.into();
    st.result = Some(if timed_out {
        format!("timed out after {}s and was killed", spec.timeout_secs.unwrap_or(0))
    } else {
        format!("exit {} after {:.1}s", st.exit_code.unwrap_or(-1), started.elapsed().as_secs_f64())
    });
    send(&mut st);
}

fn kill_group(pid: u32, child: &mut std::process::Child) {
    use nix::sys::signal::{killpg, Signal};
    let pg = nix::unistd::Pid::from_raw(pid as i32);
    let _ = killpg(pg, Signal::SIGTERM);
    for _ in 0..20 {
        if child.try_wait().ok().flatten().is_some() {
            return;
        }
        std::thread::sleep(Duration::from_millis(100));
    }
    let _ = killpg(pg, Signal::SIGKILL);
}

#[cfg(test)]
mod tests {
    use super::*;

    fn v(a: &[&str]) -> Vec<String> {
        a.iter().map(|s| s.to_string()).collect()
    }

    #[test]
    fn only_a_final_star_globs() {
        let p = v(&["node", "bin/check.mjs", "*"]);
        assert!(rule_matches(&p, &v(&["node", "bin/check.mjs"])));
        assert!(rule_matches(&p, &v(&["node", "bin/check.mjs", "verify", "S5"])));
        assert!(!rule_matches(&p, &v(&["node", "other.mjs", "x"])));
        assert!(!rule_matches(&p, &v(&["node"])));
        assert!(rule_matches(&v(&["make", "test"]), &v(&["make", "test"])));
        assert!(!rule_matches(&v(&["make", "test"]), &v(&["make", "test", "extra"])));
        assert!(!rule_matches(&v(&["sh", "*", "x"]), &v(&["sh", "*", "x"])), "a mid-argv star invalidates the rule");
        assert!(!rule_matches(&v(&["*"]), &v(&["rm", "-rf", "/"])), "a bare star allows nothing");
        assert!(!rule_matches(&[], &v(&["ls"])));
    }

    fn fleet_with(dir: &Path) -> Fleet {
        let mut f = Fleet { device: "server".into(), ..Default::default() };
        f.places.insert("harness".into(), dir.to_string_lossy().into_owned());
        f.run.allow.push(RunRule { place: Some("harness".into()), argv: v(&["echo", "*"]), ..Default::default() });
        f
    }

    #[test]
    fn authorize_needs_a_matching_rule_and_says_how_to_add_one() {
        let dir = tempfile::tempdir().unwrap();
        let f = fleet_with(dir.path());
        let file = Path::new("/x/fleet.toml");
        let spec = RunSpec { argv: v(&["echo", "hi"]), place: Some("harness".into()), ..Default::default() };
        let plan = authorize(&f, file, &spec).unwrap();
        assert_eq!((plan.cwd.as_path(), plan.shell), (dir.path(), false));

        let other_dir = RunSpec { cwd: Some("/tmp".into()), place: None, ..spec.clone() };
        let e = authorize(&f, file, &other_dir).unwrap_err();
        assert!(e.contains("no [run] allow rule") && e.contains("cwd = \"/tmp\"") && e.contains("/x/fleet.toml"), "{e}");

        let rm = RunSpec { argv: v(&["rm", "-rf", "x"]), ..spec.clone() };
        assert!(authorize(&f, file, &rm).unwrap_err().contains("argv = [\"rm\", \"-rf\", \"x\"]"));

        let unknown = RunSpec { place: Some("nope".into()), ..spec };
        let e = authorize(&f, file, &unknown).unwrap_err();
        assert!(e.contains("no place 'nope'") && e.contains("[places]"), "{e}");
    }

    #[test]
    fn run_streams_output_and_reports_the_exit_code() {
        let dir = tempfile::tempdir().unwrap();
        let (tx, rx) = channel();
        let spec = RunSpec { id: "r1".into(), argv: v(&["sh", "-c", "echo out; echo err >&2; pwd; exit 3"]), ..Default::default() };
        let plan = Plan { cwd: dir.path().to_path_buf(), argv: spec.argv.clone(), shell: false };
        run(&spec, &plan, "server", &tx);
        let last = rx.try_iter().last().unwrap();
        assert_eq!((last.phase.as_str(), last.exit_code, last.kind.as_str()), ("failed", Some(3), "run"));
        assert_eq!(last.lines, 3);
        assert!(last.tail.contains(&"out".to_string()) && last.tail.contains(&"err".to_string()));
        let pwd = dir.path().canonicalize().unwrap();
        assert!(last.tail.iter().any(|l| Path::new(l).canonicalize().ok().as_deref() == Some(&pwd)));
    }

    #[test]
    fn argv_is_not_shell_parsed() {
        let dir = tempfile::tempdir().unwrap();
        let (tx, rx) = channel();
        let spec = RunSpec { id: "r2".into(), argv: v(&["echo", "$HOME; touch pwned"]), ..Default::default() };
        let plan = Plan { cwd: dir.path().to_path_buf(), argv: spec.argv.clone(), shell: false };
        run(&spec, &plan, "server", &tx);
        let last = rx.try_iter().last().unwrap();
        assert_eq!(last.exit_code, Some(0));
        assert_eq!(last.tail, vec!["$HOME; touch pwned".to_string()]);
        assert!(!dir.path().join("pwned").exists());
    }

    #[test]
    fn a_relative_program_is_found_in_the_run_directory() {
        let dir = tempfile::tempdir().unwrap();
        std::fs::create_dir_all(dir.path().join("bin")).unwrap();
        let script = dir.path().join("bin/v2.sh");
        std::fs::write(&script, "#!/bin/sh\necho \"v2 $*\"\n").unwrap();
        std::fs::set_permissions(&script, std::os::unix::fs::PermissionsExt::from_mode(0o755)).unwrap();
        let (tx, rx) = channel();
        let spec = RunSpec { id: "r4".into(), argv: v(&["./bin/v2.sh", "verify", "S5"]), ..Default::default() };
        let plan = Plan { cwd: dir.path().to_path_buf(), argv: spec.argv.clone(), shell: false };
        run(&spec, &plan, "server", &tx);
        let last = rx.try_iter().last().unwrap();
        assert_eq!((last.exit_code, last.tail.clone()), (Some(0), vec!["v2 verify S5".to_string()]));
    }

    #[test]
    fn timeout_kills_the_command() {
        let dir = tempfile::tempdir().unwrap();
        let (tx, rx) = channel();
        let spec = RunSpec { id: "r3".into(), argv: v(&["sleep", "30"]), timeout_secs: Some(1), ..Default::default() };
        let plan = Plan { cwd: dir.path().to_path_buf(), argv: spec.argv.clone(), shell: false };
        let t = Instant::now();
        run(&spec, &plan, "server", &tx);
        assert!(t.elapsed() < Duration::from_secs(10));
        let last = rx.try_iter().last().unwrap();
        assert_eq!(last.exit_code, Some(TIMED_OUT));
        assert!(last.result.unwrap().contains("timed out"));
    }
}

<script type="text/plain" class="doc" id="d50" data-group="nerve sync source" data-title="sync/setup.rs" data-path="src/sync/setup.rs">//! `nerve setup [code]`: everything a device needs, in one command.
//!
//! 1. Create this device's identity (once) with working default relays.
//! 2. Join: with an invite code, trust the inviter and ask it to trust
//!    this device back (see `pairing`).
//! 3. Connect Claude: install the nerve mod (Claude Code ≥ 2.1.287), or
//!    fall back to settings hooks on older versions.
//! 4. Keep the agent running: a launchd agent (macOS), a systemd user
//!    service (Linux), or a detached process (Termux, containers).
//! 5. Without a code: print an invite for the next device and wait for
//!    it to join.
//!
//! Re-running it is safe: every step checks what is already in place.

use std::path::{Path, PathBuf};
use std::process::{Command, Stdio};
use std::time::{Duration, Instant};

use nostr_sdk::prelude::{ClientNotification, PublicKey, StreamExt};

use super::fleet::{self, Fleet};
use super::pairing::{self, Invite};
use super::protocol::{self, Body, Envelope};
use super::transport::Transport;
use crate::paths::Paths;

/// Relays that delivered for fresh keys in testing (E14).
pub(crate) const DEFAULT_RELAYS: [&str; 2] = ["wss://relay.primal.net", "wss://relay.snort.social"];
/// First Claude Code release with mods.
const MODS_SINCE: (u32, u32, u32) = (2, 1, 287);

const MOD_MARKETPLACE: &str = include_str!("../../mod/.claude-plugin/marketplace.json");
const MOD_PLUGIN: &str = include_str!("../../mod/nerve/.claude-plugin/plugin.json");
const MOD_HOOKS: &str = include_str!("../../mod/nerve/hooks/hooks.json");
const MOD_REGISTER: &str = include_str!("../../mod/nerve/hooks/register.js");

struct Opts {
    code: Option<String>,
    name: Option<String>,
    relays: Vec<String>,
    service: bool,
    claude: bool,
    wait: bool,
}

fn parse(args: &[&str]) -> Result<Opts, String> {
    let mut o = Opts { code: None, name: None, relays: Vec::new(), service: true, claude: true, wait: true };
    let mut it = args.iter();
    while let Some(a) = it.next() {
        match *a {
            "--name" => o.name = Some(it.next().ok_or("--name needs a value")?.to_string()),
            "--relay" => o.relays.push(it.next().ok_or("--relay needs a URL")?.to_string()),
            "--no-service" => o.service = false,
            "--no-claude" => o.claude = false,
            "--no-wait" => o.wait = false,
            c if c.starts_with("nerve1") => o.code = Some(c.to_string()),
            other => return Err(format!("unknown argument {other}\nusage: nerve setup [<invite code>] [--name N] [--relay URL]... [--no-service] [--no-claude] [--no-wait]")),
        }
    }
    Ok(o)
}

fn ok(msg: impl AsRef<str>) {
    println!("  \u{2713} {}", msg.as_ref());
}

fn warn(msg: impl AsRef<str>) {
    println!("  ! {}", msg.as_ref());
}

pub(crate) fn run(paths: &Paths, args: &[&str]) -> Result<String, String> {
    let o = parse(args)?;
    let dir = fleet::sync_dir(paths);
    let invite = o.code.as_deref().map(Invite::decode).transpose()?;
    println!("nerve setup");

    // 1. Identity.
    let fresh = Fleet::load(&dir).is_none();
    let mut fleet = Fleet::load(&dir).unwrap_or_default();
    if let Some(n) = &o.name {
        fleet.device = n.clone();
    }
    let mut relays: Vec<String> = Vec::new();
    relays.extend(o.relays.iter().cloned());
    if let Some(inv) = &invite {
        relays.extend(inv.r.iter().cloned());
    }
    if fleet.relays.is_empty() && relays.is_empty() {
        relays.extend(DEFAULT_RELAYS.iter().map(|s| s.to_string()));
    }
    for r in relays {
        if !(r.starts_with("ws://") || r.starts_with("wss://")) {
            return Err(format!("relay must be ws:// or wss://: {r}"));
        }
        if !fleet.relays.contains(&r) {
            fleet.relays.push(r);
        }
    }
    let keys = fleet::device_keys(&dir).map_err(|e| e.to_string())?;
    fleet.save(&dir).map_err(|e| e.to_string())?;
    ok(format!(
        "{} '{}' ({}), relays: {}",
        if fresh { "created device" } else { "device" },
        fleet.device,
        short(&fleet::npub(&keys.public_key())),
        fleet.relays.join(" ")
    ));

    // 2. Join.
    if let Some(inv) = &invite {
        join(&dir, &mut fleet, &keys, inv)?;
    }

    // 3. Claude.
    if o.claude {
        connect_claude(&dir);
    }

    // 4. Agent.
    if o.service {
        match install_service(paths, &dir) {
            Ok(how) => ok(how),
            Err(e) => warn(format!("background agent not installed: {e}. Run `nerve sync agent` yourself.")),
        }
    }

    // 5. Invite the next device.
    if invite.is_none() {
        let inv = pairing::create(&dir, &fleet.device, &keys.public_key().to_hex(), &fleet.relays).map_err(|e| e.to_string())?;
        let code = inv.encode();
        println!("\nAdd another device: on it, run\n\n    nerve setup {code}\n");
        if let Some(qr) = qr(&code) {
            println!("{qr}");
        }
        println!("The code works once, for the next hour. Anyone holding it can pair a device, so treat it like a password.");
        if o.wait && std::io::IsTerminal::is_terminal(&std::io::stdout()) {
            wait_for_join(&dir, fleet.peers.len());
        }
    }
    Ok(String::new())
}

fn short(npub: &str) -> String {
    format!("{}…{}", &npub[..12.min(npub.len())], &npub[npub.len().saturating_sub(6)..])
}

/// Trust the inviter, then prove the invite to it and wait for its ack.
fn join(dir: &Path, fleet: &mut Fleet, keys: &nostr_sdk::prelude::Keys, inv: &Invite) -> Result<(), String> {
    let inviter = PublicKey::from_hex(&inv.k).map_err(|e| e.to_string())?;
    if inviter == keys.public_key() {
        return Err("that invite came from this device; run it on the other one".into());
    }
    let existing = fleet.peer_keys().into_iter().find(|(_, k)| *k == inviter).map(|(n, _)| n);
    let name = existing.unwrap_or_else(|| {
        let f = fleet.clone();
        pairing::unique_name(&inv.n, |n| f.peers.contains_key(n) || n == f.device)
    });
    fleet.peers.insert(name.clone(), fleet::npub(&inviter));
    fleet.save(dir).map_err(|e| e.to_string())?;
    print!("  … asking {name} to pair back");
    let _ = std::io::Write::flush(&mut std::io::stdout());
    let rt = tokio::runtime::Builder::new_current_thread().enable_all().build().map_err(|e| e.to_string())?;
    let me = fleet.device.clone();
    let relays = fleet.relays.clone();
    let res = rt.block_on(async {
        let t = Transport::connect(keys.clone(), &relays).await?;
        t.subscribe(&[inviter], protocol::now_secs().saturating_sub(5)).await?;
        let mut notes = t.client.notifications();
        let env = Envelope::new(&me, Body::PairRequest { secret: inv.s.clone(), name: me.clone(), relays: relays.clone() });
        t.send(&inviter, &env).await?;
        let deadline = Instant::now() + Duration::from_secs(60);
        let out = loop {
            let left = deadline.saturating_duration_since(Instant::now());
            if left.is_zero() {
                break Err("no answer within 60 s: is nerve set up and running on the inviting device?".to_string());
            }
            let Ok(Some(ClientNotification::Event { event, .. })) = tokio::time::timeout(left, notes.next()).await else {
                continue;
            };
            match t.open(&event).map(|i| i.envelope.body) {
                Some(Body::Ack { re, ok: true, msg }) if re == env.id => break Ok(msg),
                Some(Body::Ack { re, ok: false, msg }) if re == env.id => break Err(msg),
                _ => {}
            }
        };
        t.disconnect().await;
        out
    });
    println!();
    match res {
        Ok(msg) => {
            ok(format!("paired with {name}: {msg}"));
            Ok(())
        }
        Err(e) => {
            // Keep the half-pairing out of the way: they don't trust us.
            fleet.peers.remove(&name);
            let _ = fleet.save(dir);
            Err(format!("pairing failed: {e}"))
        }
    }
}

fn wait_for_join(dir: &Path, before: usize) {
    println!("\nWaiting for a device to join (Ctrl-C to stop waiting; the code stays valid)…");
    let deadline = Instant::now() + Duration::from_secs(pairing::INVITE_TTL_SECS);
    while Instant::now() < deadline {
        std::thread::sleep(Duration::from_secs(1));
        if let Some(f) = Fleet::load(dir) {
            if f.peers.len() > before {
                let names: Vec<&String> = f.peers.keys().collect();
                ok(format!("a device joined. Paired devices: {}", names.iter().map(|s| s.as_str()).collect::<Vec<_>>().join(", ")));
                println!("\nRun `nerve` and press D to see them.");
                return;
            }
        }
    }
}

/// "2.1.295 (Claude Code)" → (2, 1, 295).
pub(crate) fn parse_version(s: &str) -> Option<(u32, u32, u32)> {
    let v = s.split_whitespace().next()?;
    let mut p = v.split('.').map(|x| x.parse::<u32>().ok());
    Some((p.next()??, p.next()??, p.next()??))
}

fn claude_version() -> Option<(u32, u32, u32)> {
    let out = Command::new(super::bins::find("claude").ok()?).arg("--version").stdin(Stdio::null()).stderr(Stdio::null()).output().ok()?;
    parse_version(&String::from_utf8_lossy(&out.stdout))
}

fn connect_claude(dir: &Path) {
    let Some(v) = claude_version() else {
        warn("Claude Code not found on PATH: sessions can be watched once it's installed; re-run `nerve setup` after.");
        return;
    };
    if v < MODS_SINCE {
        let msg = super::cli::install_hooks(dir).unwrap_or_else(|e| e);
        warn(format!("Claude Code {}.{}.{} predates mods (2.1.287); using settings hooks instead.", v.0, v.1, v.2));
        println!("    {}", msg.replace('\n', "\n    "));
        return;
    }
    match install_mod(dir) {
        Ok(()) => ok(format!("nerve mod installed for Claude Code {}.{}.{} (new sessions load it)", v.0, v.1, v.2)),
        Err(e) => warn(format!("couldn't install the nerve mod: {e}")),
    }
}

/// Write the mod into `<sync>/mod` and register it as a local plugin
/// marketplace. The plugin reads its socket path from `nerve.json`.
fn install_mod(dir: &Path) -> Result<(), String> {
    let root = dir.join("mod");
    let files: [(&str, &str); 4] = [
        (".claude-plugin/marketplace.json", MOD_MARKETPLACE),
        ("nerve/.claude-plugin/plugin.json", MOD_PLUGIN),
        ("nerve/hooks/hooks.json", MOD_HOOKS),
        ("nerve/hooks/register.js", MOD_REGISTER),
    ];
    for (rel, body) in files {
        let p = root.join(rel);
        std::fs::create_dir_all(p.parent().unwrap_or(&root)).map_err(|e| e.to_string())?;
        std::fs::write(&p, body).map_err(|e| e.to_string())?;
    }
    let sock = super::modhub::socket_path(dir);
    let cfg = serde_json::json!({ "socket": sock.to_string_lossy() });
    std::fs::write(root.join("nerve/nerve.json"), cfg.to_string()).map_err(|e| e.to_string())?;
    let exe = super::bins::find("claude")?;
    let claude = |args: &[&str]| -> Result<String, String> {
        let out = Command::new(&exe).args(args).stdin(Stdio::null()).output().map_err(|e| e.to_string())?;
        let text = format!("{}{}", String::from_utf8_lossy(&out.stdout), String::from_utf8_lossy(&out.stderr));
        if out.status.success() { Ok(text) } else { Err(text.trim().to_string()) }
    };
    let root_s = root.to_string_lossy().into_owned();
    if let Err(e) = claude(&["plugin", "marketplace", "add", &root_s]) {
        if !e.contains("already") {
            return Err(e);
        }
        let _ = claude(&["plugin", "marketplace", "update", "nerve-local"]);
    }
    match claude(&["plugin", "install", "nerve@nerve-local"]) {
        Ok(_) => Ok(()),
        Err(e) if e.contains("already") => claude(&["plugin", "enable", "nerve@nerve-local"]).map(|_| ()).or(Ok(())),
        Err(e) => Err(e),
    }
}

fn exe() -> Result<PathBuf, String> {
    std::env::current_exe().map_err(|e| e.to_string())
}

/// A per-config suffix, so a second nerve config (the demo, a test)
/// gets its own service instead of replacing the real one.
fn label_suffix() -> String {
    match std::env::var("NERVE_CONFIG_DIR") {
        Ok(d) if !d.is_empty() => format!(".{}", &super::chunks::id_of(d.as_bytes())[..8]),
        _ => String::new(),
    }
}

fn is_termux() -> bool {
    std::env::var("PREFIX").is_ok_and(|p| p.contains("com.termux"))
}

fn install_service(paths: &Paths, dir: &Path) -> Result<String, String> {
    let exe = exe()?;
    let log = dir.join("agent.log");
    // Services start with a bare PATH; without ~/.local/bin a server's agent
    // can't find claude for hand-offs and jobs.
    let path_env = super::bins::service_path(&std::env::var("PATH").unwrap_or_default(), &super::bins::extra_dirs());
    let cfg_env = std::env::var("NERVE_CONFIG_DIR").ok().filter(|s| !s.is_empty());
    let _ = paths;
    if cfg!(target_os = "macos") {
        let label = format!("dev.nerve.sync{}", label_suffix());
        let plist_dir = dirs::home_dir().ok_or("no home dir")?.join("Library/LaunchAgents");
        std::fs::create_dir_all(&plist_dir).map_err(|e| e.to_string())?;
        let plist = plist_dir.join(format!("{label}.plist"));
        let mut env = format!("<key>PATH</key><string>{}</string>", xml(&path_env));
        if let Some(c) = &cfg_env {
            env.push_str(&format!("<key>NERVE_CONFIG_DIR</key><string>{}</string>", xml(c)));
        }
        let body = format!(
            r#"<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
<key>Label</key><string>{label}</string>
<key>ProgramArguments</key><array><string>{exe}</string><string>sync</string><string>agent</string></array>
<key>EnvironmentVariables</key><dict>{env}</dict>
<key>RunAtLoad</key><true/>
<key>KeepAlive</key><true/>
<key>StandardOutPath</key><string>{log}</string>
<key>StandardErrorPath</key><string>{log}</string>
</dict></plist>
"#,
            exe = xml(&exe.to_string_lossy()),
            log = xml(&log.to_string_lossy()),
        );
        std::fs::write(&plist, body).map_err(|e| e.to_string())?;
        let domain = format!("gui/{}", nix::unistd::getuid());
        let _ = Command::new("launchctl").args(["bootout", &domain, &plist.to_string_lossy()]).stderr(Stdio::null()).status();
        let st = Command::new("launchctl").args(["bootstrap", &domain, &plist.to_string_lossy()]).status().map_err(|e| e.to_string())?;
        if !st.success() {
            return Err("launchctl bootstrap failed".into());
        }
        return Ok(format!("background agent runs at login (launchd {label}; log {})", log.display()));
    }
    let systemd = !is_termux()
        && Command::new("systemctl").args(["--user", "show-environment"]).stdout(Stdio::null()).stderr(Stdio::null()).status().is_ok_and(|s| s.success());
    if systemd {
        let name = format!("nerve-sync{}", label_suffix());
        let unit_dir = dirs::config_dir().ok_or("no config dir")?.join("systemd/user");
        std::fs::create_dir_all(&unit_dir).map_err(|e| e.to_string())?;
        let mut env = format!("Environment=PATH={path_env}\n");
        if let Some(c) = &cfg_env {
            env.push_str(&format!("Environment=NERVE_CONFIG_DIR={c}\n"));
        }
        let unit = format!(
            "[Unit]\nDescription=nerve sync agent\nAfter=network-online.target\n\n[Service]\nExecStart={} sync agent\n{env}Restart=always\nRestartSec=5\n\n[Install]\nWantedBy=default.target\n",
            exe.display()
        );
        std::fs::write(unit_dir.join(format!("{name}.service")), unit).map_err(|e| e.to_string())?;
        let sc = |a: &[&str]| Command::new("systemctl").arg("--user").args(a).status().is_ok_and(|s| s.success());
        if !(sc(&["daemon-reload"]) && sc(&["enable", &format!("{name}.service")]) && sc(&["restart", &format!("{name}.service")])) {
            return Err("systemctl --user failed".into());
        }
        // Without lingering, user services stop at logout: a headless server
        // would lose its agent when the SSH session ends.
        let user = std::env::var("USER").unwrap_or_default();
        let linger = Command::new("loginctl").args(["enable-linger", &user]).stderr(Stdio::null()).status().is_ok_and(|s| s.success());
        return Ok(format!(
            "background agent runs as systemd user service {name}{}",
            if linger { " (also while logged out)" } else { "; run `sudo loginctl enable-linger $USER` to keep it up while logged out" }
        ));
    }
    // No service manager (Termux, containers): start it detached now.
    if super::agent::agent_alive(dir) {
        return Ok("background agent already running".into());
    }
    let logf = std::fs::OpenOptions::new().create(true).append(true).open(&log).map_err(|e| e.to_string())?;
    let mut cmd = Command::new(&exe);
    cmd.args(["sync", "agent"]).stdin(Stdio::null()).stdout(logf.try_clone().map_err(|e| e.to_string())?).stderr(logf);
    std::os::unix::process::CommandExt::process_group(&mut cmd, 0);
    cmd.spawn().map_err(|e| e.to_string())?;
    let mut how = format!("background agent started (log {})", log.display());
    if is_termux() {
        let _ = Command::new("termux-wake-lock").status();
        if let Some(boot) = dirs::home_dir().map(|h| h.join(".termux/boot")) {
            if std::fs::create_dir_all(&boot).is_ok() {
                let script = format!("#!/data/data/com.termux/files/usr/bin/sh\ntermux-wake-lock\nexec {} sync agent >> {} 2>&1\n", exe.display(), log.display());
                let p = boot.join("nerve-sync");
                if std::fs::write(&p, script).is_ok() {
                    use std::os::unix::fs::PermissionsExt;
                    let _ = std::fs::set_permissions(&p, std::fs::Permissions::from_mode(0o755));
                    how.push_str("; with the Termux:Boot app it also starts at boot");
                }
            }
        }
    }
    Ok(how)
}

fn xml(s: &str) -> String {
    s.replace('&', "&amp;").replace('<', "&lt;").replace('>', "&gt;")
}

/// The invite as a terminal QR code, for phones with a camera app that
/// copies text. None when the code is too long for a small QR.
fn qr(code: &str) -> Option<String> {
    let q = qrcode::QrCode::with_error_correction_level(code.as_bytes(), qrcode::EcLevel::L).ok()?;
    Some(q.render::<qrcode::render::unicode::Dense1x2>().quiet_zone(true).build())
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn claude_versions_compare() {
        assert_eq!(parse_version("2.1.295 (Claude Code)"), Some((2, 1, 295)));
        assert!(parse_version("2.1.286 (Claude Code)").unwrap() < MODS_SINCE);
        assert!(parse_version("2.2.0").unwrap() >= MODS_SINCE);
        assert_eq!(parse_version("garbage"), None);
    }

    #[test]
    fn embedded_mod_is_consistent() {
        let m: serde_json::Value = serde_json::from_str(MOD_MARKETPLACE).unwrap();
        assert_eq!(m["name"], "nerve-local");
        assert_eq!(m["plugins"][0]["name"], "nerve");
        let h: serde_json::Value = serde_json::from_str(MOD_HOOKS).unwrap();
        assert_eq!(h["modules"][0], "./register.js");
        assert!(MOD_REGISTER.contains("/v1/poll") && MOD_REGISTER.contains("/v1/request"));
    }

    #[test]
    fn invite_codes_fit_a_terminal_qr() {
        let inv = Invite { v: 1, n: "laptop".into(), k: "ab".repeat(32), s: "0f".repeat(16), r: vec!["ws://192.0.2.10:7777".into(), DEFAULT_RELAYS[0].into(), DEFAULT_RELAYS[1].into()] };
        let q = qr(&inv.encode()).expect("fits");
        assert!(q.lines().count() < 45, "{} rows", q.lines().count());
    }
}

<script type="text/plain" class="doc" id="d51" data-group="nerve sync source" data-title="sync/spool.rs" data-path="src/sync/spool.rs">//! CLI → running agent hand-off: when a long-lived agent (the TUI or
//! `nerve sync agent`) holds this device's identity, one-shot CLI
//! commands drop requests in `<sync>/spool/` instead of starting a
//! second agent that would race it for the mailbox and relays.

use std::path::{Path, PathBuf};

use serde_json::{json, Value};

use super::agent::Request;
use super::protocol::{Body, JobSpec, RunSpec, XferOffer};

pub(crate) fn encode(r: &Request) -> Value {
    match r {
        Request::To { device, body } => json!({"t": "to", "device": device, "body": body}),
        Request::SyncNow => json!({"t": "sync"}),
        Request::Handoff { session_id, cwd, device, continue_with, place, force } => json!({
            "t": "handoff", "session_id": session_id, "cwd": cwd, "device": device,
            "continue_with": continue_with, "place": place, "force": force
        }),
        Request::Job { spec, device } => json!({"t": "job", "spec": spec, "device": device}),
        Request::Run { spec, device } => json!({"t": "run", "spec": spec, "device": device}),
        Request::Xfer { id, device, offer, pull } => json!({"t": "xfer", "id": id, "device": device, "offer": offer, "pull": pull}),
        Request::SetAway(on) => json!({"t": "away", "on": on}),
    }
}

pub(crate) fn decode(v: &Value) -> Option<Request> {
    let s = |k: &str| v.get(k).and_then(Value::as_str).map(String::from);
    Some(match v.get("t")?.as_str()? {
        "to" => Request::To { device: s("device")?, body: serde_json::from_value::<Body>(v.get("body")?.clone()).ok()? },
        "sync" => Request::SyncNow,
        "handoff" => Request::Handoff {
            session_id: s("session_id")?,
            cwd: PathBuf::from(s("cwd")?),
            device: s("device")?,
            continue_with: s("continue_with"),
            place: s("place"),
            force: v.get("force").and_then(Value::as_bool).unwrap_or(false),
        },
        "job" => Request::Job { spec: serde_json::from_value::<JobSpec>(v.get("spec")?.clone()).ok()?, device: s("device") },
        "run" => Request::Run { spec: serde_json::from_value::<RunSpec>(v.get("spec")?.clone()).ok()?, device: s("device")? },
        "xfer" => Request::Xfer {
            id: s("id")?,
            device: s("device")?,
            offer: serde_json::from_value::<XferOffer>(v.get("offer")?.clone()).ok()?,
            pull: v.get("pull")?.as_bool()?,
        },
        "away" => Request::SetAway(v.get("on")?.as_bool()?),
        _ => return None,
    })
}

/// Take every queued request (oldest first), deleting the files.
pub(crate) fn drain(sync_dir: &Path) -> Vec<Request> {
    let spool = sync_dir.join("spool");
    let Ok(rd) = std::fs::read_dir(&spool) else {
        return Vec::new();
    };
    let mut files: Vec<(std::time::SystemTime, PathBuf)> = rd
        .flatten()
        .map(|e| e.path())
        .filter(|p| p.extension().is_some_and(|x| x == "json"))
        .map(|p| (std::fs::metadata(&p).and_then(|m| m.modified()).unwrap_or(std::time::UNIX_EPOCH), p))
        .collect();
    files.sort();
    files
        .into_iter()
        .filter_map(|(_, p)| {
            let raw = std::fs::read_to_string(&p).ok();
            let _ = std::fs::remove_file(&p);
            decode(&serde_json::from_str(&raw?).ok()?)
        })
        .collect()
}

#[cfg(test)]
mod tests {
    use super::*;
    use crate::sync::protocol::Answer;

    #[test]
    fn requests_round_trip_through_the_spool() {
        let dir = tempfile::tempdir().unwrap();
        let spool = dir.path().join("spool");
        std::fs::create_dir_all(&spool).unwrap();
        let reqs = [
            Request::To { device: "server".into(), body: Body::Answer { request: "ab".into(), answer: Answer::Allow } },
            Request::SetAway(true),
            Request::Xfer {
                id: "x1".into(),
                device: "server".into(),
                offer: XferOffer { place: "h".into(), what: crate::sync::protocol::XferWhat::Files { roots: vec!["a".into()], delete: true }, for_req: None, bulk: None },
                pull: true,
            },
            Request::Run { spec: RunSpec { id: "r1".into(), argv: vec!["ls".into()], ..Default::default() }, device: "server".into() },
            Request::Handoff { session_id: "s".into(), cwd: "/x".into(), device: "server".into(), continue_with: None, place: Some("h".into()), force: true },
        ];
        for (i, r) in reqs.iter().enumerate() {
            std::fs::write(spool.join(format!("{i}.json")), encode(r).to_string()).unwrap();
            std::thread::sleep(std::time::Duration::from_millis(15));
        }
        let got = drain(dir.path());
        assert_eq!(got.len(), 5);
        assert!(matches!(&got[0], Request::To { device, .. } if device == "server"));
        assert!(matches!(got[1], Request::SetAway(true)));
        assert!(matches!(&got[2], Request::Xfer { id, pull: true, offer, .. } if id == "x1" && offer.place == "h"));
        assert!(matches!(&got[3], Request::Run { spec, .. } if spec.argv == ["ls"]));
        assert!(matches!(&got[4], Request::Handoff { place: Some(p), force: true, .. } if p == "h"));
        assert!(drain(dir.path()).is_empty(), "drained files are removed");
    }
}
