    /// Move every chunk `pack` needs from `from` to `to`, as the wire
    /// would; returns how many bytes that took.
    fn transfer(pack: &Pack, from: &Store, to: &Store) -> u64 {
        let have: std::collections::HashSet<String> = std::collections::HashSet::new();
        let mut sent = 0;
        for id in super::super::chunks::needed(&pack.files, &have) {
            if !to.has(&id) {
                let b = from.get(&id).unwrap();
                sent += b.len() as u64;
                to.put_verified(&id, &b).unwrap();
            }
        }
        sent
    }

    // End to end on one machine: two different absolute paths stand in
    // for two devices, each with its own chunk store.
    #[test]
    fn pack_then_unpack_reproduces_repo_state_and_installs_transcript() {
        let f = fixture();
        let (store_a, store_b) = (Store::new(&f.tmp.path().join("syncA")), Store::new(&f.tmp.path().join("syncB")));
        let pack1 = pack(&f.src, f.sid, std::slice::from_ref(&f.root_a), &[], &store_a).unwrap();
        assert_eq!((pack1.meta.repo_name.as_str(), pack1.meta.branch.as_str()), ("proj", "main"));
        assert!(pack1.files.iter().any(|x| x.name == "repo.bundle"));
        let first = transfer(&pack1, &store_a, &store_b);

        let root_b = f.tmp.path().join("claudeB");
        let dest = f.tmp.path().join("other/place/proj");
        let inst = unpack(&pack1, &dest, &store_b, &root_b, false).unwrap();
        assert_eq!(std::fs::read_to_string(inst.cwd.join("f0.txt")).unwrap(), "edited\n");
        assert_eq!(std::fs::read_to_string(inst.cwd.join("new.txt")).unwrap(), "fresh\n");
        let installed = root_b.join("projects").join(project_slug(&inst.cwd.to_string_lossy()));
        assert!(installed.join(format!("{}.jsonl", f.sid)).is_file());
        assert!(installed.join(f.sid).join("subagents/agent-1.jsonl").is_file());

        // A second hand-off onto now-dirty work is refused, not merged.
        assert!(unpack(&pack1, &dest, &store_b, &root_b, false).unwrap_err().contains("uncommitted"));

        // The second hand-off after one more commit and one more turn: the
        // target reports its tips, so only the new commit and the tail of
        // the transcript travel.
        git(&inst.cwd, &["checkout", "-q", "--", "."]);
        std::fs::remove_file(inst.cwd.join("new.txt")).unwrap();
        git(&f.src, &["add", "f0.txt"]);
        git(&f.src, &["commit", "-qm", "next"]);
        let t = f.root_a.join("projects").join(project_slug(&f.src.to_string_lossy())).join(format!("{}.jsonl", f.sid));
        let mut body = std::fs::read(&t).unwrap();
        body.extend_from_slice(b"{\"type\":\"user\",\"message\":{\"content\":\"one more turn\"}}\n");
        std::fs::write(&t, body).unwrap();
        let tips = local_tips(&dest, &pack1.meta.repo_id);
        assert!(!tips.is_empty(), "same repo id: tips reported");
        let pack2 = pack(&f.src, f.sid, std::slice::from_ref(&f.root_a), &tips, &store_a).unwrap();
        let second = transfer(&pack2, &store_a, &store_b);
        assert!(second * 10 < first, "second hand-off moved {second} bytes, first {first}");
        let inst2 = unpack(&pack2, &dest, &store_b, &root_b, false).unwrap();
        assert_eq!(std::fs::read_to_string(inst2.cwd.join("f0.txt")).unwrap(), "edited\n");
        assert_eq!(text(&inst2.cwd, &["git", "log", "-1", "--format=%s"]).unwrap(), "next");
    }

    #[test]
    fn nothing_new_means_no_bundle_and_unknown_tips_are_ignored() {
        let f = fixture();
        let store = Store::new(&f.tmp.path().join("s"));
        let head = text(&f.src, &["git", "rev-parse", "HEAD"]).unwrap();
        let p = pack(&f.src, f.sid, std::slice::from_ref(&f.root_a), std::slice::from_ref(&head), &store).unwrap();
        assert!(!p.files.iter().any(|x| x.name == "repo.bundle"), "target has every commit");
        let bogus = "a".repeat(40);
        let p = pack(&f.src, f.sid, std::slice::from_ref(&f.root_a), &[bogus], &store).unwrap();
        assert!(p.files.iter().any(|x| x.name == "repo.bundle"), "a tip we don't have doesn't shrink the bundle");
        assert!(local_tips(&f.src, "not-this-repo").is_empty(), "other repos report nothing");
    }

    #[test]
    fn pack_paths_cannot_escape() {
        assert_eq!(safe_rel("a/b.txt"), Some("a/b.txt"));
        for bad in ["../x", "/etc/passwd", "a/../../x", ""] {
            assert_eq!(safe_rel(bad), None, "{bad}");
        }
    }

    #[test]
    fn destination_is_a_place_then_path_map_then_an_explicit_root_else_refused() {
        let file = Path::new("/cfg/sync/fleet.toml");
        let offer = HandoffOffer { repo_name: "nerve".into(), src_cwd: "/Users/me/code/nerve".into(), ..Default::default() };
        let mut f = Fleet { device: "server".into(), ..Default::default() };
        let e = destination(&offer, &f, file).unwrap_err();
        assert!(e.contains("--to <place>") && e.contains("[places]") && e.contains("[path_map]") && e.contains("/cfg/sync/fleet.toml"), "{e}");
        f.handoff_root = Some("/h".into());
        assert_eq!(destination(&offer, &f, file).unwrap(), PathBuf::from("/h/nerve"));
        f.path_map.insert("/Users/me/code".into(), "/srv/ss".into());
        assert_eq!(destination(&offer, &f, file).unwrap(), PathBuf::from("/srv/ss/nerve"));
        let to = HandoffOffer { place: Some("harness".into()), ..offer.clone() };
        assert!(destination(&to, &f, file).unwrap_err().contains("no place 'harness'"));
        f.places.insert("harness".into(), "/srv/harness".into());
        assert_eq!(destination(&to, &f, file).unwrap(), PathBuf::from("/srv/harness"));
    }

    #[test]
    fn an_existing_checkout_keeps_its_branch_unless_forced() {
        let f = fixture();
        let (store_a, store_b) = (Store::new(&f.tmp.path().join("syncA")), Store::new(&f.tmp.path().join("syncB")));
        let root_b = f.tmp.path().join("claudeB");
        let dest = f.tmp.path().join("b/proj");
        let p = pack(&f.src, f.sid, std::slice::from_ref(&f.root_a), &[], &store_a).unwrap();
        transfer(&p, &store_a, &store_b);
        let inst = unpack(&p, &dest, &store_b, &root_b, false).unwrap();
        git(&inst.cwd, &["checkout", "-q", "--", "."]);
        std::fs::remove_file(inst.cwd.join("new.txt")).unwrap();

        // The target's checkout is on another branch: refused, HEAD stays.
        git(&dest, &["checkout", "-qb", "mine"]);
        let e = unpack(&p, &dest, &store_b, &root_b, false).unwrap_err();
        assert!(e.contains("on branch 'mine'") && e.contains("--force"), "{e}");
        assert_eq!(text(&dest, &["git", "rev-parse", "--abbrev-ref", "HEAD"]).unwrap(), "mine");

        // The target's branch has a commit the hand-off lacks: refused.
        git(&dest, &["checkout", "-q", "main"]);
        std::fs::write(dest.join("local.txt"), "only here\n").unwrap();
        git(&dest, &["add", "local.txt"]);
        git(&dest, &["commit", "-qm", "target-only"]);
        let e = unpack(&p, &dest, &store_b, &root_b, false).unwrap_err();
        assert!(e.contains("has commits the hand-off doesn't"), "{e}");
        assert_eq!(text(&dest, &["git", "log", "-1", "--format=%s"]).unwrap(), "target-only");

        // --force does what it always did.
        git(&dest, &["checkout", "-q", "mine"]);
        let inst = unpack(&p, &dest, &store_b, &root_b, true).unwrap();
        assert_eq!(text(&inst.cwd, &["git", "rev-parse", "--abbrev-ref", "HEAD"]).unwrap(), "main");
        assert_eq!(std::fs::read_to_string(inst.cwd.join("f0.txt")).unwrap(), "edited\n");
    }

    #[test]
    fn session_ids_are_validated() {
        assert!(valid_session_id("cebc016b-999f-445c-9fea-c47cff632e85"));
        assert!(!valid_session_id("../../etc"));
        assert!(!valid_session_id(""));
    }
}

<script type="text/plain" class="doc" id="d41" data-group="nerve sync source" data-title="sync/inject.rs" data-path="src/sync/inject.rs">//! Typing a remote instruction into a running interactive session.
//!
//! Claude's TUI accepts a bracketed paste followed by Enter as a normal
//! user turn (verified on 2.1.288: multi-line text arrives as one
//! message). tmux panes get `paste-buffer -p`; Ghostty tabs get the
//! AppleScript `input text` command. Background and desktop sessions
//! have no pane to type into.

use std::process::{Command, Stdio};

use crate::state::session::{DiscoverySnapshot, SessionKind};

/// Where a session's prompt can be typed into.
#[derive(Debug, Clone, PartialEq, Eq)]
pub(crate) enum InputTarget {
    TmuxPane(String),
    #[cfg(target_os = "macos")]
    Ghostty(String),
}

pub(crate) fn tmux_panes() -> Vec<(String, String)> {
    let Ok(out) = Command::new("tmux")
        .args(["list-panes", "-a", "-F", "#{pane_id} #{pane_tty}"])
        .stdin(Stdio::null())
        .stderr(Stdio::null())
        .output()
    else {
        return Vec::new();
    };
    String::from_utf8_lossy(&out.stdout)
        .lines()
        .filter_map(|l| l.split_once(' ').map(|(a, b)| (a.to_string(), b.to_string())))
        .collect()
}

/// Match by tty: the pane's tty is the session's controlling tty.
pub(crate) fn pane_for_tty(panes: &[(String, String)], tty: &str) -> Option<String> {
    let want = tty.trim_start_matches("/dev/");
    panes
        .iter()
        .find(|(_, t)| t.trim_start_matches("/dev/") == want)
        .map(|(id, _)| id.clone())
}

/// Resolve how to reach a session. Spawns tmux / osascript: worker only.
pub(crate) fn resolve(snap: &DiscoverySnapshot, panes: &[(String, String)]) -> Option<InputTarget> {
    if snap.kind != SessionKind::Terminal {
        return None;
    }
    let tty = snap.tty.as_ref()?.as_str();
    if let Some(p) = pane_for_tty(panes, tty) {
        return Some(InputTarget::TmuxPane(p));
    }
    #[cfg(target_os = "macos")]
    {
        let target = crate::platform::SessionTarget {
            cwd: snap.cwd.to_string_lossy().into_owned(),
            name: snap.name.as_str().to_string(),
            dir_name: snap.cwd.file_name().map(|n| n.to_string_lossy().into_owned()).unwrap_or_default(),
            tty: Some(tty.to_string()),
            kind: snap.kind,
        };
        if let Some(id) = crate::platform::ghostty::terminal_id_headless(&target) {
            return Some(InputTarget::Ghostty(id));
        }
    }
    None
}

/// Instructions are capped and stripped of control characters other than
/// newline/tab: a remote peer must not be able to send Escape sequences or
/// Ctrl-keys that drive the TUI (e.g. accept a dialog) instead of typing.
pub(crate) fn clean_text(text: &str) -> String {
    text.chars()
        .filter(|c| !c.is_control() || matches!(c, '\n' | '\t'))
        .take(16_000)
        .collect::<String>()
        .trim_end()
        .to_string()
}

pub(crate) fn type_into(target: &InputTarget, text: &str) -> Result<(), String> {
    let text = clean_text(text);
    if text.is_empty() {
        return Err("empty instruction".into());
    }
    match target {
        InputTarget::TmuxPane(pane) => {
            let buf = format!("nerve-{}", super::protocol::new_id());
            let mut child = Command::new("tmux")
                .args(["load-buffer", "-b", &buf, "-"])
                .stdin(Stdio::piped())
                .stdout(Stdio::null())
                .stderr(Stdio::null())
                .spawn()
                .map_err(|e| format!("tmux: {e}"))?;
            if let Some(mut stdin) = child.stdin.take() {
                use std::io::Write;
                stdin.write_all(text.as_bytes()).map_err(|e| e.to_string())?;
            }
            if !child.wait().is_ok_and(|s| s.success()) {
                return Err("tmux load-buffer failed".into());
            }
            let run = |args: &[&str]| {
                Command::new("tmux")
                    .args(args)
                    .stdin(Stdio::null())
                    .stdout(Stdio::null())
                    .stderr(Stdio::null())
                    .status()
                    .is_ok_and(|s| s.success())
            };
            if !run(&["paste-buffer", "-p", "-d", "-b", &buf, "-t", pane]) {
                return Err(format!("tmux paste into {pane} failed"));
            }
            // Let the TUI finish ingesting the paste before submitting.
            std::thread::sleep(std::time::Duration::from_millis(300));
            if !run(&["send-keys", "-t", pane, "Enter"]) {
                return Err("tmux send Enter failed".into());
            }
            Ok(())
        }
        #[cfg(target_os = "macos")]
        InputTarget::Ghostty(id) => crate::platform::ghostty::input_text(id, &text).map_err(|e| e.to_string()),
    }
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn pane_matches_tty_with_or_without_dev_prefix() {
        let panes = vec![("%1".to_string(), "/dev/pts/3".to_string()), ("%2".to_string(), "/dev/ttys004".to_string())];
        assert_eq!(pane_for_tty(&panes, "pts/3"), Some("%1".into()));
        assert_eq!(pane_for_tty(&panes, "/dev/ttys004"), Some("%2".into()));
        assert_eq!(pane_for_tty(&panes, "ttys009"), None);
    }

    #[test]
    fn remote_text_cannot_carry_control_keys() {
        assert_eq!(clean_text("fix it\x1b[A\x03\nnow\t!\r"), "fix it[A\nnow\t!");
    }
}
</script>
<script type="text/plain" class="doc" id="d42" data-group="nerve sync source" data-title="sync/jobs.rs" data-path="src/sync/jobs.rs">//! Distributed jobs: a prompt that runs headless (`claude -p`) on the
//! device that has what it needs, then a verify command decides success.
//! The worker streams progress from `--output-format stream-json` (event
//! shapes recorded in research/sync/experiments E8) into `JobStatus`.

use std::io::{BufRead, BufReader};
use std::path::{Path, PathBuf};
use std::process::{Command, Stdio};
use std::sync::mpsc::Sender;

use serde_json::Value;

use super::protocol::{now_secs, JobSpec, JobStatus};

const TAIL: usize = 6;

/// Fold one stream-json line into the status. Returns true when the
/// status visibly changed (worth republishing).
pub(crate) fn apply_stream_line(st: &mut JobStatus, line: &str) -> bool {
    let Ok(v) = serde_json::from_str::<Value>(line) else {
        return false;
    };
    let push = |st: &mut JobStatus, s: String| {
        st.tail.push(s.chars().take(160).collect());
        if st.tail.len() > TAIL {
            st.tail.remove(0);
        }
    };
    match v.get("type").and_then(Value::as_str) {
        Some("system") if v.get("subtype").and_then(Value::as_str) == Some("init") => {
            st.session_id = v.get("session_id").and_then(Value::as_str).map(String::from);
            true
        }
        Some("assistant") => {
            let mut changed = false;
            for b in v.pointer("/message/content").and_then(Value::as_array).into_iter().flatten() {
                match b.get("type").and_then(Value::as_str) {
                    Some("tool_use") => {
                        let name = b.get("name").and_then(Value::as_str).unwrap_or("?");
                        let input = b.get("input").cloned().unwrap_or(Value::Null);
                        let arg = ["command", "file_path", "pattern", "description"]
                            .iter()
                            .find_map(|k| input.get(*k).and_then(Value::as_str))
                            .unwrap_or("");
                        push(st, format!("▸ {name} {arg}"));
                        changed = true;
                    }
                    Some("text") => {
                        if let Some(t) = b.get("text").and_then(Value::as_str) {
                            if let Some(first) = t.lines().find(|l| !l.trim().is_empty()) {
                                push(st, first.to_string());
                                changed = true;
                            }
                        }
                    }
                    _ => {}
                }
            }
            changed
        }
        Some("result") => {
            st.turns = v.get("num_turns").and_then(Value::as_u64).unwrap_or(0) as u32;
            st.cost_usd = v.get("total_cost_usd").and_then(Value::as_f64).unwrap_or(0.0);
            st.result = v.get("result").and_then(Value::as_str).map(|s| s.chars().take(2000).collect());
            if v.get("is_error").and_then(Value::as_bool).unwrap_or(false) {
                st.phase = "failed".into();
            }
            true
        }
        _ => false,
    }
}

fn job_dir(spec: &JobSpec, root: &Path) -> PathBuf {
    match &spec.cwd {
        Some(c) => PathBuf::from(c),
        None => root.join(format!("job-{}", &spec.id)),
    }
}

/// Run a job to completion on this thread, sending every status change.
pub(crate) fn run(spec: JobSpec, device: &str, work_root: &Path, claude_root: Option<&Path>, tx: &Sender<JobStatus>) {
    let mut st = JobStatus {
        id: spec.id.clone(),
        title: spec.title.clone(),
        device: device.to_string(),
        phase: "running".into(),
        updated_at: now_secs(),
        ..Default::default()
    };
    let send = |st: &mut JobStatus| {
        st.updated_at = now_secs();
        let _ = tx.send(st.clone());
    };
    send(&mut st);
    let dir = job_dir(&spec, work_root);
    if let Err(e) = prepare_dir(&dir, spec.repo.as_deref()) {
        st.phase = "failed".into();
        st.result = Some(e);
        send(&mut st);
        return;
    }
    let claude = match super::bins::find("claude") {
        Ok(c) => c,
        Err(e) => {
            st.phase = "failed".into();
            st.result = Some(e);
            send(&mut st);
            return;
        }
    };
    let mut cmd = Command::new(claude);
    cmd.args(["-p", "--output-format", "stream-json", "--verbose", "--permission-mode"])
        .arg(if spec.permission_mode.is_empty() { "acceptEdits" } else { spec.permission_mode.as_str() })
        // Nobody is at a headless job's keyboard: anything that would
        // still prompt is denied instead of hanging the worker.
        .args(["--permission-prompts", "none"]);
    if let Some(m) = &spec.model {
        cmd.args(["--model", m]);
    }
    if !spec.allowed_tools.is_empty() {
        cmd.arg("--allowedTools").args(&spec.allowed_tools);
    }
    if let Some(root) = claude_root {
        cmd.env("CLAUDE_CONFIG_DIR", root);
    }
    // The prompt goes in on stdin: `--allowedTools` is variadic and would
    // swallow a trailing positional prompt.
    cmd.current_dir(&dir).stdin(Stdio::piped()).stdout(Stdio::piped()).stderr(Stdio::null());
    match cmd.spawn() {
        Ok(mut child) => {
            if let Some(mut stdin) = child.stdin.take() {
                use std::io::Write;
                let _ = stdin.write_all(spec.prompt.as_bytes());
            }
            if let Some(out) = child.stdout.take() {
                for line in BufReader::new(out).lines().map_while(Result::ok) {
                    if apply_stream_line(&mut st, &line) {
                        send(&mut st);
                    }
                }
            }
            let ok = child.wait().is_ok_and(|s| s.success());
            if !ok && st.phase != "failed" {
                st.phase = "failed".into();
            }
        }
        Err(e) => {
            st.phase = "failed".into();
            st.result = Some(format!("could not start claude: {e}"));
        }
    }
    if st.phase != "failed" {
        if let Some(v) = &spec.verify {
            st.phase = "verifying".into();
            send(&mut st);
            let out = Command::new("sh").args(["-c", v]).current_dir(&dir).stdin(Stdio::null()).output();
            let passed = out.as_ref().is_ok_and(|o| o.status.success());
            st.verified = Some(passed);
            if let Ok(o) = out {
                let text = String::from_utf8_lossy(&[o.stdout, o.stderr].concat()).into_owned();
                for l in text.lines().rev().take(3).collect::<Vec<_>>().into_iter().rev() {
                    st.tail.push(format!("verify: {l}"));
                }
                while st.tail.len() > TAIL {
                    st.tail.remove(0);
                }
            }
            st.phase = if passed { "done" } else { "failed" }.into();
        } else {
            st.phase = "done".into();
        }
    }
    send(&mut st);
}

fn prepare_dir(dir: &Path, repo: Option<&str>) -> Result<(), String> {
    if dir.exists() {
        return Ok(());
    }
    match repo {
        Some(url) => {
            let ok = Command::new("git")
                .args(["clone", "-q", url, &dir.to_string_lossy()])
                .stdin(Stdio::null())
                .status()
                .is_ok_and(|s| s.success());
            if ok {
                Ok(())
            } else {
                Err(format!("git clone {url} failed"))
            }
        }
        None => std::fs::create_dir_all(dir).map_err(|e| e.to_string()),
    }
}

#[cfg(test)]
mod tests {
    use super::*;

    // Shapes taken from a real `claude -p --output-format stream-json`
    // run on Linux arm64 (2.1.288).
    #[test]
    fn stream_json_drives_status() {
        let mut st = JobStatus::default();
        assert!(apply_stream_line(&mut st, r#"{"type":"system","subtype":"init","session_id":"abc"}"#));
        assert_eq!(st.session_id.as_deref(), Some("abc"));
        let tool = r#"{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Bash","input":{"command":"python3 test_calc.py"}}]}}"#;
        assert!(apply_stream_line(&mut st, tool));
        assert_eq!(st.tail.last().unwrap(), "▸ Bash python3 test_calc.py");
        assert!(!apply_stream_line(&mut st, r#"{"type":"rate_limit_event"}"#));
        assert!(!apply_stream_line(&mut st, "not json"));
        let res = r#"{"type":"result","subtype":"success","is_error":false,"num_turns":8,"total_cost_usd":0.0048,"result":"Done."}"#;
        assert!(apply_stream_line(&mut st, res));
        assert_eq!((st.turns, st.result.as_deref()), (8, Some("Done.")));
    }

    #[test]
    fn tail_is_bounded() {
        let mut st = JobStatus::default();
        for i in 0..20 {
            apply_stream_line(&mut st, &format!(r#"{{"type":"assistant","message":{{"content":[{{"type":"text","text":"line {i}"}}]}}}}"#));
        }
        assert_eq!(st.tail.len(), TAIL);
        assert_eq!(st.tail.last().unwrap(), "line 19");
    }
}
</script>
<script type="text/plain" class="doc" id="d43" data-group="nerve sync source" data-title="sync/mailbox.rs" data-path="src/sync/mailbox.rs">//! Local rendezvous between Claude's blocking hooks and the sync agent.
//!
//! `nerve sync hook` (run by Claude as a PermissionRequest / PreToolUse
//! hook) writes `req/<id>.json` and polls `resp/<id>.json`. The sync
//! agent publishes pending requests to peers and writes the answer when
//! one arrives. Plain files keep the hook dependency-free and make the
//! state inspectable with `ls`.

use std::path::{Path, PathBuf};
use std::time::{Duration, Instant};

use serde_json::{json, Value};

use super::protocol::{Answer, PendingRequest, Question};

pub(crate) struct Mailbox {
    dir: PathBuf,
}

impl Mailbox {
    pub(crate) fn new(sync_dir: &Path) -> Self {
        Self { dir: sync_dir.join("mailbox") }
    }

    fn req_dir(&self) -> PathBuf {
        self.dir.join("req")
    }

    fn resp_dir(&self) -> PathBuf {
        self.dir.join("resp")
    }

    fn ensure(&self) -> std::io::Result<()> {
        std::fs::create_dir_all(self.req_dir())?;
        std::fs::create_dir_all(self.resp_dir())
    }

    /// Atomic write: readers never see half a file.
    fn put(dir: &Path, id: &str, body: &str) -> std::io::Result<()> {
        let tmp = dir.join(format!(".{id}.tmp"));
        std::fs::write(&tmp, body)?;
        std::fs::rename(tmp, dir.join(format!("{id}.json")))
    }

    /// Hook inputs currently waiting, as protocol requests.
    pub(crate) fn pending(&self) -> Vec<PendingRequest> {
        let Ok(rd) = std::fs::read_dir(self.req_dir()) else {
            return Vec::new();
        };
        let mut out: Vec<PendingRequest> = rd
            .flatten()
            .filter(|e| e.path().extension().is_some_and(|x| x == "json"))
            .filter_map(|e| {
                let id = e.path().file_stem()?.to_str()?.to_string();
                let input: Value = serde_json::from_str(&std::fs::read_to_string(e.path()).ok()?).ok()?;
                Some(to_request(&id, &input, file_age_secs(&e.path())))
            })
            .collect();
        out.sort_by_key(|r| r.created_at);
        out
    }

    /// Deliver a remote answer. Returns false when the request is gone
    /// (answered locally, timed out) — the sender should hear that.
    pub(crate) fn answer(&self, id: &str, answer: &Answer) -> std::io::Result<bool> {
        if !valid_id(id) {
            return Ok(false);
        }
        let req = self.req_dir().join(format!("{id}.json"));
        let Ok(raw) = std::fs::read_to_string(&req) else {
            return Ok(false);
        };
        let input: Value = serde_json::from_str(&raw).unwrap_or(Value::Null);
        let out = hook_output(&input, answer);
        Self::put(&self.resp_dir(), id, &out.to_string())?;
        Ok(true)
    }

    /// The hook side: park `input`, wait for an answer. `None` = no
    /// answer (timeout, or resolved at the keyboard): print nothing and
    /// Claude falls back to its normal local prompt.
    pub(crate) fn wait(&self, input: &Value, timeout: Duration, answered_locally: impl Fn() -> bool) -> Option<String> {
        self.ensure().ok()?;
        let id = super::protocol::new_id();
        Self::put(&self.req_dir(), &id, &input.to_string()).ok()?;
        let resp = self.resp_dir().join(format!("{id}.json"));
        let deadline = Instant::now() + timeout;
        let mut result = None;
        while Instant::now() < deadline {
            if let Ok(s) = std::fs::read_to_string(&resp) {
                result = Some(s);
                break;
            }
            if answered_locally() {
                break;
            }
            std::thread::sleep(Duration::from_millis(250));
        }
        let _ = std::fs::remove_file(self.req_dir().join(format!("{id}.json")));
        let _ = std::fs::remove_file(resp);
        result
    }
}

fn valid_id(id: &str) -> bool {
    !id.is_empty() && id.len() <= 32 && id.bytes().all(|b| b.is_ascii_hexdigit())
}

fn file_age_secs(p: &Path) -> u64 {
    let now = super::protocol::now_secs();
    std::fs::metadata(p)
        .and_then(|m| m.modified())
        .ok()
        .and_then(|t| t.duration_since(std::time::UNIX_EPOCH).ok())
        .map(|d| d.as_secs())
        .unwrap_or(now)
}

/// One-line description of what the tool wants to do.
fn summarise(tool: &str, input: &Value) -> String {
    let s = |k: &str| input.get(k).and_then(Value::as_str).unwrap_or("");
    let text = match tool {
        "Bash" => s("command").to_string(),
        "Write" | "Edit" | "MultiEdit" | "Read" | "NotebookEdit" => s("file_path").to_string(),
        "WebFetch" => s("url").to_string(),
        _ => input.to_string(),
    };
    text.chars().take(400).collect()
}

pub(crate) fn to_request(id: &str, input: &Value, created_at: u64) -> PendingRequest {
    let tool = input.get("tool_name").and_then(Value::as_str).unwrap_or("?").to_string();
    let tool_input = input.get("tool_input").cloned().unwrap_or(Value::Null);
    let questions: Vec<Question> = tool_input
        .get("questions")
        .and_then(Value::as_array)
        .map(|qs| {
            qs.iter()
                .map(|q| Question {
                    question: q.get("question").and_then(Value::as_str).unwrap_or("").into(),
                    header: q.get("header").and_then(Value::as_str).unwrap_or("").into(),
                    options: q
                        .get("options")
                        .and_then(Value::as_array)
                        .map(|o| o.iter().filter_map(|x| x.get("label")?.as_str().map(String::from)).collect())
                        .unwrap_or_default(),
                    multi: q.get("multiSelect").and_then(Value::as_bool).unwrap_or(false),
                })
                .collect()
        })
        .unwrap_or_default();
    let is_question = tool == "AskUserQuestion";
    PendingRequest {
        id: id.to_string(),
        session: input.get("session_id").and_then(Value::as_str).unwrap_or("").into(),
        kind: if is_question { "question" } else { "permission" }.into(),
        summary: if is_question {
            questions.iter().map(|q| q.question.as_str()).collect::<Vec<_>>().join(" / ")
        } else {
            summarise(&tool, &tool_input)
        },
        tool,
        questions,
        created_at,
    }
}

/// The JSON a hook prints to apply `answer` (shapes verified on Claude
/// Code 2.1.288, see research/sync/experiments/RESULTS.md E6).
pub(crate) fn hook_output(input: &Value, answer: &Answer) -> Value {
    let event = input.get("hook_event_name").and_then(Value::as_str).unwrap_or("");
    let tool_input = input.get("tool_input").cloned().unwrap_or(Value::Null);
    match (event, answer) {
        ("PreToolUse", Answer::Choose { labels }) => {
            let questions = tool_input.get("questions").cloned().unwrap_or(json!([]));
            let mut answers = serde_json::Map::new();
            for (q, label) in questions.as_array().into_iter().flatten().zip(labels) {
                if let Some(text) = q.get("question").and_then(Value::as_str) {
                    answers.insert(text.to_string(), json!(label));
                }
            }
            json!({"hookSpecificOutput": {
                "hookEventName": "PreToolUse",
                "permissionDecision": "allow",
                "updatedInput": {"questions": questions, "answers": answers}
            }})
        }
        ("PreToolUse", Answer::Deny { reason }) => json!({"hookSpecificOutput": {
            "hookEventName": "PreToolUse",
            "permissionDecision": "deny",
            "permissionDecisionReason": reason
        }}),
        ("PreToolUse", _) => json!({"hookSpecificOutput": {
            "hookEventName": "PreToolUse", "permissionDecision": "allow"
        }}),
        (_, Answer::Deny { reason }) => json!({"hookSpecificOutput": {
            "hookEventName": "PermissionRequest",
            "decision": {"behavior": "deny", "message": reason}
        }}),
        _ => json!({"hookSpecificOutput": {
            "hookEventName": "PermissionRequest",
            "decision": {"behavior": "allow"}
        }}),
    }
}

/// True once the transcript shows a result for the tool call this hook
/// is about — i.e. someone answered at the keyboard. The hook input has
/// no tool_use_id, so match the newest `tool_use` with the same name and
/// input, then look for its `tool_result`.
pub(crate) fn resolved_in_transcript(transcript: &Path, tool: &str, tool_input: &Value) -> bool {
    let Some(tail) = read_tail(transcript, 256 * 1024) else {
        return false;
    };
    let mut want: Option<String> = None;
    for line in tail.lines() {
        let Ok(v) = serde_json::from_str::<Value>(line) else {
            continue;
        };
        let Some(content) = v.pointer("/message/content").and_then(Value::as_array) else {
            continue;
        };
        for block in content {
            match block.get("type").and_then(Value::as_str) {
                Some("tool_use")
                    if block.get("name").and_then(Value::as_str) == Some(tool)
                        && block.get("input") == Some(tool_input) =>
                {
                    want = block.get("id").and_then(Value::as_str).map(String::from);
                }
                Some("tool_result")
                    if want.is_some() && block.get("tool_use_id").and_then(Value::as_str) == want.as_deref() =>
                {
                    return true;
                }
                _ => {}
            }
        }
    }
    false
}

fn read_tail(path: &Path, max: u64) -> Option<String> {
    use std::io::{Read, Seek, SeekFrom};
    let mut f = std::fs::File::open(path).ok()?;
    let len = f.metadata().ok()?.len();
    f.seek(SeekFrom::Start(len.saturating_sub(max))).ok()?;
    let mut buf = Vec::new();
    f.read_to_end(&mut buf).ok()?;
    let s = String::from_utf8_lossy(&buf).into_owned();
    // Drop the partial first line when we started mid-file.
    Some(if len > max { s.split_once('\n').map(|x| x.1.to_string()).unwrap_or_default() } else { s })
}

#[cfg(test)]
mod tests {
    use super::*;

    fn ask_input() -> Value {
        json!({"hook_event_name": "PreToolUse", "tool_name": "AskUserQuestion", "session_id": "s1",
               "tool_input": {"questions": [{"question": "Which language?", "header": "Lang",
                 "options": [{"label": "Python"}, {"label": "Bash"}], "multiSelect": false}]}})
    }

    #[test]
    fn question_answer_echoes_questions_and_maps_labels() {
        let out = hook_output(&ask_input(), &Answer::Choose { labels: vec!["Bash".into()] });
        let h = &out["hookSpecificOutput"];
        assert_eq!(h["permissionDecision"], "allow");
        assert_eq!(h["updatedInput"]["answers"]["Which language?"], "Bash");
        assert_eq!(h["updatedInput"]["questions"][0]["header"], "Lang");
    }

    #[test]
    fn permission_allow_and_deny_shapes() {
        let input = json!({"hook_event_name": "PermissionRequest", "tool_name": "Write", "tool_input": {"file_path": "/x"}});
        assert_eq!(hook_output(&input, &Answer::Allow)["hookSpecificOutput"]["decision"]["behavior"], "allow");
        let d = hook_output(&input, &Answer::Deny { reason: "no".into() });
        assert_eq!(d["hookSpecificOutput"]["decision"]["behavior"], "deny");
        assert_eq!(d["hookSpecificOutput"]["decision"]["message"], "no");
    }

    #[test]
    fn requests_summarise_tools_and_questions() {
        let r = to_request("ab", &ask_input(), 5);
        assert_eq!(r.kind, "question");
        assert_eq!(r.questions[0].options, vec!["Python", "Bash"]);
        let b = to_request("cd", &json!({"tool_name": "Bash", "tool_input": {"command": "rm -rf build"}}), 5);
        assert_eq!((b.kind.as_str(), b.summary.as_str()), ("permission", "rm -rf build"));
    }

    #[test]
    fn wait_returns_remote_answer_and_cleans_up() {
        let dir = tempfile::tempdir().unwrap();
        let mb = std::sync::Arc::new(Mailbox::new(dir.path()));
        let mb2 = mb.clone();
        let answerer = std::thread::spawn(move || {
            for _ in 0..100 {
                if let Some(r) = mb2.pending().first() {
                    assert!(mb2.answer(&r.id, &Answer::Allow).unwrap());
                    return;
                }
                std::thread::sleep(Duration::from_millis(20));
            }
            panic!("request never appeared");
        });
        let input = json!({"hook_event_name": "PermissionRequest", "tool_name": "Write", "tool_input": {}});
        let out = mb.wait(&input, Duration::from_secs(5), || false).unwrap();
        answerer.join().unwrap();
        assert!(out.contains("\"allow\""));
        assert!(mb.pending().is_empty(), "request withdrawn after answer");
    }

    #[test]
    fn wait_gives_up_when_answered_locally() {
        let dir = tempfile::tempdir().unwrap();
        let mb = Mailbox::new(dir.path());
        let out = mb.wait(&json!({}), Duration::from_secs(5), || true);
        assert!(out.is_none());
        assert!(mb.pending().is_empty());
        assert!(!mb.answer("ffff", &Answer::Allow).unwrap(), "late answer reports gone");
        assert!(!mb.answer("../x", &Answer::Allow).unwrap(), "ids are validated");
    }

    #[test]
    fn transcript_resolution_matches_tool_use_by_input() {
        let dir = tempfile::tempdir().unwrap();
        let t = dir.path().join("t.jsonl");
        let input = json!({"file_path": "/a", "content": "x"});
        let lines = [
            json!({"message": {"content": [{"type": "tool_use", "id": "tu1", "name": "Write", "input": input}]}}),
        ];
        let body: String = lines.iter().map(|l| format!("{l}\n")).collect();
        std::fs::write(&t, &body).unwrap();
        assert!(!resolved_in_transcript(&t, "Write", &input));
        let result = json!({"message": {"content": [{"type": "tool_result", "tool_use_id": "tu1"}]}});
        std::fs::write(&t, format!("{body}{result}\n")).unwrap();
        assert!(resolved_in_transcript(&t, "Write", &input));
        assert!(!resolved_in_transcript(&t, "Write", &json!({"file_path": "/b"})));
    }
}

<script type="text/plain" class="doc" id="d44" data-group="nerve sync source" data-title="sync/mod.rs" data-path="src/sync/mod.rs">//! Cross-device sync (`--features sync`). See docs/SYNC.md for the
//! design and research/sync/ for the experiments behind it.
//!
//! - `protocol`: wire format (pure)
//! - `fleet`: device identity, peers, capabilities
//! - `transport`: Nostr + NIP-44
//! - `agent`: the per-device worker thread
//! - `mailbox`: Claude hook ⇄ agent rendezvous for remote answers
//! - `inject`: typing into a session's tmux pane / Ghostty tab
//! - `handoff`: pack/unpack/resume a session on another device
//! - `jobs`: headless capability-routed jobs
//! - `runs`: allowlisted plain-command runs
//! - `places`: files and git refs into named places
//! - `bulk`: big files over rsync, coordinated over the relay
//! - `bins`: executable lookup that survives a service's bare PATH
//! - `cli`: `nerve sync ...`

pub(crate) mod agent;
pub(crate) mod bins;
pub(crate) mod bulk;
pub(crate) mod chunks;
pub(crate) mod cli;
pub(crate) mod fleet;
pub(crate) mod handoff;

/// Start the embedded agent for the TUI when this device is set up.
/// If `nerve sync agent` already runs for this config, the TUI gets a
/// viewer (reads state, sends requests) and leaves the work to it.
pub(crate) fn start_for_tui(paths: &crate::paths::Paths) -> Option<agent::AgentHandle> {
    let dir = fleet::sync_dir(paths);
    let fleet = fleet::Fleet::load(&dir)?;
    let long_lived = !agent::agent_alive(&dir);
    agent::spawn(agent::Ctx { sync_dir: dir, fleet, statusline_dir: Some(paths.statusline_dir()), long_lived }).ok()
}

<script type="text/plain" class="doc" id="d45" data-group="nerve sync source" data-title="sync/modhub.rs" data-path="src/sync/modhub.rs">//! The bridge between the sync agent and Claude sessions running the
//! nerve mod (`mod/nerve`, Claude Code ≥ 2.1.287).
//!
//! A mod runs inside the Claude process, so it can do what the tmux /
//! hook path can only approximate:
//! - submit a prompt with `$.prompt.submit` (queued while a turn runs;
//!   works for `claude --bg` sessions, which have no terminal);
//! - answer a permission prompt from `classic.PermissionRequest` and
//!   learn at once when the user answered locally (`next.signal`);
//! - answer `AskUserQuestion` while its dialog stays on screen, so
//!   questions no longer need away mode;
//! - report each turn's start, end and token usage as it happens.
//!
//! Each mod instance talks HTTP/1.1 over a Unix socket owned by this
//! device's agent (mode 0600 in a 0700 directory: only this user).
//! Endpoints, all JSON:
//!
//! | call | body / query | answer |
//! |---|---|---|
//! | `POST /v1/hello` | `{sid, cwd, surface, version}` | `{ok}` |
//! | `GET /v1/poll?sid=` | long-poll, up to 8 s | `{cmds: [...], status}` |
//! | `POST /v1/event` | `{sid, kind, ...}` turn.start / turn.complete | `{ok}` |
//! | `POST /v1/request` | `{sid, id, kind, tool, input}` | `{ok}` |
//! | `GET /v1/wait?sid=&id=` | long-poll, up to 2 s | `{answer}`, `{pending}` or `{gone}` |
//! | `POST /v1/resolved` | `{sid, id}` answered locally / timed out | `{ok}` |
//! | `POST /v1/ack` | `{sid, cmd, ok, msg}` a command's outcome | `{ok}` |
//!
//! Commands a poll returns: `{t:"prompt", id, text}`.
//!
//! A hook waiting for a remote answer must wait inside a `$` call: a
//! mod hook gets 10 s of its *own* time, `$.clock.sleep` counts against
//! it and an in-flight `$.http.fetch` doesn't (E21). Hence `/v1/wait`
//! rather than a sleep loop. A hook Claude abandons (the user answered
//! at the keyboard) can't make further `$` calls, so it can't say so:
//! a request whose hook stops calling `/v1/wait` for `WAIT_GONE` is
//! taken as resolved locally and withdrawn.

use std::collections::{HashMap, VecDeque};
use std::path::{Path, PathBuf};
use std::sync::{Arc, Mutex};
use std::time::{Duration, Instant};

use serde_json::{json, Value};
use tokio::io::{AsyncReadExt, AsyncWriteExt};
use tokio::net::{UnixListener, UnixStream};
use tokio::sync::Notify;

use super::protocol::{self, Answer, PendingRequest, Question, TurnInfo};

/// A mod that hasn't polled for this long is treated as gone (session
/// closed, or Claude restarted without the mod).
const STALE: Duration = Duration::from_secs(20);
const POLL_WAIT: Duration = Duration::from_secs(8);
const ANSWER_WAIT: Duration = Duration::from_secs(2);
const WAIT_GONE: Duration = Duration::from_secs(6);
const MAX_BODY: usize = 1024 * 1024;

#[derive(Debug, Default)]
struct ModSession {
    cwd: String,
    surface: String,
    version: String,
    last_seen: Option<Instant>,
    queue: VecDeque<Value>,
    running: bool,
    turn_started: Option<Instant>,
    /// The status line this session's mod last received.
    status_sent: String,
    last_turn: Option<TurnInfo>,
}

#[derive(Debug, Clone)]
struct ModRequest {
    req: PendingRequest,
    /// Set by a remote answer; the hook collects it with `/v1/wait`.
    answer: Option<Answer>,
    /// The hook's last `/v1/wait`: proof it is still waiting.
    last_wait: Instant,
}

/// Things that happened on the socket, for the agent to act on.
#[derive(Debug, Clone, PartialEq)]
pub(crate) enum HubEvent {
    /// A prompt or answer the agent queued was carried out (or failed).
    Ack { cmd: String, ok: bool, msg: String },
    /// Progress worth republishing for: a turn started or ended, a
    /// request appeared or went away.
    Changed,
}

#[derive(Default)]
struct Inner {
    sessions: HashMap<String, ModSession>,
    requests: HashMap<String, ModRequest>,
    events: Vec<HubEvent>,
    status: String,
}

#[derive(Default)]
pub(crate) struct ModHub {
    inner: Mutex<Inner>,
    wake: Notify,
}

impl ModHub {
    fn lock(&self) -> std::sync::MutexGuard<'_, Inner> {
        self.inner.lock().unwrap_or_else(|e| e.into_inner())
    }

    fn find_sid(inner: &Inner, session: &str) -> Option<String> {
        if session.is_empty() {
            return None;
        }
        inner
            .sessions
            .iter()
            .filter(|(_, s)| s.last_seen.is_some_and(|t| t.elapsed() < STALE))
            .find(|(sid, _)| sid.as_str() == session || sid.starts_with(session))
            .map(|(sid, _)| sid.clone())
    }

    /// Is a live mod attached to this session?
    pub(crate) fn connected(&self, session: &str) -> bool {
        Self::find_sid(&self.lock(), session).is_some()
    }

    /// Queue a prompt; `cmd` comes back in a `HubEvent::Ack`.
    pub(crate) fn submit(&self, session: &str, cmd: &str, text: &str) -> bool {
        let mut g = self.lock();
        let Some(sid) = Self::find_sid(&g, session) else { return false };
        let text = super::inject::clean_text(text);
        if let Some(s) = g.sessions.get_mut(&sid) {
            s.queue.push_back(json!({"t": "prompt", "id": cmd, "text": text}));
        }
        drop(g);
        self.wake.notify_waiters();
        true
    }

    pub(crate) fn has_request(&self, id: &str) -> bool {
        self.lock().requests.contains_key(id)
    }

    /// Deliver a remote answer; false when the request is gone or was
    /// already answered.
    pub(crate) fn answer(&self, id: &str, answer: &Answer) -> bool {
        let mut g = self.lock();
        let Some(r) = g.requests.get_mut(id).filter(|r| r.answer.is_none()) else { return false };
        r.answer = Some(answer.clone());
        g.events.push(HubEvent::Changed);
        drop(g);
        self.wake.notify_waiters();
        true
    }

    pub(crate) fn pending(&self) -> Vec<PendingRequest> {
        let mut v: Vec<PendingRequest> =
            self.lock().requests.values().filter(|r| r.answer.is_none()).map(|r| r.req.clone()).collect();
        v.sort_by_key(|r| r.created_at);
        v
    }

    /// Live mod sessions: id → (running a turn now, last finished turn).
    pub(crate) fn sessions(&self) -> HashMap<String, (bool, Option<TurnInfo>)> {
        self.lock()
            .sessions
            .iter()
            .filter(|(_, s)| s.last_seen.is_some_and(|t| t.elapsed() < STALE))
            .map(|(id, s)| (id.clone(), (s.running, s.last_turn.clone())))
            .collect()
    }

    /// Events since the last call. Also withdraws requests whose hook
    /// stopped waiting (answered at the keyboard, or the session ended).
    pub(crate) fn drain_events(&self) -> Vec<HubEvent> {
        let mut g = self.lock();
        let before = g.requests.len();
        g.requests.retain(|_, r| r.last_wait.elapsed() < WAIT_GONE);
        if g.requests.len() != before {
            g.events.push(HubEvent::Changed);
        }
        std::mem::take(&mut g.events)
    }

    /// One line the mod shows under Claude's prompt (`$.ui.status`).
    pub(crate) fn set_status(&self, s: String) {
        let changed = {
            let mut g = self.lock();
            let changed = g.status != s;
            g.status = s;
            changed
        };
        if changed {
            self.wake.notify_waiters();
        }
    }

    /// Handle one request. Pure apart from the shared state, so the
    /// protocol is unit-testable without a socket.
    async fn route(&self, method: &str, path: &str, body: &Value) -> Value {
        let (route, query) = path.split_once('?').unwrap_or((path, ""));
        let sid = body
            .get("sid")
            .and_then(Value::as_str)
            .map(String::from)
            .or_else(|| query.split('&').find_map(|kv| kv.strip_prefix("sid=").map(String::from)))
            .filter(|s| valid_sid(s));
        let Some(sid) = sid else {
            return json!({"ok": false, "error": "missing or bad sid"});
        };
        match (method, route) {
            ("POST", "/v1/hello") => {
                let mut g = self.lock();
                let s = g.sessions.entry(sid).or_default();
                s.cwd = str_field(body, "cwd", 4096);
                s.surface = str_field(body, "surface", 32);
                s.version = str_field(body, "version", 32);
                s.last_seen = Some(Instant::now());
                g.events.push(HubEvent::Changed);
                json!({"ok": true})
            }
            ("GET", "/v1/poll") => {
                let deadline = Instant::now() + POLL_WAIT;
                loop {
                    let wake = self.wake.notified();
                    {
                        let mut g = self.lock();
                        let status = g.status.clone();
                        let s = g.sessions.entry(sid.clone()).or_default();
                        s.last_seen = Some(Instant::now());
                        // Answer at once for a command or a changed status
                        // line, else at the deadline.
                        if !s.queue.is_empty() || s.status_sent != status || Instant::now() >= deadline {
                            let cmds: Vec<Value> = s.queue.drain(..).collect();
                            s.status_sent = status.clone();
                            return json!({"cmds": cmds, "status": status});
                        }
                    }
                    let _ = tokio::time::timeout(deadline.saturating_duration_since(Instant::now()), wake).await;
                }
            }
            ("POST", "/v1/event") => {
                let mut g = self.lock();
                let s = g.sessions.entry(sid).or_default();
                s.last_seen = Some(Instant::now());
                match body.get("kind").and_then(Value::as_str) {
                    Some("turn.start") => {
                        s.running = true;
                        s.turn_started = Some(Instant::now());
                    }
                    Some("turn.complete") => {
                        s.running = false;
                        let u = body.get("usage").cloned().unwrap_or(Value::Null);
                        let n = |k: &str| u.get(k).and_then(Value::as_u64).unwrap_or(0);
                        s.last_turn = Some(TurnInfo {
                            ended_at: protocol::now_secs(),
                            ms: body.get("ms").and_then(Value::as_u64).unwrap_or(0),
                            reason: str_field(body, "reason", 32),
                            model: u.get("model").and_then(Value::as_str).unwrap_or("").chars().take(64).collect(),
                            input_tokens: n("input_tokens") + n("cache_read_input_tokens") + n("cache_creation_input_tokens"),
                            output_tokens: n("output_tokens"),
                        });
                    }
                    _ => {}
                }
                g.events.push(HubEvent::Changed);
                json!({"ok": true})
            }
            ("POST", "/v1/request") => {
                let id = str_field(body, "id", 32);
                if id.is_empty() || !id.bytes().all(|b| b.is_ascii_hexdigit()) {
                    return json!({"ok": false, "error": "bad id"});
                }
                let req = to_request(&id, &sid, body);
                let mut g = self.lock();
                g.requests.insert(id, ModRequest { req, answer: None, last_wait: Instant::now() });
                g.events.push(HubEvent::Changed);
                json!({"ok": true})
            }
            ("GET", "/v1/wait") => {
                let id: String = query.split('&').find_map(|kv| kv.strip_prefix("id=")).unwrap_or("").chars().take(32).collect();
                let deadline = Instant::now() + ANSWER_WAIT;
                loop {
                    let wake = self.wake.notified();
                    {
                        let mut g = self.lock();
                        if let Some(s) = g.sessions.get_mut(&sid) {
                            s.last_seen = Some(Instant::now());
                        }
                        if let Some(r) = g.requests.get_mut(&id) {
                            r.last_wait = Instant::now();
                        }
                        match g.requests.get(&id) {
                            None => return json!({"gone": true}),
                            Some(r) if r.answer.is_some() => {
                                let a = g.requests.remove(&id).and_then(|r| r.answer);
                                return json!({"answer": a});
                            }
                            Some(_) if Instant::now() >= deadline => return json!({"pending": true}),
                            Some(_) => {}
                        }
                    }
                    let _ = tokio::time::timeout(deadline.saturating_duration_since(Instant::now()), wake).await;
                }
            }
            ("POST", "/v1/resolved") => {
                let id = str_field(body, "id", 32);
                let mut g = self.lock();
                if g.requests.remove(&id).is_some() {
                    g.events.push(HubEvent::Changed);
                }
                json!({"ok": true})
            }
            ("POST", "/v1/ack") => {
                let mut g = self.lock();
                g.events.push(HubEvent::Ack {
                    cmd: str_field(body, "cmd", 64),
                    ok: body.get("ok").and_then(Value::as_bool).unwrap_or(false),
                    msg: str_field(body, "msg", 400),
                });
                json!({"ok": true})
            }
            _ => json!({"ok": false, "error": "unknown route"}),
        }
    }
}

fn valid_sid(s: &str) -> bool {
    !s.is_empty() && s.len() <= 64 && s.bytes().all(|b| b.is_ascii_alphanumeric() || b == b'-')
}

fn str_field(v: &Value, k: &str, max: usize) -> String {
    v.get(k).and_then(Value::as_str).unwrap_or("").chars().take(max).collect()
}

/// The mod sends Claude's own tool input; summarise it the way the hook
/// path does so both look the same on other devices.
fn to_request(id: &str, sid: &str, body: &Value) -> PendingRequest {
    let tool = str_field(body, "tool", 128);
    let input = body.get("input").cloned().unwrap_or(Value::Null);
    let hook_like = json!({"tool_name": tool, "tool_input": input, "session_id": sid});
    let mut r = super::mailbox::to_request(id, &hook_like, protocol::now_secs());
    r.questions.iter_mut().for_each(|q: &mut Question| q.options.truncate(9));
    r
}

/// Where this device's agent listens. Inside the sync dir when the path
/// fits a sockaddr (104 bytes on macOS), else a per-user name in /tmp.
pub(crate) fn socket_path(sync_dir: &Path) -> PathBuf {
    let p = sync_dir.join("agent.sock");
    if p.as_os_str().len() < 100 {
        return p;
    }
    let tag = super::chunks::id_of(sync_dir.as_os_str().as_encoded_bytes());
    PathBuf::from(format!("/tmp/nerve-{}-{}.sock", nix::unistd::getuid(), &tag[..12]))
}

/// Serve until the runtime stops. A stale socket file is replaced.
pub(crate) async fn serve(path: PathBuf, hub: Arc<ModHub>) -> std::io::Result<()> {
    let _ = std::fs::remove_file(&path);
    let listener = UnixListener::bind(&path)?;
    {
        use std::os::unix::fs::PermissionsExt;
        std::fs::set_permissions(&path, std::fs::Permissions::from_mode(0o600))?;
    }
    loop {
        let (stream, _) = listener.accept().await?;
        let hub = hub.clone();
        tokio::spawn(async move {
            let _ = handle(stream, hub).await;
        });
    }
}

async fn handle(mut s: UnixStream, hub: Arc<ModHub>) -> std::io::Result<()> {
    let mut buf = Vec::with_capacity(4096);
    let mut tmp = [0u8; 4096];
    let head_end = loop {
        let n = tokio::time::timeout(Duration::from_secs(10), s.read(&mut tmp)).await.map_err(std::io::Error::other)??;
        if n == 0 {
            return Ok(());
        }
        buf.extend_from_slice(&tmp[..n]);
        if let Some(i) = find(&buf, b"\r\n\r\n") {
            break i;
        }
        if buf.len() > 16 * 1024 {
            return Ok(());
        }
    };
    let head = String::from_utf8_lossy(&buf[..head_end]).into_owned();
    let mut lines = head.split("\r\n");
    let mut first = lines.next().unwrap_or("").split(' ');
    let (method, path) = (first.next().unwrap_or("").to_string(), first.next().unwrap_or("").to_string());
    let len: usize = lines
        .filter_map(|l| l.split_once(':'))
        .find(|(k, _)| k.trim().eq_ignore_ascii_case("content-length"))
        .and_then(|(_, v)| v.trim().parse().ok())
        .unwrap_or(0);
    if len > MAX_BODY {
        return Ok(());
    }
    let mut body = buf[head_end + 4..].to_vec();
    while body.len() < len {
        let n = tokio::time::timeout(Duration::from_secs(10), s.read(&mut tmp)).await.map_err(std::io::Error::other)??;
        if n == 0 {
            break;
        }
        body.extend_from_slice(&tmp[..n]);
    }
    let json_body: Value = serde_json::from_slice(&body).unwrap_or(Value::Null);
    let out = hub.route(&method, &path, &json_body).await.to_string();
    let resp = format!(
        "HTTP/1.1 200 OK\r\ncontent-type: application/json\r\ncontent-length: {}\r\nconnection: close\r\n\r\n{out}",
        out.len()
    );
    s.write_all(resp.as_bytes()).await?;
    s.shutdown().await
}

fn find(hay: &[u8], needle: &[u8]) -> Option<usize> {
    hay.windows(needle.len()).position(|w| w == needle)
}

#[cfg(test)]
mod tests {
    use super::*;

    fn rt() -> tokio::runtime::Runtime {
        tokio::runtime::Builder::new_current_thread().enable_all().build().unwrap()
    }

    const SID: &str = "1ae53e2c-e818-48e5-822b-3f4816e500dd";

    #[test]
    fn prompt_round_trip_through_poll_and_ack() {
        rt().block_on(async {
            let hub = ModHub::default();
            hub.route("POST", "/v1/hello", &json!({"sid": SID, "cwd": "/w", "surface": "terminal"})).await;
            assert!(hub.connected("1ae53e2c"), "prefix of the id is enough");
            assert!(hub.submit("1ae53e2c", "c1", "run the tests\x1b[A"));
            let got = hub.route("GET", &format!("/v1/poll?sid={SID}"), &Value::Null).await;
            assert_eq!(got["cmds"][0]["t"], "prompt");
            assert_eq!(got["cmds"][0]["text"], "run the tests[A", "control keys are stripped");
            hub.route("POST", "/v1/ack", &json!({"sid": SID, "cmd": "c1", "ok": true, "msg": "submitted"})).await;
            assert!(hub.drain_events().contains(&HubEvent::Ack { cmd: "c1".into(), ok: true, msg: "submitted".into() }));
        });
    }

    #[test]
    fn requests_are_listed_answered_once_and_withdrawn() {
        rt().block_on(async {
            let hub = ModHub::default();
            let q = json!({"sid": SID, "id": "ab12", "kind": "question", "tool": "AskUserQuestion",
                "input": {"questions": [{"question": "Pick", "header": "H", "options": [{"label": "Red"}, {"label": "Blue"}]}]}});
            hub.route("POST", "/v1/request", &q).await;
            let p = hub.pending();
            assert_eq!((p[0].kind.as_str(), p[0].questions[0].options.len()), ("question", 2));
            let wait = format!("/v1/wait?sid={SID}&id=ab12");
            assert_eq!(hub.route("GET", &wait, &Value::Null).await["pending"], true, "times out unanswered");
            assert!(hub.answer("ab12", &Answer::Choose { labels: vec!["Blue".into()] }));
            assert!(!hub.answer("ab12", &Answer::Allow), "second answer finds nothing");
            assert!(hub.pending().is_empty(), "answered: no longer listed");
            let got = hub.route("GET", &wait, &Value::Null).await;
            assert_eq!(got["answer"]["labels"][0], "Blue");
            assert_eq!(hub.route("GET", &wait, &Value::Null).await["gone"], true, "collected once");

            hub.route("POST", "/v1/request", &json!({"sid": SID, "id": "cd34", "tool": "Write", "input": {"file_path": "/x"}})).await;
            assert_eq!(hub.pending()[0].summary, "/x");
            hub.route("POST", "/v1/resolved", &json!({"sid": SID, "id": "cd34"})).await;
            assert!(hub.pending().is_empty(), "a local answer withdraws it");
        });
    }

    #[test]
    fn a_request_whose_hook_stops_waiting_is_withdrawn() {
        rt().block_on(async {
            let hub = ModHub::default();
            hub.route("POST", "/v1/request", &json!({"sid": SID, "id": "ef56", "tool": "Bash", "input": {"command": "ls"}})).await;
            hub.lock().requests.get_mut("ef56").unwrap().last_wait = Instant::now() - WAIT_GONE;
            assert!(hub.drain_events().contains(&HubEvent::Changed));
            assert!(hub.pending().is_empty());
        });
    }

    #[test]
    fn a_status_change_ends_the_long_poll_early() {
        rt().block_on(async {
            let hub = Arc::new(ModHub::default());
            let poll = format!("/v1/poll?sid={SID}");
            hub.route("GET", &poll, &Value::Null).await; // first poll hands over the (empty) status
            hub.set_status("⇄ nerve · server 1s · 1 waiting on another device".into());
            let h = hub.clone();
            let t = Instant::now();
            let got = tokio::spawn(async move { h.route("GET", &format!("/v1/poll?sid={SID}"), &Value::Null).await }).await.unwrap();
            assert!(t.elapsed() < Duration::from_secs(1), "returned at once");
            assert!(got["status"].as_str().unwrap().contains("1 waiting"));
            let h = hub.clone();
            let waiter = tokio::spawn(async move { h.route("GET", &format!("/v1/poll?sid={SID}"), &Value::Null).await });
            tokio::time::sleep(Duration::from_millis(100)).await;
            hub.set_status("⇄ nerve · server 2s".into());
            let got = tokio::time::timeout(Duration::from_secs(1), waiter).await.expect("woken by the change").unwrap();
            assert_eq!(got["status"], "⇄ nerve · server 2s");
        });
    }

    #[test]
    fn turn_events_record_usage() {
        rt().block_on(async {
            let hub = ModHub::default();
            hub.route("POST", "/v1/event", &json!({"sid": SID, "kind": "turn.start"})).await;
            assert!(hub.sessions()[SID].0);
            hub.route("POST", "/v1/event", &json!({"sid": SID, "kind": "turn.complete", "ms": 4115, "reason": "answer",
                "usage": {"input_tokens": 2, "output_tokens": 4, "cache_read_input_tokens": 100, "model": "claude-haiku-5-5"}})).await;
            let (running, turn) = hub.sessions()[SID].clone();
            let t = turn.unwrap();
            assert!(!running);
            assert_eq!((t.ms, t.input_tokens, t.output_tokens, t.model.as_str()), (4115, 102, 4, "claude-haiku-5-5"));
        });
    }

    #[test]
    fn bad_input_is_refused() {
        rt().block_on(async {
            let hub = ModHub::default();
            assert_eq!(hub.route("POST", "/v1/hello", &json!({"sid": "../x"})).await["ok"], false);
            assert_eq!(hub.route("POST", "/v1/request", &json!({"sid": SID, "id": "zz/.."})).await["ok"], false);
            assert!(!hub.submit("nobody", "c", "hi"));
        });
    }

    // The real socket, as the mod reaches it.
    #[test]
    fn serves_http_over_a_unix_socket() {
        rt().block_on(async {
            let dir = tempfile::tempdir().unwrap();
            let path = socket_path(dir.path());
            let hub = Arc::new(ModHub::default());
            tokio::spawn(serve(path.clone(), hub.clone()));
            tokio::time::sleep(Duration::from_millis(50)).await;
            let mut s = UnixStream::connect(&path).await.unwrap();
            let body = json!({"sid": SID, "cwd": "/w"}).to_string();
            let req = format!("POST /v1/hello HTTP/1.1\r\nHost: nerve\r\nContent-Length: {}\r\n\r\n{body}", body.len());
            s.write_all(req.as_bytes()).await.unwrap();
            let mut out = String::new();
            s.read_to_string(&mut out).await.unwrap();
            assert!(out.starts_with("HTTP/1.1 200") && out.ends_with("{\"ok\":true}"), "{out}");
            assert!(hub.connected(SID));
            let mode = std::fs::metadata(&path).unwrap().permissions();
            assert_eq!(std::os::unix::fs::PermissionsExt::mode(&mode) & 0o777, 0o600);
        });
    }
}

<script type="text/plain" class="doc" id="d46" data-group="nerve sync source" data-title="sync/pairing.rs" data-path="src/sync/pairing.rs">//! Pairing by invite code, so a new device joins with one command.
//!
//! `nerve setup` on a device that is already set up prints a code:
//! `nerve1` + base64url(JSON {v, n: name, k: pubkey hex, s: secret,
//! r: relays}). `nerve setup <code>` on the new device trusts the
//! inviter's key, adopts its relays, and sends a `PairRequest` carrying
//! the secret. The inviter's agent accepts that one message from an
//! unknown key, checks the secret (single use, valid for an hour) and
//! pairs back. Both ends then trust each other's key, exactly as two
//! manual `nerve sync pair` calls would leave them.
//!
//! The code is a credential for the next hour: anyone holding it can
//! pair a device that may then type into your sessions. It is shown
//! once, on the inviting device's own terminal.

use std::path::{Path, PathBuf};

use serde::{Deserialize, Serialize};

use super::protocol::{base64_decode, base64_encode, new_id, now_secs};

pub(crate) const INVITE_TTL_SECS: u64 = 3600;
const PREFIX: &str = "nerve1";

#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]
pub(crate) struct Invite {
    pub(crate) v: u32,
    /// Inviter's device name.
    pub(crate) n: String,
    /// Inviter's public key, hex.
    pub(crate) k: String,
    /// One-time secret.
    pub(crate) s: String,
    /// Inviter's relays: the joiner uses the same ones.
    pub(crate) r: Vec<String>,
}

impl Invite {
    pub(crate) fn encode(&self) -> String {
        let json = serde_json::to_string(self).expect("invite serialises");
        let b64 = base64_encode(json.as_bytes()).replace('+', "-").replace('/', "_");
        format!("{PREFIX}{}", b64.trim_end_matches('='))
    }

    pub(crate) fn decode(code: &str) -> Result<Self, String> {
        let body = code.trim().strip_prefix(PREFIX).ok_or("not a nerve invite code (it starts with nerve1)")?;
        let mut b64 = body.replace('-', "+").replace('_', "/");
        while b64.len() % 4 != 0 {
            b64.push('=');
        }
        let raw = base64_decode(&b64).map_err(|_| "invite code is damaged (copy it again)")?;
        let inv: Self = serde_json::from_slice(&raw).map_err(|_| "invite code is damaged (copy it again)")?;
        if inv.v != 1 {
            return Err(format!("invite is for a newer nerve (v{}); update this device", inv.v));
        }
        if inv.k.len() != 64 || !inv.k.bytes().all(|b| b.is_ascii_hexdigit()) || !valid_secret(&inv.s) {
            return Err("invite code is damaged (copy it again)".into());
        }
        if inv.r.iter().any(|r| !(r.starts_with("ws://") || r.starts_with("wss://"))) {
            return Err("invite lists a relay that isn't ws:// or wss://".into());
        }
        Ok(inv)
    }
}

fn valid_secret(s: &str) -> bool {
    s.len() == 32 && s.bytes().all(|b| b.is_ascii_hexdigit())
}

fn dir(sync_dir: &Path) -> PathBuf {
    sync_dir.join("invites")
}

/// A fresh single-use invite for this device.
pub(crate) fn create(sync_dir: &Path, name: &str, pubkey_hex: &str, relays: &[String]) -> std::io::Result<Invite> {
    let d = dir(sync_dir);
    std::fs::create_dir_all(&d)?;
    {
        use std::os::unix::fs::PermissionsExt;
        std::fs::set_permissions(&d, std::fs::Permissions::from_mode(0o700))?;
    }
    let secret = format!("{}{}", new_id(), new_id());
    std::fs::write(d.join(&secret), (now_secs() + INVITE_TTL_SECS).to_string())?;
    Ok(Invite { v: 1, n: name.to_string(), k: pubkey_hex.to_string(), s: secret, r: relays.to_vec() })
}

/// Use up an invite. True only once, and only before it expires.
pub(crate) fn consume(sync_dir: &Path, secret: &str) -> bool {
    if !valid_secret(secret) {
        return false;
    }
    let p = dir(sync_dir).join(secret);
    let expires = std::fs::read_to_string(&p).ok().and_then(|s| s.trim().parse::<u64>().ok());
    // Remove first: two racing requests can't both win.
    std::fs::remove_file(&p).is_ok() && expires.is_some_and(|t| now_secs() <= t)
}

/// Any unexpired invite outstanding? The agent only listens to unknown
/// keys while one is. Expired ones are deleted on the way.
pub(crate) fn any_open(sync_dir: &Path) -> bool {
    let Ok(rd) = std::fs::read_dir(dir(sync_dir)) else { return false };
    let now = now_secs();
    let mut open = false;
    for e in rd.flatten() {
        let alive = std::fs::read_to_string(e.path()).ok().and_then(|s| s.trim().parse::<u64>().ok()).is_some_and(|t| now <= t);
        if alive {
            open = true;
        } else {
            let _ = std::fs::remove_file(e.path());
        }
    }
    open
}

/// A name for the joining device that doesn't clash with existing peers.
pub(crate) fn unique_name(wanted: &str, taken: impl Fn(&str) -> bool) -> String {
    let base: String = wanted
        .chars()
        .filter(|c| c.is_ascii_alphanumeric() || matches!(c, '-' | '_'))
        .take(32)
        .collect();
    let base = if base.is_empty() { "device".to_string() } else { base };
    if !taken(&base) {
        return base;
    }
    (2..).map(|i| format!("{base}-{i}")).find(|n| !taken(n)).unwrap_or(base)
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn code_round_trips_and_rejects_damage() {
        let inv = Invite { v: 1, n: "laptop".into(), k: "ab".repeat(32), s: "0f".repeat(16), r: vec!["wss://relay.primal.net".into()] };
        let code = inv.encode();
        assert!(code.starts_with("nerve1") && !code.contains('=') && !code.contains('/'));
        assert_eq!(Invite::decode(&format!("  {code}\n")).unwrap(), inv);
        assert!(Invite::decode("npub1abc").is_err());
        assert!(Invite::decode(&code[..code.len() - 5]).is_err());
        let bad = Invite { r: vec!["http://evil".into()], ..inv };
        assert!(Invite::decode(&bad.encode()).is_err());
    }

    #[test]
    fn invites_are_single_use_and_expire() {
        let d = tempfile::tempdir().unwrap();
        let inv = create(d.path(), "laptop", &"ab".repeat(32), &[]).unwrap();
        assert!(any_open(d.path()));
        assert!(!consume(d.path(), &"0".repeat(32)), "unknown secret");
        assert!(consume(d.path(), &inv.s));
        assert!(!consume(d.path(), &inv.s), "second use");
        assert!(!any_open(d.path()));

        let old = create(d.path(), "laptop", &"ab".repeat(32), &[]).unwrap();
        std::fs::write(d.path().join("invites").join(&old.s), "1").unwrap();
        assert!(!any_open(d.path()), "expired invites don't count and are removed");
        assert!(!consume(d.path(), &old.s));
        assert!(!consume(d.path(), "../fleet.toml"));
    }

    #[test]
    fn joining_names_never_clash() {
        let taken = |n: &str| n == "pixel" || n == "pixel-2";
        assert_eq!(unique_name("pixel", taken), "pixel-3");
        assert_eq!(unique_name("my phone!", |_| false), "myphone");
        assert_eq!(unique_name("", |_| false), "device");
    }
}
