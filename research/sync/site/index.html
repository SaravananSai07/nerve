<script type="text/plain" class="doc" id="d52" data-group="nerve sync source" data-title="sync/transport.rs" data-path="src/sync/transport.rs">//! Nostr transport: per-recipient NIP-44 encryption, state as addressable
//! events, everything else as stored, expiring messages. Knows nothing
//! about sessions; `agent` and `cli` give it envelopes.

use std::collections::{HashMap, HashSet, VecDeque};
use std::time::Duration;

use nostr::nips::nip44;
use nostr_sdk::prelude::*;

use super::protocol::{self, Envelope, KIND_MSG, KIND_STATE};

const RATE_LIMIT_BACKOFF: Duration = Duration::from_millis(1500);
const RATE_LIMIT_PATIENCE: Duration = Duration::from_secs(120);

/// NIP-01 OK prefix `rate-limited:`.
fn is_rate_limited(why: &str) -> bool {
    why.contains("rate-limited")
}

pub(crate) struct Transport {
    pub(crate) client: Client,
    pub(crate) keys: Keys,
    /// Self-hosted (`ws://`) relays take traffic as fast as we send it;
    /// public relays rate-limit and ban bursts (measured: damus banned a
    /// key after ~20 events/s), so chunk trains are paced for them.
    paced: bool,
    /// created_at of the last state event per recipient. Addressable
    /// events tie-break on created_at, so a second publish within the same
    /// second is rejected by the relay; each one has to move forward.
    last_state: std::sync::Mutex<HashMap<PublicKey, u64>>,
}

/// One decrypted inbound envelope plus who really sent it (the event's
/// signing key, not the self-reported `from`).
pub(crate) struct Inbound {
    pub(crate) sender: PublicKey,
    pub(crate) created_at: u64,
    pub(crate) envelope: Envelope,
}

#[derive(Debug, Clone, Default)]
pub(crate) struct RelayHealth {
    pub(crate) url: String,
    pub(crate) connected: bool,
}

impl Transport {
    pub(crate) async fn connect(keys: Keys, relays: &[String]) -> Result<Self, String> {
        if relays.is_empty() {
            return Err("no relays configured (nerve sync init --relay ...)".into());
        }
        let client = Client::builder().build();
        for r in relays {
            client.add_relay(r.as_str()).await.map_err(|e| format!("relay {r}: {e}"))?;
        }
        client.connect().and_wait(Duration::from_secs(8)).await;
        let paced = relays.iter().any(|r| r.starts_with("wss://"));
        Ok(Self { client, keys, paced, last_state: Default::default() })
    }

    pub(crate) async fn health(&self) -> Vec<RelayHealth> {
        let relays = self.client.relays().await;
        let mut out: Vec<RelayHealth> = relays
            .iter()
            .map(|(url, r)| RelayHealth { url: url.to_string(), connected: r.status() == RelayStatus::Connected })
            .collect();
        out.sort_by(|a, b| a.url.cmp(&b.url));
        out
    }

    fn seal(&self, to: &PublicKey, env: &Envelope) -> Result<String, String> {
        nip44::encrypt(self.keys.secret_key(), to, env.encode(), nip44::Version::V2).map_err(|e| e.to_string())
    }

    async fn publish(&self, builder: EventBuilder) -> Result<usize, String> {
        self.publish_to(builder, None).await.map(|(n, _)| n)
    }

    /// How many relays took it, and its id (for a later deletion).
    async fn publish_to(&self, builder: EventBuilder, only: Option<Vec<String>>) -> Result<(usize, EventId), String> {
        let event = builder.finalize(&self.keys).map_err(|e| e.to_string())?;
        // A relay that rate-limits refills its tokens within seconds, so a
        // long chunk train waits it out instead of dropping the transfer.
        let mut waited = Duration::ZERO;
        loop {
            let out = match &only {
                Some(urls) => self.client.send_event(&event).to(urls.iter().map(String::as_str)).await,
                None => self.client.send_event(&event).await,
            }
            .map_err(|e| e.to_string())?;
            if !out.success.is_empty() {
                return Ok((out.success.len(), event.id));
            }
            let why = out.failed.values().next().map(|w| w.to_string()).unwrap_or_default();
            if !is_rate_limited(&why) || waited >= RATE_LIMIT_PATIENCE {
                return Err(format!("no relay accepted the event: {why}"));
            }
            tokio::time::sleep(RATE_LIMIT_BACKOFF).await;
            waited += RATE_LIMIT_BACKOFF;
        }
    }

    /// Replace this device's state as seen by `to`.
    pub(crate) async fn put_state(&self, to: &PublicKey, env: &Envelope) -> Result<usize, String> {
        let at = {
            let mut last = self.last_state.lock().unwrap_or_else(|e| e.into_inner());
            let prev = last.get(to).copied().unwrap_or(0);
            let at = Timestamp::now().as_secs().max(prev + 1);
            last.insert(*to, at);
            at
        };
        let b = EventBuilder::new(Kind::Custom(KIND_STATE), self.seal(to, env)?)
            .custom_created_at(Timestamp::from(at))
            .tag(Tag::identifier(protocol::state_d_tag(&to.to_hex())))
            .tag(Tag::public_key(*to))
            .tag(Tag::expiration(Timestamp::now() + protocol::STATE_TTL_SECS));
        self.publish(b).await
    }

    pub(crate) async fn send(&self, to: &PublicKey, env: &Envelope) -> Result<usize, String> {
        self.send_id(to, env).await.map(|(n, _)| n)
    }

    /// `send`, keeping the event's id for `delete`.
    pub(crate) async fn send_id(&self, to: &PublicKey, env: &Envelope) -> Result<(usize, EventId), String> {
        let b = EventBuilder::new(Kind::Custom(KIND_MSG), self.seal(to, env)?)
            .tag(Tag::public_key(*to))
            .tag(Tag::expiration(Timestamp::now() + protocol::MSG_TTL_SECS));
        let n = self.publish_to(b, None).await?;
        if self.paced {
            tokio::time::sleep(Duration::from_millis(250)).await;
        }
        Ok(n)
    }

    /// NIP-09: ask the relays to drop events of ours whose work is done
    /// (a delivered transfer), instead of holding them until they expire.
    pub(crate) async fn delete(&self, ids: &[EventId]) -> Result<(), String> {
        for batch in ids.chunks(500) {
            let b = EventBuilder::new(Kind::EventDeletion, "")
                .tags(batch.iter().map(|id| Tag::event(*id)))
                .tag(Tag::expiration(Timestamp::now() + protocol::MSG_TTL_SECS));
            self.publish(b).await?;
        }
        Ok(())
    }

    /// Bulk (handoff packs, diffs): only via connected self-hosted relays
    /// when there are any. Public relays rate-limit chunk trains (and
    /// store them for everyone), a private relay on a private network does not.
    pub(crate) async fn send_bulk(&self, to: &PublicKey, env: &Envelope) -> Result<(usize, EventId), String> {
        let private: Vec<String> = self
            .health()
            .await
            .into_iter()
            .filter(|h| h.connected && h.url.starts_with("ws://"))
            .map(|h| h.url)
            .collect();
        if private.is_empty() {
            return self.send_id(to, env).await;
        }
        let b = EventBuilder::new(Kind::Custom(KIND_MSG), self.seal(to, env)?)
            .tag(Tag::public_key(*to))
            .tag(Tag::expiration(Timestamp::now() + protocol::MSG_TTL_SECS));
        self.publish_to(b, Some(private)).await
    }

    /// Live + stored traffic addressed to us from `authors`, since `since`.
    pub(crate) async fn subscribe(&self, authors: &[PublicKey], since: u64) -> Result<(), String> {
        let me = self.keys.public_key();
        let msgs = Filter::new()
            .kind(Kind::Custom(KIND_MSG))
            .pubkey(me)
            .authors(authors.iter().copied())
            .since(Timestamp::from(since));
        let states = Filter::new()
            .kind(Kind::Custom(KIND_STATE))
            .pubkey(me)
            .authors(authors.iter().copied());
        self.client.subscribe(msgs).await.map_err(|e| e.to_string())?;
        self.client.subscribe(states).await.map_err(|e| e.to_string())?;
        Ok(())
    }

    /// While an invite is open: messages to us from *any* key, so a
    /// joining device's `PairRequest` gets through. The agent drops
    /// everything else from unknown keys.
    pub(crate) async fn subscribe_open(&self, since: u64) -> Result<SubscriptionId, String> {
        let f = Filter::new()
            .kind(Kind::Custom(KIND_MSG))
            .pubkey(self.keys.public_key())
            .since(Timestamp::from(since));
        self.client.subscribe(f).await.map(|o| o.value).map_err(|e| e.to_string())
    }

    pub(crate) async fn unsubscribe(&self, id: &SubscriptionId) {
        let _ = self.client.unsubscribe(id).await;
    }

    /// One-shot read of peers' latest states (CLI `status`).
    pub(crate) async fn fetch_states(&self, authors: &[PublicKey]) -> Vec<Inbound> {
        let f = Filter::new()
            .kind(Kind::Custom(KIND_STATE))
            .pubkey(self.keys.public_key())
            .authors(authors.iter().copied());
        let Ok(events) = self.client.fetch_events(f).timeout(Duration::from_secs(8)).await else {
            return Vec::new();
        };
        let mut latest: HashMap<PublicKey, Inbound> = HashMap::new();
        for e in events.into_iter() {
            if let Some(i) = self.open(&e) {
                let newer = latest.get(&i.sender).is_none_or(|o| o.created_at < i.created_at);
                if newer {
                    latest.insert(i.sender, i);
                }
            }
        }
        latest.into_values().collect()
    }

    /// Decrypt and parse; None for anything not meant for us or garbled.
    pub(crate) fn open(&self, event: &Event) -> Option<Inbound> {
        if event.verify().is_err() {
            return None;
        }
        let plain = nip44::decrypt(self.keys.secret_key(), &event.pubkey, &event.content).ok()?;
        let envelope = Envelope::decode(&plain).ok()?;
        Some(Inbound {
            sender: event.pubkey,
            created_at: event.created_at.as_secs(),
            envelope,
        })
    }

    pub(crate) async fn disconnect(&self) {
        self.client.disconnect().await;
    }
}

/// Envelope ids already handled, bounded, persisted so a restart doesn't
/// replay a stored `Send` into a live session twice.
pub(crate) struct Seen {
    path: std::path::PathBuf,
    order: VecDeque<String>,
    set: HashSet<String>,
}

const SEEN_MAX: usize = 4000;

impl Seen {
    pub(crate) fn load(path: std::path::PathBuf) -> Self {
        let order: VecDeque<String> = std::fs::read_to_string(&path)
            .unwrap_or_default()
            .lines()
            .map(String::from)
            .collect();
        let set = order.iter().cloned().collect();
        Self { path, order, set }
    }

    /// True the first time an id is seen.
    pub(crate) fn first(&mut self, id: &str) -> bool {
        if self.set.contains(id) {
            return false;
        }
        self.set.insert(id.to_string());
        self.order.push_back(id.to_string());
        while self.order.len() > SEEN_MAX {
            if let Some(old) = self.order.pop_front() {
                self.set.remove(&old);
            }
        }
        let body: String = self.order.iter().map(|s| format!("{s}\n")).collect();
        let _ = std::fs::write(&self.path, body);
        true
    }
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn seen_dedupes_across_restarts() {
        let dir = tempfile::tempdir().unwrap();
        let p = dir.path().join("seen");
        let mut s = Seen::load(p.clone());
        assert!(s.first("a"));
        assert!(!s.first("a"));
        let mut s2 = Seen::load(p);
        assert!(!s2.first("a"));
        assert!(s2.first("b"));
    }

    // Full encrypt → event → decrypt path, with no relay.
    #[test]
    fn sealed_envelope_opens_only_for_its_recipient() {
        let rt = tokio::runtime::Builder::new_current_thread().enable_all().build().unwrap();
        rt.block_on(async {
            let (a, b, c) = (Keys::generate(), Keys::generate(), Keys::generate());
            let ta = Transport { client: Client::builder().build(), keys: a.clone(), paced: false, last_state: Default::default() };
            let tb = Transport { client: Client::builder().build(), keys: b.clone(), paced: false, last_state: Default::default() };
            let tc = Transport { client: Client::builder().build(), keys: c, paced: false, last_state: Default::default() };
            let env = Envelope::new("a", protocol::Body::SyncNow);
            let ev = EventBuilder::new(Kind::Custom(KIND_MSG), ta.seal(&b.public_key(), &env).unwrap())
                .tag(Tag::public_key(b.public_key()))
                .finalize(&a)
                .unwrap();
            let got = tb.open(&ev).expect("recipient opens");
            assert_eq!(got.sender, a.public_key());
            assert_eq!(got.envelope, env);
            assert!(tc.open(&ev).is_none(), "third party cannot");
        });
    }

    // Found running the one-machine demo: a manual sync right after the
    // startup publish was rejected because both events had the same
    // created_at.
    #[test]
    fn back_to_back_state_publishes_are_both_accepted() {
        let rt = tokio::runtime::Builder::new_current_thread().enable_all().build().unwrap();
        rt.block_on(async {
            let relay = LocalRelay::new();
            relay.run().await.unwrap();
            let url = relay.url().await.to_string();
            let t = Transport::connect(Keys::generate(), &[url]).await.unwrap();
            let to = Keys::generate().public_key();
            let env = Envelope::new("a", protocol::Body::SyncNow);
            for _ in 0..3 {
                assert_eq!(t.put_state(&to, &env).await, Ok(1));
            }
            relay.shutdown();
        });
    }

    // A delivered transfer's chunks stayed in the relay's memory for a
    // day; the sender now deletes them once the receiver confirms.
    #[test]
    fn a_deleted_event_is_gone_from_the_relay() {
        use nostr_sdk::prelude::IntoNostrDatabase;
        let rt = tokio::runtime::Builder::new_current_thread().enable_all().build().unwrap();
        rt.block_on(async {
            let db = nostr_memory::MemoryDatabase::unbounded().into_nostr_database();
            let relay = LocalRelay::builder().database(db.clone()).build();
            relay.run().await.unwrap();
            let url = relay.url().await.to_string();
            let t = Transport::connect(Keys::generate(), &[url]).await.unwrap();
            let to = Keys::generate().public_key();
            let env = Envelope::new("a", protocol::Body::SyncNow);
            let (_, kept) = t.send_bulk(&to, &env).await.unwrap();
            let (_, done) = t.send_bulk(&to, &env).await.unwrap();
            let held = |ids: Vec<EventId>| {
                let db = db.clone();
                async move { db.query(Filter::new().ids(ids)).await.unwrap().len() }
            };
            assert_eq!(held(vec![kept, done]).await, 2);
            t.delete(&[done]).await.unwrap();
            assert_eq!(held(vec![done]).await, 0, "deleted");
            assert_eq!(held(vec![kept]).await, 1, "only what was named");
            // Nobody else may delete our events.
            let other = Transport::connect(Keys::generate(), &[relay.url().await.to_string()]).await.unwrap();
            assert!(other.delete(&[kept]).await.is_err() || held(vec![kept]).await == 1);
            assert_eq!(held(vec![kept]).await, 1);
            relay.shutdown();
        });
    }

    // Found pulling a 3.5 MB folder through the fleet relay: the train
    // outran the relay's per-minute limit and the transfer was dropped.
    #[test]
    fn a_train_longer_than_the_relay_limit_waits_instead_of_failing() {
        let rt = tokio::runtime::Builder::new_current_thread().enable_all().build().unwrap();
        rt.block_on(async {
            let relay = LocalRelay::builder().rate_limit(RateLimit { max_reqs: 500, notes_per_minute: 120 }).build();
            relay.run().await.unwrap();
            let url = relay.url().await.to_string();
            let t = Transport::connect(Keys::generate(), &[url]).await.unwrap();
            let to = Keys::generate().public_key();
            let env = Envelope::new("a", protocol::Body::SyncNow);
            for i in 0..125 {
                assert_eq!(t.send_bulk(&to, &env).await.map(|(n, _)| n), Ok(1), "message {i}");
            }
            relay.shutdown();
        });
    }
}

<script type="text/plain" class="doc" id="d53" data-group="nerve sync source" data-title="tui/devices.rs" data-path="src/tui/devices.rs">//! The Devices view (`D`): your other devices, what each is doing, and
//! what is waiting for you, with the actions on them.
//!
//! Wide terminals get a device list on the left and the selected device
//! on the right. Below 90 columns (a phone over SSH) the list collapses
//! into a tab strip and the device fills the screen. On every device
//! "needs you" comes first: pending permission prompts and questions,
//! answerable in place.
//!
//! Pure rendering over a `SyncView` snapshot; strings from the network go
//! through `Sanitised` here, at the render boundary.

use ratatui::layout::{Constraint, Layout, Rect};
use ratatui::style::{Color, Modifier, Style};
use ratatui::text::{Line, Span};
use ratatui::widgets::{Block, BorderType, Borders, Clear, Paragraph, Wrap};
use ratatui::Frame;

use super::theme::Theme;
use crate::sync::agent::{PeerView, SyncView};
use crate::sync::protocol::{now_secs, DeviceState, PendingRequest, RemoteSession};
use crate::util::sanitize::Sanitised;
use crate::util::text::{format_age, truncate_width};

/// Below this width the device list becomes a tab strip.
const NARROW: u16 = 90;
/// A device whose state is older than this is shown as stale.
const STALE_SECS: u64 = 180;

/// One selectable line of the selected device.
#[derive(Debug, Clone, PartialEq)]
pub(crate) enum Row {
    Session { device: String, id: String, injectable: bool, via_mod: bool },
    Request { device: String, req: PendingRequest },
    Job { device: String, id: String },
}

pub(crate) enum Mode {
    List,
    /// Typing an instruction for a remote session.
    Compose { device: String, session: String, via_mod: bool, buf: String },
    /// Reading a fetched diff / log.
    Blob { scroll: usize },
}

pub(crate) struct DevicesState {
    /// Name of the device shown; follows the device, not its position.
    pub(crate) device: Option<String>,
    pub(crate) cursor: usize,
    /// Identity of the selected row. Peers republish their state every
    /// few seconds and rows can shift; acting on an index once sent an
    /// instruction to the wrong session, so the cursor follows this.
    pub(crate) key: Option<String>,
    pub(crate) mode: Mode,
}

impl Row {
    pub(crate) fn key(&self) -> String {
        match self {
            Row::Session { device, id, .. } => format!("s/{device}/{id}"),
            Row::Request { device, req } => format!("r/{device}/{}", req.id),
            Row::Job { device, id } => format!("j/{device}/{id}"),
        }
    }
}

impl DevicesState {
    pub(crate) fn new() -> Self {
        Self { device: None, cursor: 0, key: None, mode: Mode::List }
    }

    /// The device shown: the remembered one if it still exists, else the
    /// first one that needs you, else the first.
    pub(crate) fn current<'a>(&mut self, view: &'a SyncView) -> Option<&'a PeerView> {
        let found = self.device.as_ref().and_then(|d| view.peers.iter().find(|p| p.name == *d));
        let p = found
            .or_else(|| view.peers.iter().find(|p| p.state.as_ref().is_some_and(|s| !s.requests.is_empty())))
            .or_else(|| view.peers.first())?;
        self.device = Some(p.name.clone());
        Some(p)
    }

    /// Show the next (or previous) device.
    pub(crate) fn cycle(&mut self, view: &SyncView, forward: bool) {
        let n = view.peers.len();
        if n == 0 {
            return;
        }
        let i = self.device.as_ref().and_then(|d| view.peers.iter().position(|p| p.name == *d)).unwrap_or(0);
        let j = if forward { (i + 1) % n } else { (i + n - 1) % n };
        self.device = Some(view.peers[j].name.clone());
        self.cursor = 0;
        self.key = None;
    }

    /// Re-find the selected row after a refresh; falls back to the old
    /// index (clamped) when it vanished.
    pub(crate) fn resolve(&mut self, rows: &[Row]) -> Option<Row> {
        if let Some(i) = self.key.as_ref().and_then(|k| rows.iter().position(|r| r.key() == *k)) {
            self.cursor = i;
        }
        self.cursor = self.cursor.min(rows.len().saturating_sub(1));
        let row = rows.get(self.cursor).cloned();
        self.key = row.as_ref().map(Row::key);
        row
    }
}

/// Rows of one device in display order: what needs you, then sessions
/// (busiest first), then jobs. The cursor indexes into this.
pub(crate) fn rows(peer: Option<&PeerView>) -> Vec<Row> {
    let Some(p) = peer else { return Vec::new() };
    let Some(st) = &p.state else { return Vec::new() };
    let mut out: Vec<Row> = st.requests.iter().map(|r| Row::Request { device: p.name.clone(), req: r.clone() }).collect();
    for s in ordered_sessions(st) {
        out.push(Row::Session { device: p.name.clone(), id: s.id.clone(), injectable: s.injectable, via_mod: s.via_mod });
    }
    for j in &st.jobs {
        out.push(Row::Job { device: p.name.clone(), id: j.id.clone() });
    }
    out
}

/// Waiting first, then working, then idle; stable within each group.
fn ordered_sessions(st: &DeviceState) -> Vec<&RemoteSession> {
    let rank = |s: &RemoteSession| match s.state.as_str() {
        "Waiting" => 0,
        "Error" => 1,
        "Processing" => 2,
        x if x.starts_with("Tool") => 2,
        _ => 3,
    };
    let mut v: Vec<&RemoteSession> = st.sessions.iter().collect();
    v.sort_by_key(|s| rank(s));
    v
}

/// Network text, made safe to draw: sanitised, and tabs (which the
/// terminal expands past our width math) turned into spaces.
fn san(s: &str) -> String {
    Sanitised::new(s.to_string()).as_str().replace('\t', "  ")
}

fn short_path(p: &str) -> String {
    let home = dirs::home_dir().map(|h| h.to_string_lossy().into_owned()).unwrap_or_default();
    let p = san(p);
    match p.strip_prefix(&home) {
        Some(rest) if !home.is_empty() => format!("~{rest}"),
        _ => p.replacen("/home/", "~", 1).replacen("/Users/", "~", 1),
    }
}

fn age_short(s: u64) -> String {
    match s {
        0..60 => format!("{s}s"),
        60..3600 => format!("{}m", s / 60),
        3600..86_400 => format!("{}h", s / 3600),
        _ => format!("{}d", s / 86_400),
    }
}

struct Palette {
    text: Style,
    bold: Style,
    muted: Style,
    ok: Color,
    warn: Color,
    bad: Color,
    accent: Color,
}

impl Palette {
    fn new(t: &Theme) -> Self {
        Self {
            text: Style::default().fg(t.text),
            bold: Style::default().fg(t.text).add_modifier(Modifier::BOLD),
            muted: Style::default().fg(t.muted),
            ok: t.processing,
            warn: t.waiting,
            bad: t.error,
            accent: t.processing,
        }
    }
}

/// Freshness of a device: (dot colour, "synced 4s ago" text).
fn freshness(p: &PeerView, pal: &Palette, now: u64) -> (Color, String) {
    match p.state_generated_at {
        Some(g) => {
            let age = now.saturating_sub(g);
            (if age < STALE_SECS { pal.ok } else { pal.warn }, format!("synced {}", format_age(age as f64)))
        }
        None => (pal.bad, "never synced".into()),
    }
}

fn state_color(state: &str, t: &Theme) -> Color {
    match state {
        "Processing" => t.processing,
        "Waiting" => t.waiting,
        "Error" => t.error,
        s if s.starts_with("Tool") => t.processing,
        _ => t.idle,
    }
}

pub(crate) fn render(frame: &mut Frame, theme: &Theme, view: &SyncView, ui: &mut DevicesState) {
    // A full view, not a popup: covers the grid entirely.
    let area = frame.area();
    frame.render_widget(Clear, area);
    let pal = Palette::new(theme);
    let needs: usize = view.peers.iter().filter_map(|p| p.state.as_ref()).map(|s| s.requests.len()).sum();
    let mut title = vec![Span::styled(" Devices ", pal.bold)];
    if needs > 0 {
        title.push(Span::styled(format!(" {needs} need{} you ", if needs == 1 { "s" } else { "" }), Style::default().fg(theme.selected_text).bg(pal.warn).add_modifier(Modifier::BOLD)));
        title.push(Span::raw(" "));
    }
    let block = Block::default()
        .title(Line::from(title))
        .borders(Borders::ALL)
        .border_type(BorderType::Rounded)
        .border_style(Style::default().fg(theme.border));
    let inner = block.inner(area);
    frame.render_widget(block, area);
    let [head, body, foot] = Layout::vertical([Constraint::Length(1), Constraint::Min(0), Constraint::Length(2)]).areas(inner);
    render_header(frame, head, view, &pal);

    if let Mode::Blob { scroll } = &mut ui.mode {
        render_blob(frame, body, foot, theme, view, scroll);
        return;
    }

    let peer = ui.current(view).cloned();
    let rows = rows(peer.as_ref());
    let selected = ui.resolve(&rows);
    if view.peers.is_empty() {
        let msg = vec![
            Line::raw(""),
            Line::from(Span::styled("  No other devices yet.", pal.bold)),
            Line::raw(""),
            Line::from(Span::styled("  On this device run   nerve setup", pal.text)),
            Line::from(Span::styled("  then run the command it prints on the other one.", pal.muted)),
        ];
        frame.render_widget(Paragraph::new(msg), body);
        hints(frame, foot, theme, view, &[("Esc", "close")]);
        return;
    }
    let detail = if body.width < NARROW {
        let [tabs, rest] = Layout::vertical([Constraint::Length(2), Constraint::Min(0)]).areas(body);
        render_tabs(frame, tabs, view, ui, &pal);
        rest
    } else {
        let [list, gap, rest] = Layout::horizontal([Constraint::Length(30), Constraint::Length(1), Constraint::Min(0)]).areas(body);
        render_device_list(frame, list, view, ui, &pal);
        frame.render_widget(Paragraph::new(vec![Line::styled("│", pal.muted); gap.height as usize]), gap);
        rest
    };
    if let Some(p) = &peer {
        render_device(frame, detail, theme, &pal, p, &rows, ui.cursor);
    }

    if let Mode::Compose { device, buf, via_mod, .. } = &ui.mode {
        render_compose(frame, area, theme, &pal, device, buf, *via_mod);
        hints(frame, foot, theme, view, &[("Enter", "send"), ("Esc", "cancel")]);
        return;
    }
    let base: &[(&str, &str)] = match &selected {
        Some(Row::Request { req, .. }) if req.kind == "question" => &[("1-9", "answer"), ("x", "decline"), ("Tab", "device"), ("r", "sync"), ("Esc", "close")],
        Some(Row::Request { .. }) => &[("a", "allow"), ("x", "deny"), ("Tab", "device"), ("r", "sync"), ("Esc", "close")],
        Some(Row::Session { injectable: true, .. }) => &[("m", "message"), ("d", "diff"), ("l", "log"), ("g", "agents"), ("Tab", "device"), ("Esc", "close")],
        Some(Row::Session { .. }) => &[("d", "diff"), ("l", "log"), ("g", "agents"), ("Tab", "device"), ("Esc", "close")],
        _ => &[("Tab", "device"), ("r", "sync now"), ("A", "away"), ("Esc", "close")],
    };
    hints(frame, foot, theme, view, base);
}

fn render_header(frame: &mut Frame, area: Rect, view: &SyncView, pal: &Palette) {
    let now = now_secs();
    let mut spans = vec![Span::raw(" ")];
    if view.running {
        spans.push(Span::styled("● ", Style::default().fg(pal.ok)));
        spans.push(Span::styled(san(&view.me), pal.bold));
        if let Some(t) = view.last_publish {
            spans.push(Span::styled(format!("  published {} ago", age_short(now.saturating_sub(t))), pal.muted));
        }
        if view.mod_sessions > 0 {
            spans.push(Span::styled(format!("  · {} session(s) via mod", view.mod_sessions), pal.muted));
        }
        if view.away {
            spans.push(Span::styled("  · away", Style::default().fg(pal.warn)));
        }
    } else {
        spans.push(Span::styled("● sync off ", Style::default().fg(pal.bad)));
        spans.push(Span::styled(san(view.error.as_deref().unwrap_or("")), pal.muted));
    }
    // Relays as dots, right-aligned: ● connected, ○ down.
    let up = view.relays.iter().filter(|r| r.connected).count();
    let relays = format!("relays {}", view.relays.iter().map(|r| if r.connected { '●' } else { '○' }).collect::<String>());
    let used: usize = spans.iter().map(|s| s.content.chars().count()).sum();
    let pad = (area.width as usize).saturating_sub(used + relays.chars().count() + 1);
    spans.push(Span::raw(" ".repeat(pad)));
    let rc = if view.relays.is_empty() || up == 0 { pal.bad } else if up < view.relays.len() { pal.warn } else { pal.ok };
    spans.push(Span::styled(relays, Style::default().fg(rc)));
    frame.render_widget(Paragraph::new(Line::from(spans)), area);
}

fn render_device_list(frame: &mut Frame, area: Rect, view: &SyncView, ui: &DevicesState, pal: &Palette) {
    let now = now_secs();
    let mut lines = vec![Line::raw("")];
    for p in &view.peers {
        let sel = ui.device.as_deref() == Some(p.name.as_str());
        let (dot, fresh) = freshness(p, pal, now);
        let base = if sel { pal.bold.add_modifier(Modifier::REVERSED) } else { pal.bold };
        lines.push(Line::from(vec![
            Span::styled(if sel { "▌" } else { " " }, Style::default().fg(pal.accent)),
            Span::styled("● ", Style::default().fg(dot)),
            Span::styled(format!("{:<20}", truncate_width(&san(&p.name), 20)), base),
        ]));
        let mut meta = vec![Span::raw("    "), Span::styled(fresh, pal.muted)];
        if let Some(st) = &p.state {
            let waiting = st.requests.len();
            if waiting > 0 {
                meta.push(Span::styled(format!(" · {waiting} waiting"), Style::default().fg(pal.warn)));
            }
            lines.push(Line::from(meta));
            let busy = st.sessions.iter().filter(|s| s.state != "Idle").count();
            lines.push(Line::from(vec![
                Span::raw("    "),
                Span::styled(format!("{} session{}", st.sessions.len(), if st.sessions.len() == 1 { "" } else { "s" }), pal.muted),
                Span::styled(if busy > 0 { format!(", {busy} active") } else { String::new() }, pal.muted),
            ]));
        } else {
            lines.push(Line::from(meta));
        }
        lines.push(Line::raw(""));
    }
    for (t, done, of) in &view.transfers {
        lines.push(Line::from(Span::styled(format!(" {}", truncate_width(&san(t), 28)), pal.muted)));
        lines.push(progress_bar(*done, *of, 26, pal));
    }
    frame.render_widget(Paragraph::new(lines), area);
}

fn render_tabs(frame: &mut Frame, area: Rect, view: &SyncView, ui: &DevicesState, pal: &Palette) {
    let now = now_secs();
    let mut spans = vec![Span::raw(" ")];
    for p in &view.peers {
        let sel = ui.device.as_deref() == Some(p.name.as_str());
        let (dot, _) = freshness(p, pal, now);
        let waiting = p.state.as_ref().map(|s| s.requests.len()).unwrap_or(0);
        spans.push(Span::styled("●", Style::default().fg(dot)));
        let label = if waiting > 0 { format!(" {} ({waiting}) ", san(&p.name)) } else { format!(" {} ", san(&p.name)) };
        spans.push(Span::styled(label, if sel { pal.bold.add_modifier(Modifier::REVERSED) } else { pal.muted }));
        spans.push(Span::raw(" "));
    }
    frame.render_widget(Paragraph::new(vec![Line::from(spans), Line::raw("")]), area);
}

fn progress_bar(done: usize, of: usize, width: usize, pal: &Palette) -> Line<'static> {
    let filled = (done * width).checked_div(of).unwrap_or(width).min(width);
    Line::from(vec![
        Span::raw(" "),
        Span::styled("█".repeat(filled), Style::default().fg(pal.accent)),
        Span::styled("░".repeat(width - filled), pal.muted),
        Span::styled(format!(" {done}/{of}"), pal.muted),
    ])
}

/// The selected device: what needs you, sessions, jobs, and the selected
/// session's recent transcript.
fn render_device(frame: &mut Frame, area: Rect, theme: &Theme, pal: &Palette, p: &PeerView, rows: &[Row], cursor: usize) {
    let now = now_secs();
    let width = area.width as usize;
    let mut lines: Vec<Line> = Vec::new();
    let (dot, fresh) = freshness(p, pal, now);
    let mut head = vec![Span::styled(" ● ", Style::default().fg(dot)), Span::styled(san(&p.name), pal.bold), Span::styled(format!("  {fresh}"), pal.muted)];
    let Some(st) = &p.state else {
        head.push(Span::styled("  waiting for its first update", pal.muted));
        lines.push(Line::from(head));
        lines.push(Line::raw(""));
        lines.push(Line::from(Span::styled("   Is nerve running there, on the same relays? Try `nerve sync doctor` on it.", pal.muted)));
        lines.push(Line::from(Span::styled(format!("   trusted key {}", truncate_width(&p.npub, width.saturating_sub(16))), pal.muted)));
        frame.render_widget(Paragraph::new(lines), area);
        return;
    };
    if width > 60 {
        head.push(Span::styled(format!("  {} {}", san(&st.os), san(&st.arch)), pal.muted));
    }
    if st.away {
        head.push(Span::styled("  away", Style::default().fg(pal.warn)));
    }
    lines.push(Line::from(head));
    if width > 60 {
        lines.push(Line::from(Span::styled(format!("   can run: {}", truncate_width(&san(&st.caps.join(" ")), width.saturating_sub(14))), pal.muted)));
    }

    let mut cursor_line = 0usize;
    let mut i = 0usize;
    let mut select = |lines: &mut Vec<Line<'static>>, i: usize, mut l: Line<'static>| {
        if i == cursor {
            cursor_line = lines.len();
            l.spans.insert(0, Span::styled(" ▶ ", Style::default().fg(pal.accent).add_modifier(Modifier::BOLD)));
            l = l.style(Style::default().bg(theme.selected_bg));
        } else {
            l.spans.insert(0, Span::raw("   "));
        }
        lines.push(l);
    };

    if !st.requests.is_empty() {
        lines.push(Line::raw(""));
        lines.push(Line::from(Span::styled(" NEEDS YOU", Style::default().fg(pal.warn).add_modifier(Modifier::BOLD))));
        for r in &st.requests {
            let session = st.sessions.iter().find(|s| s.id == r.session).map(|s| san(&s.name)).unwrap_or_default();
            let age = if r.created_at == 0 { String::new() } else { age_short(now.saturating_sub(r.created_at)) };
            let what = if r.kind == "question" {
                format!("? {}", san(&r.summary))
            } else {
                format!("{} wants to run {}", if session.is_empty() { "a session".into() } else { session.clone() }, san(&r.tool))
            };
            select(&mut lines, i, Line::from(vec![Span::styled(truncate_width(&what, width.saturating_sub(12)), pal.bold), Span::styled(format!("  {age}"), pal.muted)]));
            i += 1;
            if r.kind == "question" {
                if let Some(q) = r.questions.first() {
                    let opts: Vec<Span> = q
                        .options
                        .iter()
                        .enumerate()
                        .flat_map(|(n, o)| [Span::styled(format!("[{}]", n + 1), Style::default().fg(pal.accent).add_modifier(Modifier::BOLD)), Span::styled(format!(" {}   ", san(o)), pal.text)])
                        .collect();
                    lines.push(Line::from([vec![Span::raw("      ")], opts].concat()));
                }
            } else {
                lines.push(Line::from(vec![Span::raw("      "), Span::styled(truncate_width(&san(&r.summary), width.saturating_sub(8)), pal.muted)]));
            }
        }
    }

    lines.push(Line::raw(""));
    lines.push(Line::from(Span::styled(format!(" SESSIONS  {}", st.sessions.len()), pal.muted.add_modifier(Modifier::BOLD))));
    let selected_session = match rows.get(cursor) {
        Some(Row::Session { id, .. }) => Some(id.clone()),
        _ => None,
    };
    for s in ordered_sessions(st) {
        let name_w = (width / 3).clamp(14, 40);
        let state = s.waiting_for.as_ref().map(|w| format!("waiting: {}", san(w))).unwrap_or_else(|| san(&s.state).to_lowercase());
        let mut l = vec![
            Span::styled("● ", Style::default().fg(state_color(&s.state, theme))),
            Span::styled(format!("{:<w$} ", truncate_width(&san(&s.name), name_w), w = name_w), pal.bold),
            Span::styled(format!("{:<18}", truncate_width(&state, 18)), Style::default().fg(state_color(&s.state, theme))),
        ];
        if width > 70 {
            let mut meta = String::new();
            if let Some(b) = &s.branch {
                meta.push_str(&format!(" ⎇ {}", truncate_width(&san(b), 18)));
            }
            if s.cost_usd >= 0.01 {
                meta.push_str(&format!("  ${:.2}", s.cost_usd));
            }
            if s.subagents > 0 {
                meta.push_str(&format!("  {} agents", s.subagents));
            }
            l.push(Span::styled(meta, pal.muted));
        }
        let reach = if s.via_mod { "mod" } else if s.injectable { "tty" } else { "view" };
        l.push(Span::styled(format!("  {reach}"), if s.via_mod { Style::default().fg(pal.accent) } else { pal.muted }));
        select(&mut lines, i, Line::from(l));
        i += 1;
        if selected_session.as_deref() == Some(s.id.as_str()) {
            let mut sub = format!("      {}", short_path(&s.cwd));
            if let Some(t) = &s.last_turn {
                sub.push_str(&format!(
                    "  · last turn {} ago, {:.1}s, {}k tokens in / {} out",
                    age_short(now.saturating_sub(t.ended_at)),
                    t.ms as f64 / 1000.0,
                    t.input_tokens / 1000,
                    t.output_tokens
                ));
            }
            lines.push(Line::from(Span::styled(truncate_width(&sub, width.saturating_sub(1)), pal.muted)));
            for t in &s.tail {
                lines.push(Line::from(vec![Span::styled("      │ ", pal.muted), Span::styled(truncate_width(&san(t), width.saturating_sub(9)), pal.text)]));
            }
            if !s.injectable {
                let note = "      view only: no terminal or mod to send input through";
                lines.push(Line::from(Span::styled(truncate_width(note, width.saturating_sub(1)), pal.muted)));
            }
        }
    }
    if st.sessions.is_empty() {
        lines.push(Line::from(Span::styled("    no Claude sessions running", pal.muted)));
    }

    if !st.jobs.is_empty() {
        lines.push(Line::raw(""));
        lines.push(Line::from(Span::styled(" JOBS & RUNS", pal.muted.add_modifier(Modifier::BOLD))));
        for j in &st.jobs {
            let (mark, c) = match (j.phase.as_str(), j.verified) {
                ("done", Some(true)) => ("✓ verified", pal.ok),
                ("done", _) => ("✓ done", pal.ok),
                ("failed", _) | (_, Some(false)) => ("✗ failed", pal.bad),
                (p, _) => (p, pal.warn),
            };
            select(
                &mut lines,
                i,
                Line::from(vec![
                    Span::styled(format!("{:<28} ", truncate_width(&san(&j.title), 28)), pal.text),
                    Span::styled(format!("{mark:<12}"), Style::default().fg(c)),
                    Span::styled(
                        if j.kind == "run" {
                            let code = j.exit_code.map(|c| format!("exit {c} · ")).unwrap_or_default();
                            format!(" {code}{} lines{}", j.lines, j.tail.last().map(|l| format!(" · {}", truncate_width(&san(l), 40))).unwrap_or_default())
                        } else {
                            format!(" {} turns · ${:.3}", j.turns, j.cost_usd)
                        },
                        pal.muted,
                    ),
                ]),
            );
            i += 1;
        }
    }
    // Scroll only as far as needed to keep the selected row (and the line
    // under it) on screen.
    let h = area.height as usize;
    let top = (cursor_line + 2).saturating_sub(h);
    frame.render_widget(Paragraph::new(lines).scroll((top as u16, 0)), area);
}

fn render_blob(frame: &mut Frame, body: Rect, foot: Rect, theme: &Theme, view: &SyncView, scroll: &mut usize) {
    let pal = Palette::new(theme);
    if let Some((t, got, of)) = view.incoming.first() {
        let lines = vec![Line::raw(""), Line::from(Span::styled(format!("  receiving {}", san(t)), pal.text)), progress_bar(*got, *of, 30, &pal)];
        frame.render_widget(Paragraph::new(lines), body);
        hints(frame, foot, theme, view, &[("Esc", "back")]);
        return;
    }
    let Some((t, text)) = view.blobs.back().cloned() else {
        frame.render_widget(Paragraph::new(Line::from(Span::styled("  asking the device…", pal.muted))), body);
        hints(frame, foot, theme, view, &[("Esc", "back")]);
        return;
    };
    let total = text.lines().count();
    let max = total.saturating_sub(body.height.saturating_sub(2) as usize);
    *scroll = (*scroll).min(max);
    let mut lines = vec![Line::from(vec![
        Span::styled(format!(" {}", san(&t)), pal.bold),
        Span::styled(format!("   lines {}-{} of {total}", *scroll + 1, (*scroll + body.height as usize).min(total)), pal.muted),
    ])];
    lines.push(Line::raw(""));
    lines.extend(text.lines().skip(*scroll).take(body.height as usize).map(|l| {
        let style = if l.starts_with("@@") {
            Style::default().fg(theme.waiting)
        } else if l.starts_with('+') && !l.starts_with("+++") {
            Style::default().fg(theme.processing)
        } else if l.starts_with('-') && !l.starts_with("---") {
            Style::default().fg(theme.error)
        } else {
            pal.text
        };
        Line::from(Span::styled(l.replace('\t', "    "), style))
    }));
    frame.render_widget(Paragraph::new(lines), body);
    hints(frame, foot, theme, view, &[("j/k", "scroll"), ("PgUp/PgDn", "page"), ("Esc", "back")]);
}

fn render_compose(frame: &mut Frame, area: Rect, theme: &Theme, pal: &Palette, device: &str, buf: &str, via_mod: bool) {
    let box_area = super::centered(area, area.width.saturating_sub(6).min(96), 8);
    frame.render_widget(Clear, box_area);
    let b = Block::default()
        .title(Span::styled(format!(" message to {} ", san(device)), pal.bold))
        .borders(Borders::ALL)
        .border_type(BorderType::Rounded)
        .border_style(Style::default().fg(theme.processing));
    let i = b.inner(box_area);
    frame.render_widget(b, box_area);
    let how = if via_mod {
        "sent through the nerve mod: queued if Claude is busy, as if typed there"
    } else {
        "typed into the session's terminal and submitted"
    };
    let [text, note] = Layout::vertical([Constraint::Min(1), Constraint::Length(1)]).areas(i);
    frame.render_widget(Paragraph::new(format!("{buf}▏")).wrap(Wrap { trim: false }), text);
    frame.render_widget(Paragraph::new(Span::styled(how, pal.muted)), note);
}

fn hints(frame: &mut Frame, area: Rect, theme: &Theme, view: &SyncView, keys: &[(&str, &str)]) {
    let pal = Palette::new(theme);
    let last = view.log.back().map(|l| truncate_width(&san(l), area.width.saturating_sub(2) as usize)).unwrap_or_default();
    let mut spans = vec![];
    for (k, d) in keys {
        spans.push(Span::styled(format!(" {k}"), Style::default().fg(theme.processing).add_modifier(Modifier::BOLD)));
        spans.push(Span::styled(format!(" {d} "), pal.muted));
    }
    frame.render_widget(Paragraph::new(vec![Line::from(Span::styled(format!(" {last}"), pal.muted)), Line::from(spans)]), area);
}

/// "Continue on which device?" — peers numbered 1-9.
pub(crate) fn render_handoff_picker(frame: &mut Frame, theme: &Theme, view: &SyncView) {
    let pal = Palette::new(theme);
    let area = super::centered(frame.area(), 64, (view.peers.len() as u16 + 8).min(16));
    frame.render_widget(Clear, area);
    let block = Block::default()
        .title(Span::styled(" continue this session on… ", pal.bold))
        .borders(Borders::ALL)
        .border_type(BorderType::Rounded)
        .border_style(Style::default().fg(theme.processing));
    let inner = block.inner(area);
    frame.render_widget(block, area);
    let now = now_secs();
    let mut lines = vec![
        Line::from(Span::styled(" Moves the commits it lacks, your uncommitted changes and the", pal.muted)),
        Line::from(Span::styled(" conversation; the session resumes there in tmux. Repeat hand-offs", pal.muted)),
        Line::from(Span::styled(" only send what changed.", pal.muted)),
        Line::raw(""),
    ];
    for (i, p) in view.peers.iter().enumerate().take(9) {
        let (dot, fresh) = freshness(p, &pal, now);
        lines.push(Line::from(vec![
            Span::styled(format!(" [{}] ", i + 1), Style::default().fg(theme.processing).add_modifier(Modifier::BOLD)),
            Span::styled("● ", Style::default().fg(dot)),
            Span::styled(format!("{:<18}", san(&p.name)), pal.bold),
            Span::styled(fresh, pal.muted),
        ]));
    }
    lines.push(Line::raw(""));
    lines.push(Line::from(Span::styled(" [Esc] cancel", pal.muted)));
    frame.render_widget(Paragraph::new(lines), inner);
}

/// Status-bar summary: "⇄ server 12s · 1 needs you".
pub(crate) fn status_hint(view: &SyncView) -> Option<String> {
    if !view.running && view.error.is_none() {
        return None;
    }
    if !view.running {
        return Some("⇄ sync off".into());
    }
    let now = now_secs();
    let peers: Vec<String> = view
        .peers
        .iter()
        .map(|p| match p.state_generated_at {
            Some(g) => format!("{} {}", san(&p.name), age_short(now.saturating_sub(g))),
            None => format!("{} –", san(&p.name)),
        })
        .collect();
    let pending: usize = view.peers.iter().filter_map(|p| p.state.as_ref()).map(|s| s.requests.len()).sum();
    let mut s = format!("⇄ {}", peers.join(" "));
    if pending > 0 {
        s.push_str(&format!(" · {pending} need{} you", if pending == 1 { "s" } else { "" }));
    }
    Some(s)
}

#[cfg(test)]
mod tests {
    use super::*;
    use crate::sync::protocol::{DeviceState, RemoteSession};

    fn view() -> SyncView {
        let st = DeviceState {
            sessions: vec![
                RemoteSession { id: "s1".into(), name: "demo".into(), state: "Idle".into(), injectable: true, ..Default::default() },
                RemoteSession { id: "s2".into(), name: "busy".into(), state: "Waiting".into(), via_mod: true, injectable: true, ..Default::default() },
            ],
            requests: vec![PendingRequest { id: "r1".into(), kind: "permission".into(), tool: "Write".into(), session: "s2".into(), created_at: now_secs() - 30, ..Default::default() }],
            generated_at: now_secs(),
            ..Default::default()
        };
        SyncView {
            running: true,
            peers: vec![
                PeerView { name: "laptop".into(), ..Default::default() },
                PeerView { name: "server".into(), state_generated_at: Some(now_secs() - 5), state: Some(st), ..Default::default() },
            ],
            ..Default::default()
        }
    }

    #[test]
    fn opens_on_the_device_that_needs_you_and_cycles() {
        let v = view();
        let mut ui = DevicesState::new();
        assert_eq!(ui.current(&v).unwrap().name, "server");
        ui.cycle(&v, true);
        assert_eq!(ui.current(&v).unwrap().name, "laptop");
        ui.cycle(&v, false);
        assert_eq!(ui.current(&v).unwrap().name, "server");
    }

    #[test]
    fn requests_come_first_then_waiting_sessions() {
        let v = view();
        let r = rows(v.peers.get(1));
        assert!(matches!(&r[0], Row::Request { req, .. } if req.id == "r1"));
        assert!(matches!(&r[1], Row::Session { id, via_mod: true, .. } if id == "s2"));
        assert!(matches!(&r[2], Row::Session { id, .. } if id == "s1"));
        assert!(rows(v.peers.first()).is_empty(), "a device without state has no rows");
    }

    // Regression: a republished state with reordered sessions moved the
    // selection under the user, and `m` messaged a different session.
    #[test]
    fn selection_follows_the_row_not_the_index() {
        let mut v = view();
        let mut ui = DevicesState::new();
        ui.cursor = 2;
        assert!(matches!(ui.resolve(&rows(v.peers.get(1))), Some(Row::Session { ref id, .. }) if id == "s1"));
        let st = v.peers[1].state.as_mut().unwrap();
        st.sessions.insert(0, RemoteSession { id: "s0".into(), state: "Waiting".into(), ..Default::default() });
        assert!(matches!(ui.resolve(&rows(v.peers.get(1))), Some(Row::Session { ref id, .. }) if id == "s1"));
        assert_eq!(ui.cursor, 3);
    }

    #[test]
    fn status_hint_shows_age_and_pending() {
        let mut v = view();
        v.peers.remove(0);
        assert_eq!(status_hint(&v).unwrap(), "⇄ server 5s · 1 needs you");
        assert_eq!(status_hint(&SyncView::default()), None);
    }

    #[test]
    fn renders_wide_and_phone_sized() {
        let theme = crate::tui::theme::Theme::catalog(None)[0].clone();
        for (w, h) in [(40, 12), (60, 30), (89, 30), (140, 40)] {
            let backend = ratatui::backend::TestBackend::new(w, h);
            let mut term = ratatui::Terminal::new(backend).unwrap();
            let mut ui = DevicesState::new();
            term.draw(|f| render(f, &theme, &view(), &mut ui)).unwrap();
            let text: String = term.backend().buffer().content().iter().map(|c| c.symbol()).collect();
            assert!(text.contains("server"), "{w}x{h}");
            assert!(text.contains("NEEDS YOU"), "{w}x{h} shows what needs you");
            if w <= 60 {
                assert!(!text.contains("can run:"), "{w}: phone layout drops the detail line");
            }
            if w < NARROW {
                assert!(text.contains("● laptop") && text.contains("server (1)"), "{w}: tab strip with the waiting count");
            }
        }
        let backend = ratatui::backend::TestBackend::new(60, 20);
        let mut term = ratatui::Terminal::new(backend).unwrap();
        term.draw(|f| render(f, &theme, &SyncView { running: true, ..Default::default() }, &mut DevicesState::new())).unwrap();
        let text: String = term.backend().buffer().content().iter().map(|c| c.symbol()).collect();
        assert!(text.contains("nerve setup"), "empty state says what to do");
    }
}

<script type="text/plain" class="doc" id="d54" data-group="nerve sync source" data-title="app/sync_ui.rs" data-path="src/app/sync_ui.rs">//! Key handling for the Devices and hand-off overlays.

use crossterm::event::KeyCode;

use super::{App, Overlay};
use crate::sync::agent::Request;
use crate::sync::protocol::{Answer, Body, FetchWhat};
use crate::tui::devices::{rows, DevicesState, Mode, Row};

impl App {
    pub(super) fn sync_hint(&self) -> Option<String> {
        self.sync.as_ref().and_then(|h| crate::tui::devices::status_hint(&h.snapshot()))
    }

    pub(super) fn open_devices(&mut self) {
        if self.sync.is_none() {
            self.set_status_info("sync is not set up: run `nerve setup`");
            return;
        }
        self.overlay = Overlay::Devices(DevicesState::new());
    }

    pub(super) fn open_handoff(&mut self) {
        let Some(h) = &self.sync else {
            self.set_status_info("sync is not set up: run `nerve setup`");
            return;
        };
        if h.snapshot().peers.is_empty() {
            self.set_status_info("no other devices yet: run `nerve setup` to add one");
            return;
        }
        if let Some(s) = self.nth_filtered(self.selected) {
            self.overlay = Overlay::Handoff { id: s.id.clone(), cwd: s.cwd.clone() };
        }
    }

    pub(super) fn handle_handoff_key(&mut self, code: KeyCode) {
        let Overlay::Handoff { id, cwd } = &self.overlay else { return };
        match code {
            KeyCode::Char(c) if c.is_ascii_digit() && c != '0' => {
                let (id, cwd) = (id.clone(), cwd.clone());
                let idx = c as usize - '1' as usize;
                let Some(h) = &self.sync else { return };
                let Some(peer) = h.snapshot().peers.get(idx).map(|p| p.name.clone()) else { return };
                h.request(Request::Handoff { session_id: id.as_str().to_string(), cwd, device: peer.clone(), continue_with: None, place: None, force: false });
                self.overlay = Overlay::None;
                self.set_status_info(format!("handing off to {peer}… (progress in D)"));
            }
            KeyCode::Esc | KeyCode::Char('q') => self.overlay = Overlay::None,
            _ => {}
        }
    }

    pub(super) fn handle_devices_key(&mut self, code: KeyCode) {
        let Some(h) = &self.sync else {
            self.overlay = Overlay::None;
            return;
        };
        let view = h.snapshot();
        let Overlay::Devices(ui) = &mut self.overlay else { return };
        let peer = ui.current(&view).cloned();
        let all = rows(peer.as_ref());
        let row = ui.resolve(&all);
        let mut requests = Vec::new();
        let mut note = None;
        match &mut ui.mode {
            Mode::Compose { device, session, buf, .. } => match code {
                KeyCode::Enter => {
                    let text = std::mem::take(buf);
                    if !text.trim().is_empty() {
                        requests.push(Request::To { device: device.clone(), body: Body::Send { session: session.clone(), text } });
                        note = Some(format!("message sent to {device}; the ack shows below"));
                    }
                    ui.mode = Mode::List;
                }
                KeyCode::Esc => ui.mode = Mode::List,
                KeyCode::Backspace => {
                    buf.pop();
                }
                KeyCode::Char(c) if buf.chars().count() < 4000 => buf.push(c),
                _ => {}
            },
            Mode::Blob { scroll } => match code {
                KeyCode::Char('j') | KeyCode::Down => *scroll += 1,
                KeyCode::Char('k') | KeyCode::Up => *scroll = scroll.saturating_sub(1),
                KeyCode::PageDown | KeyCode::Char(' ') => *scroll += 20,
                KeyCode::PageUp => *scroll = scroll.saturating_sub(20),
                KeyCode::Char('g') | KeyCode::Home => *scroll = 0,
                KeyCode::Esc | KeyCode::Char('q') => ui.mode = Mode::List,
                _ => {}
            },
            Mode::List => match (code, row) {
                (KeyCode::Esc | KeyCode::Char('q') | KeyCode::Char('D'), _) => {
                    self.overlay = Overlay::None;
                    return;
                }
                (KeyCode::Tab | KeyCode::Right | KeyCode::Char('L'), _) => ui.cycle(&view, true),
                (KeyCode::BackTab | KeyCode::Left | KeyCode::Char('H'), _) => ui.cycle(&view, false),
                (KeyCode::Char('j') | KeyCode::Down, _) => {
                    ui.cursor = (ui.cursor + 1).min(all.len().saturating_sub(1));
                    ui.key = all.get(ui.cursor).map(Row::key);
                }
                (KeyCode::Char('k') | KeyCode::Up, _) => {
                    ui.cursor = ui.cursor.saturating_sub(1);
                    ui.key = all.get(ui.cursor).map(Row::key);
                }
                (KeyCode::Char('r'), _) => {
                    requests.push(Request::SyncNow);
                    note = Some("syncing: republished here and asked every device to".into());
                }
                (KeyCode::Char('A'), _) => requests.push(Request::SetAway(!view.away)),
                (KeyCode::Char('m') | KeyCode::Enter, Some(Row::Session { device, id, injectable, via_mod })) => {
                    if injectable {
                        ui.mode = Mode::Compose { device, session: id, via_mod, buf: String::new() };
                    } else {
                        note = Some("that session has no terminal or mod to send input through".into());
                    }
                }
                (KeyCode::Char(c @ ('d' | 'l' | 'g')), Some(Row::Session { device, id, .. })) => {
                    let what = match c {
                        'd' => FetchWhat::Diff,
                        'l' => FetchWhat::Log,
                        _ => FetchWhat::Subagents,
                    };
                    requests.push(Request::To { device, body: Body::Fetch { session: id, what } });
                    ui.mode = Mode::Blob { scroll: 0 };
                }
                (KeyCode::Char('a') | KeyCode::Enter, Some(Row::Request { device, req })) if req.kind != "question" => {
                    requests.push(Request::To { device: device.clone(), body: Body::Answer { request: req.id, answer: Answer::Allow } });
                    note = Some(format!("allowed on {device}"));
                }
                (KeyCode::Char('x'), Some(Row::Request { device, req })) => {
                    let answer = Answer::Deny { reason: format!("denied from {}", view.me) };
                    requests.push(Request::To { device: device.clone(), body: Body::Answer { request: req.id, answer } });
                    note = Some(format!("denied on {device}"));
                }
                (KeyCode::Char(c), Some(Row::Request { device, req })) if req.kind == "question" && c.is_ascii_digit() => {
                    let i = (c as usize).wrapping_sub('1' as usize);
                    if let Some(label) = req.questions.first().and_then(|q| q.options.get(i)) {
                        note = Some(format!("answered '{label}' on {device}"));
                        let answer = Answer::Choose { labels: vec![label.clone()] };
                        requests.push(Request::To { device, body: Body::Answer { request: req.id, answer } });
                    }
                }
                _ => {}
            },
        }
        if let Some(h) = &self.sync {
            for r in requests {
                h.request(r);
            }
        }
        if let Some(n) = note {
            self.set_status_info(n);
        }
    }
}
</script>
<script type="text/plain" class="doc" id="d55" data-group="The nerve mod" data-title="nerve/hooks/register.js" data-path="mod/nerve/hooks/register.js">// nerve mod: connects this Claude session to the local nerve sync agent.
//
// The agent listens on a Unix socket (path in ../nerve.json, written by
// `nerve setup`). This module long-polls it for prompts sent from your
// other devices, offers it permission prompts and questions to answer
// remotely, and reports each turn. When no agent is running every hook
// falls through to Claude Code's normal behaviour.
//
// Protocol: src/sync/modhub.rs. Experiments: research/sync/experiments
// (E17-E22).

const VERSION = '0.1.0'
let sock = ''
let sid = ''
let online = false
let lastStatus = ''
// Tool calls whose permission flow has ended (allowed, denied or run),
// newest last. Claude doesn't abort a PermissionRequest hook when the
// user answers its dialog here (E21), so the hook looks for its call in
// this list instead.
const settled = []

function sameCall(tool, input, e) {
  return e.tool === tool && Object.keys(input || {}).every((k) => JSON.stringify(e[k]) === JSON.stringify(input[k]))
}

async function call($, method, path, body) {
  const r = await $.http.fetch('http://nerve' + path, {
    method,
    socketPath: sock,
    headers: { 'content-type': 'application/json' },
    body: body ? JSON.stringify({ sid, ...body }) : undefined,
  })
  return JSON.parse(r.text || '{}')
}

function newId() {
  let s = ''
  for (let i = 0; i < 16; i++) s += Math.floor(Math.random() * 16).toString(16)
  return s
}

async function loadConfig($) {
  try {
    const cfg = JSON.parse(await $.fs.read($.plugin.root + '/nerve.json'))
    sock = cfg.socket || ''
  } catch {
    sock = ''
  }
}

// One round of the command loop; returns how long to wait before the next.
async function pump($) {
  if (!sock) return 5000
  try {
    if (!online) {
      await call($, 'POST', '/v1/hello', { cwd: await $.session.cwd(), surface: await $.session.surface(), version: VERSION })
      online = true
    }
    const got = await call($, 'GET', '/v1/poll?sid=' + encodeURIComponent(sid))
    if (got.status !== undefined && got.status !== lastStatus) {
      lastStatus = got.status
      $.ui.status(got.status)
    }
    for (const c of got.cmds || []) {
      if (c.t !== 'prompt') continue
      try {
        // Queued by Claude Code while a turn runs; starts at once when idle.
        await $.prompt.submit({ text: c.text, asUser: true })
        await call($, 'POST', '/v1/ack', { cmd: c.id, ok: true, msg: 'submitted to the session' })
      } catch (err) {
        await call($, 'POST', '/v1/ack', { cmd: c.id, ok: false, msg: String(err) })
      }
    }
    return 10
  } catch {
    // Agent not running (or restarting): try again shortly.
    online = false
    return 3000
  }
}

// Register a prompt with the agent and wait for a remote answer until
// `localDone()` says it was answered here. The wait happens inside
// `$.http.fetch` (the agent's /v1/wait long-poll): a hook has 10 s of its
// own time, a `$.clock.sleep` would spend it and a fetch in flight doesn't
// (E21). Each wait returns within 2 s, so a local answer is noticed fast.
async function remote($, kind, tool, input, localDone, maxWaits) {
  if (!online) return { kind: 'none' }
  const id = newId()
  try {
    await call($, 'POST', '/v1/request', { id, kind, tool, input })
  } catch {
    return { kind: 'none' }
  }
  for (let i = 0; i < maxWaits && !localDone(); i++) {
    let r
    try {
      r = await call($, 'GET', '/v1/wait?sid=' + encodeURIComponent(sid) + '&id=' + id)
    } catch {
      return { kind: 'none' }
    }
    if (r.answer) return { kind: 'remote', answer: r.answer }
    if (r.gone) return { kind: 'none' }
  }
  await call($, 'POST', '/v1/resolved', { id }).catch(() => {})
  return { kind: 'local' }
}

export function register(on) {
  on('session.start', async ($, e, next) => {
    const r = await next(e)
    sid = await $.session.id()
    await loadConfig($)
    const loop = async () => {
      const wait = await pump($)
      $.clock.after(wait, loop)
    }
    $.clock.after(10, loop)
    return r
  })

  // Every tool call passes through here, around Claude's permission check
  // and the tool itself: once `next` returns, any dialog for it is gone.
  on('tool.call', async ($, e, next) => {
    try {
      return await next(e)
    } finally {
      settled.push({ at: Date.now(), e })
      while (settled.length > 50 || (settled.length && Date.now() - settled[0].at > 600_000)) settled.shift()
    }
  })

  // Permission prompts: Claude shows its dialog while this hook waits, so
  // whichever answer comes first wins. A remote one is returned here; a
  // local one shows up as the call settling (E19, E21).
  on('classic.PermissionRequest', async ($, e, next) => {
    if (e.tool_name === 'AskUserQuestion' || !online) return next(e)
    const since = Date.now()
    const answeredHere = () => next.signal.aborted || settled.some((s) => s.at >= since && sameCall(e.tool_name, e.tool_input, s.e))
    const r = await remote($, 'permission', e.tool_name, e.tool_input, answeredHere, 300)
    if (r.kind !== 'remote') return next(e)
    const a = r.answer || {}
    if (a.kind === 'allow') return { decision: { behavior: 'allow' } }
    return { decision: { behavior: 'deny', message: a.reason || 'Denied from another device.' } }
  }).catch(($, e, next) => next(e))

  // Questions: Claude's own dialog runs (and stays on screen) while a
  // remote answer is awaited; whichever comes first is used (E20).
  on('tool.call', { tool: 'AskUserQuestion' }, async ($, e, next) => {
    if (!online) return next(e)
    const { tool, tool_use_id, consent, ...input } = e
    let answeredHere = false
    const native = next(e).then((r) => {
      answeredHere = true
      return r
    })
    const r = await Promise.race([
      native.then(() => ({ kind: 'local' })),
      remote($, 'question', 'AskUserQuestion', input, () => answeredHere, 900),
    ])
    if (r.kind !== 'remote') return native
    const labels = (r.answer && r.answer.labels) || []
    const answers = {}
    ;(input.questions || []).forEach((q, i) => {
      if (labels[i] !== undefined) answers[q.question] = labels[i]
    })
    return { result: { questions: input.questions, answers } }
  }).catch(($, e, next) => next(e))

  on('turn.start', async ($, e, next) => {
    if (online) call($, 'POST', '/v1/event', { kind: 'turn.start' }).catch(() => {})
    return next(e)
  })

  on('turn.complete', async ($, e, next) => {
    const r = await next(e)
    if (online) call($, 'POST', '/v1/event', { kind: 'turn.complete', reason: e.reason, ms: e.durationMs, usage: e.usage }).catch(() => {})
    return r
  })
}
</script>

<script>
(() => {
  const docs = [...document.querySelectorAll('script.doc')].map(el => ({
    group: el.dataset.group, title: el.dataset.title, path: el.dataset.path, text: el.textContent,
  }));
  const byPath = new Map(docs.map(d => [d.path, d]));
  const nav = document.getElementById('nav');
  const main = document.getElementById('main');
  const built = document.getElementById('built');
  document.getElementById('builtline').textContent = built ? built.textContent : '';

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slug = s => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');

  function resolve(base, rel) {
    const parts = base.split('/').slice(0, -1);
    for (const p of rel.split('/')) {
      if (p === '..') parts.pop(); else if (p && p !== '.') parts.push(p);
    }
    return parts.join('/');
  }

  let current = '';
  function link(text, url) {
    const [file, frag] = url.split('#');
    if (file && !/^[a-z]+:/i.test(file)) {
      for (const cand of [resolve(current, file), file, 'research/sync/' + file]) {
        if (byPath.has(cand)) return `<a href="#${esc(cand)}${frag ? '::' + frag : ''}">${text}</a>`;
      }
    }
    if (!file && frag) return `<a href="#${esc(current)}::${frag}">${text}</a>`;
    return `<a href="${url}" target="_blank" rel="noopener">${text}</a>`;
  }

  function inline(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => link(t, u));
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
  }

  const isList = l => /^\s*([-*+]|\d+\.)\s+/.test(l);
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const startsBlock = l => /^(#{1,6}\s|```|>|\|)/.test(l) || /^(-{3,}|\*{3,})\s*$/.test(l);
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, '|')));

  function renderList(lines) {
    const base = lines[0].match(/^\s*/)[0].length;
    const ordered = /^\s*\d+\./.test(lines[0]);
    const items = [];
    let cur = null;
    for (const l of lines) {
      const m = l.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
      if (m && m[1].length <= base) { cur = [m[3]]; items.push(cur); }
      else if (cur) { const ind = l.match(/^\s*/)[0].length; cur.push(l.slice(Math.min(ind, base + 4))); }
    }
    const tag = ordered ? 'ol' : 'ul';
    return `<${tag}>` + items.map(it => {
      let h = blocks(it);
      const m = h.match(/^<p>([\s\S]*?)<\/p>([\s\S]*)$/);
      if (m && !m[2].includes('<p>')) h = m[1] + m[2];
      return '<li>' + h + '</li>';
    }).join('') + `</${tag}>`;
  }

  function blocks(lines) {
    let out = '';
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = l.match(/^\s*```(.*)$/))) {
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
      } else if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {
        const h = inline(m[2]);
        out += `<h${m[1].length} id="${slug(h)}">${h}</h${m[1].length}>`;
        i++;
      } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) {
        out += '<hr>'; i++;
      } else if (l.trim().startsWith('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const head = cells(l);
        i += 2;
        let body = '';
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          body += '<tr>' + cells(lines[i]).map(c => `<td>${c}</td>`).join('') + '</tr>';
          i++;
        }
        out += '<table><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
      } else if (/^\s*>/.test(l)) {
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
        out += '<blockquote>' + blocks(buf) + '</blockquote>';
      } else if (isList(l)) {
        const buf = [l];
        i++;
        while (i < lines.length) {
          const n = lines[i];
          if (isList(n) || (/^\s+\S/.test(n))) { buf.push(n); i++; continue; }
          if (!n.trim()) {
            const next = lines[i + 1] || '';
            if (isList(next) || /^\s+\S/.test(next)) { buf.push(n); i++; continue; }
            break;
          }
          if (buf[buf.length - 1].trim() && !startsBlock(n)) { buf.push('  ' + n); i++; continue; }
          break;
        }
        out += renderList(buf);
      } else {
        const buf = [];
        while (i < lines.length && lines[i].trim() && !startsBlock(lines[i]) && !(buf.length && isList(lines[i]))) buf.push(lines[i++].trim());
        out += '<p>' + inline(buf.join(' ')) + '</p>';
      }
    }
    return out;
  }

  function show(path, frag) {
    const d = byPath.get(path) || docs[0];
    current = d.path;
    nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.path === d.path));
    const header = `<div class="path">${esc(d.path)}</div>`;
    if (d.path.endsWith('.html')) {
      main.innerHTML = header;
      const f = document.createElement('iframe');
      f.title = d.title;
      // <base>: relative links inside an embedded page resolve against
      // the page's own folder rather than about:srcdoc.
      const dir = d.path.split('/').slice(0, -1).join('/');
      const depth = 'research/sync/site'.split('/').length;
      const base = '../'.repeat(depth) + (dir ? dir + '/' : '');
      f.srcdoc = d.text.replace(/<head>/i, `<head><base href="${base}">`);
      // In-page links (#section) need the document's own URL, not <base>.
      f.addEventListener('load', () => {
        const doc = f.contentDocument;
        if (!doc) return;
        doc.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', ev => {
          const t = doc.getElementById(a.getAttribute('href').slice(1));
          if (t) { ev.preventDefault(); t.scrollIntoView(); }
        }));
      });
      main.appendChild(f);
    } else if (d.path.endsWith('.md')) {
      main.innerHTML = header + blocks(d.text.replace(/\r/g, '').split('\n'));
    } else {
      main.innerHTML = header + `<h1>${esc(d.title)}</h1><pre><code>${esc(d.text)}</code></pre>`;
    }
    const target = frag && document.getElementById(frag);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }

  let group = '';
  for (const d of docs) {
    if (d.group !== group) {
      group = d.group;
      const h = document.createElement('h2');
      h.textContent = group;
      nav.appendChild(h);
    }
    const a = document.createElement('a');
    a.href = '#' + d.path;
    a.textContent = d.title;
    a.title = d.path;
    a.dataset.path = d.path;
    nav.appendChild(a);
  }

  document.getElementById('q').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    nav.querySelectorAll('a').forEach(a => {
      const d = byPath.get(a.dataset.path);
      a.style.display = !q || d.title.toLowerCase().includes(q) || d.text.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  const route = () => {
    const [path, frag] = decodeURIComponent(location.hash.slice(1)).split('::');
    show(path, frag);
  };
  window.addEventListener('hashchange', route);
  route();
})();
</script>
