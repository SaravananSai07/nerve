| offchain.pub | strfry 1.1.0 | 131,072 | 20 | 40, 70, **77** |
| relay.snort.social | memlay 0.2.0 | 524,288 | 300 | 1, 9, 11 only; `idle_timeout: 10` |
| nostr.wine (paid) | custom | 524,288 | 50 | 40, **42**, 70; `payment_required`, admission 18,888,000 msat (about 18.9k sats) |
| auth.nostr1.com | strfry | 262,200 | 80 | **42**, 77, 17; `auth_required: true` |
| relay.nostr.band | n/a | n/a | n/a | Timed out |

- **relay.nostr.band** is widely reported as down or abandoned, and clients have been replacing it ([search results](https://github.com/vitorpamplona/amethyst)) **[UNVERIFIED in detail]**. Do not use it.
- **Rate limits** are not advertised in NIP-11 by these relays. strfry has configurable per-connection limits; plan for `rate-limited:` OK responses and back off. **[UNVERIFIED]** I have no exact figures.
- **Ephemeral events:** strfry forwards ephemeral events to live subscribers and keeps them only briefly (`ephemeralEventsLifetimeSeconds = 300`). It rejects them if they are more than 60 seconds old. I did not publish test events to public relays, because that would be posting publicly.
- **Kind 1059 acceptance:** relays that support NIP-17 accept it (Damus advertises 59). Some messaging relays restrict it: one report says White Noise's relays refuse REQs for 21059 and cap filters per REQ **[UNVERIFIED]**.
- **Kind 4 (NIP-04)** is advertised by every strfry relay. It is deprecated; do not use it.
- **Reliability:** public relays are free and best-effort. Any of them can drop you, rate-limit you or prune data.
- **Recommendation:**
  1. Write to two or three relays.
  2. One of them should be either a paid or AUTH-required relay, or your own relay on the Pi that is publicly reachable over WSS (for example behind Cloudflare Tunnel, which needs only outbound connectivity from the Pi).
  3. Dedupe by event id on receipt.

### 3.2 Metadata leakage

Relays see:
- your IP;
- connection timing;
- event kinds;
- `created_at`;
- tag values (`p`, `d`, custom tags);
- ciphertext sizes (bucketed by padding);
- the author pubkey, unless gift-wrapped.

A third party subscribed to the same relay sees everything except your IP. A custom kind such as `25xxx` also fingerprints "this is nerve traffic".

**Mitigations:**
1. NIP-44 for all content.
2. NIP-59 or 21059 wraps, so the author is hidden behind a throwaway key.
3. Opaque `d` tags (HMAC of the session id with a fleet secret).
4. AUTH relays that serve events only to the author or recipient (NIP-42, plus the NIP-78 and NIP-59 guidance).
5. NIP-70 `["-"]`, to block rebroadcast.
6. A self-hosted relay, so IPs go only to you.
7. Optionally Tor or a SOCKS proxy (`nostr_sdk::proxy`).

## 5. NAT traversal and latency

- **No inbound connectivity needed.** NIP-01 is a client-to-relay WebSocket protocol, and both the agent host and the controller are clients that dial out. That works behind CGNAT, mobile carriers and hotel Wi-Fi. A relay on the Pi is the only thing that needs to be reachable, and a tunnel can make it reachable without opening inbound ports.
- **Latency.** A message costs sender → relay plus relay → subscriber over already-open sockets, with no extra handshake per message.
  - Measured from this Mac to Damus, nos.lol, Primal and nostr.mom: TCP connect about 0.19–0.23 s and TLS about 0.26–0.48 s. That is one-time setup cost.
  - Steady-state one-way delivery should be roughly two relay-path RTT halves plus relay processing. My estimate is about 100–400 ms on public relays. **[UNVERIFIED]** I found no rigorous benchmark.
  - A Pi relay on the LAN gives LAN latency when both peers are home.
- **Keepalive.** Mobile networks and some relays (snort's `idle_timeout: 10`) close idle sockets. Send pings and re-subscribe with `since` and negentropy after a reconnect.
- **Sync ordering.** Clock skew matters: strfry rejects events stamped more than 900 seconds in the future, and ephemeral events older than 60 seconds.

## 6. Mobile clients

- **Android:**
  - Amethyst has an always-on notification relay service ([PR #4373](https://github.com/vitorpamplona/amethyst/pull/4373)) and supports NIP-17. If nerve sends questions and alerts as NIP-17 DMs to the user's personal npub, the user can answer from Amethyst or 0xchat with no custom app.
  - Pokey ([repo](https://github.com/KoalaSat/pokey)) provides "pull notifications": it holds relay sockets and raises Android notifications. 56 stars, last push 2025-07.
- **iOS:** apps cannot keep WebSockets open in the background, so push needs a server.
  - Damus uses [notepush](https://github.com/damus-io/notepush), a relay that sends to APNs with NIP-98 auth. It is marked "WIP! Experimental!".
  - The generic route is the NIP-9a draft: a kind 30390 registration and an HTTP callback to your own FCM, APNs or VAPID gateway.
  - Without either, the iOS user sees updates only when the app is open.
- **PWA:** use `nostr-tools` (npm 2.25.2) for live view while the page is open. For background, use Web Push (VAPID) fed by a small service on the Pi that subscribes to the relay and forwards. The Pi can do this because it is always on. **This is likely the cheapest cross-platform "approve permission prompt" path.**

## 7. Recommended event design for nerve

### 7.1 Keys and encryption model

- **Device keys:** each device (Mac, Pi, phone) has its own keypair, stored in the OS keychain or a `0600` file under the nerve config directory.
- **Fleet roster:** a **fleet roster** event lists the authorised device pubkeys, with names and capabilities. It is signed by a root key, which can live in a NIP-46 signer on the phone. Devices accept commands only from pubkeys in the latest roster.
- **Encryption:** NIP-44 per recipient. With fewer than 5 devices, encrypt each message separately to each target.
  - Alternative: a shared fleet key that every device holds. Simpler, but compromising one device exposes all traffic.
- **Hiding sender and receiver:** wrap commands in 21059 (live) or 1059 (durable).
- **Relay set:** a NIP-65-style relay list kept in the roster.
- **Kind collisions:** the custom kinds below are illustrative. Check them against [registry-of-kinds](https://github.com/nostr-protocol/registry-of-kinds).
- **Common tags:** every event carries `["-"]` (NIP-70) where the relay supports it, and a protocol version tag, `["v","1"]`.

### 7.2 Event kinds

| Purpose | Kind (class) | Addressing / tags | Content (NIP-44) | Lifetime |
|---|---|---|---|---|
| Fleet roster | 30078 (addressable) | `d`=`nerve:fleet`; signed by root | `{devices:[{pub,name,caps,relays}]}`, encrypted to each device or to self | Durable |
| Device presence (state) | 30078 | `d`=`nerve:dev:<hmac(id)>`, `expiration`=now+3×interval | `{host, os, caps:{gpu,arch,ram,tools}, load, sessions:n, nerve_ver}` | Replaced every 30–60 s |
| Heartbeat (cheap) | 25500 (ephemeral) | `p`=fleet, or none | Tiny ping with seq | Not stored |
| Session snapshot | 30078 (or custom 30500) | `d`=`nerve:sess:<hmac(session_id)>`, `expiration` once ended | `{state, cwd, branch, model, tokens, last_tool, pending_question_id, subagents:[...]}` | Latest only; refresh on change |
| Progress stream | 21059 wrapping a rumor of kind 25501, or bare 25501 if you accept visible authors | `p`=target viewer(s), `s`=opaque session tag | `{seq, ts, delta:[...]}`; the receiver detects gaps by `seq` and re-reads the snapshot | Ephemeral; strfry drops after 300 s, rejects if more than 60 s old |
| Command / instruction | 1059 wrapping a rumor of kind 4501 (durable), or 21059 (live-only) | Wrap `p`=target device; rumor tags `e`/`s`, `expiration`=now+1 h | `{cmd:"send_input"\|"interrupt"\|"approve"\|..., session, payload, nonce}` | Durable until expiry, so an offline device picks it up |
| Command ack / result | 1059 → rumor 4502 | `e`=command rumor id | `{ok, error?, output_ref?}` | 1 h–1 d |
| Question (permission or ask) | 1059 → rumor 4503, plus a mirrored NIP-17 kind 14 DM to the user's npub for stock clients | `s`, `q` id, `expiration`=question timeout | `{qid, tool, input_summary, options:["allow","deny","allow_always"], diff_ref?}` | Until answered or expired |
| Answer | 1059 → rumor 4504 | `e`=question id | `{qid, choice, text?}`; the first valid answer wins, others are acked as "already answered" | Short |
| Diff / subagent payload | Blossom blob (encrypted locally) referenced from 4505, or chunked rumors `{chunk:i/n, sha256}` | `e`=parent | `{url, sha256, key, nonce, mime}` | Durable; delete with NIP-09 |
| Handoff | 1059 → rumor 4506 (offer), 4507 (accept), 4508 (complete) | `e` chain | Offer: `{session, transcript_ref (Blossom), git:{remote,branch,sha}, cwd_hint}`. The target pulls, resumes (`claude --resume` with the imported transcript **[UNVERIFIED]**), then publishes a new snapshot; the source marks the old snapshot `state:"handed_off"` | Durable |
| Job request | 1059 → rumor 5500 (pattern borrowed from NIP-90) | `["req_caps","arch=arm64","gpu"]` and similar, `expiration` | `{job_id, spec, repo, prompt, constraints}` broadcast to all capable devices | Durable until claimed or expired |
| Job claim | 1059 → rumor 5501 | `e`=request | `{job_id, device, eta}` | Short |
| Job feedback | 7000-style status (`processing` / `partial` / `error` / `success`) as rumor 5502 | `e`=request | NIP-90 status vocabulary | Short |
| Job result | 1059 → rumor 6500 | `e`=request | `{job_id, summary, artifacts:[blossom refs]}` | Durable |

### 7.3 Claim arbitration

Relays give no compare-and-swap, so use one of these:
- **(a) Coordinator:** a single coordinator (for example the always-on Pi) issues an `assign` event. **Simplest and deterministic.**
- **(b) Deterministic tie-break:** collect claims for N seconds and award the job to the lowest `hash(job_id ‖ device_pub)` among claimants. Every device computes the same winner.

I recommend (a), with (b) as fallback.

### 7.4 Large payloads

- Keep each event at or below 60 KiB after base64. That fits strfry's 64 KiB default and nos.lol's 128 KB.
- For more, use encrypted Blossom blobs, or chunk following the CEP-22 approach (`seq/total` plus a final hash).

### 7.5 Catch-up after offline

- Use `REQ` with `since=last_seen` on the wrapped kinds addressed to me (`#p`).
- Use NIP-77 negentropy where the relay supports it.
- Re-read all `nerve:sess:*` snapshots.

### 7.6 Implementation note for nerve's architecture

- Run `nostr-sdk` in its own tokio thread, the "sync worker". It feeds the existing state model the same way the discovery worker does.
- Inbound fields such as hostnames, session titles and transcript snippets must be wrapped in `Sanitised`.
- Before acting on any inbound `interrupt` or `kill` command, re-validate the PID as the CLAUDE.md rule requires.
- Treat remote command execution as a security boundary: allowlist the roster pubkeys, enforce expiry, and dedupe nonces.

<script type="text/plain" class="doc" id="d8" data-group="Surveys" data-title="48 alternatives" data-path="research/sync/reports/02-alternatives-survey.md"># Alternatives to Nostr for syncing nerve across Mac, Raspberry Pi and Android
*Research date: 2026-10-09. Crate versions, release dates and MSRVs come from the crates.io API, queried today. Other claims come from vendor docs or my own knowledge, and are marked "(unverified)" where I did not re-check them today.*
---
## 0. Two findings that change the framing
**1. Claude Code already has a first-party cross-device feature.** It is called Remote Control, and it covers several of nerve's requirements. `claude remote-control`, or `/remote-control`, connects a local session to claude.ai/code and to the Claude iOS and Android apps. From there you can:
- watch progress, including subagents and workflows;
- send messages;
- answer permission prompts and `AskUserQuestion` dialogs, which stay open until you answer them;
- attach files.
How it connects:
- The local process "makes outbound HTTPS requests only and never opens inbound ports". All traffic goes through the Anthropic API over TLS.
- It needs a Pro, Max, Team or Enterprise subscription. API-key authentication is not supported.
- Server mode can run several sessions from one process.
Source: https://code.claude.com/docs/en/remote-control
What it does **not** cover:
- device-to-device session handoff with git working state;
- per-device sync status;
- placing jobs on devices by capability;
- self-hosting, or working offline from Anthropic;
- traffic that never leaves your own devices. Anthropic routes everything, so this is not end-to-end encryption in the self-hosted sense.
**Recommendation:** nerve should *complement* Remote Control (fleet view, handoff, job placement, diffs) rather than rebuild phone steering. Where a session already has Remote Control on, nerve could offer a "deep link into Remote Control" path.
**2. MSRV is a hard constraint.** nerve's MSRV is 1.85. Most of the serious networking crates now need more:
| Crate | Minimum Rust |
|---|---|
| iroh 1.3.0 | 1.91 |
| libp2p 0.57 | 1.88 |
| async-nats 0.50 | 1.88 |
| matrix-sdk 0.19 | 1.96 |
| automerge 0.12 | 1.90 |
| tailscale (tailscale-rs) 0.6.1 | 1.92 |
| rmcp 3.5 | 1.88 |
| agent-client-protocol 3.3 | 1.88 |
| redis 1.7 | 1.88 |
| magic-wormhole 0.8 | 1.92 |
These fit within 1.85: nostr-sdk 0.45.4 (1.85), str0m 0.24 (1.85), quinn 0.11.12 (1.85), tokio-tungstenite 0.30 (1.85), axum 0.8.9 (1.80), zenoh 1.10.1 (1.75) and rumqttc 0.25.1 (1.64).
So either:
- the sync layer goes in a **separate binary or crate** (for example a `nerve-sync` daemon) with its own MSRV, or
- nerve raises its MSRV to about 1.91.
The Nostr design under evaluation fits the current MSRV. Most alternatives do not.
---
## 1. Survey (40 options)
### A. P2P / QUIC
**1. iroh** (n0). QUIC connections addressed by public key ("dial keys, not IPs").
- **Connectivity:** hole punching first; falls back to relays (HTTPS/WebSocket over 443). The relay never sees plaintext; the key is never sent to it.
- **Status:** 1.0 shipped 2026-06-15. Now `iroh` 1.3.0 (2026-09-28, MSRV 1.91).
- **Public relays:** free, rate-limited, "hobby use"; only the latest stable release is officially supported. Relays for v0.9x and 1.0-rc builds were scheduled to stop on 2026-09-30, and 0.35x on 2026-12-31. Public-relay users are forced onto a treadmill of iroh upgrades.
- **Self-hosting:** run `iroh-relay` yourself. A Pi works, but it needs a public port or tunnel; n0 says one relay handles about 60k connections.
- **Offline:** no store-and-forward.
- **Mobile/browser:** FFI bindings for Swift and Kotlin exist (unverified current state); there is a WASM/browser build that is relay-only (unverified).
- **Fit:** (a) excellent; (b) excellent; (c) via iroh-docs; (d) excellent via iroh-blobs.
- **Sources:** https://www.iroh.computer/blog/v1 · https://docs.iroh.computer/concepts/relays · https://docs.iroh.computer/iroh-services/relays/public
**2. iroh-gossip** 0.101.0 (2026-06-15, MSRV 1.91). Epidemic broadcast trees (HyParView/PlumTree) per topic over iroh. Good for fan-out of progress events. Still pre-1.0, unlike core iroh.
**3. iroh-docs** 0.101.0. Multi-writer key-value replicas (range-based set reconciliation, Willow-inspired) with blob references. A fit for durable state such as session index and device status. Pre-1.0; n0 has signalled less focus on it than on core (unverified).
**4. iroh-blobs** 0.103.1 (2026-10-06). BLAKE3-verified, resumable, content-addressed transfer. An ideal fit for transcripts, diffs and git bundles. `sendme` 0.36 is a CLI built on it.
**5. rust-libp2p** 0.57.0 (2026-09-11, MSRV 1.88).
- **Connectivity:** TCP/QUIC/WebRTC/WebTransport. Circuit Relay v2 (`libp2p-relay` 0.22) plus DCUtR hole punching (`libp2p-dcutr` 0.15). You must run your own relay, which needs a public address. Kademlia/mDNS for discovery.
- **Messaging:** gossipsub (`libp2p-gossipsub` 0.50) for pub/sub.
- **Encryption:** Noise/TLS on links; no application-level offline store.
- **Mobile:** Kotlin and Swift exist via other implementations; a Rust FFI build is DIY.
- **Assessment:** powerful but heavy. For three personal devices it is a lot of machinery compared with iroh.
- https://github.com/libp2p/rust-libp2p
**6. Holepunch** (Hypercore / Hyperswarm / HyperDHT / Pear / Bare).
- **Connectivity:** a DHT handles hole punching, including the "random NAT" case; DHT nodes can relay.
- **Data:** Hypercore append-only logs with Noise encryption. Store-and-forward only if some peer stays online (a "blind peer" or seeder).
- **Mobile:** strong. The Bare runtime runs on iOS and Android, and Keet ships on it.
- **Rust:** `hypercore` 0.16.0 (datrs, 2026-08-07) is maintained. `hyperswarm` 0.1.0 (2026-06-19) is brand new, with 6 downloads. The ecosystem is JavaScript-first, so nerve would effectively need a Node or Bare sidecar.
- https://docs.pears.com · https://github.com/datrs/hypercore
**7. Veilid.** Privacy-first, onion-routed P2P application framework with a DHT and private routes; no ports needed.
- **Crate:** `veilid-core` 0.5.7 (2026-07-19, MSRV 1.89). Flutter bindings for mobile.
- **Assessment:** high latency, small community (2.8k recent downloads). Better suited to anonymity than to a fleet dashboard.
- https://veilid.com
**8. Willow / Earthstar.** Willow is a family of specs for path-addressed, capability-secured (Meadowcap) data with range sync; Earthstar is moving onto it.
- **Crates:** `willow25` 0.7.9 and `willow-data-model` 0.8.0 (Codeberg, worm-blossom); about 1–2k downloads.
- **Transport:** you bring your own (iroh is a natural pairing).
- **Assessment:** elegant but early; no mobile story yet.
- https://willowprotocol.org
**9. Reticulum** (with LXMF messaging). A cryptographic mesh stack that runs over anything, including LoRa, TCP and I2P. LXMF propagation nodes provide store-and-forward. Mobile clients exist (Sideband, Python).
- **Rust:** two young ports: `reticulum` 0.1.0 (Beechat, 2025-10) and `reticulum-rs` / `lxmf` 0.13.0 (FreeTAKTeam, 2026-10-03, MSRV 1.85).
- **Internet use:** needs a reachable TCP transport node.
- **Assessment:** fascinating for off-grid use; overkill here.
- https://reticulum.network
**10. Yggdrasil.** Encrypted IPv6 overlay mesh in Go. You peer with public nodes over outbound TCP, so it works without WireGuard. Every device gets a stable IPv6 address, and nerve would just bind a socket.
- **Caveat:** it is a global network. You must firewall, because every Yggdrasil node can reach you.
- **Android:** app exists. No Rust crate of note (`yggdrasil` 0.1.0 dates from 2019).
- **Status:** still marked alpha.
- https://yggdrasil-network.github.io
**11. WebRTC datachannels.**
- **Crates:** `webrtc` (webrtc-rs) 0.21.0, 2026-09-19, MSRV unset; `str0m` 0.24.1, 2026-10-03, MSRV 1.85, sans-IO.
- **Connectivity:** ICE/STUN/TURN. Needs a signalling channel (this is where Nostr fits well) and a TURN server for symmetric NAT (coturn runs on a Pi but needs ports).
- **Strengths:** DTLS encryption built in; the **best browser and phone story**, because any mobile browser can join with no app.
- **Weaknesses:** no offline support. You assemble everything yourself.
- https://github.com/algesten/str0m · https://github.com/webrtc-rs/webrtc
**12. magic-wormhole / croc.** One-shot PAKE code-phrase transfers through a mailbox server and a transit relay; both can be self-hosted.
- **Crates:** `magic-wormhole` 0.8.1 (MSRV 1.92). croc is Go only.
- **Fit:** a UX pattern for pairing ("type this code on your phone"), not ongoing sync. Good inspiration for device enrolment.
- https://github.com/magic-wormhole/magic-wormhole.rs
**13. Syncthing.** Go block-level file sync.
- **Connectivity:** global discovery servers plus relays (both can be self-hosted); TLS with device-ID pinning; no inbound ports needed.
- **Mobile:** the Android app was discontinued upstream in late 2024; a community fork, "Syncthing-Fork", continues (unverified current state).
- **Rust:** none for the protocol; the `syncthing` 0.6 crate is only a REST client.
- **Fit:** honestly a viable *blob and transcript* layer. nerve writes snapshots to a folder and Syncthing ships them. Useless for commands or realtime.
- https://docs.syncthing.net
### B. Brokers and messaging
**14. MQTT** (Mosquitto, rumqttd, EMQX, NanoMQ). The classic option for the Pi: Mosquitto runs well there. Every client dials out to the broker, so only the broker needs reachability.
- **Rust:** `rumqttc` 0.25.1 (MSRV 1.64, but last release 2025-11-21, so slowing); `rumqttd` 0.20.0 (2025-09).
- **Strengths:** retained messages give "last-known state per device" for free; QoS 1/2 with persistent sessions gives limited store-and-forward; MQTT-over-WebSocket works in a phone browser; Android clients are plentiful.
- **Weaknesses:** TLS to the broker only, so payloads need your own end-to-end encryption; blobs are awkward (default maximum is about 256 MB, but it is not designed for blobs).
- **Fit:** (a) and (b) excellent; (c) fair; (d) poor.
- https://mosquitto.org · https://github.com/bytebeamio/rumqtt
**15. NATS + JetStream.** A single Go binary that is very Pi-friendly.
- **Leaf nodes:** a laptop can run a local leaf that bridges to the Pi hub when online and keeps working offline.
- **JetStream:** durable streams and consumers (store-and-forward), plus a KV store and an object store for blobs.
- **Rust:** `async-nats` 0.50.0 (2026-07-20, MSRV 1.88), 5.6M recent downloads, official.
- **Mobile/browser:** WebSocket via nats.ws.
- **Security:** TLS plus NKeys/JWT auth; no end-to-end encryption.
- **Assessment:** the most complete single brokered option. (a)(b)(c)(d) are all good; the object store handles transcripts.
- https://docs.nats.io/running-a-nats-service/configuration/leafnodes · https://github.com/nats-io/nats.rs
**16. Zenoh** (Eclipse). Pub/sub/query protocol with peer mode (multicast scouting on a LAN), client mode, and routers that you can chain.
- **Rust:** `zenoh` 1.10.1 (2026-09-07, **MSRV 1.75**). It is written in Rust natively.
- **Storage:** "storages" plugins with RocksDB/filesystem backends.
- **Mobile:** an Android/Kotlin binding exists, with reconnect and declaration restore in recent releases.
- **Connectivity:** routers need a reachable endpoint (or a Tailscale address); TLS/QUIC transports.
- **Assessment:** the best MSRV fit among the strong options. Learning curve is moderate.
- https://zenoh.io · https://github.com/eclipse-zenoh/zenoh-kotlin
**17. Redis Streams / Valkey.** `XADD`/`XREADGROUP` give durable logs with consumer groups; pub/sub is fine for realtime.
- **Rust:** `redis` 1.7.1 (MSRV 1.88).
- **Weaknesses:** no auth model you would expose to the internet, so it must sit behind Tailscale or a tunnel; no browser access without a bridge.
- **Assessment:** fine for the Pi on a tailnet; weak otherwise.
**18. ntfy** (+ UnifiedPush). An HTTP pub/sub notification server in Go; self-hosting on a Pi is trivial. It stores messages with a configurable cache time (store-and-forward) and supports SSE/WebSocket/JSON streams.
- **Android:** the ntfy app is a UnifiedPush distributor, so it gives real **push to the phone without Google**.
- **Encryption:** server-side; ntfy's end-to-end encryption feature is long-planned and not shipped (unverified).
- **Rust:** `ntfy` 0.9.1 (MSRV 1.85; publish client).
- **Fit:** (b) for phone wake-ups ("agent needs approval"). Not a sync layer.
- https://docs.ntfy.sh · https://unifiedpush.org
**19. Matrix.** Federated rooms with Megolm/Olm end-to-end encryption (`vodozemac` 0.11.1), store-and-forward via the homeserver, and excellent mobile clients (Element X).
- **Rust SDK:** `matrix-sdk` 0.19.1 (MSRV **1.96**).
- **Homeservers:**
  - conduwuit was archived in 2025.
  - **Continuwuity** is the community-run successor, currently v26.8.x.
  - **Tuwunel** is another fork with 0.5.x security releases.
  - Both are Rust and light enough for a Pi.
- **Device verification:** cross-signing, so you get end-to-end encryption to your own devices out of the box.
- **Assessment:** the "free phone UI" option. A bot posts progress to a room, and you reply `/approve 3`. Heavy SDK; federation adds attack surface (you can disable it).
- https://continuwuity.org · https://github.com/matrix-construct/tuwunel
**20. XMPP.** Mature; MUC and PubSub (XEP-0060), OMEMO end-to-end encryption, Prosody/ejabberd run on a Pi, and Android has Conversations.
- **Rust:** `tokio-xmpp` 6.0.0 / `xmpp` 0.7.0 (2026-06). Usable, but no OMEMO in Rust that I could confirm.
- **Assessment:** a phone-UI path like Matrix, with lighter servers and a weaker Rust story.
**21. SimpleX.** No user IDs; SMP relays (self-hostable) with store-and-forward and double-ratchet end-to-end encryption; good Android app.
- **Rust:** none of substance (`simplex-chat` 0.2.0, 2024; the core is Haskell). A bot needs the CLI over WebSocket.
- **Assessment:** privacy-excellent but integration-awkward.
- https://simplex.chat/docs/server.html
**22. Briar.** Tor/Bluetooth/Wi-Fi P2P messenger on Android; Briar Mailbox offers store-and-forward.
- **Assessment:** no Rust; Android-centric. Not a fit.
**23. Secure Scuttlebutt.** Append-only signed feeds with gossip via pubs. The ecosystem is largely dormant; `kuska-ssb` was last released 2022. **Not recommended.**
**24. Keet.** Holepunch's consumer app. It is not a library; you would use the Holepunch stack instead (#6).
**25. Signal protocol libraries.** `libsignal` (Signal's official, AGPL, not on crates.io; consumed via git). `vodozemac` is a better-maintained Olm/Megolm alternative. The `presage` Signal client (bot via linked device) is fragile and against Signal's terms in spirit.
- **Assessment:** only relevant for adding end-to-end encryption on top of a broker, where MLS (OpenMLS) or simple age/X25519 sealed boxes are simpler.
### C. CRDT and local-first sync
**26. Automerge.** JSON-like CRDT with compact binary history.
- **Crates:** `automerge` 0.12.0 (MSRV 1.90); `samod` 0.15.0 (2026-09-30), a Rust repo compatible with JS automerge-repo. `automerge-repo` 0.3 is stale; use samod.
- **Sync server:** a sync server exists (JS). The protocol is transport-agnostic and runs over WebSocket or iroh.
- **Fit:** (c) excellent for session metadata and job queues. History grows for append-heavy logs like transcripts, so keep those out.
- https://automerge.org · https://github.com/alexjg/samod
**27. Yjs / y-crdt.** `yrs` 0.28.0 (2026-09-17), 2M downloads, a JS-compatible port. `y-sweet` 0.9.1 is a standalone Rust Yjs server (2025-09, slowing).
- **Assessment:** best browser interop. Fit like Automerge.
**28. Loro.** Rust-native CRDT (text, list, map, tree, movable list) with a fast snapshot format.
- **Crates:** `loro` 1.16.2 (2026-09-21); `loro-protocol` 0.3 for sync.
- **Mobile:** Swift/Kotlin bindings via FFI (unverified depth).
- **Assessment:** strong technically; the sync-server story is younger.
**29. cr-sqlite / Corrosion.** cr-sqlite adds CRDT columns to SQLite. Its development slowed after the author joined Rocicorp (unverified current status), and it is not on crates.io as a crate.
- **Corrosion** (fly.io) is gossip-replicated SQLite built on cr-sqlite with SWIM/QUIC. It is designed for datacentre clusters; there is no mobile story. **Not a fit.**
- https://github.com/superfly/corrosion
**30. Electric SQL.** Postgres → shape streams over HTTP to clients. Needs Postgres (possible on a Pi, but heavy). Read-path sync only; you handle writes. Not a fit for a Rust daemon.
**31. PowerSync.** Postgres/Mongo/MySQL → SQLite on clients, with a self-hostable service.
- **Rust:** a new **experimental** `powersync` 0.1.0 (2026-09-28).
- **Assessment:** heavy for three personal devices.
**32. Ditto.** Commercial P2P database (BLE, LAN, Wi-Fi Aware, cloud) with excellent mobile SDKs.
- **Rust:** `dittolive-ditto` 5.1.0 (2026-10-08, MSRV 1.91).
- **Assessment:** licensing and pricing for a personal OSS tool is the blocker; closed source.
**33. Jazz / Triplit / Replicache / Zero.** All TypeScript-first.
- Jazz: `jazz-tools` 2.0.0-alpha on crates.io (Jazz 2 is moving to a Rust core).
- Triplit: company wound down in 2025 and open-sourced (unverified).
- Replicache is in maintenance in favour of Zero, which is Postgres-based.
- **Assessment:** none fit a Rust daemon today. Watch Jazz 2.
**34. CouchDB / PouchDB.** Battle-tested multi-master HTTP replication with offline support. CouchDB runs on a Pi, and PouchDB runs in a phone browser. Rust clients are thin (CouchDB is just HTTP). Revision-tree conflicts are manual.
- **Assessment:** viable for durable state; dated.
**35. Turso / libSQL embedded replicas.** `libsql` 0.9.30 (2026-06-02). Embedded replicas sync from a primary (sqld can be self-hosted). Turso is pivoting to its Rust rewrite ("Turso Database") with its own sync (unverified current state).
- **Assessment:** single-writer primary; OK for a Pi-hub model.
**36. Litestream / rqlite.**
- Litestream streams SQLite to S3/SFTP for backup and DR, not multi-device sync.
- rqlite is Raft SQLite over HTTP (`rqlite-rs` 0.6.2) and needs a quorum, which is wrong for intermittently connected laptops and phones.
- **Assessment:** neither fits.
### D. Overlay networks
**37. Tailscale** (+ tsnet, Serve, Funnel, Taildrop / `tailscale file`).
- **Connectivity:** WireGuard mesh, NAT traversal via DERP relays (no inbound ports), ACLs, MagicDNS.
- **Serve and Funnel:** Serve exposes `localhost:PORT` to the tailnet with automatic HTTPS. Funnel exposes it to the public internet.
- **Taildrop:** `tailscale file cp/get` moves blobs between devices.
- **Mobile:** excellent Android app.
- **Rust:**
  - `tailscale` 0.6.1 is the **official tailscale-rs**: "preview, experimental", monthly pre-1.0 releases, MSRV 1.92, talks to peers through DERP. Direct connections are in forks (unverified for upstream).
  - `libtailscale` 0.2.2 binds the Go tsnet library through C, which adds a Go toolchain to the build.
- **Assessment:** the simplest "everything just works" baseline. Nerve exposes plain HTTP + SSE/WebSocket on the tailnet.
- https://github.com/tailscale/tailscale-rs · https://tailscale.com/kb/1312/serve
**38. Headscale / NetBird / ZeroTier / Nebula / innernet.**
- **Headscale:** self-hosted Tailscale control server; it runs on a Pi, but the Pi then needs a public endpoint.
- **NetBird:** WireGuard mesh with a self-hostable management server, TURN, and an Android app.
- **ZeroTier:** its own L2 protocol rather than WireGuard; libzt SDK, root-server based, Android app.
- **Nebula:** Slack's certificate-based mesh. Needs a "lighthouse" with a public UDP port; mobile via Defined Networking's app.
- **innernet:** Rust and WireGuard, Linux/macOS only, no mobile, and it needs a reachable coordinator.
- **Assessment:** all deliver "IP connectivity, then use HTTP". None removes the need for *some* reachable node.
**39. Tunnels: Cloudflare Tunnel / ngrok / bore / frp.** Outbound-only tunnels publish the Pi's HTTP service on a public hostname.
- Cloudflare Tunnel is free; add Cloudflare Access for authentication. It terminates TLS at Cloudflare, so it is **not end-to-end encrypted**.
- ngrok has a free tier with limits.
- `bore-cli` 0.6.0 (Rust) and frp (Go) need your own VPS.
- **Assessment:** gives the phone a URL with no app installed. Pair it with application-layer encryption.
### E. Hosted realtime
**40. Cloudflare Durable Objects / PartyKit.** One stateful actor per room with WebSocket hibernation and built-in SQLite storage; PartyKit now lives inside Cloudflare.
- **Connectivity:** a Rust daemon connects out over WebSocket (`tokio-tungstenite`, MSRV 1.85).
- **Cost:** realistically about $0–5 a month for this volume.
- **Encryption:** not end-to-end unless you encrypt payloads.
- **Assessment:** a good "zero infra on the Pi" relay and mailbox, written in TypeScript or as a Rust→WASM worker (`worker` crate).
**41. Firebase RTDB / Supabase Realtime / PocketBase.**
- **Firebase:** FCM is the most reliable Android push. RTDB is fine, but Rust clients are unofficial (`firebase-rs`).
- **Supabase Realtime:** Postgres plus broadcast channels; self-hosting is heavy.
- **PocketBase:** a single Go binary with SQLite and SSE realtime that runs perfectly on a Pi, plus an admin UI. Rust SDK is stale (`pocketbase-sdk` 0.1.1, 2023), but the REST/SSE API is trivial to call.
- **Assessment:** PocketBase is a dark-horse "Pi hub" choice.
**42. Ably / Pusher.** Hosted pub/sub with history and presence; Rust SDKs are unofficial or limited. Listed for completeness; vendor lock-in for a personal tool.
### F. Agent-specific protocols
**43. A2A** (Agent2Agent).
- **Status:** v1.0 in March 2026 (1.0.1 in May); moved into the Linux Foundation's Agentic AI Foundation on 2026-08-17. IBM's older "ACP" (Agent Communication Protocol) was merged into A2A in 2025.
- **Protocol:** JSON-RPC/gRPC/REST over HTTP; Agent Cards (now signed) for capability discovery; tasks with streaming (SSE) and push notifications.
- **Rust:** `a2a-rs` 0.10.0 (community, MSRV 1.96).
- **Relevance:** the **Agent Card + task lifecycle model maps directly onto "job distribution by capability"**. It solves no NAT problem; it assumes HTTP reachability.
- https://a2a-protocol.org
**44. MCP** (streamable HTTP / remote MCP). `rmcp` 3.5.1 (official, MSRV 1.88). nerve could expose an MCP server ("list sessions", "send instruction", "get diff"), so *a Claude on device Y can steer device X*. Elicitation covers question prompts. It is a tool interface, not a sync layer, and it needs reachability (tailnet or tunnel).
**45. ContextVM.** MCP carried over Nostr events; `contextvm-sdk` 0.2.2 (MSRV 1.88). This is the natural bridge if the Nostr design wins: nerve as an MCP server reachable over relays with no ports. Young (226 downloads).
**46. ACP** (Agent Client Protocol, Zed). Editor ↔ agent JSON-RPC over stdio; `agent-client-protocol` 3.3.0 (released today). It is local, not network. **Relevant as the *session-control vocabulary*:** prompts, permission requests, tool-call updates and diffs. That is exactly nerve's command set, and could be tunnelled over any transport above.
- https://agentclientprotocol.com
**47. AG-UI.** Agent ↔ frontend event stream (SSE/WebSocket) with event types for text deltas, tool calls, state snapshots and deltas. `ag-ui` 0.4.5 (community, MSRV 1.85). A ready-made **schema for the progress stream to the phone UI**.
**48. Agent Network Protocol (ANP).** DID-based (did:wba) identity plus meta-protocol negotiation for open-internet agents. Mostly Python, no Rust crate, early. **Not relevant** for a single-owner fleet.

## 3. Top-6 shortlist
The target is a Rust TUI daemon on Mac and Pi, reachable from a phone.
**1. iroh (+ iroh-blobs, optionally iroh-gossip / iroh-docs).**
- **For:** the best pure-P2P story in Rust. Key-addressed, hole punching, relay fallback over 443, no inbound ports, end-to-end encrypted, works with or without Tailscale, 1.0 API stability, and content-addressed blobs that are perfect for session handoff (transcript + `git bundle` + diff).
- **Costs:** MSRV 1.91. No store-and-forward, so a sleeping laptop misses commands unless the Pi acts as an always-on peer. The public-relay version treadmill. The phone needs a native app using FFI, or a relay-only browser build.
**2. NATS + JetStream with the hub on the Pi.**
- **For:** one Go binary solves realtime, commands, durable log, KV ("device X last synced at T") and the object store. Leaf nodes let the Mac keep working offline and catch up. `async-nats` is official and heavily used.
- **Costs:** the Pi must be reachable (Tailscale, Cloudflare Tunnel or a port forward). No end-to-end encryption; add age or X25519 sealing if the hub is exposed beyond the tailnet. MSRV 1.88.
**3. Zenoh.**
- **For:** Rust-native, MSRV 1.75 (fits nerve today), peer mode on a LAN with no infrastructure, a router on the Pi for WAN, query/queryable fits "get diff for session S" naturally, storages give durable state, and there is a Kotlin binding for Android.
- **Costs:** more conceptual surface than MQTT. A WAN router still needs reachability. Smaller community than NATS.
**4. Tailscale + plain HTTP (axum) with SSE/WebSocket and an AG-UI-shaped event schema.**
- **For:** the lowest-effort design that reliably works. Each nerve daemon serves `/events` (SSE) and `/cmd` on its tailnet IP; `tailscale serve` gives HTTPS; the phone opens a PWA. Taildrop or HTTP handles blobs. MSRV-friendly (axum 1.80, tungstenite 1.85).
- **Costs:** fails the "without WireGuard mesh" goal. Tailscale's control plane is a third party unless you run Headscale. Embedding via tailscale-rs is experimental, so in practice you depend on the system tailscaled.
**5. Matrix (Continuwuity or Tuwunel on the Pi, Element X on the phone).**
- **For:** you get a polished, end-to-end encrypted phone UI, push notifications and store-and-forward with **zero mobile development**. One room per session; threads for subagents; commands as messages or reactions; diffs as file attachments.
- **Costs:** matrix-sdk MSRV 1.96 and a large dependency tree (isolate it in a sidecar binary). The homeserver needs reachability. Chat is a clumsy UI for structured state.
**6. MQTT (Mosquitto on the Pi) + ntfy/UnifiedPush.**
- **For:** the boring, proven option. Retained topics give per-device status, QoS 1 persistent sessions queue commands for sleeping devices, WebSocket gives the phone a browser view, and `rumqttc` fits MSRV.
- **Costs:** blobs are poor (use HTTP or Syncthing alongside). End-to-end encryption is DIY. rumqttc releases have slowed (last 2025-11).
**Honourable mentions:**
- **WebRTC/str0m:** the best browser and phone P2P, but you must build signalling (Nostr could do it) and TURN.
- **Syncthing:** as a zero-code blob and handoff layer.
- **Cloudflare Durable Objects:** a no-Pi-infrastructure mailbox.
- **Automerge (samod):** if you want a CRDT job board.

## 4. Recommended layered designs
Treat the problem as four planes:
1. **Identity and pairing**
2. **Signalling, commands and push**
3. **Realtime stream**
4. **Bulk and durable state**
Then pick per plane. Whatever transport you choose, use **ACP's vocabulary** for session control (prompt, permission request and response, tool-call update, diff) and **AG-UI-style events** for the progress stream. That keeps the transport swappable and gives the phone UI a known schema.
**Design A: "Nostr for signalling + iroh for bulk."** Strongest no-mesh, no-port design.
- Nostr carries:
  - small encrypted control events (NIP-44/NIP-17), giving relay store-and-forward for commands to sleeping devices;
  - device presence and "last synced" heartbeats (replaceable events);
  - iroh endpoint IDs and tickets.
- When two devices need to talk live (streaming a transcript, handoff), they exchange an iroh `NodeAddr` over Nostr and open a QUIC connection. iroh-blobs moves `git bundle` + transcript JSONL + diffs with BLAKE3 verification.
- Optionally ContextVM to expose nerve as an MCP server over the same relays.
- Run your own iroh-relay (and Nostr relay, for example `nostr-rs-relay` or strfry) on a small VPS, or on the Pi behind a Cloudflare Tunnel. A tunnel works for the WebSocket-based Nostr relay; for iroh-relay, check that QUIC address discovery degrades gracefully.
- Phone: a Nostr client for commands (Amethyst/0xchat-style DMs work out of the box), plus a native app later for rich views.
- **Assessment:** best long-term architecture. Highest build cost. Needs a separate MSRV-1.91 crate.
**Design B: "NATS on the Pi."** Most features per line of code.
- Pi runs `nats-server` with JetStream. Mac runs a leaf node (offline-tolerant).
- Subjects:
  - `nerve.<device>.sessions.<id>.events` → stream with limits
  - `nerve.<device>.cmd` → work-queue stream
  - KV bucket `devices` → last-synced and capabilities
  - object store `handoff` → bundles
- Job distribution: devices publish capabilities into KV (`ios_sim=true`); jobs go to `nerve.jobs.<capability>` with queue groups. This is A2A-Agent-Card semantics in miniature.
- Reachability: Tailscale today; Cloudflare Tunnel (WebSocket listener) for the no-mesh case. Add payload sealing.
- Phone: a PWA over nats.ws, plus ntfy for push.
**Design C: "Tailscale + HTTP/SSE"** (ship-it-this-week baseline).
- Each daemon exposes axum `/v1/sessions`, `/v1/events` (SSE, AG-UI-shaped), `/v1/cmd`, `/v1/blobs/:hash`.
- The phone uses a PWA over `tailscale serve`.
- "Last synced" is kept by having each daemon poll its peers.
- Fits MSRV 1.85 with no new heavy dependencies.
- It is also the natural *local API* that designs A and B wrap. Build it first regardless.
**Design D: "Remote Control for steering, nerve for the fleet."**
- Rely on Claude Code Remote Control for phone chat and approvals; it already handles prompts, questions and subagent progress on the official app.
- nerve adds only what Remote Control lacks: the cross-device dashboard, handoff (bundle + transcript copy + `claude --resume` on the target), capability-based job placement, and diff browsing.
- This shrinks the custom command surface a lot. The downside is dependence on Anthropic and on a subscription (no API-key auth).
**Suggested path:** C first (local API + schema) → D (integrate Remote Control) → A or B for the no-mesh WAN layer. Choose B if you are happy running the Pi as a hub; choose A if you want no hub and end-to-end encryption.
**Handoff specifics, independent of transport:**
- Use `git bundle create` covering `HEAD` plus `git stash create` for the working tree (or a `git diff --binary` patch), plus the session's JSONL transcript from the source device's `claude_roots()` dir.
- On the target, rewrite the project path, because the transcript dir is keyed by the encoded cwd.
- Hash-address everything (iroh-blobs or NATS object store).
---
## 5. Risks and uncertainties
1. **MSRV.** Almost every serious option needs Rust 1.88–1.96 (table above). Decide now between a separate sync crate or binary, or an MSRV bump. Keeping the TUI at 1.85 while a `nerve-sync` sidecar floats is the cleanest option.
2. **Injecting input into a running Claude Code session is the real hard part, not transport.** Answering permission prompts remotely needs either:
   - Remote Control;
   - hooks (a `PermissionRequest`/`PreToolUse` hook that blocks on nerve's channel);
   - tmux `send-keys` (fragile; impossible for Ghostty tabs without AppleScript keystrokes);
   - the Agent SDK.
   Validate this before choosing a network stack.
3. **Security.** A remote "send instruction to agent" channel is remote code execution on your machine. Requirements:
   - per-device keys and explicit pairing (wormhole-style code);
   - signed commands with replay protection (nonce plus expiry);
   - an allow-list of command types;
   - re-validating the PID (per CLAUDE.md) before acting.
   Brokers without end-to-end encryption (MQTT, NATS, Redis, Cloudflare) need payload sealing if anything leaves the tailnet.
4. **Third-party relay dependence:**
   - n0 public relays are rate-limited with no SLA, and drop old versions (0.9x/rc relays scheduled off on 2026-09-30, 0.35x on 2026-12-31).
   - Tailscale's control plane is third party unless you run Headscale.
   - Cloudflare terminates TLS at its edge.
   - Remote Control routes through Anthropic.
5. **Mobile background limits.** Android kills background sockets. Any realtime design still needs push for the "agent is waiting on you" case: FCM, or UnifiedPush via ntfy, or Matrix push. P2P options (iroh, libp2p, Holepunch) do not solve this on their own.
6. **Pi reachability.** Every hub design (NATS, Zenoh router, MQTT, Matrix, Headscale, self-hosted iroh-relay) needs the Pi reachable. Behind CGNAT, that means Tailscale, Cloudflare Tunnel or a VPS. Only iroh with public relays, Holepunch, Nostr with public relays, Yggdrasil and Remote Control avoid it.
7. **Maturity flags:**
   - tailscale-rs is explicitly experimental.
   - iroh-gossip and iroh-docs are pre-1.0.
   - samod, willow25, the Rust hyperswarm, the reticulum ports, ContextVM, ag-ui and a2a-rs all have small download counts.
   - rumqttc's release cadence has slowed.
   - conduwuit is archived; prefer Continuwuity or Tuwunel.
   - Statements marked "(unverified)" above (iroh mobile FFI depth, ntfy end-to-end encryption, Syncthing Android fork, cr-sqlite status, Triplit, Turso's rewrite) should be checked before committing.
8. **Transcript size and privacy.** JSONL transcripts can be many MB and contain secrets. Blob layers must be encrypted at rest on any hub, with retention limits.

- **Hidden flags.** `--channels` and `--dangerously-load-development-channels` are in the binary but not in `claude --help`. So is `--sdk-url`, an internal flag I won't use. The binary also contains `notifications/claude/channel`, `notifications/claude/channel/permission` and `notifications/claude/channel/permission_request`.
- **Hook event names in the binary.** PreToolUse, PostToolUse, PostToolUseFailure, PostToolBatch, UserPromptSubmit, UserPromptExpansion, Notification, Stop, StopFailure, SubagentStart, SubagentStop, PreCompact, PostCompact, SessionStart, SessionEnd, Setup, PermissionRequest, PermissionDenied, Elicitation, ElicitationResult, TaskCreated, TaskCompleted, TeammateIdle, ConfigChange, CwdChanged, FileChanged, InstructionsLoaded, WorktreeCreate, WorktreeRemove.
  - The docs also list MessageDisplay, DirectoryAdded, PreModelSwitch and PostModelSwitch (33 events in total).
- **`claude agents --json`.** Prints active sessions, interactive and background, as JSON and does not need a TTY. `--all` also includes finished ones.
- **`claude attach <id|name>`.** Opens a background session in the current terminal.
- **`claude logs <id|name>`.** Prints a background session's recent terminal output.
- **Other subcommands.** `stop`, `respawn`, `rm` and `purge` exist.
- **`--bg --resume <id>`.** Continues that session in the background under the same ID. If the session is already running, it starts a copy instead.
- **`--permission-prompts host|none`.** In `-p` mode, decides whether the SDK host or `--permission-prompt-tool` answers prompts, or whether they are auto-denied.
- **`~/.claude/settings.json`.** Top-level keys: `enabledPlugins`, `extraKnownMarketplaces`, `hooks`, `model`, `permissions`, `skipDangerousModePermissionPrompt`, `theme`.
  - Hooks are already set for PostToolUse, PreCompact, PreToolUse, SessionEnd, SessionStart, Stop and UserPromptSubmit. I did not print any values.
- **This session's config dir is `~/.claude-ext`, not `~/.claude`.** Its transcripts are under `~/.claude-ext/projects/`, so `CLAUDE_CONFIG_DIR` is set. Both directories have a `sessions/` folder, and the session file I inspected lives under `~/.claude/sessions/`. nerve's `detect::claude_roots()` rule is the right one.
- **Fields in a live `sessions/<pid>.json`.** Secret-like keys were redacted. Useful fields for nerve:
  - `sessionId`, `cwd`, `kind` (`interactive`), `entrypoint` (`claude-desktop`)
  - `peerProtocol: 1`, `peerFeatures: ["notify_idle", …]`
  - `messagingSocketPath: "/tmp/cc-socks/<pid>.sock"`
  - `status` (`busy`) and `statusUpdatedAt`
  - `bridgeSessionId: "session_01…"` (looks like the Remote Control bridge ID **[UNCERTAIN]**)
  - `<pid>.<hash>.key` files sit next to the JSON. They are probably the messaging token, so nerve must never render them.
- **Session layout on disk.** `projects/<slug>/<session-id>/subagents/agent-<id>.jsonl` and `.meta.json`, plus `tool-results/`. `file-history/<session-id>/` is separate.

## 1. Ways to send input into a running interactive session

### 1.1 Remote Control (official)

**How it works**
- Start it with `claude --remote-control [name]`, `/remote-control` (`/rc`) inside a session, or `claude remote-control`. The last one is server mode: it can spawn sessions on demand, `--capacity` defaults to 32, and it has `--spawn` and `--[no-]create-session-in-dir`.
- `/config` can turn on auto-connect for every session.
- Each interactive process registers one remote session.

**Transport**
- The docs say the session "makes outbound HTTPS requests only" and "never opens inbound ports".
- Messages go through Anthropic's servers, which issue short-lived credentials. The machine needs `api.anthropic.com:443`.
- Cross-session messages to a session on another machine also travel "through Anthropic servers, arriving over that machine's Remote Control connection".

**Auth**
- Works on Pro, Max, Team and Enterprise. "API keys are not supported."
- `claude setup-token` and `CLAUDE_CODE_OAUTH_TOKEN` fail with "Remote Control requires full-scope login token". You need `claude auth login` with a claude.ai account.
- Team and Enterprise need an Owner to turn it on, and may require Trusted Devices.
- It is off when `ANTHROPIC_BASE_URL` points anywhere other than api.anthropic.com, and on Bedrock, Vertex or Foundry.

**Clients**
- claude.ai/code, the Claude iOS and Android apps, or any browser. `/mobile` shows a QR code to get the app.

**What a remote client can do**
- Send prompts and attach images or files. Files are downloaded locally and passed to Claude as `@` references.
- See subagent and workflow progress.
- Answer permission prompts and AskUserQuestion. The docs' limitations section talks about forwarded prompts, and the CHANGELOG mentions remote status for "a session waiting on a permission prompt". **[UNCERTAIN]** I did not find a spec of exactly which dialog types are forwarded.

**Limitations**
- The local process has to keep running; it reconnects after sleep or network loss.
- After roughly 30 minutes of failed heartbeats it disconnects and needs `/remote-control` again.
- Queued messages that arrive while the process is exiting are kept for the next resume (CHANGELOG).
- There is no public API or protocol. nerve cannot be a Remote Control client; only Anthropic's apps can. Its role would be to start sessions with RC enabled and show the `bridgeSessionId` or a link.
- A Raspberry Pi can only take part as a browser pointed at claude.ai/code.

### 1.2 Channels: MCP servers that push events into a session (research preview)

**What they are**
- A channel is an MCP server over stdio that declares `capabilities.experimental['claude/channel']`. It pushes events with `notifications/claude/channel`, and params are `{ content: string, meta?: Record<string,string> }`.
- Each `meta` key becomes an attribute on a `<channel source="<server>" …>` tag that Claude sees. Keys must be letters, digits or underscores; anything else is silently dropped.

**Requirements**
- Bun for the official plugins.
- Claude.ai or Console API-key auth. Not available on Bedrock, Vertex or Foundry.
- Team and Enterprise must set `channelsEnabled: true` and can restrict plugins with `allowedChannelPlugins`.
- Official channels are Telegram, Discord and iMessage, plus the `fakechat` demo.

**Enabling**
- `claude --channels plugin:telegram@claude-plugins-official` accepts only allowlisted plugins.
- A custom server needs `claude --dangerously-load-development-channels server:<name>` (or `plugin:x@market`). This shows a confirmation prompt, so it only works interactively. Under `-p` or the SDK the flag is ignored and the channel does not register.

**Delivery**
- There is no acknowledgement. `await mcp.notification()` resolves once the message is written. If the session isn't there to receive it, the event is silently dropped.

**Two-way**
- Expose a `reply` tool. Claude calls it to answer.

**Permission relay** (exact protocol from channels-reference)
- **Opt in:** declare `experimental: { 'claude/channel': {}, 'claude/channel/permission': {} }`.
- **Outbound from Claude Code:** `notifications/claude/channel/permission_request` with params `{ request_id, tool_name, description, input_preview }`.
  - `request_id` is five lowercase letters a–z, excluding `l`.
  - Since v2.1.211, `description` and `input_preview` are sanitised, capped at 3,500 code points, and credentials are replaced with `[REDACTED]`.
- **Inbound verdict:** `notifications/claude/channel/permission` with `{ request_id, behavior: 'allow' | 'deny' }`. It applies to that one call only.
- **Which answer wins:** the local dialog and the relay are both live, and "Claude Code applies whichever answer arrives first and closes the other."
- **What it covers:** tool-use approvals such as Bash, Write and Edit. Project-trust and MCP-consent dialogs are not relayed.
- **AskUserQuestion is not documented as relayable** over channels **[UNCERTAIN]**. The only documented channel path is the `yes/no <id>` tool approval.
- **In auto mode** the classifier decides and no relay happens. The doc example switches to manual mode.
- **Security:** the docs say "An ungated channel is a prompt injection vector". Gate on the sender's identity (`message.from.id`), not the chat or room.
- A recent CHANGELOG fix ignores a repeated reply ID so it can't approve a different prompt.

**For nerve:** this is the best documented way to push instructions into a live interactive session and approve tools remotely without Anthropic's relay. The catch is that the session must be launched with the dev-channel flag and a confirmation, unless nerve ships as an allowlisted plugin (unlikely).

### 1.3 Hooks

**Common input fields:** `session_id`, `prompt_id`, `transcript_path`, `cwd`, `scratchpad_dir` (v2.1.257+), `permission_mode`, `hook_event_name`. Tool events add `tool_name`, `tool_input` and `tool_use_id`.

**Universal output fields:** `continue` (false stops everything), `stopReason`, `systemMessage`, `suppressOutput`, `terminalSequence`.

| Event | Can it add input or keep Claude going? | Output |
|---|---|---|
| SessionStart | Adds context at start or resume. `initialUserMessage` works only with `-p`. | `hookSpecificOutput.additionalContext`, `sessionTitle`, `watchPaths`, `reloadSkills`. Input includes `source` (startup/resume…), `seconds_since_last_response`, `context_tokens`. |
| UserPromptSubmit | Can add context but **cannot replace the prompt**. | `additionalContext`; `decision:"block"` + `reason`. Plain stdout becomes context. |
| PostToolUse | Adds context after a tool runs. | `hookSpecificOutput.additionalContext`, `updatedToolOutput`; `decision:"block"`. |
| Stop / SubagentStop | **Keeps the agent working:** `{"decision":"block","reason":"…"}` makes Claude continue, with `reason` as the instruction. Check `stop_hook_active` to avoid loops. | Also accepts `hookSpecificOutput.additionalContext`. |
| Notification | Watch only. `notification_type` is one of `permission_prompt` (fires about 6 s after the prompt appears), `idle_prompt`, `elicitation_dialog`, `elicitation_url_dialog`, `elicitation_complete`, `elicitation_response`, `agent_needs_input`, `agent_completed`, `auth_success`, `quota_auto_resume_*`. | No decision control; only `terminalSequence` works. |
| PermissionRequest | **Answers a permission prompt.** Fires only when Claude Code is about to ask, or would auto-deny. | See schema below. Exit code 2 is ignored. |
| PreToolUse | Decides on any tool call and **can answer AskUserQuestion**. | `permissionDecision: allow/deny/ask/defer`, `permissionDecisionReason`, `updatedInput`, `additionalContext`. |
| Elicitation | Answers MCP elicitation forms without showing a dialog. | `hookSpecificOutput.action` accept/decline/cancel + `content`. |
| Async hooks | `"async": true` delivers output on the next turn; if the session is idle it waits. `"asyncRewake": true` exiting with code 2 **wakes an idle Claude immediately**, with stderr shown as a system reminder. | This is the only documented hook path that injects into an idle session. |

**PermissionRequest input** (from the docs):
```json
{"session_id":"…","transcript_path":"…","cwd":"…","permission_mode":"default","hook_event_name":"PermissionRequest",
 "tool_name":"Bash","tool_input":{"command":"rm -rf node_modules","description":"…"},
 "permission_suggestions":[{"type":"addRules","rules":[{"toolName":"Bash","ruleContent":"rm -rf node_modules"}],"behavior":"allow","destination":"localSettings"}]}
```

**PermissionRequest output:**
```json
{"hookSpecificOutput":{"hookEventName":"PermissionRequest",
  "decision":{"behavior":"allow","updatedInput":{"command":"npm run lint"},"updatedPermissions":[…]}}}
```
- On deny: `{"behavior":"deny","message":"…","interrupt":true}`.
- A matching deny rule still wins over `allow`.

**Answering AskUserQuestion through PreToolUse.** Echo back the original `questions` and add an `answers` map. `"allow"` on its own is not enough.
```json
{"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"allow",
 "updatedInput":{"questions":[{"question":"Which framework?","header":"Framework",
   "options":[{"label":"React","description":"…"},{"label":"Vue","description":"…"}],"multiSelect":false}],
 "answers":{"Which framework?":"React"}}}}
```
- For multi-select, pass an array or `", "`-joined labels. The SDK also accepts a free-text `response`.
- MCP tools marked `_meta["anthropic/requiresUserInteraction"]` cannot be auto-answered this way.

**Design note for remote answering**
- A blocking PermissionRequest or PreToolUse hook could wait on nerve's server for a phone answer. The default `command` hook timeout is 600 s.
- **[UNCERTAIN]** The docs don't say whether the local dialog is already visible while a PermissionRequest hook runs. Everything suggests the hook runs *before* the dialog, so a slow hook delays the local prompt. Channel relay, by contrast, races the local dialog explicitly.
- For AskUserQuestion, a PreToolUse hook that blocks until the phone answers is the only documented remote path besides Remote Control and the SDK.
- Hooks need to be in settings when the session starts. nerve can't add one to a session that is already running without a settings reload (`ConfigChange` exists, but I didn't verify hot reload).

### 1.4 Cross-session messaging socket (local)

- Each session exposes `messagingSocketPath`, for example `/tmp/cc-socks/<pid>.sock`, falling back to `/tmp/cc-socks-<uid>`.
- A connection may start with `{"type":"auth","token":"<CLAUDE_CODE_MESSAGING_TOKEN>"}`.
- Messages from peers are labelled as coming from another session, not from the user, and "can't answer a pending permission prompt". The receiver's `crossSessionInbound` setting is `accept`, `hold` or `refuse`.
- **[UNCERTAIN]** The wire format beyond the auth line isn't publicly specified. I couldn't pull it from the binary quickly, and it's an internal, versioned protocol (`peerProtocol: 1`).
- That makes it a tempting "send an instruction" path for nerve, but brittle, and semantically weaker than a real user message.

### 1.5 tmux send-keys and PTY

- Works on any interactive session running in tmux: `tmux send-keys -t pane "text" Enter`, or arrow keys and digits for dialogs.
- Claude Squad, ccremote, Claude-Code-Remote (tmux mode) and handmux all work this way.
- Pros: universal, and answers any dialog, including trust prompts.
- Cons: you scrape the screen for state, typing races with the TUI, and it can't reach Ghostty tabs that aren't in tmux. On macOS, Ghostty would need AppleScript keystroke injection.

### 1.6 Background sessions

- `claude --bg`, then `claude attach`, `claude logs` and `claude agents --json`. The supervisor (`~/.claude/daemon/`) keeps sessions alive.
- **Reading state:** the docs call `claude agents --json --all` "the supported way to read session state from outside". Fields are `state` (`working|blocked|done|failed|stopped`), `status` (`busy|waiting|idle`), `waitingFor` (`permission prompt`, `input needed`, `sandbox request`, `worker request`, `dialog open`), `id`, `pid`, `sessionId`, `name`, `cwd`, `kind`, `startedAt`.
- **Not stable:** "The files under `~/.claude/jobs/<id>/` are not a stable interface." nerve should move from `jobs/*/state.json` to `agents --json`.
- **No CLI to send input.** There is no "send message to background session" command. Input happens through `attach` (a TTY, which a PTY bridge on the Mac could drive), Remote Control, or channels.
- **Idle sessions get unloaded.** Sessions that are finished and unattached for about an hour stop, and resume when you reply or attach.

### 1.7 Agent SDK / headless (`-p --input-format stream-json`)

This gives full programmatic control, but only for sessions **you start**. You cannot attach it to an existing interactive TUI. See §3.

## 2. Moving a session to another machine

- **Storage:** `<config>/projects/<slug>/<session-id>.jsonl`. The slug is the cwd with every non-alphanumeric character replaced by `-`. If that is longer than 200 characters, it's truncated and a hash is added. `CLAUDE_CODE_PROJECT_DIR_NAME` can override it.
- **How `--resume` finds a session:** `claude --resume <id>` searches the current project and its worktrees first. In other projects it resolves the ID only if exactly one project holds it, so "a hand-copied duplicate makes Claude Code report not-found". `claude --resume <path/to/file.jsonl>` resumes straight from a file.
- **Copying to another host is officially supported** (Agent SDK sessions docs, "Resume across hosts"):
  - Either "Move the session file": restore `~/.claude/projects/<encoded-cwd>/<session-id>.jsonl` on the new host before calling resume.
  - Or attach a `sessionStore` / `session_store` adapter that mirrors transcripts.
  - Either way, the `cwd` must match the original run's.
  - In practice: put the repo at the same absolute path on the Pi, or write the file into the slug for the Pi's path and resume by file path. **[UNCERTAIN]** whether old absolute paths inside tool calls confuse later turns. They're only text, so probably harmless.
- **Subagent transcripts** (`<session-id>/subagents/agent-*.jsonl` + `.meta.json`) and `tool-results/` belong to the session directory. Copy them so expanded subagent views and large tool outputs survive.
  - **[UNCERTAIN]** whether resume needs them. The main transcript holds the Agent tool results.
- **file-history** (`<config>/file-history/<session-id>/`) holds checkpoint backups for `/rewind`. It's only needed if you want rewind to work on the target. Todos/tasks (`tasks/`) are optional.
- **Code state is not carried.** Push the branch or worktree through git, or rsync.
- **`--fork-session`** with `--resume` or `--continue` gives the conversation a new session ID. Use it for handoff so both machines don't append to the same ID; the docs warn against resuming one session in two places without forking.
- **`--bg --resume <id>`** continues a session in the background on the new host.
- **Teleport is cloud to local only:**
  - `claude --teleport [session]` or `/teleport` pulls a claude.ai/code cloud session into your terminal. It checks the repo, fetches and checks out the branch, and needs the same account.
  - "you can't push an existing terminal session to the cloud."
  - The desktop app's "Open in → Cloud" carries the conversation over **as a summary** only.
  - `--cloud <id|url>` with `-p` queues a message into an existing cloud session.
  - There is **no local-to-local teleport.** Handoff between your own machines is: copy the jsonl and its directory, sync the code, then `claude --resume <id> [--fork-session]`.
- **Self-hosted environments** (`--environment ccpool_…`) run *cloud* sessions on your own runners. They're Team and Enterprise only, in beta, and work from GitHub checkouts. The docs point Pro and Max users who want "your own always-on machine" to Remote Control instead.

## 3. Agent SDK as a controllable worker on a Pi

TypeScript `@anthropic-ai/claude-agent-sdk`, Python `claude-agent-sdk`. Both drive the same CLI over stream-json.

- **Streaming input:** pass an async iterable of `SDKUserMessage`s to `query({prompt})`. You can push new instructions at any time, and they queue between turns. This is what Happy's "remote mode" does with a `PushableAsyncIterable` around `query()`.
- **`canUseTool(toolName, input, {signal, suggestions})`** returns `{behavior:"allow", updatedInput}` or `{behavior:"deny", message, interrupt?}`. In Python it's `PermissionResultAllow(updated_input=…)` / `PermissionResultDeny`.
  - Before v2.1.207 an allow without `updatedInput` was rejected, so always include it.
  - AskUserQuestion arrives here as well. Return `updatedInput` containing `questions` + `answers` (question text → label) and an optional `response`.
  - This is the cleanest way to send prompts to a phone and wait as long as needed.
- **`interrupt()`** ends the current turn cleanly. `setPermissionMode()` and `setModel()` change settings mid-session. SIGTERM leaves the turn unrecorded, while SIGINT or `interrupt()` finishes it. `CLAUDE_CODE_RESUME_INTERRUPTED_TURN=1` continues the interrupted turn on resume.
- **Resume and fork:**
  - `options.resume = <sessionId>`, with `forkSession: true` / `fork_session=True`.
  - `listSessions()` and `getSessionMessages()` (Python `list_sessions` / `get_session_messages`).
  - `sessionStore` for transcripts shared across hosts.
- **CLI equivalent:** `claude -p --input-format stream-json --output-format stream-json --verbose [--include-partial-messages --include-hook-events --forward-subagent-text --replay-user-messages] --permission-prompt-tool mcp__x__approve`. Use `--permission-prompts none` for unattended jobs.
  - The init event has a `capabilities` array (for example `interrupt_receipt_v1`) for feature detection.
  - SDK and `-p` sessions don't appear in `/resume` or `--continue`, but `--resume <id>` works.
- **Auth for unattended workers:** an API key or a `setup-token` OAuth token works for the SDK. Remote Control and dev channels do not work there.
- **[UNCERTAIN]** I did not verify Raspberry Pi (linux-arm64) support for the native build. Node or Bun plus the SDK's bundled CLI should work.

## 5. Recommended control surface for nerve

nerve watches sessions it didn't start, so the options split into "attach to someone else's session" and "nerve starts the worker".

**Send an instruction**
1. **A channel server that nerve ships**, for example `nerve-channel` over MCP stdio, started via `--dangerously-load-development-channels server:nerve`. nerve's Mac process POSTs to it, gated by sender identity, and it emits `notifications/claude/channel`. Two-way via a `reply` tool. Works on interactive sessions without Anthropic's relay.
   - Cost: the session must be launched with the flag and a confirmation, and the feature is a research preview.
2. **tmux send-keys** for sessions in tmux panes. Universal but screen-scraped, and nerve already knows the panes.
3. **Remote Control.** Fine for a person with a phone, but nerve can't drive it programmatically. nerve could show RC status (`bridgeSessionId`) and add a "start with `--remote-control`" action.
4. **asyncRewake hook.** A command hook that waits for a nerve message and exits 2 wakes an idle Claude with stderr as context. Hacky, but no flags needed once installed.
5. **Cross-session socket.** Don't use it: the protocol is undocumented, and messages are labelled as not from the user.

**Answer a permission prompt or AskUserQuestion**
1. **For nerve-launched workers, use the SDK `canUseTool`.** It's the only path that handles both, with no timeout games.
2. **Channel permission relay** for tool approvals in interactive sessions. It races the local dialog, which is the nicest UX, but AskUserQuestion is not covered **[UNCERTAIN]**.
3. **Blocking PermissionRequest hook** (allow/deny, plus `updatedPermissions` for "always") and **a PreToolUse hook on `AskUserQuestion`** returning `updatedInput.answers`.
   - Both are installed in settings and talk to nerve over a local socket.
   - The 600 s hook timeout applies, and the local dialog is probably delayed while the hook waits **[UNCERTAIN]**. Fall back to "ask" or no output on timeout.
4. **tmux keystrokes**, the last resort.
- **Detecting that a prompt is pending:** use `claude agents --json` `waitingFor` and the Notification hook (`permission_prompt` ~6 s, `elicitation_dialog`, `idle_prompt`, `agent_needs_input`).

**Read progress, diffs and subagent work**
1. **Keep reading transcripts** (`projects/<slug>/<id>.jsonl` and `<id>/subagents/*.jsonl`), following `Sanitised` and `claude_roots()`. Edit/Write `tool_use` inputs and `tool-results/` give the diffs.
2. **Move job state to `claude agents --json --all`**, which is the documented-stable API. Keep `sessions/<pid>.json` (`status`, `name`, `kind`) for interactive sessions. Run it in the discovery worker, never on the UI tick.
3. **Optional hooks feed:** PostToolUse, Stop and SubagentStop hooks append to a nerve event log, which is lower latency than polling.
4. **For workers:** `--output-format stream-json --include-hook-events --forward-subagent-text`.
- **Getting it to the Pi or phone:** a small nerve HTTP/WebSocket server bound to Tailscale (the most common pattern above). If going over the internet, add E2E encryption modelled on Happy, Paseo or YepAnywhere (key pairing by QR, relay only forwards ciphertext).

**Handoff**
1. **Stop the session on the source machine.**
2. **Sync the code** with git push of the branch or worktree.
3. **Copy the session files:** `<id>.jsonl` and the `<id>/` folder (subagents, tool-results), and optionally `file-history/<id>/`, into the target's `claude_roots()/projects/<slug-for-target-cwd>/`.
4. **On the target:** `claude --resume <id> --fork-session` (or `--bg --resume`, or SDK `resume` + `forkSession`). This is the officially documented "resume across hosts" path; the cwd must match.
   - Use the same absolute repo path, or rewrite the slug and resume by file path.
5. **Do not use teleport.** It is cloud → local only. Desktop "Open in Cloud" only moves a summary.
6. **For SDK workers:** implement a `sessionStore` adapter shared between the Mac and the Pi.

**Overall:** nerve stays a passive monitor for sessions it didn't start (transcripts + `agents --json`). It adds an optional "nerve-controlled" launch mode: interactive sessions with a nerve channel and a hook bundle, or headless SDK workers on the Pi with `canUseTool`. That second mode is where sending input, answering prompts and handoff become reliable. Remote Control stays the zero-effort option for users with a claude.ai login.
