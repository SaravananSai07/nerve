<script type="text/plain" class="doc" id="d3" data-group="Overview" data-title="Decision log" data-path="research/sync/DECISIONS.md"># Decision log: nerve cross-device sync

Each entry gives the decision, the alternatives considered, and the evidence. "E*n*" refers to `experiments/RESULTS.md` and the experiment table in `REPORT.md`.

---

**D1. Build on Claude Code's own control surfaces, not on keystroke scraping alone.**

- *Decision:* Answer permissions with a `PermissionRequest` hook. Answer questions with a `PreToolUse` hook on `AskUserQuestion` that returns `updatedInput.answers`. Use tmux/Ghostty paste only to type new instructions.
- *Alternatives:*
  - tmux send-keys for everything. This is fragile: you have to scrape the screen to find the dialog.
  - Channels (`--dangerously-load-development-channels`). This needs a flag plus an interactive confirmation every launch, and it is a research preview.
  - The cross-session socket. It is undocumented, and Claude labels its messages as "not from the user".
  - Remote Control. There is no public API, it is Anthropic-only, and it needs a claude.ai login.
- *Evidence:* E6a and E6b both work on 2.1.288. The exact output shapes are recorded and unit-tested (`mailbox::tests`).

**D2. Questions go remote only in "away mode"; permissions go remote always.**

- *Why:* E6b showed that the question dialog is **not shown** while a `PreToolUse` hook is waiting. If questions always went remote, the person at the keyboard would never see them. E6a showed that the permission dialog **is shown** while `PermissionRequest` waits, so a local and a remote answer simply race, and that is safe.
- *Setting:* `remote_questions = away | always | never`. Default: `away`.

**D3. Detect a local answer from the transcript, not from the hook's stdin.**

- *Why:* A blocked hook is never told that the user answered at the keyboard (E6c), and the hook input carries no `tool_use_id`. So the hook matches the newest `tool_use` with the same name and input, then watches for its `tool_result` (E6d: the transcript grows about 10 KB the moment a local answer lands). Once it sees that, it withdraws its request, so other devices don't keep showing a question that is already resolved.

**D4. Transport: Nostr via nostr-sdk 0.45, inside nerve, behind a cargo feature.**

- *Alternatives:* 48 options surveyed (`reports/02-alternatives-survey.md`), including iroh, NATS, MQTT, Zenoh, Matrix, libp2p, Syncthing, Tailscale-plus-HTTP, and CRDT stacks.
- *Why Nostr:*
  - **No inbound connectivity.** Both ends dial out over WSS, so it works without Tailscale (E14).
  - **Store-and-forward for free.** A job sent to an offline Pi ran about 1 s after the Pi reconnected (E15).
  - **The relay data model matches the problem.** Addressable events give "last known state" and NIP-40 gives TTLs.
  - **Self-hostable in about 20 lines.** `nostr-sdk` with `local-relay` gave 16 ms RTT over Tailscale (E3).
  - **Fits nerve's MSRV.** nostr-sdk's MSRV is **1.85, the same as nerve's**.
  - **Phones can join later.** Existing Nostr apps and the `nostr-tools` JS library give a path to a phone client.
- *Why not iroh as the main transport:* iroh measured best (8.5 ms direct, 15 MiB/s, and it found the LAN path on its own, E4). But it needs MSRV 1.91, has no store-and-forward, and its relay-only path ran at 1.1 MiB/s. It is a good future bulk lane (see D10).
- *Why not NATS or MQTT:* they need a hub reachable from every device, so without Tailscale the Pi must be exposed. They also have no end-to-end encryption and add a Go service to run.
- *Why a cargo feature:* the default build stays dependency-light, and users who don't sync pay nothing.

**D5. One envelope format; three event classes.**

- Every payload is a JSON `Envelope { v, id, from, sent_at, body }`, NIP-44 v2 encrypted to exactly one device.
- State is kind 30078 (addressable, `d = nerve/1/state/<recipient>`). Everything else is kind 4590 (stored), with a NIP-40 expiry of 24 h.
- *Why not ephemeral kinds (2xxxx):* they give no catch-up for a sleeping device, and E2 showed public relays shadow-dropping them.
- *Why not NIP-59 gift wrap by default:* it works (E2: same latency on primal), but it triples the event size and gains little when the only peers are your own devices. Kept as an option.
- *Why not NIP-90 DVM kinds for jobs:* NIP-90 is now marked "unrecommended" upstream. We borrow only its request → feedback → result shape.

**D6. End-to-end acks; a relay's `OK` is not delivery.**

- *Evidence:* E2. nos.lol and nostr.mom returned `OK true` for every event from a new key, delivered nothing, and stored nothing.
- *Decision:*
  - Every command gets an `Ack` envelope back from the device.
  - The CLI prints `✓` or `✗` only from that ack.
  - Docs list relays that were verified to deliver.

**D7. Chunking at 32 KiB of plaintext; bulk only via private relays.**

- *Evidence:* E1. The smallest accepted size was 60 KB (strfry's 64 KiB default), nostr-sdk's LocalRelay default is 64 KiB, and offchain.pub allowed 8 KB for unknown keys.
- *Evidence:* E12. A 730 KiB handoff took 20.7 s over a public relay (paced to avoid bans; damus banned a test key within minutes, E2) and **0.6 s** via the private relay.
- *Decision:* `send_bulk` targets only connected `ws://` relays when any exist, falling back to all relays.

**D8. Handoff = git bundle + worktree patch + untracked tar + transcript, installed under the target's slug, then `--resume --fork-session`.**

- *Evidence:*
  - E7 (scripts) and E12 (nerve): the session recalled context given on the other machine and edited the carried-over uncommitted file.
  - The cwd slug is the **only** path that must match. Absolute source paths inside the transcript did not confuse later turns, so path rewriting was not needed.
- *Why `--fork-session`:* the two devices never append to one transcript.
- *Why the resumed session runs in detached tmux:* it then shows up in nerve, can receive typed instructions, and outlives the agent.
- *Safety:* refuse to unpack over a dirty checkout.

**D9. Replay protection on two layers.**

- *Evidence:* during E14 the seen-set was wiped, and a fresh agent replayed stored commands, including typing an old instruction.
- *Decision:*
  - The persisted seen-set covers every message type.
  - A hard 5-minute age limit applies to `Send`, because typing is not idempotent.
  - Answers are naturally idempotent: an unknown or answered request returns "already resolved".

**D10. Deferred: iroh bulk lane, phone/web client, NIP-59 by default, NIP-42 relay auth.**

- iroh becomes attractive once nerve's MSRV reaches 1.91. It could also run as a separate `nerve-bulk` sidecar today.
- A web or PWA client can reuse `protocol.rs` one-to-one: it is plain JSON in NIP-44.
- Remote Control and Nostr are complementary. Use Remote Control for zero-setup phone chat. Use nerve for fleet view, handoff and jobs, none of which Remote Control offers.

**D11. One-shot CLI commands never act on peer commands.**

- *Why:* `nerve sync send` starts a short-lived agent. If that agent consumed a `Send` addressed to this device, it would exit mid-task and the long-lived agent would never see it.
- *Decision:*
  - Short-lived agents only read.
  - When a long-lived agent is running (pid heartbeat), the CLI queues requests through `spool/` instead of starting a second agent.

**D12. The Devices view keys its selection by row identity, not by index.**

- *Evidence:* during TUI testing, a peer republished its state with sessions in a different order, and `m` sent an instruction to the *wrong session*.
- *Decision:*
  - Selection is keyed by row identity.
  - Agents publish sessions in a stable order (by cwd, then id).
  - A regression test covers this (`selection_follows_the_row_not_the_index`).

**D13. Keep MSRV 1.85 without pinning by hand.**

- The new transitive deps (icu 2.3 via `url`) want rustc 1.88. The lockfile was resolved with `CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback`.
- Zero pre-existing dependency versions changed.
- Verified: `cargo build --locked --all-targets` passes on rust:1.85 both with and without `--features sync`.

**D14. Environment facts, recorded rather than worked around in code.**

- **macOS Local Network Privacy.** It blocked our ad-hoc-signed binaries (and Go's `nak`) from dialling the Pi's **LAN** IP (`EHOSTUNREACH`), while Apple-signed curl and nc worked. Tailscale addresses were unaffected. Docs recommend tailnet or public relays from macOS.
- **Setting `CLAUDE_CONFIG_DIR=~/.claude` explicitly makes Claude rerun onboarding**, because it then looks for `~/.claude/.claude.json`. So the env var is set only for relocated roots.
- **The tmux server, not the caller, runs `new-session`'s command.** PATH and config therefore travel with `-e`.

---

## Round 2 (2026-10-12): mods, incremental sync, one-command setup

**D15. Prefer a Claude Code mod over tmux paste and settings hooks, and keep both as fallbacks.**

- *Decision:* `nerve setup` installs a mod (`mod/nerve`, embedded in the binary) on Claude Code ≥ 2.1.287. Each session's mod connects to the device's agent over a Unix socket and:
  - submits prompts with `$.prompt.submit`;
  - answers permissions from `classic.PermissionRequest`;
  - answers questions by racing Claude's own `AskUserQuestion` dialog;
  - reports `turn.start` and `turn.complete`.
- *Why:*
  - **Prompts.** A typed paste lands in whatever the TUI is showing. If a dialog is open, it can answer the dialog. `prompt.submit` is queued behind a running turn instead (E18b), and it reaches `claude --bg` sessions, which have no terminal at all.
  - **Questions.** The settings `PreToolUse` hook hides the question dialog while it waits (D2), so questions needed away mode. The mod leaves the dialog up and races it (E20), so away mode is no longer needed for sessions with the mod.
  - **Signals.** The mod knows when a turn starts and ends, and what it cost, rather than inferring that from the transcript.
- *Fallbacks:* sessions without the mod (older Claude, a session started before setup, or `--bare`) still get tmux/Ghostty paste and settings hooks, unchanged. The Devices view marks each session `mod`, `tty` or `view`.
- *Costs:*
  - Mods are not sandboxed. The nerve mod can approve tool calls, and that is the point of it. It talks only to a 0600 socket owned by the same user.
  - Mods load only in trusted folders, and the first load of a `--plugin-dir` mod asks for approval. An installed plugin (`claude plugin install`) loaded without a prompt in a trusted folder (probed).
  - Claude Code 2.1.287 or newer is required.

**D16. Mod hooks wait inside `$.http.fetch`, never `$.clock.sleep`.**

- *Evidence:* E21 run 1. A hook has 10 s of its own time, a sleep loop spends it, and after 10 s the hook was abandoned with the request still listed. An in-flight `$` call pauses the clock (`HookBudget` docs; E19 now holds 20 s).
- *Decision:* the agent offers `/v1/wait`, a 2 s long-poll per request.

**D17. Detect a local answer by watching the tool call settle, not by `next.signal`.**

- *Evidence:* the probe logged `next.signal.aborted == false` for 14 s after the user pressed "Yes".
- *Decision:*
  - The mod wraps every `tool.call`. When a call with the same tool and input settles after the request was raised, the request is withdrawn.
  - The agent drops any request whose hook stops polling for 6 s.

**D18. Hand-off is incremental: negotiate git, content-address everything else.**

- *Problem raised:* sending the whole repo history and the whole transcript on every hand-off.
- *Decision:*
  - **Git.** The target reports its checkout's tips, and the source bundles `--all --not <tips>`. The repo is identified by its root commit, so an unrelated checkout at the same path is never treated as "has these commits".
  - **Files.** The patch, untracked files, transcript and sidecars are cut with FastCDC-style content-defined chunking (gear hash, 2/8/32 KiB). Each chunk is stored by SHA-256 in `<sync>/chunks`. Per-peer `known/` lists record what each peer has acknowledged.
  - **Index.** The list of files and chunk ids travels as a chunked file too, so a big repo's index can't overflow a message.
- *Why content-defined rather than fixed-size or rsync-style:*
  - Transcripts are append-only JSONL, but an edit can land anywhere in a patch or untracked file.
  - With CDC both cost only the chunks around the change, and nothing needs a round trip to compute signatures first.
- *Result:* second hand-off 16–19 KiB against 694 KiB (E22). Chunks are verified against their id on arrival, and a pruned or missing chunk is re-requested.
- *Not done:* compressing chunks. Transcripts compress about 5×, but NIP-44 output is base64 anyway, and the bulk lane is the private relay. Worth adding if public-relay hand-offs of big repos matter.

**D19. One command per device: `nerve setup [code]`.**

- *Decision:*
  - **Without a code:** create an identity on the two verified public relays, install the mod (or hooks on older Claude), install the agent as a service, and print a one-time invite code plus a QR.
  - **With a code:** do the same, then pair.
- *Services:*
  - launchd LaunchAgent on macOS.
  - systemd user unit on Linux, with `loginctl enable-linger` so a headless Pi keeps it after logout.
  - On Termux or containers: a detached process, plus a `~/.termux/boot` script and `termux-wake-lock`.
- *Pairing:*
  - The invite is base64url JSON: name, pubkey, a 128-bit one-time secret and the relays.
  - The joiner trusts the inviter and sends `PairRequest{secret}`.
  - The inviter's agent accepts that one message type from unknown keys, and only while an invite is open: it subscribes to strangers only then.
  - The secret is consumed (deleted before checking, so two racing joiners can't both win). The inviter pairs back and acks.
- *Security:*
  - The code is a credential for an hour. Anyone with it can pair a device that can then type into your sessions. It is printed only on the inviting device.
  - A wrong or used code gets a refusal ack, which reveals nothing the code didn't already contain.

**D20. The Devices view is a two-pane screen that collapses for phones.**

- *Layout:*
  - **Wide** (≥ 90 columns): a device list on the left (freshness dot, waiting count, sessions, hand-off progress bars) and the selected device on the right.
  - **Narrow:** the list becomes a tab strip, so the same keys work in a phone's SSH app.
- *Content:*
  - "Needs you" (permissions, questions with numbered options) always comes first; sessions are ordered waiting → working → idle.
  - The selected session shows its path, last turn (time, tokens) and transcript tail.
  - The footer shows the last event, so acks are visible without a log pane.
- `Tab`/`←→` switch device. The title shows "N needs you".

**D21. CLI commands follow the running agent's activity log.**

- *Evidence:* E23 run 1. With a service-managed agent running, every `nerve sync send/answer` printed only "queued". The ack happened, but the CLI couldn't see it.
- *Decision:* the long-lived agent appends its activity to `<sync>/activity.log`, capped at 1 MiB. A CLI command that hands work to it follows that file until the ack, as the one-shot path always did.

**D22. Test scripts must background nerve itself, not a shell function.**

- *Evidence:* `alpha sync agent &` backgrounds a subshell, so `kill $!` left the agent running. Ten orphaned agents from earlier demo runs, some two days old, were found and stopped.
- *Decision:* `demo.sh` and the experiment scripts start agents through a `bg` helper that runs the binary directly. Every script now ends with "no leftover agents".
</script>
<script type="text/plain" class="doc" id="d4" data-group="Overview" data-title="Experiment results" data-path="research/sync/experiments/RESULTS.md"># Experiment results (raw numbers live in the `*.out` files next to this)

Setup, 2026-10-09/10:
- **Mac:** M-series, macOS 27.0.1, Claude Code 2.1.295, LAN address 192.168.1.18, Tailscale address 100.100.98.51.
- **Pi:** Raspberry Pi 5 (8 GB), Debian 13, Claude Code 2.1.288 logged in with a claude.ai Max account, LAN address <lan-ip>, Tailscale address <tailscale-ip>. Same home LAN as the Mac.
- **Harness:** `research/sync/lab` (`nsync-lab`), built natively and for linux/arm64 in Docker.
- **How RTT is measured:** every RTT is a ping→pong→ping round trip measured on one clock. Clock skew between the two machines therefore can't distort the numbers.

## E1: public relay limits (`e1_*.out`)

NIP-11 advertised limits and the probed limits disagree. What relays actually accept, measured by publishing NIP-40-expiring events of increasing size:

| relay | largest accepted | note |
|---|---|---|
| relay.damus.io | 128 KB, then rate-limited | "you are noting too much" after ~10 large events |
| nos.lol, nostr.mom | 60 KB (rejects 64 KB) | strfry default `maxEventSize` 64 KiB |
| relay.primal.net | 256 KB (rejects 500 KB) | |
| relay.nostr.net | 200 KB | |
| relay.snort.social | 500 KB | memlay, idle timeout 10 s |
| offchain.pub | 8 KB from an unknown key | "pubkey is not in our web of trust" |

**Decision:** cap every event at 32 KiB of plaintext and chunk anything bigger. That fits under every relay we tested, including strfry and nostr-sdk's own embedded relay, whose default is 64 KiB.

## E2: Nostr Mac→Pi→Mac over public relays, NIP-44 encrypted (`e2_*.out`)

| path | payload | RTT p50 | RTT p95 | loss |
|---|---|---|---|---|
| relay.primal.net | 512 B | 640 ms | 813 ms | 0% |
| relay.nostr.net | 512 B | 909 ms | 1343 ms | 0% |
| primal + nos.lol + nostr.mom (first copy wins) | 512 B | 721 ms | 947 ms | 0% |
| primal, NIP-59 gift wrap (kind 1059) | 512 B | 704 ms | 1021 ms | 0% |
| primal | 8 KB | 1302 ms | 1374 ms | 0% |
| primal | 32 KB | 1732 ms | 5284 ms | 0% |
| primal | 60 KB | 2466 ms | 5372 ms | 0% |
| **nos.lol, nostr.mom** | 512 B | — | — | **100%** |

Publish acknowledgements (relay `OK`) arrive in 200–430 ms.

**Finding: silent drops.** nos.lol and nostr.mom answer `OK true` but never deliver or store events from a fresh, reputation-less pubkey. `nak req` afterwards finds nothing, for ephemeral 21059/25501 and for regular 4501 alike. These relays shadow-drop spam. **A relay's OK is not proof of delivery.** The protocol needs end-to-end acks, and a fleet must not depend on a single public relay.

**Finding: rate limits are real.** Within minutes of starting tests, damus banned the test key ("banned: rate-limit"), and nostr.mom rate-limited it ("slow down matey").

## E3: self-hosted relay on the Pi (nostr-sdk `LocalRelay`, embedded in our own binary)

| path | payload | RTT p50 | RTT p95 | loss |
|---|---|---|---|---|
| ws://<relay-host>:7777, over Tailscale | 512 B | 15.8 ms | 27.5 ms | 0% |
| same, NIP-59 gift wrap | 512 B | 15.0 ms | 18.6 ms | 0% |
| same | 60 KB | rejected | | `max_event_size` 65536 (configurable) |

That is 40–45× faster than public relays, with no third party and no rate limits. The relay is about 30 lines of code on top of nostr-sdk's `local-relay` feature.

**Finding: macOS Local Network Privacy.** Our ad-hoc-signed Rust binary, and Go's `nak`, got `EHOSTUNREACH` ("no route to host") when dialling the Pi's **LAN** IP over TCP. `curl` and `nc`, which are Apple-signed, reached it fine. The Tailscale `utun` address was unaffected. This matches macOS's per-app Local Network permission. In practice, on macOS, dial peers by Tailscale address or by a public relay, or sign the binary and grant the permission.

## E4: iroh 1.3 (QUIC, dial-by-key, n0 public relays) (`e4_iroh.out`)

| path | RTT p50 | RTT p95 | bulk |
|---|---|---|---|
| direct path (iroh discovered and selected the LAN address <lan-ip> on its own) | 8.5 ms | 9.3 ms | 64 MiB at 14.7 MiB/s |
| relay-only (`clear_ip_transports`), via aps1-1.relay.n0.iroh.link | 197 ms | 231 ms | 16 MiB at 1.1 MiB/s |
| baseline: scp over Tailscale | — | — | 64 MiB at 13.8 MiB/s |

- Connection setup including key lookup took 744 ms. Becoming "online" (relay plus address discovery) took 3.3 s on the Pi.
- iroh needed no configuration, no ports and no Tailscale, and it upgraded to the LAN path automatically.
- The catch is that iroh 1.3 requires **MSRV 1.91**, but nerve pins 1.85. It also has no store-and-forward, so a sleeping laptop misses messages.
- So iroh fits a separate "bulk lane" binary or a future MSRV bump, not the control plane.

## E5–E6: controlling a live interactive Claude Code session on the Pi (tmux)

- **E5, inject an instruction.** `tmux send-keys -l "<text>"` + `Enter` into a fullscreen-TUI Claude session works. Multi-line text works with `tmux load-buffer` + `paste-buffer -p` (bracketed paste), followed by `Enter`. Claude replied `alpha-beta-gamma` to a 4-line paste.
- **E6a, answer a permission prompt remotely.** A `PermissionRequest` hook (our `mailbox-hook.sh`) parks the request in a mailbox and blocks. Writing `{"hookSpecificOutput":{"hookEventName":"PermissionRequest","decision":{"behavior":"allow"}}}` into the response slot approved it. The transcript shows "Allowed by PermissionRequest hook".
  - **The local dialog is displayed while the hook waits.** Local and remote answers therefore *race*: whichever comes first wins.
- **E6b, answer AskUserQuestion remotely.** A `PreToolUse` hook matched on `AskUserQuestion` returns `permissionDecision: allow` + `updatedInput: {questions, answers: {"<question>": "Bash"}}`. Claude logged "User answered Claude's questions: → Bash" and wrote `greet.sh`.
  - **Unlike PermissionRequest, the question dialog is NOT shown until the hook returns.** Remote-answering questions must therefore be opt-in ("away mode"). Otherwise the person at the keyboard can't answer.
- **E6c/E6d, the local answer wins the race.** After a local "1" keypress the stale `PermissionRequest` hook keeps blocking until its own timeout. That is harmless: its late output is ignored. Its pending request must be withdrawn, though, or remote devices show a stale question.
  - The hook input carries `transcript_path`, `tool_name` and `tool_input`, but **no tool_use_id**. The transcript grows by about 10 KB the moment the local answer lands.
  - **Design:** the hook finds the matching `tool_use` in the transcript tail. Once a `tool_result` with that id appears, the request was answered locally, so the hook withdraws the request and exits.
- **Notification hook.** It fired with `notification_type: permission_prompt` about 6 s after the prompt appeared. That is enough for "needs you" alerts, but too slow and too lossy to drive answering.

## E7: hand a session over Mac → Pi (`claude/handoff-*.sh`)

The pack is a git bundle of all refs, a `git diff --binary HEAD` working-tree patch, a tar of untracked files, and the transcript plus its sidecar directory: 779 KB, mostly the transcript.

Steps that worked:
1. On the Mac, `claude -p` created a session that was told a codeword and made an *uncommitted* edit.
2. The pack was copied to the Pi and unpacked to a **different absolute path** (`/home/user/nerve-lab/ho-plain`). The transcript was installed under the slug for *that* path, without rewriting any paths inside it.
3. On the Pi, `claude --resume <id> --fork-session` in that directory recalled `PINEAPPLE-42` and correctly edited `calc.py` in the *new* path, which already carried the Mac's uncommitted change.

**Finding:** the cwd slug is the only path that has to match. Old absolute paths inside the transcript did not confuse the next turn. Path rewriting is offered as an option but is not needed.

## E8: headless worker shape (`claude -p --output-format stream-json --verbose --include-hook-events`)

- A 8-turn job (write a test, run it) produced 29 events: `system/init`, `assistant` with `tool_use` blocks, `user` with `tool_result`, `rate_limit_event`, and a final `result`.
- The `result` event carries `num_turns`, `duration_ms`, `total_cost_usd` and `session_id`.
- The job took 11.3 s and cost $0.005 with Haiku.

This is the job-worker contract: stream the progress, keep the `session_id` (so it can be resumed or handed off later), and report the result.

## E9: Ghostty injection on the Mac (AppleScript)

Ghostty 1.3.1's scripting dictionary has `input text <s> to terminal id <id>` ("as if it was pasted") and `send key "enter"`.

The test opened a throwaway window running `cat > file` and injected `line one\nline two; with $(dollar) and "quotes"`. Both lines arrived verbatim, with no shell expansion, and submitted correctly.

nerve already resolves the Ghostty terminal id for every terminal session (`platform::ghostty`). Remote instructions therefore reach Ghostty tabs as well as tmux panes.

## E10–E15: the integrated prototype, `nerve --features sync`, Mac ↔ Pi

These runs use the real nerve binary on both machines (the Pi build is cross-compiled for linux/arm64). Each device has its own config dir and Nostr identity. "Private relay" means `nerve sync serve-relay` on the Pi.

| # | what | path | result |
|---|---|---|---|
| E10a | `nerve sync send pi <session> "<text>"` | private relay over Tailscale, plus primal | ✓ typed into tmux pane %3; ack back on the Mac. ~3 s per CLI invocation, mostly the one-shot client connecting |
| E10b | pending `Write` permission visible on the Mac | same | ✓ `nerve sync status` lists `? <id> [permission] Write: …/hello.py` within one publish cycle (~4 s) |
| E10c | `nerve sync answer pi <id> allow` | same | ✓ ack "answered"; the file appeared on the Pi ~3 s later. The transcript says "Allowed by PermissionRequest hook" |
| E10d | `nerve sync fetch pi <session> diff` | same | ✓ git status and diff of the Pi checkout printed on the Mac |
| E11 | AskUserQuestion answered from the Mac (Pi in away mode) | same | ✓ question with options [Namaste, Hola] seen on the Mac; answered "Namaste"; the following Write permission was also answered remotely; `greet.txt` = Namaste |
| E12 | `nerve sync handoff <mac session> pi --then "<question>"` | same | ✓ 730 KiB pack in **0.6 s** over the private relay (20.7 s when sent through a public relay); resumed in tmux `nerve-cc6fb097` at `/home/user/nerve-handoff/demo2`; answered "The secret project codename is BLUE-HERON" (set on the Mac) and added `mul()` on top of the Mac's uncommitted `sub()` |
| E13 | three jobs: `--needs linux`, `--needs macos`, `--needs gpu,cuda` | same | ✓ linux job routed to the Pi, ran, verify passed (`fizzbuzz.py` line 15 == FizzBuzz), 3 turns, $0.003. ✓ macos job ran on the Mac, verified. ✓ gpu job refused: "no device has [gpu, cuda]" |
| TUI | `D` → select Pi session → `m` → type → Enter → request appears → `a` | same | ✓ `tui.txt` written on the Pi with the exact text; ack shown in the Devices log. Found and fixed bug D12: a reorder sent the instruction to the wrong session |
| E14 | full loop with **no Tailscale**: relays primal + snort only | public internet | ✓ send → prompt visible → answer → file written. Answer-to-file took 1.1 s |
| E15 | job sent while the Pi agent was **offline**; agent started 25 s later | public relays only | ✓ job delivered from relay storage 1 s after the agent reconnected, ran, verified |

| relay | delivery | p50 RTT |
|---|---|---|
| relay.snort.social | 6/6 | 538 ms |
| relay.primal.net | 20/20 (E2) | 640 ms |
| nostr-pub.wellorder.net | 4/6 | 648 ms |

## E16: an agent delegates verified work to another device through nerve

A headless Claude (Haiku) on the Mac was told only how to use `nerve sync status` and `nerve sync job`. It was asked for proof that python3 on an aarch64 Linux machine reports its platform, and was told not to run anything locally.

1. **First run.** The job ran on the Pi but failed: headless jobs run with `--permission-prompts none`, so `Bash(python3 …)` was denied. The agent reported this honestly and did not work around it.
2. **Fix.** Added `--allow <rule>` (→ `--allowedTools`) to jobs.
3. **Second run.** It failed with 0 turns. Cause: `--allowedTools` is variadic and swallowed the positional prompt. Fix: the prompt now goes in on stdin.
4. **Third run (plat-proof-2).** ✓ The agent chose `--needs linux,aarch64 --allow 'Bash(python3 *)' --verify 'grep -q aarch64 plat.txt'`. nerve routed the job to the Pi, which ran it in 2 turns. Verify passed, and `plat.txt` on the Pi = `aarch64`. The agent took 10 turns and $0.08, including polling.

This covers requirement 9's "tell the agents to use the other device": the sync and routing go through nerve, and the agent needs nothing more than the CLI.

## E17–E22: Claude Code mods, one-command setup, incremental hand-off (2026-10-12)

Script: `e17_mod_e2e.sh`, output `e17_mod_e2e.out`. Two devices (alpha, beta) on one Mac, each with its own `NERVE_CONFIG_DIR`, sharing a private relay on localhost. A real interactive Claude Code 2.1.295 session (Haiku) runs on "beta" and loads the nerve mod with `--plugin-dir`.

### What a mod can do, probed first

A mod is a plugin whose JavaScript runs **inside** the Claude process (Claude Code ≥ 2.1.287). The full API is in the type declarations Claude writes into a mod's `.claude-plugin/types/` the first time it loads it (16,000 lines). The calls that matter for sync:

| need | mod API | what the probe showed |
|---|---|---|
| send a prompt to a running session | `$.prompt.submit({text, asUser: true})` | Starts a turn when idle. While a turn runs it is **queued**, and runs in order. Also works in `claude --bg` sessions, which have no terminal. |
| talk to nerve's agent | `$.http.fetch(url, {socketPath})` | HTTP over a Unix socket works, so no TCP port is needed. |
| answer a permission prompt | `classic.PermissionRequest` returning `{decision: {behavior}}` | The dialog **stays on screen** while the hook waits. A remote answer returned from the hook closes it. |
| answer `AskUserQuestion` | `tool.call {tool:'AskUserQuestion'}` returning `{result: {questions, answers}}` | Racing `next(e)` (Claude's own dialog) against a remote answer works. The dialog **stays visible** the whole time, so away mode is no longer needed. |
| progress | `turn.start`, `turn.complete` (`durationMs`, `usage`) | Fires per turn, with token counts and the model name. |
| show something in Claude | `$.ui.status(text)` | One line under the prompt: `⚠ nerve: ⇄ nerve · alpha 2s · 1 waiting on another device`. |

**Dead ends found:**
- `$.ui.ask` can't be cancelled once shown.
- Returning early from `tool.call` while Claude's own permission dialog is open **leaves the dialog on screen** and wedges the turn.
- Both are why the mod answers through `classic.PermissionRequest` rather than replacing dialogs.

**Two traps that cost a re-run each:**

1. **A mod hook has 10 s of its own time** (`HookBudget.ms`). The budget pauses while a `$` call is in flight, except `$.clock.sleep`.
   - The first version waited for remote answers with a sleep loop. The hook was cut off after 10 s and the request vanished from other devices.
   - The fix: wait inside `$.http.fetch` (a 2 s long-poll on the agent, `/v1/wait`), which doesn't count.
   - E19 now waits 20 s before answering, to prove it.
2. **Claude does not abort `next.signal` when the user answers a permission dialog at the keyboard.**
   - Measured: `aborted=false` for 14 s after the local answer, until the hook ran out.
   - The mod therefore watches its own `tool.call` hook. When a call with the same tool and input settles, it was answered here, and the request is withdrawn (E21).
   - The agent also withdraws any request whose hook stops long-polling for 6 s.

### Results

| # | what | result |
|---|---|---|
| E17 | `nerve setup` on beta prints a one-time code; `nerve setup <code>` on alpha joins | ✓ both trust each other after **4.7 s**. The code is single-use; a re-run by an already-paired device just confirms |
| E18 | prompt from alpha to an idle session | ✓ `submitted to the session`, ack in **0.37 s** (one-shot CLI, including its connect) |
| E18b | two prompts sent while a 6 s tool call runs | ✓ both queued by Claude and run in order (`E18-QUEUED` answered last) |
| E19 | `Write` permission, answered from alpha **20 s** after it appeared | ✓ still pending after 20 s, then allowed, file written; dialog visible locally throughout |
| E20 | `AskUserQuestion`, answered from alpha, **no away mode** | ✓ question visible on both devices; alpha's "Blue" answered it |
| E21 | permission answered at the keyboard | ✓ withdrawn from alpha's view (pending 1 → none), file written |
| E22 | hand-off beta → alpha, then one more turn and one commit, then again | ✓ first: **694 KiB** (101/101 chunks), 0.5 s. Second: **16–19 KiB** (4–5 of 100 chunks), 0.5 s. Both resumed in tmux with the conversation |

### Hand-off size, in detail

The old pack was one tar: a `git bundle --all` (full history), the patch, untracked files and the transcript, always sent whole. The new one is an exchange:

1. **Offer.** It names the repo by its root commit.
2. **Have.** The target answers with the commit tips its checkout already has.
3. **Pack.** The source bundles only `--all --not <tips>`, so with nothing new there is no bundle at all. Every other file (patch, untracked files, transcript, subagent sidecars) is cut into content-defined chunks: gear hash, 2–32 KiB, 8 KiB average, SHA-256 ids.
4. **Push and fill.** The source pushes only chunks it doesn't know the target holds. The target asks for anything still missing (`ChunkWant`), then acks.
5. **Remember.** On the ack both sides record which chunks the other has.

| | first hand-off | second (1 turn + 1 commit later) |
|---|---|---|
| git | full bundle | only the new commit |
| transcript (~700 KiB, append-only) | all chunks | the re-cut tail: 1–2 chunks |
| sent (E22) | 694 KiB | **16–19 KiB** (~2.5%) |

Unit tests pin the properties:
- an append re-sends at most the old last chunk plus the new bytes;
- an edit in the middle stays local (≤ 3 chunks);
- a forged chunk is rejected by id;
- a second hand-off moves under a tenth of the first (`handoff::tests`).

## E23–E26, E25b: Mac ⇄ Pi, public relays only (2026-10-12)

Scripts: `e23_pi_e2e.sh` and `e25b_mac_session_pi_answers.sh`, outputs next to them.

- **Relays:** only relay.primal.net and relay.snort.social. No private relay, no Tailscale relay; SSH only drives the test.
- **Configs:** throwaway on both machines.
- **Pi:** Claude Code 2.1.296 with the nerve mod loaded via `--plugin-dir`.

| # | what | result |
|---|---|---|
| E23 | `nerve setup` on the Mac prints a code; `nerve setup <code>` on the Pi joins **and installs the systemd user service** | ✓ join + service in **4 s**. `systemctl --user` shows `nerve-sync.…service active running`; `nerve sync doctor` all ✓ except "mod not installed", which is expected with `--no-claude` |
| E24 | prompt from the Mac to the Pi's session, via the mod | ✓ `submitted to the session`, ack in **0.86 s** (4.8 s in the first run, which included the CLI's own relay connect) |
| E25 | permission on the Pi, answered from the Mac | ✗ **not run.** The Pi's Claude account hit its usage limit ("You've hit your session limit · resets 10:20pm") partway through, so Claude on the Pi never asked. Covered by E25b. |
| E25b | the same, reversed: Claude on the Mac with the mod, answered from the Pi | ✓ prompt visible on the Pi after **6 s**. Answered with `nerve sync answer mac … allow` from the Pi; ack ~5.8 s including SSH and a one-shot client; file written on the Mac |
| E26 | hand the Pi's session to the Mac (**Pi → Mac, never run in round 1**), then once more after a commit | ✓ first: 5 of 5 chunks, 3.1 s, resumed in tmux on the Mac. Second: **3 of 5 chunks**, 2.3 s. The Mac checkout's HEAD was the new commit ("more") |

In E26 the test repo is tiny (≈24 KiB packed), so the second transfer saves less than in E22, where the transcript dominates. The index file and the transcript tail are always re-sent; the unchanged files and old history are not.

**Finding: a service-managed agent hid acks from the CLI.**
- In E23's first run, every `nerve sync send` and `answer` printed only "queued", because the systemd agent did the work. The ack arrived, but the CLI couldn't see it.
- Fix (D21): the agent writes `activity.log`, and the CLI follows it until the ack.
- The timings above come from that.

<script type="text/plain" class="doc" id="d5" data-group="Overview" data-title="User guide (docs/SYNC.md)" data-path="docs/SYNC.md"># Cross-device sync (`--features sync`)

Watch and drive Claude Code sessions running on your other devices: a
laptop, a desktop, a small always-on server. From any device you can:

- see every device's sessions and when each device last synced;
- type an instruction into a session running elsewhere;
- answer its permission prompts and `AskUserQuestion` questions;
- read its diff, transcript tail and subagent work;
- move a session to another device and carry on there;
- send a job to whichever device has what the job needs;
- send files and git refs into a named place on another device, or pull
  them from it;
- run an allowlisted command on another device and get its exit code.

Transport is [Nostr](https://github.com/nostr-protocol/nips): every
device dials *out* to one or more relays over WebSocket, so it works
behind NAT with **or without** Tailscale. Everything is NIP-44
encrypted to the receiving device; relays only see ciphertext, kinds,
timestamps and public keys.

The research behind this design is in `research/sync/`:
- `REPORT.md`: findings, measurements and the comparison of 48 alternatives;
- `DECISIONS.md`: why each choice was made;
- `experiments/`: raw results.

## Set up

One command per device. On the first device:

```bash
./install.sh --sync            # from the repo: builds with sync, then runs `nerve setup`
nerve setup                    # if nerve is already built with --features sync
```

It creates the device's key, installs the nerve mod into Claude Code
(2.1.287 or later), installs the background agent (launchd on macOS,
a systemd user unit on Linux, a detached process plus Termux:Boot
script on Termux), and prints a one-time invite code and QR.

On every other device:

```bash
./install.sh nerve1…           # or: nerve setup nerve1…
```

That joins: both devices trust each other, and the joiner adopts the
inviter's relays. A code works once, for an hour. Make another with
`nerve sync invite`. Check a device with `nerve sync doctor`.

Flags: `--name N`, `--relay URL` (repeatable), `--no-service`,
`--no-claude`, `--no-wait`. Re-running `nerve setup` is safe.

The pieces underneath are still available: `nerve sync init`, `pair`,
`relay add|rm` and `install-hooks`.

### The nerve mod

`nerve setup` registers `<config>/sync/mod` as a local plugin
marketplace and installs `nerve@nerve-local`. New Claude sessions load
it; restart older ones to pick it up. It connects to the agent's Unix
socket (`<config>/sync/agent.sock`, mode 0600) and:

- submits prompts sent from other devices with `$.prompt.submit`
  (queued while a turn runs; works for `claude --bg` sessions);
- offers permission prompts and `AskUserQuestion` questions to other
  devices while Claude's own dialog stays on screen. The first answer
  wins, and an answer at the keyboard withdraws the request;
- reports each turn's duration and token use;
- shows `⇄ nerve · server 4s · 1 waiting on another device` under the prompt.

Sessions without the mod (older Claude, `--bare`, started before
setup) fall back to tmux/Ghostty paste and the settings hook, as before.
The Devices view tags each session `mod`, `tty` or `view`.

### Relays

| setup | how | measured RTT | notes |
|---|---|---|---|
| Public relays (default) | what `nerve setup` configures | **0.5–0.9 s** | No VPN at all. Relays see metadata. |
| + private relay | `nerve sync serve-relay` on an always-on device, then `nerve sync relay add ws://<relay-host>:7777` on each device | **~16 ms** | Bulk data (hand-offs, diffs) goes only here when connected. In memory. |

Public relays that worked for fresh keys in testing:
- relay.primal.net
- relay.snort.social
- relay.nostr.net (lossy)

nos.lol and nostr.mom acknowledged events but never delivered them.

## Run

`nerve setup` installs the agent as a service, so there is nothing to
start by hand. The TUI attaches to that agent as a viewer; on a device
without the service, `nerve` starts an agent itself. The status bar
shows `⇄ server 4s · 1 needs you`.

Run only **one agent per device key**. Two agents holding the same key
both act on every command.

## Use it

In the TUI, press `D` for Devices. At 90 columns or more, the device
list is on the left and the selected device on the right; on narrower
terminals (a phone over SSH) the list becomes a tab strip:

```
╭ Devices  1 needs you ─────────────────────────────────────────────────────────╮
│ ● laptop  published 2s ago  · 1 session(s) via mod                     relays ●● │
│                              │ ● server  synced 3s ago  linux aarch64         │
│▌● server                     │   can run: linux aarch64 tmux git cargo        │
│    synced 3s ago · 1 waiting │                                                │
│    2 sessions, 1 active      │ NEEDS YOU                                      │
│                              │ ▶ demo wants to run Write  12s                 │
│ ● pixel                      │       /home/user/demo/tui.txt                  │
│    synced 1m ago             │                                                │
│    0 sessions                │ SESSIONS  2                                    │
│                              │   ● demo        waiting: permission  ⎇ main  mod│
│ → server 4153487f            │   ● notes       idle                       tty │
│ ██████████████░░░░░░░ 61/101 │                                                │
│ 13:52:00Z server ✓ …: answered 46bf0e3df7a5a6b7                                   │
│ a allow  x deny  Tab device  r sync  Esc close                                │
╰───────────────────────────────────────────────────────────────────────────────╯
```

Keys in the Devices view:

| key | on | does |
|---|---|---|
| `Tab` / `←` `→` | | next / previous device |
| `j/k` | | move |
| `a` (or Enter) / `x` | permission | allow / deny |
| `1`-`9` / `x` | question | choose an option / decline |
| `m` (or Enter) | session | send a message to it |
| `d` / `l` / `g` | session | fetch its diff / transcript / subagent work |
| `r` | | sync now: republish here and ask every peer to |
| `A` | | toggle away mode on *this* device (only matters for sessions without the mod) |

On the main grid, `H` hands the selected session to another device.

The same features are available from the CLI:

```bash
nerve sync doctor                               # is this device set up and talking?
nerve sync invite                               # a one-time code for another device
nerve sync status                               # last synced, sessions, pending prompts
nerve sync send server 4c14e2fb "run the tests again"
nerve sync answer server 15a12dee3382bc05 allow     # or deny, or an option label
nerve sync fetch server 4c14e2fb diff
nerve sync handoff cc6fb097 server --to proj --then "carry on with the next step"
nerve sync job --needs macos --verify 'xcodebuild test ...' "ios tests" -- "fix the failing UI test"
nerve sync put server proj build --delete --wait
nerve sync get server proj build/reports --wait
nerve sync refs server proj feature:refs/remotes/laptop/feature --wait
nerve sync refs server proj --pull main:refs/remotes/server/main
nerve sync run server --place proj --timeout 1800 --wait -- make test
nerve sync away on
```

## How each feature works

### Progress and "last synced"

- Each agent scans local sessions (the same discovery the TUI uses) every
  3 s. It republishes its **device state** when anything changes, and at
  least once a minute.
- The state includes:
  - sessions: state, waiting reason, cwd, branch, cost, subagent count and an 8-line transcript tail;
  - pending prompts;
  - jobs;
  - capabilities;
  - away flag.
- It is an *addressable* Nostr event (kind 30078, one per recipient). The
  relay keeps only the newest copy, so a laptop that has been shut keeps
  showing what it was doing when it went away, with the time.
- "Last synced" is the time the peer generated that state.
- `r` / `nerve sync sync` republishes immediately and asks peers to do the same.

### Sending an instruction

- The receiving agent finds the session's tmux pane (by tty) or Ghostty
  tab (through AppleScript `input text`).
- It checks that the PID is still a live `claude` process, then pastes the
  text as a bracketed paste and presses Enter.
- Control characters are stripped, so a peer can't send Escape or Ctrl-keys.
- Instructions older than 5 minutes are refused instead of typed. Typing
  is not idempotent, so a replay must never land.
- Background (`claude --bg`) and desktop-app sessions have no pane, so
  they are view-only.

### Answering prompts and questions

With the mod (see above), both permissions and questions go remote while
the dialog stays on screen. Without it, the settings hook works as
follows.

`nerve sync hook` is a Claude `PermissionRequest` hook and a `PreToolUse`
hook on `AskUserQuestion`.

**Permission prompts.** The dialog stays on screen while the hook waits,
so a local keypress and a remote answer race. Whichever arrives first
wins. The hook notices a local answer in the transcript and withdraws its
request.

**Questions.** The question dialog is *hidden* until the hook returns.
Questions therefore go remote only in **away mode** (`A`, or `nerve sync
away on`), or with `remote_questions = "always"`. Otherwise the person at
the keyboard couldn't answer.

**Timeouts and fallback.** The hook gives up after `hook_timeout_secs`
(default 600) and Claude asks locally as usual. With no agent running,
the hook returns at once.

### Handoff

`H` or `nerve sync handoff` starts a short exchange:

1. **Offer.** The source names the session and the repo, by its root commit.
2. **Have.** The target answers with the commit tips its copy of that repo
   already has (none for a new checkout).
3. **Pack.** The source bundles only the commits beyond those tips, then
   chunks the working-tree patch, untracked files, the transcript and its
   subagent sidecar. Chunking is content-defined (2/8/32 KiB, SHA-256 ids).
4. **Push.** It sends the index, then only chunks the target isn't known to
   hold. The target asks for anything missing.
5. **Unpack.** The target restores the repo where it was told (see
   *Where a hand-off lands*), refusing to overwrite uncommitted work. It installs
   the transcript under the slug Claude derives from the *new* path, and runs
   `claude --resume <id> --fork-session` in a detached tmux session
   `nerve-<id>`, typing `--then <text>` if given.
6. **Remember.** Both sides record which chunks the other now holds, so the
   next hand-off sends only what changed. A 700 KiB session one turn and one
   commit later moved 16–19 KiB (E22).

Chunks live in `<config>/sync/chunks/`, pruned oldest-first above 512 MiB.

#### Where a hand-off lands

The target picks the first of these that applies:

1. the place named with `--to <place>`: its `[places]` entry on the target;
2. the source path mapped through the target's `[path_map]`;
3. `<handoff_root>/<repo name>`, but only when `handoff_root` is set.

With none of these, the target refuses and names the config to add. It
never picks a directory on its own.

An existing checkout keeps its branch. The hand-off is refused, unless
you pass `--force`, when:

- the checkout is on a different branch from the hand-off's, or
- its branch has commits the hand-off doesn't have.

Uncommitted changes always refuse it.

### Jobs

`nerve sync job` routes to the least-busy device that advertises every
`--needs` capability, or to `--on <device>`.

- **Detected capabilities:** OS, architecture, tmux, docker, git, node,
  cargo, plus `xcode` and `ios-sim` when Xcode is installed.
- **Extra capabilities:** add them under `caps` in `fleet.toml`.
- **Running:** the device runs `claude -p` headless, with
  `--permission-prompts none` (nothing hangs waiting for a human), and
  streams progress.
- **Verifying:** it then runs `--verify`. Exit 0 marks the job done and
  verified.
- **Offline devices:** jobs sent to a device that is asleep wait on the
  relay for up to a day. They start when it reconnects.
- **Re-running:** the job's `session_id` is reported, so it can be
  resumed or handed off.
- **Where:** `--cwd` on the executing device. Without it, the job runs in
  `job-<id>` under `handoff_root` when that is set, else in
  `<config>/sync/jobs/`.

### Places

A place is a name for a directory, defined on each device in its own
`fleet.toml`:

```toml
[places]                        # on the laptop
proj = "/Users/me/code/proj"
```

```toml
[places]                        # on the server
proj = "/srv/proj"
```

Commands name the place. Each side resolves its own path, so a sender
never needs to know remote paths. A place missing on either side is
refused, with the line to add.

### Files: `put` and `get`

```bash
nerve sync put server proj build scripts/check.sh --wait
nerve sync get server proj build/reports --delete --wait
```

`put` sends files and directories, given relative to the place (`.` is
the whole place). `get` asks the peer to send them back the same way, so
either device can start a transfer.

- **Incremental.** Files go through the hand-off's content-defined chunks
  and per-peer ledger, so only chunks the peer isn't known to hold travel.
  A repeat put of a 61-file, 1 MiB folder with one changed file moved
  8.9 KiB (2 of 237 chunks).
- **Atomic.** Each file is written to a temp file next to it and renamed
  into place. Its permission bits are kept. A file whose content and mode
  already match is left alone.
- **Contained.** Every path is checked before anything is written. A path
  that leaves the place (`..` or absolute), or that goes through a
  symlink, refuses the whole transfer. The sender skips symlinks.
- **`--delete`** removes files under the given *directories* that the
  sender no longer has, then any directories that leaves empty. It never
  deletes outside them, and doesn't follow symlinked directories.
- **`--wait`** blocks until the receiver acknowledges, then prints what
  moved. Without it, a running agent takes the transfer over and the
  command returns at once. With no agent running, the CLI stays until the
  transfer ends anyway. A failure exits 1.

```
beta ✓ b15eac3f…: beta place harness: 1 file(s) written, 60 unchanged, 0 deleted;
  received 8.9 KiB in 2 of 237 chunks (235 reused) in 0.5s
```

#### Big files: rsync

The relay holds every chunk in memory until it is deleted or expires,
so files at or over `[xfer] bulk_over` (default 64 MiB) skip it: the
relay carries the offer, the other side's path and the outcome, and
the files go over rsync on ssh.

```toml
[ssh]
server = "user@server.example"   # this device reaches the peer "server" at this ssh host

[xfer]
bulk_over = 67108864    # bytes
```

- **One route is enough.** rsync runs on whichever side has one. A
  device that can be reached but cannot reach back still sends: the
  peer with the route pulls from the path the sender gives. With no route on either side the
  transfer is refused, naming the setting to add.
- **Same rules.** Roots stay inside the place, symlinks are skipped
  (`-rtp`, no `-l`), nothing is written through one on the receiver,
  and `--delete` reaches only into the named directories. Each root is
  its own rsync; `--partial` lets each of up to three attempts resume.
- **Fallback.** A relay transfer the relay fails to carry (down,
  rate-limit patience spent) goes over rsync when there is a route. The
  path then comes from the far side's own nerve over ssh
  (`nerve sync place <name> --src|--dst <path>...`), never a guess. A
  `--wait` that hears nothing about its transfer for five minutes, or
  runs with no agent, does the same from the CLI.
- **Outcome.** The same `✓ <id>:` line and exit code as the relay path,
  ending `via rsync, N file(s), X MiB in Ys`. A running rsync logs a
  line a minute.

#### Relay memory

A sender deletes (NIP-09) the events of a transfer once the receiver
confirms it, and `serve-relay` sweeps expired events every ten minutes
and keeps at most 4000 (oldest dropped first), so the in-memory store
stays well under the service's memory cap.

### Git refs: `refs`

```bash
nerve sync refs server proj feature:refs/remotes/laptop/feature --wait
nerve sync refs server proj --pull main:refs/remotes/server/main --wait
```

Each pair is `<src-ref>:<dst-ref>`. The source is a branch, tag or `HEAD`
in the sender's place repo. The destination is a full ref in the
receiver's. `--pull` reverses the direction: the source is on the peer
and the destination is here.

- The receiver reports its branch and remote-tracking tips first, as for
  a hand-off. The git bundle carries only the commits beyond them, and
  none at all when it already has them.
- The receiver adds the bundle's objects (`git bundle unbundle`), then
  points **exactly the named destination refs** at their commits with
  `git update-ref`.
- Nothing is checked out. HEAD, the index, the working tree and every
  other ref stay as they were.
- These are refused:
  - a destination that isn't a full `refs/…` name;
  - the destination the receiver has checked out;
  - a place that holds a different repository (a different root commit).

### Runs

```bash
nerve sync run server --place proj --timeout 1800 --wait -- make test
```

`run` starts one command on a peer. The command runs only if the peer's
`fleet.toml` allows it:

```toml
[run]
allow = [
  { place = "proj", argv = ["make", "*"] },
  { cwd = "/srv/api", argv = ["make", "test"] },
]
```

- **Matching.** `argv` matches literally. A final `"*"` matches any
  further arguments, including none; a `*` anywhere else makes the rule
  match nothing. A rule with `place` or `cwd` applies only there; a rule
  with neither applies anywhere.
- **Refusals** name the rule to add and the file to add it to.
- **No shell.** The argv is passed as given. `./bin/x` resolves inside the
  run's directory; a bare name is looked up on PATH, then in
  `~/.local/bin`, `~/.cargo/bin`, `/opt/homebrew/bin` and
  `/usr/local/bin`. A rule with `shell = true` instead joins the argv with
  spaces and runs `sh -c`. A trailing `*` in such a rule admits arbitrary
  shell, so keep shell rules literal.
- **Directory.** `--place P` runs in the place's directory on the peer,
  `--cwd DIR` in an absolute directory there. With neither, it runs in the
  home directory.
- **Timing.** The 5-minute expiry applies to *starting*: a stored request
  older than that is refused. A started command runs as long as it needs,
  or until `--timeout` kills its process group (exit 124).
- **Replay.** Like every envelope, a run request is deduplicated by id, so
  it starts at most once.
- **Output.** Stdout and stderr are merged into a 20-line tail, sent at
  most once a second. `nerve sync status` and the Devices view list runs
  with jobs, showing the exit code once the run ends.
- **`--wait`** prints the output as it arrives, on stdout, and exits with
  the remote exit code. When the command never ran (refused, unknown
  device, no answer), it exits 125. Without `--wait`, it returns once the
  peer accepts or refuses.

## Files

All under `<nerve config>/sync/`:

| file | what |
|---|---|
| `device.key` | This device's secret key (0600). It identifies the device: keep it private. |
| `fleet.toml` | Name, relays, peers, extra capabilities, path map, policies. |
| `claude-settings.json` | Hooks for Claude (`install-hooks`). |
| `mailbox/` | Prompts waiting for a remote answer (settings-hook path). |
| `agent.sock` | The mod's connection to the agent (0600). |
| `mod/` | The nerve mod, as installed into Claude. |
| `chunks/`, `known/` | Content-addressed chunks for hand-offs and `put`/`get`/`refs`; which chunks each peer holds. |
| `jobs/` | Working directories of jobs given no `--cwd` (when `handoff_root` is unset). |
| `invites/` | Open one-time invite secrets (0700). |
| `activity.log` | The agent's activity, which CLI commands follow for acks. |
| `spool/` | CLI requests for the running agent. |
| `seen`, `since` | Replay protection and catch-up position. |
| `away` | Present while away mode is on. |

`fleet.toml` options:

```toml
device = "laptop"
relays = ["ws://192.0.2.10:7777", "wss://relay.primal.net"]
caps = ["ios-sim"]                 # extra, on top of detected ones
handoff_root = "/Users/me/nerve-handoff"   # optional; unset, unplaced hand-offs are refused
remote_questions = "away"          # away | always | never
remote_permissions = true
auto_trust_handoffs = true         # accept Claude's folder-trust prompt for handed-off sessions
hook_timeout_secs = 600

[peers]
server = "npub1..."

[path_map]                         # source prefix = local prefix
"/Users/me/code" = "/home/user/code"

[places]                           # name = absolute path on this device
proj = "/Users/me/code/proj"

[run]                              # commands peers may run here
allow = [{ place = "proj", argv = ["make", "*"] }]

[ssh]                              # peer = ssh host; big files go over rsync on it
server = "user@server.example"

[xfer]
bulk_over = 67108864               # bytes from which files skip the relay
```

### The agent's PATH

launchd and systemd user units start with a bare PATH. Claude Code
installs into `~/.local/bin`, which is not on it. `nerve setup` writes
your PATH into the unit, adding `~/.local/bin`, `~/.cargo/bin`,
`/opt/homebrew/bin` and `/usr/local/bin` where they exist. Hand-offs,
jobs and runs also search those directories when PATH misses. If `claude`
still isn't found, the error lists every directory searched. Re-run
`nerve setup` to refresh a unit written by an older version.

## Security model

- **Peers.** Only keys listed in `[peers]` are obeyed. Anything else is
  dropped before decryption is acted on.
- **Encryption.** Every payload is NIP-44 v2 encrypted to one device.
- **Integrity.** Events are signature-checked.
- **Replay.** Envelopes are deduplicated by id across restarts, and
  instructions expire after 5 minutes.
- **Commands.** `nerve sync run` executes only what a `[run] allow` rule
  in the *receiving* device's fleet.toml names. A sender cannot widen the
  rule, and an empty allowlist (the default) runs nothing.
- **Places.** `put`, `get` and `refs` write only inside a place the
  receiver defined. Writes never follow a symlink out of it. `refs` sets
  only the destination refs named, never one that is checked out.
- **Scope of trust.** A paired device can type into your sessions and
  approve tool calls. That is remote code execution by design, so pair
  only devices you control. Treat `device.key` like an SSH private key.
- **What relays see.** Public relays can see which public keys talk, and
  when, and the size of each message. They cannot see content. Use a
  private relay on a private network if that metadata matters.
- **Invites.** A code is a one-hour, single-use credential. A stranger's
  `PairRequest` is read only while an invite is open, and only that
  message type.
- **The mod** runs inside Claude and can approve tool calls; it talks
  only to the 0600 socket of the same user's agent.
- **Not implemented yet:**
  - NIP-59 gift wrap to hide the sender key (works, measured in E2, not wired in);
  - NIP-42 relay auth;
  - key rotation and revocation, beyond editing `[peers]`.
</script>
<script type="text/plain" class="doc" id="d6" data-group="Overview" data-title="Run the prototype" data-path="research/sync/demo/README.md"># Run the prototype

Two ways to see `nerve sync` working: on one Mac in a minute, or across real devices.

## One machine, no setup

```bash
research/sync/demo/demo.sh           # relay + "beta" agent, then the TUI as "alpha"
research/sync/demo/demo.sh --check   # the same, non-interactive; prints status and exits
research/sync/demo/demo.sh --job     # also runs a headless Claude job on beta (costs a few cents)
research/sync/demo/places.sh         # put/get/refs/run between two agents, each side initiating; exits non-zero on failure
```

The script does the following:

1. Builds `nerve` with `--features sync` into `target/release`.
2. Starts the embedded private relay on `ws://127.0.0.1:7788`.
3. Creates two devices, **alpha** and **beta**, each with its own `NERVE_CONFIG_DIR` under `research/sync/demo/.state/`, and pairs them. Your real nerve config is not touched.
4. Runs beta's sync agent in the background, waits for its first state event, and prints `nerve sync status`.
5. Runs a manual sync, then opens the TUI as alpha.

In the TUI:

| key | what you see |
|---|---|
| `D` | Devices: beta's sessions, last-synced time, pending prompts, jobs |
| `r` | sync now |
| `m` | type an instruction into the selected session |
| `d` / `l` / `g` | fetch the session's diff, transcript log, or subagents |
| `a` / `x` / `1`–`9` | answer a pending permission or question |
| `H` | hand the selected session off to beta (it resumes in a detached tmux session, checkout under `.state/beta-work`) |

Both "devices" run on this Mac, so beta reports the same Claude sessions you have open. An instruction sent with `m` is typed into a real session.

Logs are in `.state/relay.log` and `.state/beta-agent.log`. Quitting the TUI stops the relay and beta.

## Across real devices (what the experiments used)

See `docs/SYNC.md` for the full guide. In short:

```bash
cargo build --release --features sync
nerve sync init --name laptop --relay wss://relay.primal.net --relay wss://relay.snort.social
nerve sync pair server npub1…        # and the reverse on the server
nerve sync agent                     # on the server
nerve                                # on the laptop: press D
```

To add a private relay over Tailscale (about 16 ms instead of 0.5–1 s), run `nerve sync serve-relay` on an always-on device. Then run `nerve sync relay add ws://<relay-host>:7777` on both devices.

## What was verified, and where

| claim | evidence |
|---|---|
| Every requirement end to end, laptop ⇄ server | `experiments/RESULTS.md` E10–E16 |
| Public relays only, no Tailscale | E14 |
| Offline store-and-forward | E15 |
| A laptop agent delegating a verified job to the server | E16 |
| This one-machine demo | `demo.sh --check`, run 2026-10-10. It found and fixed a same-second state-publish collision; the regression test is `transport::tests::back_to_back_state_publishes_are_both_accepted` |
</script>
<script type="text/plain" class="doc" id="d7" data-group="Surveys" data-title="Nostr deep dive" data-path="research/sync/reports/01-nostr-deep-dive.md"># Nostr as a device-sync transport for nerve: research report

*Researched 2026-10-09. I checked spec text against the raw NIP files. I queried crate versions from the crates.io API and relay limits from live NIP-11 documents (`curl -H 'Accept: application/nostr+json'`). Items I could not verify are marked **[UNVERIFIED]**.*

## 0. Bottom line

- **Yes, Nostr can carry nerve's device sync without a WireGuard or Tailscale mesh.** Every peer opens an outbound WSS connection to one or more relays. No device needs inbound reachability, port forwarding or NAT hole-punching.
- **The protocol primitives match the use case closely:**
  - replaceable and addressable events for "current state";
  - ephemeral events for live progress;
  - NIP-44 and NIP-59 for encrypted commands;
  - NIP-40 for TTL;
  - NIP-42 and NIP-70 for access control.
- **Someone has already built this.** CodeDeck+ is a phone controller for Claude Code. It runs over Nostr relays with NIP-44 and uses almost exactly the kind-class split recommended here (details in §4).
- **There are three real constraints:**
  1. **Event size.** Public relays cap messages at roughly 128 KB to 1 MB. strfry's default `maxEventSize` is 64 KiB. Large diffs therefore need chunking or encrypted Blossom blobs.
  2. **No atomicity.** Relays give no compare-and-swap or ordering guarantee, so "job claim" needs a deterministic tie-break or a coordinator.
  3. **Metadata.** Relays see IPs, timestamps, kinds and (unless you gift-wrap) pubkeys.
- **iOS background delivery is the weakest link.** It needs an APNs bridge. Android can hold a socket open (Amethyst, Pokey).

---

## 1. Relevant NIPs: exact semantics

### 1.1 NIP-01: kind classes ([01.md](https://github.com/nostr-protocol/nips/blob/master/01.md))

| Class | Range | Relay semantics |
|---|---|---|
| Regular | `1000 ≤ n < 10000`, `4 ≤ n < 45`, `1`, `2` | Expected to be stored |
| Replaceable | `10000 ≤ n < 20000`, `0`, `3` | Only the latest per (pubkey, kind) MUST be kept |
| Ephemeral | `20000 ≤ n < 30000` | Not expected to be stored |
| Addressable | `30000 ≤ n < 40000` | Only the latest per (kind, pubkey, `d` tag) MUST be kept |

- **Ties:** when two events have the same `created_at`, the one with the lowest id (lexical order) is retained.
- **Messages:** `EVENT` / `REQ` / `CLOSE` from the client; `EVENT` / `OK` / `EOSE` / `CLOSED` / `NOTICE` from the relay.
- **Acknowledgement:** relays MUST answer every `EVENT` with `OK`. That gives nerve a per-relay write ack.
- **Subscription IDs:** at most 64 characters.
- **Filters:** conditions within one filter are ANDed; multiple filters in one `REQ` are ORed. `limit: 0` means "live only, no stored events". Only single-letter tags are indexed, and only their first value.

These are the building blocks for nerve. Use `#d`, `#p` and a custom single-letter tag (for example `#s` for session id) for routing.

### 1.2 NIP-09: deletion ([09.md](https://github.com/nostr-protocol/nips/blob/master/09.md))

- Kind 5 carries `e` and/or `a` tags plus `k` tags.
- Relays SHOULD delete referenced events that have the same pubkey. For an `a` tag they delete all versions up to the deletion's `created_at`.
- Deletion is advisory. Other relays and clients may still hold copies.
- NIP-90 reuses kind 5 to cancel a job.

### 1.3 NIP-40: expiration ([40.md](https://github.com/nostr-protocol/nips/blob/master/40.md))

- The `["expiration", "<unix>"]` tag tells relays they SHOULD NOT serve the event after that time and SHOULD reject it if it is already expired on arrival.
- Relays MAY keep it on disk indefinitely. The spec says explicitly that this is not a security feature.
- Clients should send it only to relays that list 40 in `supported_nips`. Every public relay I probed lists 40 (see §3).

### 1.4 NIP-42: relay AUTH ([42.md](https://github.com/nostr-protocol/nips/blob/master/42.md))

- The relay sends `["AUTH", challenge]`. The client replies with a signed kind 22242 event carrying `relay` and `challenge` tags, timestamped within about 10 minutes.
- Relays MUST NOT broadcast kind 22242.
- Rejections use the `auth-required:` and `restricted:` prefixes on `OK` or `CLOSED`.
- AUTH is what lets a relay serve your events only to you.

### 1.5 NIP-44 v2: encryption ([44.md](https://github.com/nostr-protocol/nips/blob/master/44.md))

- **Construction:**
  - secp256k1 ECDH, using the unhashed x-coordinate;
  - HKDF-SHA256 with salt `nip44-v2`;
  - a random 32-byte nonce per message;
  - ChaCha20;
  - HMAC-SHA256 over nonce ‖ ciphertext;
  - base64 encoding of `version ‖ nonce ‖ ct ‖ mac`.
- **Padding:** power-of-two-based buckets, minimum 32 bytes.
- **Audit:** Cure53, December 2023.

**Correction to the brief's assumption about the 65535-byte maximum.** The current spec text says plaintext may be up to 4,294,967,295 bytes. A 2-byte u16 prefix is used below 65536. At 65536 and above, an extended prefix applies (two zero bytes, then a u32), and test vectors cover lengths 65535, 65536 and 65537. The original 2023 spec capped plaintext at 65535. **[UNVERIFIED]** I did not check whether rust-nostr 0.45 and other implementations accept the extended prefix. Plan for 64 KiB per encrypted payload regardless, because relay size limits bind first.

**What NIP-44 does not provide:**
- forward secrecy or post-compromise security;
- deniability;
- metadata protection (`created_at`, IPs and sizes are visible, sizes only partly padded).

**Security note.** [RUSTSEC-2026-0216](https://rustsec.org/advisories/RUSTSEC-2026-0216.html) is a remote DoS (a panic) in `nostr::nip44::decrypt` when a crafted payload decrypts to 0 or 1 bytes. Affected versions are `<0.44.5` and `0.45.0-alpha.1` through `alpha.4`. The current 0.45.x is patched.

### 1.6 NIP-59: gift wrap ([59.md](https://github.com/nostr-protocol/nips/blob/master/59.md))

- **Layers:**
  - rumor: an unsigned event;
  - seal: kind 13, NIP-44-encrypted, signed by the real author, tags empty;
  - gift wrap: kind 1059, signed by a throwaway key, `p`-tagged to the recipient.
- **Kind 21059 (ephemeral gift wrap):** relays MUST NOT store it, and it is meant for real-time use. It was merged into NIP-59 on 2026-05-28 ([PR #2245](https://github.com/nostr-protocol/nips/pull/2245), authored by the ContextVM team).
- **Timestamps:** the seal and wrap SHOULD be backdated by a random amount (up to 2 days in the sample code), always into the past.
- **Relay guidance:** relays SHOULD gate 1059 behind AUTH and serve it only to the `p`-tagged recipient.
- **What relays see:** a one-time pubkey, the kind, the recipient `p`, a fuzzed time and ciphertext. They do not see the author.

### 1.7 NIP-17: private DMs ([17.md](https://github.com/nostr-protocol/nips/blob/master/17.md))

- Kind 14 (text) and kind 15 (an encrypted file: AES-GCM key and nonce plus hashes) travel as gift-wrapped rumors.
- The recipient advertises kind 10050 listing their DM relays. Senders MUST publish only to those relays.
- Disappearing messages use `expiration` on the wrap and the seal.
- Groups above about 10 participants are impractical because each recipient gets a separate wrap.

**Relevance to nerve:** any stock Nostr messenger (Amethyst, 0xchat and others) can read and answer NIP-17 DMs. That is a zero-custom-app phone path.

### 1.8 NIP-46: remote signing ([46.md](https://github.com/nostr-protocol/nips/blob/master/46.md))

- Kind 24133 carries NIP-44-encrypted JSON-RPC: `connect`, `sign_event`, `get_public_key`, `nip44_encrypt` / `nip44_decrypt`, `switch_relays`, `ping` and `logout`.
- Sessions start from either a `bunker://` or a `nostrconnect://` URI.
- Permissions look like `sign_event:4`.

**Relevance:** the Mac or a phone signer (Amber, nsec.app) can hold the user's root key while devices hold only session keys. That is useful for authorising device enrolment.

### 1.9 NIP-65: relay lists ([65.md](https://github.com/nostr-protocol/nips/blob/master/65.md))

- Kind 10002 lists `r` tags marked `read` or `write`.
- Recommended size is 2–4 relays per category.
- Publish to the author's write relays and to the read relays of anyone tagged.

### 1.10 NIP-70: protected events ([70.md](https://github.com/nostr-protocol/nips/blob/master/70.md))

- An event carrying the `["-"]` tag may be published only by its author, after AUTH.
- Relays MUST reject such events by default.
- The tag stops third parties from rebroadcasting your session snapshots to other relays. Every public relay I probed lists NIP-70.

### 1.11 NIP-78: app data ([78.md](https://github.com/nostr-protocol/nips/blob/master/78.md))

- Kind 30078 is addressable. The `d` tag is free-form ("app name and context"), and content and tags can be anything.
- Kind 78 is the regular-event variant.
- Relays SHOULD require AUTH and serve these events only to their author. In practice, public relays don't enforce this (none of the strfry relays probed list 42), so encrypt the content.

### 1.12 NIP-90: Data Vending Machines ([90.md](https://github.com/nostr-protocol/nips/blob/master/90.md))

- **Kinds:** requests 5000–5999, results 6000–6999 (always the request kind + 1000), feedback 7000.
- **Feedback `status` values:** `payment-required`, `processing`, `error`, `success`, `partial`.
- **Request tags:** `i` (input types `url` / `event` / `job` / `text`), `output`, `param`, `bid`, `relays`, `p`.
- **Encrypted requests:** put the encrypted `i` and `param` tags in `content` and add `["encrypted"]`. **Note:** the spec still says NIP-04 for this.
- **Cancellation:** a kind 5 deletion.
- **Status:** NIP-90 is now flagged **unrecommended** in the [NIPs README](https://github.com/nostr-protocol/nips/blob/master/README.md) ("this got totally out of control, prefer use-case-specific microstandards").

**Advice:** copy the request → feedback → result shape, not the kinds or the payment machinery.

### 1.13 NIP-29: relay-based groups ([29.md](https://github.com/nostr-protocol/nips/blob/master/29.md))

- A group is a random id whose membership and writes are enforced by one relay.
- Kinds 9000–9030 are moderation; kinds 39000+ are metadata.
- This could model a "fleet" if you run your own relay, but it ties trust to that relay. Not needed for a single user.

### 1.14 NIP-EE and Marmot (MLS)

- NIP-EE is **unrecommended, superseded by Marmot** ([README](https://github.com/nostr-protocol/nips/blob/master/README.md)).
- Marmot (status "adopted"; the [README](https://github.com/marmot-protocol/marmot) calls the MIP-era documents deprecated):
  - Nostr keys for identity;
  - MLS (RFC 9420) for group key agreement;
  - kinds 443 (KeyPackage), 444 (Welcome), 445 (Group Event) and 10051.
- The Rust implementation is `mdk-core` 0.8.0, which requires **MSRV 1.90** ([crates.io](https://crates.io/crates/mdk-core)). `whitenoise-rs` is now archived on GitHub.
- Marmot provides forward secrecy and post-compromise security, unlike NIP-44.
- **Overkill for a handful of a single user's devices**, and its MSRV conflicts with nerve's 1.85.

### 1.15 NIP-B7 Blossom and NIP-96

- **NIP-B7 ([B7.md](https://github.com/nostr-protocol/nips/blob/master/B7.md)):** blobs are addressed by SHA-256, and a kind 10063 server list lets clients find them.
- **NIP-96** is unrecommended, replaced by Blossom.
- **Use for nerve:** encrypt large diffs or transcripts locally, upload the ciphertext, and send `{url, sha256, key, nonce}` inside an encrypted event. This mirrors NIP-17 kind 15.
- `nostr-blossom` 0.45.1 exists ([crates.io](https://crates.io/crates/nostr-blossom)).

### 1.16 NIP-11: relay info ([11.md](https://github.com/nostr-protocol/nips/blob/master/11.md))

The `limitation` object can contain:

| Field | Meaning |
|---|---|
| `max_message_length` | Bytes of incoming JSON; effectively the maximum event size |
| `max_content_length` | Characters in `content` |
| `max_subscriptions` | Subscriptions per connection |
| `max_limit` | Clamp applied to a filter's `limit` |
| `max_subid_length` | Maximum subscription-id length |
| `max_event_tags` | Maximum number of tags |
| `min_pow_difficulty` | Required NIP-13 proof of work |
| `auth_required` | Relay requires NIP-42 AUTH |
| `payment_required` | Relay requires payment |
| `restricted_writes` | Writes are limited |
| `created_at_lower_limit` / `created_at_upper_limit` | Accepted timestamp window |
| `default_limit` | Events returned when no `limit` is given |

nerve should fetch each relay's NIP-11 document at startup and size its chunks to the smallest `max_message_length` across the relays it uses.

### 1.17 NIP-77: negentropy ([77.md](https://github.com/nostr-protocol/nips/blob/master/77.md))

- `NEG-OPEN` / `NEG-MSG` / `NEG-CLOSE` / `NEG-ERR` run range-based set reconciliation over a filter. They exchange only IDs; you then fetch with `REQ` or push with `EVENT`.
- **Use for nerve:** a device that has been offline catches up on stored command and result history cheaply.
- Only some relays advertise it (offchain.pub and auth.nostr1.com among those probed).
- The `negentropy` crate is at 0.5.1 and is a dependency of `nostr-sdk`.

### 1.18 NIP-C7 chats ([C7.md](https://github.com/nostr-protocol/nips/blob/master/C7.md))

- Kind 9 is a chat message; replies use a `q` tag.
- Public. Not useful for nerve except perhaps as a NIP-29 group chat UI.

### 1.19 Newer and agent-related proposals (all unmerged unless stated)

- **ContextVM: "NIP-XX: MCP JSON-RPC over Nostr"** ([PR #2246](https://github.com/nostr-protocol/nips/pull/2246), open since 2026-02).
  - Uses a single ephemeral kind, **25910**, for all MCP traffic.
  - Public server announcements use replaceable kinds **11316** (server), **11317** (tools), **11318** (resources), **11319** (resource templates) and **11320** (prompts), per [CEP-6](https://docs.contextvm.org/reference/ceps/cep-6/).

  - [CEP-22](https://docs.contextvm.org/reference/ceps/cep-22/) defines oversized-payload chunking through MCP progress notifications. Its example uses chunks of up to 65,536 bytes for a 10 MiB transfer.

- **NIP-XX "AI Agent Messages"** ([PR #2226](https://github.com/nostr-protocol/nips/pull/2226), open) proposes:
  - prompt, response, streaming-delta, status, tool-telemetry, error and cancel kinds;
  - a replaceable `ai.info` discovery event (31340);
  - `seq`-based stream reconciliation;
  - NIP-44 payloads.

  **Worth reading for nerve's stream design.**
- **Other open agent PRs:**
  - NIP-AE "Agents" ([#2220](https://github.com/nostr-protocol/nips/pull/2220));
  - NIP-C1 "Agent TUI Messages" ([#2295](https://github.com/nostr-protocol/nips/pull/2295)): buttons and cards inside NIP-17 DM content, a good fit for "approve / deny" prompts on stock clients;
  - NIP-AC "DVM Agent Coordination" ([#2253](https://github.com/nostr-protocol/nips/pull/2253)), with heartbeat kind 30333;
  - LLM/AI Agents ([#1929](https://github.com/nostr-protocol/nips/pull/1929)).

  None is merged. **Do not depend on their kind numbers.**
- **NIP-9a "Relay Push"** ([PR #2194](https://github.com/nostr-protocol/nips/pull/2194), [draft text](https://github.com/coracle-social/nips/blob/635449ebfea6ee25da570e3642c9762e78b02904/9a.md)):
