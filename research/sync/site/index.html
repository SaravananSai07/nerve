<script type="text/plain" class="doc" id="d22" data-group="Experiment scripts" data-title="experiments/e1_relay_info.sh" data-path="research/sync/experiments/e1_relay_info.sh">#!/usr/bin/env bash
# E1: survey public relays' NIP-11 limits (what each will accept from us).
set -u
RELAYS=(relay.damus.io nos.lol relay.primal.net relay.nostr.band nostr.wine
  relay.snort.social offchain.pub nostr.mom relay.nostr.net nostr.land
  relay.0xchat.com nostr.oxtr.dev relay.mostr.pub purplepag.es nostr-pub.wellorder.net)
printf '%s\n' "relay|software|version|max_message_length|max_content_length|auth|payment|restricted_writes|nips(4,17,40,42,44,59,70,77?)"
for r in "${RELAYS[@]}"; do
  j=$(curl -s -m 8 -H 'Accept: application/nostr+json' "https://$r" 2>/dev/null)
  if ! echo "$j" | jq -e . >/dev/null 2>&1; then echo "$r|unreachable-or-non-json"; continue; fi
  echo "$j" | jq -r --arg r "$r" '[ $r, (.software//"?"|split("/")|last), (.version//"?"),
    (.limitation.max_message_length//"-"), (.limitation.max_content_length//"-"),
    (.limitation.auth_required//"-"), (.limitation.payment_required//"-"),
    (.limitation.restricted_writes//"-"),
    ([4,17,40,42,44,59,70,77] - ((.supported_nips//[])|map(tonumber? // 0)) | if length==0 then "all" else "missing:"+(map(tostring)|join(",")) end) ] | join("|")'
done
</script>
<script type="text/plain" class="doc" id="d23" data-group="Experiment scripts" data-title="experiments/e17_mod_e2e.sh" data-path="research/sync/experiments/e17_mod_e2e.sh">#!/usr/bin/env bash
# E17-E22: the mod path and the one-command setup, end to end on one Mac.
#
# Two devices (alpha, beta) with their own NERVE_CONFIG_DIR, a private relay
# on localhost, and a real interactive Claude session (Haiku) on "beta" that
# loads the nerve mod with --plugin-dir. Nothing is installed into your real
# Claude config: the mod is loaded only for the test session.
#
#   E17  nerve setup prints an invite; nerve setup <code> joins with it
#   E18  a prompt sent from alpha is submitted by the mod (idle and mid-turn)
#   E19  a permission prompt answered from alpha, 20 s after it appeared
#        (twice a mod hook's 10 s budget: the wait must not spend it)
#   E20  an AskUserQuestion answered from alpha, without away mode
#   E21  a permission answered at the keyboard is withdrawn from alpha's view
#   E22  hand-off twice: the second transfer only carries what changed
#
# Costs a few cents of Haiku. Run from the repo root:
#   research/sync/experiments/e17_mod_e2e.sh | tee research/sync/experiments/e17_mod_e2e.out
set -uo pipefail
repo="$(cd "$(dirname "$0")/../../.." && pwd)"
nerve="$repo/target/release/nerve"
# Outside the repo: Claude would otherwise ask about this repo's CLAUDE.md imports.
st="${E17_DIR:-${TMPDIR:-/tmp}/nerve-e17}"
port=7791
relay="ws://127.0.0.1:$port"
tm=e17beta
pids=()
cleanup() {
  for p in "${pids[@]}"; do kill "$p" 2>/dev/null; done
  tmux kill-session -t "$tm" 2>/dev/null
  tmux ls 2>/dev/null | awk -F: '/^nerve-/{print $1}' | while read -r s; do
    tmux show-environment -t "$s" NERVE_CONFIG_DIR 2>/dev/null | grep -q "$st" && tmux kill-session -t "$s"
  done
}
trap cleanup EXIT
alpha() { NERVE_CONFIG_DIR="$st/alpha" "$nerve" "$@"; }
beta() { NERVE_CONFIG_DIR="$st/beta" "$nerve" "$@"; }
# Background an agent so that $! is nerve itself, not a subshell.
bg() { local dev=$1; NERVE_CONFIG_DIR="$st/$dev" "$nerve" sync agent >"$st/$dev-agent.log" 2>&1 & pids+=($!); }
say() { printf '\n=== %s\n' "$*"; }
pane() { tmux capture-pane -p -t "$tm" | grep -v '^\s*$' | grep -v '╌' | tail -"${1:-8}"; }
wait_for() { # seconds, command...
  local n=$1; shift
  for _ in $(seq 1 $((n * 2))); do "$@" >/dev/null 2>&1 && return 0; sleep 0.5; done
  return 1
}

cargo build --quiet --release --features sync --manifest-path "$repo/Cargo.toml" || exit 1
rm -rf "$st"; mkdir -p "$st/work" "$st/beta-handoff"
"$nerve" sync serve-relay --port "$port" >"$st/relay.log" 2>&1 & pids+=($!)
until nc -z 127.0.0.1 $port 2>/dev/null; do sleep 0.2; done

say "E17 one-command setup + invite"
beta setup --name beta --relay "$relay" --no-service --no-claude --no-wait | tee "$st/beta-setup.txt" | grep -v '█\|▀\|▄'
code=$(grep -o 'nerve1[A-Za-z0-9_-]*' "$st/beta-setup.txt" | head -1)
f="$st/beta/sync/fleet.toml"; { printf 'handoff_root = "%s"\n' "$st/beta-handoff"; cat "$f"; } >"$f.tmp" && mv "$f.tmp" "$f"
bg beta
wait_for 10 test -S "$st/beta/sync/agent.sock"
t0=$(date +%s.%N)
alpha setup "$code" --name alpha --no-service --no-claude
echo "join took $(echo "$(date +%s.%N) - $t0" | bc) s"
echo "alpha peers: $(grep -A3 '^\[peers\]' "$st/alpha/sync/fleet.toml" | tail -n +2 | cut -c1-30 | tr '\n' ' ')"
sleep 6
echo "beta peers:  $(grep -A3 '^\[peers\]' "$st/beta/sync/fleet.toml" | tail -n +2 | cut -c1-30 | tr '\n' ' ')"
echo "reusing the code:"; alpha setup "$code" --no-service --no-claude 2>&1 | tail -1

say "a git repo with a Claude session on beta, loading the nerve mod"
cd "$st/work" && git init -q -b main && for i in 1 2 3; do echo "line $i" > "f$i.txt"; git add .; git -c user.email=t@t -c user.name=t commit -qm "c$i"; done
mkdir -p "$st/mod" && cp -R "$repo/mod/nerve" "$st/mod/"
printf '{"socket":"%s"}' "$st/beta/sync/agent.sock" > "$st/mod/nerve/nerve.json"
tmux new-session -d -s "$tm" -x 160 -y 50 -c "$st/work" -e "NERVE_CONFIG_DIR=$st/beta" \
  "claude --plugin-dir $st/mod/nerve --permission-mode default --model haiku"
sleep 6
pane 3 | grep -q 'trust this folder' && { tmux send-keys -t "$tm" Down Enter; sleep 5; }
pane 8 | grep -q 'external imports' && { tmux send-keys -t "$tm" Enter; sleep 4; }
sid=""
for _ in $(seq 1 30); do
  sid=$(alpha sync status --json 2>/dev/null | python3 -c 'import json,sys
for d in json.load(sys.stdin):
  for s in d["sessions"]:
    if s.get("via_mod"): print(s["id"]); raise SystemExit' 2>/dev/null)
  [ -n "$sid" ] && break; sleep 1
done
echo "session on beta with mod connected: ${sid:-NONE}"
[ -n "$sid" ] || { pane 20; exit 1; }

say "E18 prompt from alpha (idle session)"
t0=$(date +%s.%N)
alpha sync send beta "${sid:0:8}" "Run the bash command: echo e18-idle" | tail -2
echo "send→ack $(echo "$(date +%s.%N) - $t0" | bc) s"
sleep 8; pane 6
say "E18b two prompts while a turn runs (queued, in order)"
alpha sync send beta "${sid:0:8}" "Run the bash command: sleep 6; echo e18-long" | tail -1
sleep 1
alpha sync send beta "${sid:0:8}" "Now reply with just the word E18-QUEUED" | tail -1
sleep 22; pane 8

say "E19 permission prompt answered from alpha"
alpha sync send beta "${sid:0:8}" "Use the Write tool to write the word nineteen into e19.txt. Nothing else." | tail -1
req=""
for _ in $(seq 1 30); do
  req=$(alpha sync status 2>/dev/null | awk '/\[permission\]/{print $2; exit}'); [ -n "$req" ] && break; sleep 1
done
alpha sync status | grep -E '^\s+\?' | head -3
echo "--- beta's screen while waiting (dialog visible):"; pane 6
sleep 20
echo "still pending on alpha after 20 s: $(alpha sync status | grep -c '\[permission\]')"
alpha sync answer beta "$req" allow | tail -1
sleep 5; echo "e19.txt: $(cat "$st/work/e19.txt" 2>/dev/null || echo MISSING)"; pane 4

say "E20 question answered from alpha, no away mode"
alpha sync send beta "${sid:0:8}" "Use the AskUserQuestion tool to ask me to pick one: Red or Blue. Then reply with only my pick." | tail -1
req=""
for _ in $(seq 1 40); do
  req=$(alpha sync status 2>/dev/null | awk '/\[question\]/{print $2; exit}'); [ -n "$req" ] && break; sleep 1
done
alpha sync status | grep -E '^\s+\?' | head -3
echo "--- beta's screen (the question is visible locally too):"; pane 7
sleep 15
alpha sync answer beta "$req" Blue | tail -1
sleep 6; pane 5

say "E21 answered at the keyboard → withdrawn on alpha"
alpha sync send beta "${sid:0:8}" "Use the Write tool to write the word twentyone into e21.txt. Nothing else." | tail -1
for _ in $(seq 1 30); do alpha sync status 2>/dev/null | grep -q '\[permission\]' && break; sleep 1; done
echo "pending before:"; alpha sync status | grep -E '^\s+\?'
sleep 12
tmux send-keys -t "$tm" 1; sleep 6
echo "pending after local answer:"; alpha sync status | grep -E '^\s+\?' || echo "  (none)"
pane 6
echo "e21.txt: $(cat "$st/work/e21.txt" 2>/dev/null || echo MISSING)"

say "E22 hand-off twice from beta to alpha"
# Give alpha a long-lived agent and a handoff root of its own.
f="$st/alpha/sync/fleet.toml"; { printf 'handoff_root = "%s"\n' "$st/alpha-handoff"; cat "$f"; } >"$f.tmp" && mv "$f.tmp" "$f"
bg alpha
sleep 4
beta sync handoff "${sid:0:8}" alpha | tail -3
for _ in $(seq 1 60); do grep -q 'resumed' "$st/alpha-agent.log" && break; sleep 1; done
grep -E 'handing over|asking for|resumed|failed' "$st/alpha-agent.log" | tail -3
grep -E 'handoff .* sent' "$st/beta-agent.log" | tail -1
echo "--- one more turn and one more commit on beta, then hand off again"
alpha_tmux=$(tmux ls | awk -F: '/^nerve-/{print $1}' | head -1); [ -n "$alpha_tmux" ] && tmux kill-session -t "$alpha_tmux"
git -C "$st/alpha-handoff/work" checkout -q -- . 2>/dev/null; git -C "$st/alpha-handoff/work" clean -qfd 2>/dev/null
alpha sync send beta "${sid:0:8}" "Reply with just the word E22" | tail -1
sleep 8
( cd "$st/work" && git add -A && git -c user.email=t@t -c user.name=t commit -qm "work from the session" )
beta sync handoff "${sid:0:8}" alpha | tail -2
for _ in $(seq 1 60); do [ "$(grep -c 'resumed' "$st/alpha-agent.log")" -ge 2 ] && break; sleep 1; done
grep -E 'handoff .* sent' "$st/beta-agent.log" | tail -2
grep -E 'resumed|failed' "$st/alpha-agent.log" | tail -2
echo "chunk store sizes: beta $(du -sh "$st/beta/sync/chunks" | cut -f1), alpha $(du -sh "$st/alpha/sync/chunks" | cut -f1)"
say done
</script>
<script type="text/plain" class="doc" id="d24" data-group="Experiment scripts" data-title="experiments/e23_pi_e2e.sh" data-path="research/sync/experiments/e23_pi_e2e.sh">#!/usr/bin/env bash
# E23-E26: the same flows between two real machines, public relays only
# (relay.primal.net + relay.snort.social), no Tailscale relay, no VPN path.
#
#   E23  `nerve setup` on the Mac prints a code; `nerve setup <code>` on the
#        Pi joins, and installs the agent as a systemd user service
#   E24  a prompt from the Mac reaches a Claude session on the Pi via its mod
#   E25  a permission prompt on the Pi answered from the Mac
#   E26  the Pi hands its session to the Mac, twice (Pi → Mac had never been
#        run); the second transfer is incremental
#
# Throwaway config dirs on both sides; the Pi's test service is removed at
# the end; neither machine's real Claude config is touched (the mod is
# loaded with --plugin-dir). Needs: SSH to the Pi (PI=user@host, PI_KEY),
# nerve built at ~/nerve-src on the Pi. Costs a few cents of Haiku.
set -uo pipefail
repo="$(cd "$(dirname "$0")/../../.." && pwd)"
nerve="$repo/target/release/nerve"
PI="${PI:?set PI=user@host}"
PI_KEY="${PI_KEY:?set PI_KEY=path to its ssh key}"
mac="${TMPDIR:-/tmp}/nerve-e23"
pidir='$HOME/nerve-e23'
pinerve='$HOME/nerve-src/target/release/nerve'

<script type="text/plain" class="doc" id="d25" data-group="Experiment scripts" data-title="experiments/e25b_mac_session_pi_answers.sh" data-path="research/sync/experiments/e25b_mac_session_pi_answers.sh">#!/usr/bin/env bash

  pi "[ -f $pidir/agent.pid ] && kill \$(cat $pidir/agent.pid) 2>/dev/null; true"

rm -rf "$mac"; mkdir -p "$mac/work"; pi "rm -rf $pidir"

say "pair (Pi invites, Mac joins), agents on both"

<script type="text/plain" class="doc" id="d26" data-group="Experiment scripts" data-title="experiments/claude/handoff-pack.sh" data-path="research/sync/experiments/claude/handoff-pack.sh">#!/usr/bin/env bash
# E7 handoff packer: everything another device needs to continue a session.
#   handoff-pack.sh <repo-dir> <session-id> <claude-config-root> <out.tar>
# Contents: git bundle of all refs (+ HEAD), binary diff of the working tree
# (tracked changes), untracked files, the transcript and its sidecar dir
# (subagents/, tool-results/), and a manifest with the source cwd.
set -euo pipefail
repo=$1 sid=$2 root=$3 out=$4
work=$(mktemp -d)
cd "$repo"
git bundle create "$work/repo.bundle" --all HEAD >/dev/null 2>&1
git diff --binary HEAD > "$work/worktree.patch"
git ls-files --others --exclude-standard -z | tar --null -T - -cf "$work/untracked.tar" 2>/dev/null || tar -cf "$work/untracked.tar" -T /dev/null
t=$(ls "$root"/projects/*/"$sid".jsonl | head -1)
cp "$t" "$work/transcript.jsonl"
side="${t%.jsonl}"
[ -d "$side" ] && tar -C "$(dirname "$side")" -cf "$work/sidecar.tar" "$(basename "$side")"
jq -n --arg sid "$sid" --arg cwd "$(pwd -P)" --arg head "$(git rev-parse HEAD)" \
  --arg branch "$(git rev-parse --abbrev-ref HEAD)" --arg host "$(hostname)" \
  '{v:1, session_id:$sid, src_cwd:$cwd, head:$head, branch:$branch, src_host:$host, created:now}' > "$work/manifest.json"
tar -C "$work" -cf "$out" .
rm -rf "$work"
ls -l "$out" | awk '{print "packed", $5, "bytes"}'
</script>
<script type="text/plain" class="doc" id="d27" data-group="Experiment scripts" data-title="experiments/claude/handoff-unpack.sh" data-path="research/sync/experiments/claude/handoff-unpack.sh">#!/usr/bin/env bash
# E7 handoff unpacker on the target device:
#   handoff-unpack.sh <pack.tar> <dest-repo-dir> <claude-config-root> [--rewrite-paths]
# Restores the repo at <dest> (clone from bundle, apply worktree patch and
# untracked files), then installs the transcript under the slug Claude derives
# from <dest>, so `claude --resume <id>` run in <dest> finds it.
set -euo pipefail
pack=$1 dest=$2 root=$3 rewrite=${4:-}
work=$(mktemp -d); tar -C "$work" -xf "$pack"
sid=$(jq -r .session_id "$work/manifest.json"); src=$(jq -r .src_cwd "$work/manifest.json")
branch=$(jq -r .branch "$work/manifest.json")
if [ ! -d "$dest/.git" ]; then git clone -q "$work/repo.bundle" "$dest"; fi
cd "$dest"
git fetch -q "$work/repo.bundle" "+refs/heads/*:refs/remotes/handoff/*"
git checkout -q -B "$branch" "handoff/$branch"
[ -s "$work/worktree.patch" ] && git apply --binary "$work/worktree.patch"
tar -xf "$work/untracked.tar"
dest=$(pwd -P)
slug=$(printf '%s' "$dest" | sed 's/[^A-Za-z0-9]/-/g')
mkdir -p "$root/projects/$slug"
if [ "$rewrite" = "--rewrite-paths" ]; then
  # Rewrite absolute source paths so later turns' file paths point at dest.
  jq -c --arg s "$src" --arg d "$dest" 'walk(if type=="string" then gsub($s; $d) else . end)' \
    "$work/transcript.jsonl" > "$root/projects/$slug/$sid.jsonl"
else
  cp "$work/transcript.jsonl" "$root/projects/$slug/$sid.jsonl"
fi
[ -f "$work/sidecar.tar" ] && tar -C "$root/projects/$slug" -xf "$work/sidecar.tar"
echo "installed $sid into $root/projects/$slug (src_cwd=$src -> $dest)"
git status --short
rm -rf "$work"
</script>
<script type="text/plain" class="doc" id="d28" data-group="Experiment scripts" data-title="experiments/claude/mailbox-hook.sh" data-path="research/sync/experiments/claude/mailbox-hook.sh">#!/usr/bin/env bash
# Generic blocking hook: park the hook input in a local mailbox and wait for a
# remote answer. The sync daemon (not this script) moves requests/answers over
# the network. Usage in settings: "command": "mailbox-hook.sh <timeout-secs>"
set -u
MB=${NERVE_MAILBOX:-$HOME/.nerve-lab/mailbox}
mkdir -p "$MB/req" "$MB/resp"
in=$(cat)
id=$(date +%s%N)-$$
printf '%s' "$in" > "$MB/req/$id.json.tmp" && mv "$MB/req/$id.json.tmp" "$MB/req/$id.json"
deadline=$(( $(date +%s) + ${1:-300} ))
while [ "$(date +%s)" -lt "$deadline" ]; do
  if [ -f "$MB/resp/$id.json" ]; then
    cat "$MB/resp/$id.json"; rm -f "$MB/resp/$id.json" "$MB/req/$id.json"; exit 0
  fi
  sleep 0.2
done
rm -f "$MB/req/$id.json"
exit 0   # timeout: no output = fall back to Claude's normal local prompt
</script>
<script type="text/plain" class="doc" id="d29" data-group="Experiment scripts" data-title="demo/demo.sh" data-path="research/sync/demo/demo.sh">#!/usr/bin/env bash
# Two-device nerve sync demo on one machine, no second device, VPN or internet.
#
#   research/sync/demo/demo.sh           relay + "beta" agent, then the TUI as "alpha" (press D)
#   research/sync/demo/demo.sh --job     also run a headless Claude job on beta (spends a few cents)
#   research/sync/demo/demo.sh --check   non-interactive smoke test: status + acknowledged sync
#
# Each device is a separate NERVE_CONFIG_DIR under demo/.state, so your real
# nerve config is untouched. Both "devices" see the same local Claude
# sessions, so anything you type from the Devices view lands in a real session.
set -euo pipefail
here="$(cd "$(dirname "$0")" && pwd)"
repo="$(cd "$here/../../.." && pwd)"
state="$here/.state"
port="${DEMO_PORT:-7788}"
relay="ws://127.0.0.1:$port"
mode="${1:-tui}"

echo "› building nerve with --features sync"
cargo build --quiet --release --features sync --manifest-path "$repo/Cargo.toml"
nerve="$repo/target/release/nerve"

pids=()
cleanup() { for p in "${pids[@]}"; do kill "$p" 2>/dev/null || true; done; }
trap cleanup EXIT INT TERM

rm -rf "$state"
mkdir -p "$state/alpha" "$state/beta" "$state/beta-work"
alpha() { NERVE_CONFIG_DIR="$state/alpha" "$nerve" "$@"; }
beta() { NERVE_CONFIG_DIR="$state/beta" "$nerve" "$@"; }
# Background a long-running nerve so that $! is nerve itself (a
# backgrounded shell function is a subshell, and killing it would
# leave the agent running after the demo).
bg() { local dev=$1 log=$2; shift 2; NERVE_CONFIG_DIR="$state/$dev" "$nerve" "$@" >"$log" 2>&1 & pids+=($!); }

echo "› private relay on $relay"
"$nerve" sync serve-relay --port "$port" >"$state/relay.log" 2>&1 &
pids+=($!)
until nc -z 127.0.0.1 "$port" 2>/dev/null; do sleep 0.2; done

echo "› two devices: alpha (this TUI) and beta (headless agent)"
alpha sync init --name alpha --relay "$relay" >/dev/null
beta sync init --name beta --relay "$relay" >/dev/null
# Keep beta's handoffs and job checkouts inside the demo folder.
f="$state/beta/sync/fleet.toml"
{ printf 'handoff_root = "%s"\n' "$state/beta-work"; cat "$f"; } >"$f.tmp" && mv "$f.tmp" "$f"
alpha sync pair beta "$(beta sync id)"
beta sync pair alpha "$(alpha sync id)"

bg beta "$state/beta-agent.log" sync agent
echo "› waiting for beta's first state event"
for _ in $(seq 1 40); do
  alpha sync status 2>/dev/null | grep -q 'beta: last synced' && break
  sleep 0.5
done
alpha sync status
echo
echo "› manual sync (✓ only when beta acknowledges end to end)"
alpha sync sync

if [ "$mode" = "--job" ]; then
  echo
  echo "› job on beta: headless claude -p, then a verify command"
  alpha sync job --on beta --allow 'Bash(uname *)' --verify 'grep -q . arch.txt' \
    arch -- "Run uname -m and write its output to arch.txt. Nothing else."
  alpha sync status
fi

if [ "$mode" = "--check" ]; then
  echo "demo check passed"
  exit 0
fi

cat <<EOF

Opening the TUI as "alpha". Try:
  D   Devices view: beta's sessions, last synced, pending prompts, jobs
  r   sync now            m  type into a session      d/l/g  diff/log/subagents
  H   hand a session off to beta (lands in $state/beta-work, tmux)
  q   quit (stops the relay and beta)
Logs: $state/*.log
EOF
read -r -p "Press Enter to open the TUI… " _
NERVE_CONFIG_DIR="$state/alpha" "$nerve"
</script>
<script type="text/plain" class="doc" id="d30" data-group="Prototype v1 lab (Rust)" data-title="iroh_lab.rs" data-path="research/sync/lab/src/iroh_lab.rs">use std::time::{Duration, Instant};

use anyhow::{anyhow, Result};
use iroh::endpoint::{presets, Connection};
use iroh::protocol::{AcceptError, ProtocolHandler, Router};
use iroh::{Endpoint, EndpointId, RelayMode, SecretKey};

use crate::{elapsed_ms, key_dir, pad, stats};

const ALPN: &[u8] = b"nerve-lab/echo/0";

fn secret(name: &str) -> Result<SecretKey> {
    let p = key_dir()?.join(format!("iroh-{name}.key"));
    if let Ok(s) = std::fs::read_to_string(&p) {
        let b: [u8; 32] = hex::decode(s.trim())?
            .try_into()
            .map_err(|_| anyhow!("bad key"))?;
        return Ok(SecretKey::from_bytes(&b));
    }
    let k = SecretKey::generate();
    std::fs::write(&p, hex::encode(k.to_bytes()))?;
    Ok(k)
}

#[derive(Debug, Clone)]
struct Echo;

impl ProtocolHandler for Echo {
    async fn accept(&self, conn: Connection) -> Result<(), AcceptError> {
        eprintln!("accepted {}", conn.remote_id());
        while let Ok((mut send, mut recv)) = conn.accept_bi().await {
            tokio::spawn(async move {
                // Length-prefixed frames, echoed until the peer finishes.
                let mut len = [0u8; 4];
                while recv.read_exact(&mut len).await.is_ok() {
                    let n = u32::from_be_bytes(len) as usize;
                    let mut buf = vec![0u8; n];
                    if recv.read_exact(&mut buf).await.is_err() {
                        break;
                    }
                    // Bulk frames (flag bit) are acknowledged with 4 bytes only.
                    if n > 1 << 20 {
                        let _ = send.write_all(&(n as u32).to_be_bytes()).await;
                        let _ = send.write_all(&[]).await;
                        let _ = send.write_all(b"").await;
                        continue;
                    }
                    let _ = send.write_all(&len).await;
                    let _ = send.write_all(&buf).await;
                }
                let _ = send.finish();
            });
        }
        Ok(())
    }
}

pub(crate) async fn pong(no_relay: bool, dur: Duration) -> Result<()> {
    let mut b = Endpoint::builder(presets::N0)
        .secret_key(secret("pong")?)
        .alpns(vec![ALPN.to_vec()]);
    if no_relay {
        b = b.relay_mode(RelayMode::Disabled);
    }
    let ep = b.bind().await?;
    let t = Instant::now();
    ep.online().await;
    eprintln!("online in {:.0} ms", elapsed_ms(t));
    println!("{}", ep.id());
    println!("addr: {:?}", ep.addr());
    let router = Router::builder(ep).accept(ALPN, Echo).spawn();
    tokio::time::sleep(dur).await;
    router.shutdown().await?;
    Ok(())
}

pub(crate) async fn ping(
    peer: &str,
    n: u32,
    size: usize,
    bulk_mib: usize,
    relay_only: bool,
    no_relay: bool,
) -> Result<()> {
    let peer: EndpointId = peer.parse()?;
    let mut b = Endpoint::builder(presets::N0).secret_key(secret("ping")?);
    if relay_only {
        b = b.clear_ip_transports();
    }
    if no_relay {
        b = b.relay_mode(RelayMode::Disabled);
    }
    let ep = b.bind().await?;
    let t = Instant::now();
    // Dial by key only: address lookup (n0 DNS/pkarr) resolves relay + direct addrs.
    let conn = ep.connect(peer, ALPN).await?;
    println!("connect (handshake incl. lookup) {:.0} ms", elapsed_ms(t));
    let (mut send, mut recv) = conn.open_bi().await?;
    let mut rtts = Vec::new();
    let payload = pad(size).into_bytes();
    for i in 0..n {
        let t0 = Instant::now();
        send.write_all(&(payload.len() as u32).to_be_bytes()).await?;
        send.write_all(&payload).await?;
        let mut len = [0u8; 4];
        recv.read_exact(&mut len).await?;
        let mut buf = vec![0u8; u32::from_be_bytes(len) as usize];
        recv.read_exact(&mut buf).await?;
        rtts.push(elapsed_ms(t0));
        if i == 0 || i == n - 1 {
            for p in conn.paths().iter() {
                println!(
                    "  path[{}] {:?} selected={} relay={} rtt={:?}",
                    i,
                    p.remote_addr(),
                    p.is_selected(),
                    p.is_relay(),
                    p.rtt()
                );
            }
        }
        tokio::time::sleep(Duration::from_millis(200)).await;
    }
    stats::report(
        &format!("iroh size={size} relay_only={relay_only} no_relay={no_relay}"),
        n,
        rtts,
    );
    if bulk_mib > 0 {
        let chunk = pad(4 << 20).into_bytes();
        let total = bulk_mib << 20;
        let t0 = Instant::now();
        let mut sent = 0;
        while sent < total {
            let c = &chunk[..chunk.len().min(total - sent)];
            // > 1 MiB frames are acked with just their length.
            let c = if c.len() <= 1 << 20 { &chunk[..(1 << 20) + 1] } else { c };
            send.write_all(&(c.len() as u32).to_be_bytes()).await?;
            send.write_all(c).await?;
            let mut ack = [0u8; 4];
            recv.read_exact(&mut ack).await?;
            sent += c.len();
        }
        let s = t0.elapsed().as_secs_f64();
        println!(
            "RESULT iroh bulk {} MiB in {:.2}s = {:.1} MiB/s",
            sent >> 20,
            s,
            (sent as f64 / (1 << 20) as f64) / s
        );
    }
    send.finish()?;
    conn.close(0u32.into(), b"bye");
    ep.close().await;
    Ok(())
}
</script>
<script type="text/plain" class="doc" id="d31" data-group="Prototype v1 lab (Rust)" data-title="main.rs" data-path="research/sync/lab/src/main.rs">//! nsync-lab: measurement harness for nerve's cross-device sync research.
//!
//! Every experiment is a ping/pong between two devices so RTT is measured on
//! one clock (no cross-device clock skew in the numbers).

use std::path::PathBuf;
use std::time::{Duration, Instant};

use anyhow::{bail, Context, Result};
use clap::{Parser, Subcommand};

mod iroh_lab;
mod nostr_lab;
mod stats;

#[derive(Parser)]
#[command(name = "nsync-lab")]
struct Cli {
    #[command(subcommand)]
    cmd: Cmd,
}

#[derive(Subcommand)]
enum Cmd {
    /// Create (or show) a named Nostr keypair under ~/.nsync-lab/<name>.key
    Keys { name: String },
    /// Answer pings: decrypt, echo back to sender (encrypted) on the same kind.
    Pong {
        #[arg(long)]
        key: String,
        #[arg(long, value_delimiter = ',')]
        relays: Vec<String>,
        #[arg(long, default_value_t = 600)]
        secs: u64,
    },
    /// Send N pings to a peer and report RTT stats.
    Ping {
        #[arg(long)]
        key: String,
        /// Peer public key (hex or npub)
        #[arg(long)]
        peer: String,
        #[arg(long, value_delimiter = ',')]
        relays: Vec<String>,
        #[arg(long, default_value_t = 30)]
        n: u32,
        /// Payload size in bytes (before encryption)
        #[arg(long, default_value_t = 256)]
        size: usize,
        /// Event kind: 21059 (ephemeral) or 1059-ish regular kinds, etc.
        #[arg(long, default_value_t = 21059)]
        kind: u16,
        #[arg(long, default_value_t = 400)]
        interval_ms: u64,
        /// Wrap in NIP-59 gift wrap (kind 1059) instead of a plain NIP-44 event
        #[arg(long)]
        giftwrap: bool,
    },
    /// Probe the largest event each relay accepts.
    Sizeprobe {
        #[arg(long)]
        key: String,
        #[arg(long, value_delimiter = ',')]
        relays: Vec<String>,
        #[arg(long, default_value_t = 20001)]
        kind: u16,
    },
    /// Run an embedded relay (nostr-relay-builder) on 0.0.0.0:<port>, in memory.
    Relay {
        #[arg(long, default_value_t = 7777)]
        port: u16,
    },
    /// iroh: accept echo connections; prints the endpoint id to dial.
    IrohPong {
        /// Disable the n0 relay so only direct paths can be used
        #[arg(long)]
        no_relay: bool,
        #[arg(long, default_value_t = 600)]
        secs: u64,
    },
    /// iroh: dial a peer by endpoint id and measure RTT over one QUIC stream.
    IrohPing {
        peer: String,
        #[arg(long, default_value_t = 30)]
        n: u32,
        #[arg(long, default_value_t = 256)]
        size: usize,
        /// Bulk transfer size in MiB after the RTT loop (0 to skip)
        #[arg(long, default_value_t = 0)]
        bulk_mib: usize,
        /// Disable discovery of LAN/direct addresses: relay-only path
        #[arg(long)]
        relay_only: bool,
        #[arg(long)]
        no_relay: bool,
    },
}

pub(crate) fn key_dir() -> Result<PathBuf> {
    let d = dirs_home()?.join(".nsync-lab");
    std::fs::create_dir_all(&d)?;
    Ok(d)
}

fn dirs_home() -> Result<PathBuf> {
    std::env::var_os("HOME")
        .map(PathBuf::from)
        .context("HOME not set")
}

pub(crate) fn now_ms() -> u128 {
    std::time::SystemTime::now()
        .duration_since(std::time::UNIX_EPOCH)
        .unwrap()
        .as_millis()
}

pub(crate) fn elapsed_ms(t: Instant) -> f64 {
    t.elapsed().as_secs_f64() * 1000.0
}

pub(crate) fn pad(size: usize) -> String {
    use rand::Rng;
    // Random alphanumerics so relays/compression can't shrink it.
    let mut rng = rand::rng();
    (0..size)
        .map(|_| rng.sample(rand::distr::Alphanumeric) as char)
        .collect()
}

#[tokio::main]
async fn main() -> Result<()> {
    let cli = Cli::parse();
    match cli.cmd {
        Cmd::Keys { name } => nostr_lab::keys(&name),
        Cmd::Pong { key, relays, secs } => {
            nostr_lab::pong(&key, &relays, Duration::from_secs(secs)).await
        }
        Cmd::Ping {
            key,
            peer,
            relays,
            n,
            size,
            kind,
            interval_ms,
            giftwrap,
        } => {
            if relays.is_empty() {
                bail!("--relays required");
            }
            nostr_lab::ping(
                &key,
                &peer,
                &relays,
                n,
                size,
                kind,
                Duration::from_millis(interval_ms),
                giftwrap,
            )
            .await
        }
        Cmd::Sizeprobe { key, relays, kind } => nostr_lab::sizeprobe(&key, &relays, kind).await,
        Cmd::Relay { port } => nostr_lab::relay(port).await,
        Cmd::IrohPong { no_relay, secs } => {
            iroh_lab::pong(no_relay, Duration::from_secs(secs)).await
        }
        Cmd::IrohPing {
            peer,
            n,
            size,
            bulk_mib,
            relay_only,
            no_relay,
        } => iroh_lab::ping(&peer, n, size, bulk_mib, relay_only, no_relay).await,
    }
}
</script>
<script type="text/plain" class="doc" id="d32" data-group="Prototype v1 lab (Rust)" data-title="nostr_lab.rs" data-path="research/sync/lab/src/nostr_lab.rs">use std::collections::HashMap;
use std::time::{Duration, Instant};

use anyhow::{Context, Result};
use nostr::nips::nip44;
use nostr_sdk::prelude::*;
use serde::{Deserialize, Serialize};

use crate::{elapsed_ms, key_dir, now_ms, pad, stats};

#[derive(Serialize, Deserialize)]
struct Probe {
    seq: u32,
    t: u128,
    pad: String,
}

pub(crate) fn load_keys(name: &str) -> Result<Keys> {
    let path = key_dir()?.join(format!("{name}.key"));
    if let Ok(s) = std::fs::read_to_string(&path) {
        return Ok(Keys::parse(s.trim())?);
    }
    let k = Keys::generate();
    std::fs::write(&path, k.secret_key().to_secret_hex())?;
    Ok(k)
}

pub(crate) fn keys(name: &str) -> Result<()> {
    let k = load_keys(name)?;
    println!("{} {}", k.public_key().to_hex(), k.public_key().to_bech32()?);
    Ok(())
}

async fn client(keys: &Keys, relays: &[String]) -> Result<Client> {
    let _ = keys;
    let c = Client::builder().build();
    for r in relays {
        c.add_relay(r.as_str()).await.with_context(|| format!("add {r}"))?;
    }
    let t = Instant::now();
    c.connect().and_wait(Duration::from_secs(10)).await;
    eprintln!("connected to {} relays in {:.0} ms", relays.len(), elapsed_ms(t));
    Ok(c)
}

fn parse_pk(s: &str) -> Result<PublicKey> {
    Ok(PublicKey::parse(s)?)
}

pub(crate) async fn pong(key: &str, relays: &[String], dur: Duration) -> Result<()> {
    let keys = load_keys(key)?;
    let c = client(&keys, relays).await?;
    let me = keys.public_key();
    // Plain NIP-44 probes on any kind, addressed to us with a p-tag; plus gift wraps.
    let f = Filter::new().pubkey(me).limit(0);
    c.subscribe(f).await?;
    eprintln!("pong listening as {}", me.to_hex());
    let mut rx = c.notifications();
    let deadline = Instant::now() + dur;
    let mut seen = std::collections::HashSet::new();
    while Instant::now() < deadline {
        let n = match tokio::time::timeout(Duration::from_secs(5), rx.next()).await {
            Ok(Some(n)) => n,
            Ok(None) => break,
            Err(_) => continue,
        };
        let ClientNotification::Event { event, .. } = n else {
            continue;
        };
        if !seen.insert(event.id) || event.pubkey == me && event.kind != Kind::GiftWrap {
            continue;
        }
        if event.kind == Kind::GiftWrap {
            let Ok(un) = UnwrappedGift::from_gift_wrap(&keys, &event) else {
                continue;
            };
            if un.sender == me {
                continue;
            }
            let rumor = EventBuilder::new(Kind::Custom(14), un.rumor.content.clone())
                .finalize_unsigned(me);
            let gw = GiftWrapBuilder::new(un.sender, rumor).finalize(&keys)?;
            let _ = c.send_event(&gw).await;
            continue;
        }
        let Ok(plain) = nip44::decrypt(keys.secret_key(), &event.pubkey, &event.content) else {
            continue;
        };
        let ct = nip44::encrypt(keys.secret_key(), &event.pubkey, &plain, nip44::Version::V2)?;
        let b = EventBuilder::new(event.kind, ct)
            .tag(Tag::public_key(event.pubkey))
            .tag(Tag::event(event.id))
            .tag(Tag::expiration(Timestamp::now() + 600u64));
        let _ = c.send_event(&b.finalize(&keys)?).await;
    }
    Ok(())
}

#[allow(clippy::too_many_arguments)]
pub(crate) async fn ping(
    key: &str,
    peer: &str,
    relays: &[String],
    n: u32,
    size: usize,
    kind: u16,
    interval: Duration,
    giftwrap: bool,
) -> Result<()> {
    let keys = load_keys(key)?;
    let peer = parse_pk(peer)?;
    let c = client(&keys, relays).await?;
    let me = keys.public_key();
    c.subscribe(Filter::new().pubkey(me).limit(0)).await?;
    let mut rx = c.notifications();

    let sent_at: std::sync::Arc<tokio::sync::Mutex<HashMap<u32, Instant>>> = Default::default();
    let rtts: std::sync::Arc<tokio::sync::Mutex<HashMap<u32, f64>>> = Default::default();
    let per_relay_ok: std::sync::Arc<tokio::sync::Mutex<HashMap<String, (u32, u32)>>> =
        Default::default();

    // Receiver task: first arrival of each seq wins.
    let (sa, rt, kc, cc) = (sent_at.clone(), rtts.clone(), keys.clone(), c.clone());
    let recv = tokio::spawn(async move {
        while let Some(n) = rx.next().await {
            let ClientNotification::Event { event, .. } = n else {
                continue;
            };
            let plain = if event.kind == Kind::GiftWrap {
                match UnwrappedGift::from_gift_wrap(&kc, &event) {
                    Ok(u) if u.sender != kc.public_key() => u.rumor.content,
                    _ => continue,
                }
            } else {
                if event.pubkey == kc.public_key() {
                    continue;
                }
                match nip44::decrypt(kc.secret_key(), &event.pubkey, &event.content) {
                    Ok(p) => p,
                    Err(_) => continue,
                }
            };
            let Ok(p) = serde_json::from_str::<Probe>(&plain) else {
                continue;
            };
            let t0 = sa.lock().await.get(&p.seq).copied();
            if let Some(t0) = t0 {
                rt.lock().await.entry(p.seq).or_insert_with(|| elapsed_ms(t0));
            }
        }
    });

    let mut publish_ms = Vec::new();
    for seq in 0..n {
        let body = serde_json::to_string(&Probe {
            seq,
            t: now_ms(),
            pad: pad(size),
        })?;
        let t0 = Instant::now();
        sent_at.lock().await.insert(seq, t0);
        let out = if giftwrap {
            let rumor = EventBuilder::new(Kind::Custom(14), body).finalize_unsigned(me);
            let gw = GiftWrapBuilder::new(peer, rumor).finalize(&keys)?;
            c.send_event(&gw).await.map(|o| (o.success, o.failed))
        } else {
            let ct = nip44::encrypt(keys.secret_key(), &peer, &body, nip44::Version::V2)?;
            let b = EventBuilder::new(Kind::Custom(kind), ct)
                .tag(Tag::public_key(peer))
                .tag(Tag::expiration(Timestamp::now() + 600u64));
            c.send_event(&b.finalize(&keys)?).await.map(|o| (o.success, o.failed))
        };
        publish_ms.push(elapsed_ms(t0));
        match out {
            Ok((ok, failed)) => {
                let mut pr = per_relay_ok.lock().await;
                for (r, _) in ok {
                    pr.entry(r.to_string()).or_default().0 += 1;
                }
                for (r, why) in failed {
                    let e = pr.entry(r.to_string()).or_default();
                    e.1 += 1;
                    if e.1 == 1 {
                        eprintln!("relay {r} rejected: {why}");
                    }
                }
            }
            Err(e) => eprintln!("send error: {e}"),
        }
        tokio::time::sleep(interval).await;
    }
    tokio::time::sleep(Duration::from_secs(5)).await;
    recv.abort();
    let label = format!(
        "nostr kind={} giftwrap={giftwrap} size={size} relays={}",
        if giftwrap { 1059 } else { kind },
        relays.join(",")
    );
    stats::report(&label, n, rtts.lock().await.values().copied().collect());
    stats::report("  publish-ack(OK from all relays)", n, publish_ms);
    for (r, (ok, bad)) in per_relay_ok.lock().await.iter() {
        println!("  relay {r}: accepted={ok} rejected={bad}");
    }
    Ok(())
}

pub(crate) async fn sizeprobe(key: &str, relays: &[String], kind: u16) -> Result<()> {
    let keys = load_keys(key)?;
    for r in relays {
        let c = client(&keys, std::slice::from_ref(r)).await?;
        let mut line = format!("{r}:");
        for kib in [8usize, 32, 60, 64, 100, 128, 200, 256, 500, 1000] {
            let b = EventBuilder::new(Kind::Custom(kind), pad(kib * 1024))
                .tag(Tag::expiration(Timestamp::now() + 300u64));
            let res = c.send_event(&b.finalize(&keys)?).await;
            let ok = matches!(&res, Ok(o) if !o.success.is_empty());
            line.push_str(&format!(" {kib}K={}", if ok { "ok" } else { "NO" }));
            if !ok {
                if let Ok(o) = res {
                    if let Some((_, why)) = o.failed.iter().next() {
                        line.push_str(&format!("({})", why.chars().take(60).collect::<String>()));
                    }
                }
                break;
            }
        }
        println!("{line}");
        c.disconnect().await;
    }
    Ok(())
}

pub(crate) async fn relay(port: u16) -> Result<()> {
    let relay = LocalRelay::builder()
        .addr("0.0.0.0".parse()?)
        .port(port)
        .build();
    relay.run().await?;
    eprintln!("relay listening on ws://0.0.0.0:{port}");
    tokio::signal::ctrl_c().await?;
    Ok(())
}
</script>
<script type="text/plain" class="doc" id="d33" data-group="Prototype v1 lab (Rust)" data-title="stats.rs" data-path="research/sync/lab/src/stats.rs">pub(crate) fn report(label: &str, sent: u32, mut rtts: Vec<f64>) {
    let got = rtts.len();
    if rtts.is_empty() {
        println!("RESULT {label}: sent={sent} recv=0 loss=100%");
        return;
    }
    rtts.sort_by(|a, b| a.partial_cmp(b).unwrap());
    let pct = |p: f64| rtts[((rtts.len() - 1) as f64 * p).round() as usize];
    let mean = rtts.iter().sum::<f64>() / rtts.len() as f64;
    println!(
        "RESULT {label}: sent={sent} recv={got} loss={:.1}% min={:.1} p50={:.1} mean={:.1} p95={:.1} max={:.1} (ms RTT)",
        100.0 * (sent as f64 - got as f64) / sent as f64,
        rtts[0],
        pct(0.5),
        mean,
        pct(0.95),
        rtts[rtts.len() - 1]
    );
}
</script>
<script type="text/plain" class="doc" id="d34" data-group="nerve sync source" data-title="sync/agent.rs" data-path="src/sync/agent.rs">//! The sync agent: one per device. Publishes this device's state to every
//! peer, executes commands peers send (type into a session, answer a
//! prompt, hand a session over, run a job) and keeps a view of the
//! peers for the TUI and CLI.
//!
//! Runs on its own thread with a single-threaded tokio runtime. It is a
//! worker in nerve's sense: all I/O happens here, the UI only reads
//! `SyncView` and sends `Request`s.

use std::collections::{BTreeMap, HashMap, VecDeque};
use std::path::{Path, PathBuf};
use std::sync::mpsc::{channel, Receiver, Sender, TryRecvError};
use std::sync::{Arc, Mutex};
use std::time::{Duration, Instant};

use nostr_sdk::prelude::PublicKey;
use nostr_sdk::prelude::{ClientNotification, StreamExt};

use super::chunks::{self, FileRef, Store};
use super::fleet::{self, Fleet};
use super::handoff::{self, Pack};
use super::inject;
use super::jobs;
use super::mailbox::Mailbox;
use super::modhub::{HubEvent, ModHub};
use super::pairing;
use super::bulk::{self, End};
use super::places::{self, XferPack};
use super::protocol::{
    self, Blob, Body, DeviceState, Envelope, FetchWhat, HandoffHave, HandoffManifest, HandoffOffer, JobSpec,
    JobStatus, Reassembly, RemoteSession, RunSpec, TransferStats, XferOffer, XferWhat,
    BulkOffer,
};
use super::runs;
use super::transport::{Inbound, RelayHealth, Seen, Transport};
use crate::detect::claude::{discover_sessions_with, ScanCaches};
use crate::detect::process::ProcessTable;
use crate::state::session::DiscoverySnapshot;
use crate::util::sanitize::Sanitised;

/// What a peer looks like from here. Strings in `state` came off the
/// network: sanitise before rendering.
#[derive(Debug, Clone, Default)]
pub(crate) struct PeerView {
    pub(crate) name: String,
    pub(crate) npub: String,
    pub(crate) state: Option<DeviceState>,
    /// When the peer generated the state we hold (its clock).
    pub(crate) state_generated_at: Option<u64>,
    /// When we last heard anything from it (our clock).
    pub(crate) last_heard: Option<u64>,
    pub(crate) jobs: BTreeMap<String, JobStatus>,
}

#[derive(Debug, Clone, Default)]
pub(crate) struct SyncView {
    pub(crate) me: String,
    pub(crate) npub: String,
    pub(crate) running: bool,
    pub(crate) error: Option<String>,
    pub(crate) relays: Vec<RelayHealth>,
    pub(crate) last_publish: Option<u64>,
    /// Peers the last publish reached (relay accepted).
    pub(crate) last_publish_peers: usize,
    pub(crate) peers: Vec<PeerView>,
    /// Recent activity, newest last.
    pub(crate) log: VecDeque<String>,
    /// Chunked transfers in flight: (title, parts in, parts total).
    pub(crate) incoming: Vec<(String, usize, usize)>,
    /// Fetched artefacts (title, text), newest last.
    pub(crate) blobs: VecDeque<(String, String)>,
    pub(crate) local_jobs: Vec<JobStatus>,
    pub(crate) away: bool,
    /// Hand-offs in either direction: (title, chunks done, chunks total).
    pub(crate) transfers: Vec<(String, usize, usize)>,
    /// Sessions on this device whose nerve mod is connected.
    pub(crate) mod_sessions: usize,
    pub(crate) activity: Option<PathBuf>,
}

/// Activity of the long-lived agent, one line per event, so CLI commands
/// that hand their request to it can follow the outcome.
pub(crate) fn activity_file(sync_dir: &Path) -> PathBuf {
    sync_dir.join("activity.log")
}

impl SyncView {
    fn note(&mut self, msg: impl Into<String>) {
        let line = format!("{} {}", clock(protocol::now_secs()), msg.into());
        crate::log_info!("sync: {line}");
        if let Some(f) = &self.activity {
            use std::io::Write;
            if let Ok(mut out) = std::fs::OpenOptions::new().create(true).append(true).open(f) {
                let _ = writeln!(out, "{line}");
            }
        }
        self.log.push_back(line);
        while self.log.len() > 200 {
            self.log.pop_front();
        }
    }
}

pub(crate) fn clock(secs: u64) -> String {
    let s = secs % 86_400;
    format!("{:02}:{:02}:{:02}Z", s / 3600, s % 3600 / 60, s % 60)
}

/// Things the UI / CLI ask the agent to do.
#[derive(Debug, Clone)]
pub(crate) enum Request {
    To { device: String, body: Body },
    SyncNow,
    Handoff { session_id: String, cwd: PathBuf, device: String, continue_with: Option<String>, place: Option<String>, force: bool },
    Job { spec: JobSpec, device: Option<String> },
    /// `spec.id` names the run in the activity log.
    Run { spec: RunSpec, device: String },
    /// Files or refs into a place on `device` (`pull`: from it into ours).
    /// `id` names the transfer in the activity log.
    Xfer { id: String, device: String, offer: XferOffer, pull: bool },
    SetAway(bool),
}

/// An outcome line in the activity log: `<clock> <device> ✓|✗ <id>: <msg>`.
/// Parsed by position, so a ✓ inside command output never counts.
pub(crate) fn outcome(line: &str) -> Option<(&str, bool, &str)> {
    let mut it = line.splitn(4, ' ');
    let (_clock, _from, mark, rest) = (it.next()?, it.next()?, it.next()?, it.next()?);
    let ok = match mark {
        "\u{2713}" => true,
        "\u{2717}" => false,
        _ => return None,
    };
    let (id, msg) = rest.split_once(": ").unwrap_or((rest.trim_end_matches(':'), ""));
    Some((id, ok, msg))
}

pub(crate) struct AgentHandle {
    pub(crate) view: Arc<Mutex<SyncView>>,
    tx: Sender<Request>,
}

impl AgentHandle {
    pub(crate) fn request(&self, r: Request) {
        let _ = self.tx.send(r);
    }

    pub(crate) fn snapshot(&self) -> SyncView {
        self.view.lock().map(|v| v.clone()).unwrap_or_default()
    }
}

pub(crate) struct Ctx {
    pub(crate) sync_dir: PathBuf,
    pub(crate) fleet: Fleet,
    pub(crate) statusline_dir: Option<PathBuf>,
    /// The TUI or `nerve sync agent`, as opposed to a one-shot CLI
    /// command. Only these answer hooks and take spooled requests.
    pub(crate) long_lived: bool,
}

pub(crate) fn away_flag(sync_dir: &Path) -> PathBuf {
    sync_dir.join("away")
}

pub(crate) fn heartbeat_file(sync_dir: &Path) -> PathBuf {
    sync_dir.join("agent.alive")
}

/// Is a long-lived agent running for this config dir? Hooks only wait
/// for a remote answer when someone will actually forward it. The
/// heartbeat names its pid, so a crashed agent stops counting at once.
pub(crate) fn agent_alive(sync_dir: &Path) -> bool {
    let path = heartbeat_file(sync_dir);
    let fresh = std::fs::metadata(&path)
        .and_then(|m| m.modified())
        .ok()
        .and_then(|t| t.elapsed().ok())
        .is_some_and(|age| age < Duration::from_secs(30));
    let pid = std::fs::read_to_string(&path).ok().and_then(|s| s.trim().parse::<i32>().ok());
    fresh && pid.is_some_and(|p| nix::sys::signal::kill(nix::unistd::Pid::from_raw(p), None).is_ok())
}

pub(crate) fn spawn(ctx: Ctx) -> std::io::Result<AgentHandle> {
    let view = Arc::new(Mutex::new(SyncView { me: ctx.fleet.device.clone(), ..Default::default() }));
    let (tx, rx) = channel();
    let v = view.clone();
    std::thread::Builder::new().name("nerve-sync".into()).spawn(move || {
        let rt = match tokio::runtime::Builder::new_current_thread().enable_all().build() {
            Ok(rt) => rt,
            Err(e) => {
                if let Ok(mut g) = v.lock() {
                    g.error = Some(format!("runtime: {e}"));
                }
                return;
            }
        };
        rt.block_on(run(ctx, v, rx));
    })?;
    Ok(AgentHandle { view, tx })
}

struct Agent {
    ctx: Ctx,
    t: Transport,
    view: Arc<Mutex<SyncView>>,
    peers: Vec<(String, PublicKey)>,
    mailbox: Mailbox,
    seen: Seen,
    caches: ScanCaches,
    table: ProcessTable,
    caps: Vec<String>,
    last_state: Option<String>,
    last_publish: Option<Instant>,
    publish_now: bool,
    snapshots: Vec<DiscoverySnapshot>,
    reassembly: HashMap<String, Reassembly>,
    job_tx: Sender<JobStatus>,
    job_rx: Receiver<JobStatus>,
    jobs: BTreeMap<String, (JobStatus, Option<PublicKey>)>,
    handoff_tx: Sender<String>,
    handoff_rx: Receiver<String>,
    store: Arc<Store>,
    /// Hand-offs this device is sending, by offer id.
    outgoing: HashMap<String, Outgoing>,
    /// Hand-offs this device is receiving, by offer id.
    incoming: HashMap<String, Incoming>,
    pack_tx: Sender<Packed>,
    pack_rx: Receiver<Packed>,
    /// Bulk copies this device ran as the sender: (offer id, outcome).
    bulk_tx: Sender<(String, Result<String, String>)>,
    bulk_rx: Receiver<(String, Result<String, String>)>,
    hub: Option<Arc<ModHub>>,
    /// Prompts handed to a mod, waiting for its ack: command id → sender.
    mod_cmds: HashMap<String, PublicKey>,
    open_sub: Option<nostr_sdk::prelude::SubscriptionId>,
    fleet_mtime: Option<std::time::SystemTime>,
    /// Pulls this device asked for: get id → the peer asked.
    pending_gets: HashMap<String, PublicKey>,
    /// Runs this device submitted: id → output lines already logged.
    my_runs: HashMap<String, u64>,
}

/// A finished pack from the packing thread: (offer id, its files + index).
type Packed = (String, Result<(Vec<FileRef>, FileRef), String>);

#[derive(Clone)]
enum OutJob {
    Handoff { session_id: String, cwd: PathBuf },
    Xfer { offer: XferOffer, base: PathBuf },
}

struct Outgoing {
    to: PublicKey,
    device: String,
    label: String,
    job: OutJob,
    started: Instant,
    /// Every chunk id the pack (and its index) uses.
    ids: Vec<String>,
    stats: TransferStats,
    /// Relay events this transfer published, deleted once it is over.
    events: Vec<nostr_sdk::prelude::EventId>,
}

impl Outgoing {
    fn job_for_req(&self) -> Option<String> {
        match &self.job {
            OutJob::Xfer { offer, .. } => offer.for_req.clone(),
            OutJob::Handoff { .. } => None,
        }
    }
}

/// A running rsync's progress line. It names the pull it serves too,
/// since a follower of the pull watches for that id.
fn beat(view: &Arc<Mutex<SyncView>>, re: &str, for_req: Option<&str>, line: String) {
    if let Ok(mut v) = view.lock() {
        v.note(match for_req {
            Some(g) => format!("[{re} for {g}] {line}"),
            None => format!("[{re}] {line}"),
        });
    }
}

enum InJob {
    Handoff(HandoffOffer),
    Xfer(XferOffer),
}

impl InJob {
    fn label(&self) -> String {
        match self {
            Self::Handoff(o) => o.name.clone(),
            Self::Xfer(o) => format!("place {}", o.place),
        }
    }

    fn for_req(&self) -> Option<String> {
        match self {
            Self::Handoff(_) => None,
            Self::Xfer(o) => o.for_req.clone(),
        }
    }
}

#[derive(Clone)]
enum Parsed {
    Handoff(Pack),
    Xfer(XferPack),
}

impl Parsed {
    fn files(&self) -> Vec<FileRef> {
        match self {
            Self::Handoff(p) => p.files.clone(),
            Self::Xfer(p) => p.file_refs(),
        }
    }
}

struct Incoming {
    from: PublicKey,
    job: InJob,
    dest: PathBuf,
    index: Option<FileRef>,
    pack: Option<Parsed>,
    /// The sender said it has pushed everything it thinks we lack.
    pushed: bool,
    asks: u32,
    started: Instant,
    unpacking: bool,
    /// Chunks (and their bytes) that came over the wire for this transfer.
    got_chunks: usize,
    got_bytes: u64,
}

impl Incoming {
    fn new(from: PublicKey, job: InJob, dest: PathBuf) -> Self {
        Self { from, job, dest, index: None, pack: None, pushed: false, asks: 0, started: Instant::now(), unpacking: false, got_chunks: 0, got_bytes: 0 }
    }
}

const HEARTBEAT: Duration = Duration::from_secs(60);
const MIN_GAP: Duration = Duration::from_secs(2);
/// Instructions older than this are refused rather than typed.
const SEND_MAX_AGE_SECS: u64 = 300;

async fn run(ctx: Ctx, view: Arc<Mutex<SyncView>>, rx: Receiver<Request>) {
    let keys = match fleet::device_keys(&ctx.sync_dir) {
        Ok(k) => k,
        Err(e) => return fail(&view, format!("device key: {e}")),
    };
    let t = match Transport::connect(keys, &ctx.fleet.relays).await {
        Ok(t) => t,
        Err(e) => return fail(&view, e),
    };
    let peers = ctx.fleet.peer_keys();
    let mut authors: Vec<PublicKey> = peers.iter().map(|(_, k)| *k).collect();
    authors.push(t.keys.public_key());
    let since_file = ctx.sync_dir.join("since");
    let since = std::fs::read_to_string(&since_file)
        .ok()
        .and_then(|s| s.trim().parse::<u64>().ok())
        .unwrap_or_else(|| protocol::now_secs().saturating_sub(protocol::MSG_TTL_SECS))
        .saturating_sub(120);
    if let Err(e) = t.subscribe(&authors, since).await {
        return fail(&view, format!("subscribe: {e}"));
    }
    if let Ok(mut v) = view.lock() {
        v.running = true;
        v.npub = fleet::npub(&t.keys.public_key());
        v.peers = peers
            .iter()
            .map(|(n, k)| PeerView { name: n.clone(), npub: fleet::npub(k), ..Default::default() })
            .collect();
        v.away = away_flag(&ctx.sync_dir).exists();
        if ctx.long_lived {
            let f = activity_file(&ctx.sync_dir);
            // Keep it short: only the tail matters to anyone reading it.
            if std::fs::metadata(&f).is_ok_and(|m| m.len() > 1024 * 1024) {
                let _ = std::fs::remove_file(&f);
            }
            v.activity = Some(f);
        }
        v.note(format!("agent up on {} relay(s), {} peer(s)", ctx.fleet.relays.len(), peers.len()));
    }
    let (job_tx, job_rx) = channel();
    let (handoff_tx, handoff_rx) = channel();
    let (pack_tx, pack_rx) = channel();
    let (bulk_tx, bulk_rx) = channel();
    // Sessions running the nerve mod connect here (long-lived agents only:
    // a one-shot CLI must not take the socket from the real agent).
    let hub = if ctx.long_lived {
        let hub = Arc::new(ModHub::default());
        let path = super::modhub::socket_path(&ctx.sync_dir);
        let h = hub.clone();
        let v = view.clone();
        tokio::spawn(async move {
            if let Err(e) = super::modhub::serve(path.clone(), h).await {
                if let Ok(mut g) = v.lock() {
                    g.note(format!("mod socket {} unavailable: {e}", path.display()));
                }
            }
        });
        Some(hub)
    } else {
        None
    };
    let ctx_sync_dir = ctx.sync_dir.clone();
    let mut a = Agent {
        caps: fleet::detect_caps(&ctx.fleet.caps),
        mailbox: Mailbox::new(&ctx.sync_dir),
        seen: Seen::load(ctx.sync_dir.join("seen")),
        caches: ScanCaches::new(ctx.statusline_dir.clone()),
        table: ProcessTable::refreshed(),
        ctx,
        t,
        view,
        peers,
        last_state: None,
        last_publish: None,
        publish_now: true,
        snapshots: Vec::new(),
        reassembly: HashMap::new(),
        job_tx,
        job_rx,
        jobs: BTreeMap::new(),
        handoff_tx,
        handoff_rx,
        store: Arc::new(Store::new(&ctx_sync_dir)),
        outgoing: HashMap::new(),
        incoming: HashMap::new(),
        pack_tx,
        pack_rx,
        bulk_tx,
        bulk_rx,
        hub,
        mod_cmds: HashMap::new(),
        open_sub: None,
        fleet_mtime: None,
        pending_gets: HashMap::new(),
        my_runs: HashMap::new(),
    };
    let mut notifications = a.t.client.notifications();
    let mut tick = tokio::time::interval(Duration::from_millis(500));
    let mut last_scan = Instant::now() - Duration::from_secs(60);
    let mut last_health = Instant::now() - Duration::from_secs(60);
    let mut last_fleet = Instant::now();
    let mut last_prune = Instant::now();
    a.fleet_mtime = fleet_mtime(&a.ctx.sync_dir);
    loop {
        tokio::select! {
            n = notifications.next() => {
                let Some(ClientNotification::Event { event, .. }) = n else {
                    if n.is_none() { break; }
                    continue;
                };
                if let Some(inb) = a.t.open(&event) {
                    a.handle(inb).await;
                    let _ = std::fs::write(&since_file, protocol::now_secs().to_string());
                }
            }
            _ = tick.tick() => {
                if a.ctx.long_lived {
                    let _ = std::fs::write(heartbeat_file(&a.ctx.sync_dir), std::process::id().to_string());
                    for r in super::spool::drain(&a.ctx.sync_dir) {
                        a.request(r).await;
                    }
                }
                loop {
                    match rx.try_recv() {
                        Ok(r) => a.request(r).await,
                        Err(TryRecvError::Empty) => break,
                        Err(TryRecvError::Disconnected) => {
                            a.t.disconnect().await;
                            return;
                        }
                    }
                }
                a.drain_jobs().await;
                a.drain_handoffs().await;
                a.drain_packs().await;
                a.drain_bulk().await;
                a.drain_hub().await;
                if a.ctx.long_lived && last_prune.elapsed() >= Duration::from_secs(3600) {
                    last_prune = Instant::now();
                    let store = a.store.clone();
                    tokio::task::spawn_blocking(move || store.prune());
                }
                if last_fleet.elapsed() >= Duration::from_secs(5) {
                    last_fleet = Instant::now();
                    a.reload_fleet().await;
                    a.sync_invite_subscription().await;
                }
                if last_scan.elapsed() >= Duration::from_secs(3) {
                    last_scan = Instant::now();
                    a.scan();
                }
                if last_health.elapsed() >= Duration::from_secs(10) {
                    last_health = Instant::now();
                    let h = a.t.health().await;
                    if let Ok(mut v) = a.view.lock() { v.relays = h; }
                }
                a.maybe_publish().await;
            }
        }
    }
}

fn fail(view: &Arc<Mutex<SyncView>>, e: String) {
    crate::log_warn!("sync: {e}");
    if let Ok(mut v) = view.lock() {
        v.running = false;
        v.error = Some(e);
    }
}

impl Agent {
    fn note(&self, msg: impl Into<String>) {
        if let Ok(mut v) = self.view.lock() {
            v.note(msg);
        }
    }

    fn peer_name(&self, pk: &PublicKey) -> Option<String> {
        if *pk == self.t.keys.public_key() {
            return Some(self.ctx.fleet.device.clone());
        }
        self.peers.iter().find(|(_, k)| k == pk).map(|(n, _)| n.clone())
    }

    fn peer_key(&self, name: &str) -> Option<PublicKey> {
        if name == self.ctx.fleet.device {
            return Some(self.t.keys.public_key());
        }
        self.peers.iter().find(|(n, _)| n == name).map(|(_, k)| *k)
    }

    fn scan(&mut self) {
        self.table.refresh_if_stale(Duration::from_secs(5));
        self.snapshots = discover_sessions_with(&self.table, &mut self.caches).sessions;
        let away = away_flag(&self.ctx.sync_dir).exists();
        if let Ok(mut v) = self.view.lock() {
            v.away = away;
            v.local_jobs = self.jobs.values().map(|(j, _)| j.clone()).collect();
        }
    }

    fn build_state(&self) -> DeviceState {
        let panes = inject::tmux_panes();
        let mods = self.hub.as_ref().map(|h| h.sessions()).unwrap_or_default();
        let mut ordered: Vec<&DiscoverySnapshot> = self.snapshots.iter().collect();
        // Stable order across publishes, so remote views don't reshuffle.
        ordered.sort_by(|a, b| a.cwd.cmp(&b.cwd).then_with(|| a.id.as_str().cmp(b.id.as_str())));
        let sessions = ordered
            .into_iter()
            .map(|s| RemoteSession {
                id: s.id.as_str().to_string(),
                name: s.name.as_str().to_string(),
                cwd: s.cwd.to_string_lossy().into_owned(),
                branch: s.branch.as_ref().map(|b| b.as_str().to_string()),
                state: s.detected_state.label(),
                waiting_for: s.waiting_for.as_ref().map(|w| w.as_str().to_string()),
                kind: format!("{:?}", s.kind).to_lowercase(),
                tool: s.current_tool.as_ref().map(|t| t.as_str().to_string()),
                cost_usd: crate::state::session::effective_cost(s.official.as_ref(), &s.usage),
                active_age_secs: s.activity_age_secs,
                injectable: mods.contains_key(s.id.as_str())
                    || (s.kind == crate::state::session::SessionKind::Terminal
                        && (s.tty.as_ref().is_some_and(|t| inject::pane_for_tty(&panes, t.as_str()).is_some())
                            || cfg!(target_os = "macos"))),
                via_mod: mods.contains_key(s.id.as_str()),
                last_turn: mods.get(s.id.as_str()).and_then(|(_, t)| t.clone()),
                subagents: s.jsonl_path.as_deref().map(count_subagents).unwrap_or(0),
                tail: s.jsonl_path.as_deref().map(|p| tail_lines(p, protocol::TAIL_LINES)).unwrap_or_default(),
            })
            .collect();
        DeviceState {
            device: self.ctx.fleet.device.clone(),
            host: fleet::hostname(),
            os: std::env::consts::OS.into(),
            arch: std::env::consts::ARCH.into(),
            caps: self.caps.clone(),
            nerve_version: env!("CARGO_PKG_VERSION").into(),
            generated_at: protocol::now_secs(),
            away: away_flag(&self.ctx.sync_dir).exists(),
            sessions,
            requests: {
                let mut r = self.mailbox.pending();
                if let Some(h) = &self.hub {
                    r.extend(h.pending());
                }
                r
            },
            jobs: self.jobs.values().map(|(j, _)| j.clone()).collect(),
        }
    }

    async fn maybe_publish(&mut self) {
        if self.peers.is_empty() {
            return;
        }
        if self.last_publish.is_some_and(|t| t.elapsed() < MIN_GAP) && !self.publish_now {
            return;
        }
        let state = self.build_state();
        let mut fingerprint = state.clone();
        fingerprint.generated_at = 0;
        let fp = serde_json::to_string(&fingerprint).unwrap_or_default();
        let changed = self.last_state.as_deref() != Some(fp.as_str());
        let due = self.last_publish.is_none_or(|t| t.elapsed() >= HEARTBEAT);
        if !(changed || due || self.publish_now) {
            return;
        }
        self.publish_now = false;
        self.last_publish = Some(Instant::now());
        let env = Envelope::new(&self.ctx.fleet.device, Body::State(Box::new(state)));
        let mut reached = 0;
        for (name, pk) in self.peers.clone() {
            match self.t.put_state(&pk, &env).await {
                Ok(_) => reached += 1,
                Err(e) => self.note(format!("publish to {name} failed: {e}")),
            }
        }
        self.last_state = Some(fp);
        if let Ok(mut v) = self.view.lock() {
            v.last_publish = Some(protocol::now_secs());
            v.last_publish_peers = reached;
        }
    }

    async fn reply(&self, to: &PublicKey, body: Body) {
        let env = Envelope::new(&self.ctx.fleet.device, body);
        if let Err(e) = self.t.send(to, &env).await {
            self.note(format!("send failed: {e}"));
        }
    }

    async fn ack(&self, to: &PublicKey, re: &str, ok: bool, msg: impl Into<String>) {
        let msg = msg.into();
        self.note(format!("{} {re}: {msg}", if ok { "ok" } else { "refused" }));
        self.reply(to, Body::Ack { re: re.to_string(), ok, msg }).await;
    }

    async fn handle(&mut self, inb: Inbound) {
        let Some(from) = self.peer_name(&inb.sender) else {
            // Not a fleet member. The one thing a stranger may say is
            // "here is the invite secret you handed out".
            if let Body::PairRequest { secret, name, relays } = &inb.envelope.body {
                if self.ctx.long_lived && self.seen.first(&inb.envelope.id) {
                    self.on_pair_request(&inb, secret, name, relays).await;
                }
            }
            return;
        };
        let id = inb.envelope.id.clone();
        // A one-shot CLI agent only reads; work addressed to this device
        // waits (stored) for the long-lived agent, unmarked as seen.
        let is_work = matches!(
            inb.envelope.body,
            Body::Send { .. }
                | Body::Answer { .. }
                | Body::Fetch { .. }
                | Body::HandoffOffer(_)
                | Body::HandoffManifest(_)
                | Body::ChunkData { .. }
                | Body::JobSubmit(_)
                | Body::RunSubmit(_)
                | Body::XferOffer(_)
                | Body::XferGet(_)
                | Body::PairRequest { .. }
        );
        // Except the replies to a pull this very agent asked for.
        let asked_for = match &inb.envelope.body {
            Body::XferOffer(o) => o.for_req.as_ref().is_some_and(|r| self.pending_gets.get(r) == Some(&inb.sender)),
            Body::HandoffManifest(m) => self.incoming.contains_key(&m.re),
            Body::ChunkData { re, .. } => self.incoming.contains_key(re),
            _ => false,
        };
        if is_work && !asked_for && !self.ctx.long_lived {
            return;
        }
        if !self.seen.first(&id) {
            return;
        }
        let now = protocol::now_secs();
        let is_me = inb.sender == self.t.keys.public_key();
        if !is_me {
            if let Ok(mut v) = self.view.lock() {
                if let Some(p) = v.peers.iter_mut().find(|p| p.name == from) {
                    p.last_heard = Some(now);
                }
            }
        }
        match inb.envelope.body {
            Body::State(state) => {
                if let Ok(mut v) = self.view.lock() {
                    if let Some(p) = v.peers.iter_mut().find(|p| p.name == from) {
                        let newer = p.state_generated_at.is_none_or(|g| state.generated_at >= g);
                        if newer {
                            p.state_generated_at = Some(state.generated_at);
                            p.state = Some(*state);
                        }
                    }
                }
            }
            Body::SyncNow => {
                self.publish_now = true;
                self.last_publish = None;
                self.note(format!("{from} asked for a sync"));
            }
            Body::Send { session, text } => {
                // Typing is not idempotent: never replay an old instruction,
                // even if the seen-set was lost (fresh install, wiped state).
                if now.saturating_sub(inb.envelope.sent_at.min(inb.created_at)) > SEND_MAX_AGE_SECS {
                    self.ack(&inb.sender, &id, false, "instruction too old; not typed").await;
                    return;
                }
                // The mod submits it inside Claude (queued if a turn is
                // running); its ack comes back through the hub.
                if let Some(hub) = self.hub.as_ref().filter(|h| h.connected(&session)) {
                    if hub.submit(&session, &id, &text) {
                        self.mod_cmds.insert(id.clone(), inb.sender);
                        return;
                    }
                }
                let res = self.inject(&session, &text);
                match res {
                    Ok(how) => self.ack(&inb.sender, &id, true, format!("typed into {how}")).await,
                    Err(e) => self.ack(&inb.sender, &id, false, e).await,
                }
                self.publish_now = true;
            }
            Body::Answer { request, answer } => {
                if let Some(hub) = self.hub.as_ref().filter(|h| h.has_request(&request)) {
                    let ok = hub.answer(&request, &answer);
                    let msg = if ok { format!("answered {request}") } else { "request already resolved".into() };
                    self.ack(&inb.sender, &id, ok, msg).await;
                    self.publish_now = true;
                    return;
                }
                match self.mailbox.answer(&request, &answer) {
                    Ok(true) => self.ack(&inb.sender, &id, true, format!("answered {request}")).await,
                    Ok(false) => self.ack(&inb.sender, &id, false, "request already resolved").await,
                    Err(e) => self.ack(&inb.sender, &id, false, e.to_string()).await,
                }
                self.publish_now = true;
            }
            Body::Fetch { session, what } => {
                let res = self.fetch(&session, what);
                match res {
                    Ok((title, bytes)) => {
                        for b in protocol::chunk(&id, &title, &bytes) {
                            let env = Envelope::new(&self.ctx.fleet.device, Body::Blob(b));
                            if let Err(e) = self.t.send_bulk(&inb.sender, &env).await {
                                self.note(format!("blob send failed: {e}"));
                                break;
                            }
                        }
                        self.note(format!("sent {title} ({} bytes) to {from}", bytes.len()));
                    }
                    Err(e) => self.ack(&inb.sender, &id, false, e).await,
                }
            }
            Body::Blob(b) => self.on_blob(&inb.sender, b).await,
            Body::HandoffOffer(offer) => self.on_offer(&inb.sender, &from, id.clone(), offer).await,
            Body::HandoffHave(have) => self.on_have(&inb.sender, have),
            Body::HandoffManifest(m) => self.on_manifest(&inb.sender, m).await,
            Body::ChunkWant { re, ids } => self.on_chunk_want(&inb.sender, &re, ids).await,
            Body::ChunkData { re, chunks, last } => self.on_chunk_data(&inb.sender, &re, chunks, last).await,
            // Already paired (the joiner re-ran setup): just confirm.
            Body::PairRequest { .. } => self.ack(&inb.sender, &id, true, format!("{} already trusts '{from}'", self.ctx.fleet.device)).await,
            Body::JobSubmit(spec) => self.accept_job(&inb.sender, &id, spec).await,
            Body::RunSubmit(spec) => {
                let age = now.saturating_sub(inb.envelope.sent_at.min(inb.created_at));
                self.accept_run(&inb.sender, &id, age, spec).await;
            }
            Body::XferOffer(offer) => self.on_xfer_offer(&inb.sender, &from, id.clone(), offer).await,
            Body::XferGet(offer) => self.on_xfer_get(inb.sender, &from, &id, offer).await,
            Body::JobUpdate(st) => {
                if let Ok(mut v) = self.view.lock() {
                    if let Some(p) = v.peers.iter_mut().find(|p| p.name == from) {
                        p.jobs.insert(st.id.clone(), st.clone());
                    }
                    if st.kind != "run" && (st.phase == "done" || st.phase == "failed") {
                        v.note(format!("job '{}' on {from}: {}", st.title, st.phase));
                    }
                }
                self.on_run_update(&from, &st);
            }
            Body::Ack { re, ok, msg } => {
                // A finished hand-off: the target now holds every chunk of
                // it, so the next hand-off to it can skip them.
                if let Some(o) = self.outgoing.remove(&re) {
                    if ok {
                        let _ = self.store.mark_known(&o.to.to_hex(), o.ids);
                    }
                    self.refresh_transfers();
                    // Delivered (or given up on): nothing will ask for these
                    // again, so the relay need not hold them for a day.
                    self.forget_events(o.events).await;
                }
                self.note(format!("{from} {} {re}: {msg}", if ok { "✓" } else { "✗" }));
                // The sender ended a pull we asked for (a bulk copy it ran,
                // or giving up): report it under the pull's id, which is
                // what the CLI follows.
                if let Some(get) = self.incoming.remove(&re).and_then(|i| i.job.for_req()) {
                    self.pending_gets.remove(&get);
                    self.note(format!("{from} {} {get}: {msg}", if ok { "✓" } else { "✗" }));
                    self.refresh_transfers();
                }
                self.pending_gets.remove(&re);
            }
        }
    }

    fn local_session(&self, id: &str) -> Option<&DiscoverySnapshot> {
        self.snapshots.iter().find(|s| s.id.as_str() == id || s.id.as_str().starts_with(id))
    }

    fn inject(&self, session: &str, text: &str) -> Result<String, String> {
        let snap = self.local_session(session).ok_or("no such session on this device")?;
        let target = inject::resolve(snap, &inject::tmux_panes()).ok_or("session has no pane/tab to type into")?;
        // Re-validate right before typing: the pane must still belong to
        // a live claude process (a recycled tty would type into a shell).
        let pid = snap.pid.ok_or("session has no process")?;
        let alive = ProcessTable::refreshed()
            .find_by_pid(pid)
            .is_some_and(|p| crate::detect::process::comm_name(&p.comm) == "claude");
        if !alive {
            return Err("session process is gone".into());
        }
        inject::type_into(&target, text)?;
        Ok(format!("{target:?}"))
    }

    fn fetch(&self, session: &str, what: FetchWhat) -> Result<(String, Vec<u8>), String> {
        let snap = self.local_session(session).ok_or("no such session on this device")?;
        let name = snap.name.as_str();
        match what {
            FetchWhat::Diff => {
                let run = |args: &[&str]| {
                    std::process::Command::new("git")
                        .args(args)
                        .current_dir(&snap.cwd)
                        .stdin(std::process::Stdio::null())
                        .output()
                        .map(|o| String::from_utf8_lossy(&o.stdout).into_owned())
                        .unwrap_or_default()
                };
                let mut out = format!("# {name} — {}\n\n", snap.cwd.display());
                out.push_str(&run(&["status", "--short", "--branch"]));
                out.push('\n');
                out.push_str(&run(&["diff", "HEAD", "--stat"]));
                out.push('\n');
                let mut diff = run(&["diff", "HEAD"]);
                if diff.len() > 512 * 1024 {
                    diff.truncate(512 * 1024);
                    diff.push_str("\n… diff truncated at 512 KiB\n");
                }
                out.push_str(&diff);
                Ok((format!("diff: {name}"), out.into_bytes()))
            }
            FetchWhat::Log => {
                let path = snap.jsonl_path.as_deref().ok_or("no transcript")?;
                Ok((format!("log: {name}"), tail_lines(path, 200).join("\n").into_bytes()))
            }
            FetchWhat::Subagents => {
                let path = snap.jsonl_path.as_deref().ok_or("no transcript")?;
                Ok((format!("subagents: {name}"), subagent_report(path).into_bytes()))
            }
        }
    }

    async fn on_blob(&mut self, from: &PublicKey, b: Blob) {
        let key = b.re.clone();
        let entry = self.reassembly.entry(key.clone()).or_default();
        let done = match entry.add(&b) {
            Ok(d) => d,
            Err(e) => {
                self.note(format!("bad chunk for {key}: {e}"));
                self.reassembly.remove(&key);
                return;
            }
        };
        let Some(bytes) = done else {
            let inflight: Vec<(String, usize, usize)> =
                self.reassembly.values().map(|r| { let (a, b) = r.progress(); (r.title.clone(), a, b) }).collect();
            if let Ok(mut v) = self.view.lock() {
                v.incoming = inflight;
            }
            return;
        };
        if let Ok(mut v) = self.view.lock() {
            v.incoming.retain(|(t, _, _)| *t != b.title);
        }
        let title = self.reassembly.remove(&key).map(|r| r.title).unwrap_or_default();
        let _ = from;
        let text = Sanitised::new(String::from_utf8_lossy(&bytes).into_owned()).as_str().to_string();
        self.note(format!("received {title} ({} bytes)", bytes.len()));
        if let Ok(mut v) = self.view.lock() {
            v.blobs.push_back((title, text));
            while v.blobs.len() > 10 {
                v.blobs.pop_front();
            }
        }
    }

    // ---- hand-off: offer → have → manifest → want → data → ack ----

    /// Source, step 1: tell the target what's coming and which repo it is.
    /// `asks` carries what the user chose: `continue_with`, `place`, `force`.
    async fn start_handoff(&mut self, pk: PublicKey, device: String, session_id: String, cwd: PathBuf, asks: HandoffOffer) {
        let m = match tokio::task::spawn_blocking({
            let cwd = cwd.clone();
            move || handoff::describe(&cwd)
        })
        .await
        {
            Ok(Ok(m)) => m,
            Ok(Err(e)) => return self.note(format!("handoff: {e}")),
            Err(e) => return self.note(format!("handoff: {e}")),
        };
        let offer = HandoffOffer {
            session: session_id.clone(),
            name: m.repo_name.clone(),
            src_cwd: m.src_cwd.clone(),
            repo_name: m.repo_name,
            repo_id: m.repo_id,
            branch: m.branch,
            ..asks
        };
        let env = Envelope::new(&self.ctx.fleet.device, Body::HandoffOffer(offer));
        let offer_id = env.id.clone();
        if let Err(e) = self.t.send(&pk, &env).await {
            return self.note(format!("handoff offer failed: {e}"));
        }
        self.note(format!("offered '{session_id:.8}' to {device}; waiting for it to say what it has"));
        let label = format!("handoff '{session_id:.8}'");
        self.outgoing.insert(
            offer_id,
            Outgoing { to: pk, device, label, job: OutJob::Handoff { session_id, cwd }, started: Instant::now(), ids: Vec::new(), stats: TransferStats::default(), events: Vec::new() },
        );
    }

    /// Target, step 2: report the commits our copy of the repo has.
    async fn on_offer(&mut self, from: &PublicKey, name: &str, offer_id: String, offer: HandoffOffer) {
        let dest = match handoff::destination(&offer, &self.ctx.fleet, &Fleet::file(&self.ctx.sync_dir)) {
            Ok(d) => d,
            Err(e) => return self.ack(from, &offer_id, false, e).await,
        };
        let (d, rid) = (dest.clone(), offer.repo_id.clone());
        let tips = tokio::task::spawn_blocking(move || handoff::local_tips(&d, &rid)).await.unwrap_or_default();
        self.note(format!(
            "{name} is handing over '{}' → {} ({})",
            offer.name,
            dest.display(),
            if tips.is_empty() { "new checkout".to_string() } else { format!("have {} commit tip(s)", tips.len()) }
        ));
        self.incoming.insert(offer_id.clone(), Incoming::new(*from, InJob::Handoff(offer), dest));
        self.reply(from, Body::HandoffHave(HandoffHave { re: offer_id, tips, dest: None })).await;
    }

    /// Source, step 3: pack against what the target has, off the loop.
    fn on_have(&mut self, from: &PublicKey, have: HandoffHave) {
        let Some(o) = self.outgoing.get(&have.re).filter(|o| o.to == *from) else { return };
        if let OutJob::Xfer { offer: XferOffer { bulk: Some(scan), what: XferWhat::Files { roots, delete }, place, .. }, base } = &o.job {
            // The recipient checked the place and gave its path; we copy.
            let res = match (&have.dest, self.ctx.fleet.ssh.get(&o.device)) {
                (Some(dest), Some(host)) => Ok((dest.clone(), host.clone())),
                (None, _) => Err(format!("{} gave no path for a bulk copy", o.device)),
                (_, None) => Err(format!("no [ssh] route to {}", o.device)),
            };
            let (tx, view, re) = (self.bulk_tx.clone(), self.view.clone(), have.re.clone());
            let (scan, roots, delete, place, base) = (scan.clone(), roots.clone(), *delete, place.clone(), base.clone());
