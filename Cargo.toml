[package]
name = "nerve-tui"
version = "0.5.2"
edition = "2021"
# Two binaries since the `nerve-tui` alias; keep plain `cargo run` working.
default-run = "nerve"
rust-version = "1.85"
description = "TUI for monitoring AI coding sessions across terminal tabs"
license = "MIT"
repository = "https://github.com/SaravananSai07/nerve"
authors = ["Sai Saravanan"]
readme = "README.md"
keywords = ["tui", "claude", "ai", "terminal", "monitoring"]
categories = ["command-line-utilities", "development-tools"]

# The crate is `nerve-tui` on crates.io (`nerve` was taken), but the
# command is `nerve` however it's installed.
[[bin]]
name = "nerve"
path = "src/main.rs"

# Pre-0.5.1 command name, kept so cargo upgrades replace it; execs `nerve`.
[[bin]]
name = "nerve-tui"
path = "src/bin/nerve_tui_alias.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
nix = { version = "0.29", features = ["signal", "process", "term", "fs", "poll", "hostname", "user"] }
dirs = "6"
anyhow = "1.0.102"
# Cross-device sync (`--features sync`): Nostr transport + async runtime.
nostr-sdk = { version = "0.45", optional = true, features = ["local-relay"] }
nostr = { version = "0.45", optional = true, default-features = false, features = ["std", "nip44"] }
tokio = { version = "1", optional = true, features = ["rt", "macros", "time", "sync", "signal", "net", "io-util"] }
# The fleet relay's store, bounded and swept (`serve-relay`); already in
# the tree through nostr-sdk's local relay.
nostr-memory = { version = "0.45", optional = true }
# SHA-256 for chunk ids; already in the tree through nostr.
bitcoin_hashes = { version = "0.14", optional = true }
# Invite codes as a terminal QR (`nerve setup`).
qrcode = { version = "0.14", optional = true, default-features = false }
signal-hook = "0.4.4"
notify = "7.0.0"
unicode-segmentation = "1"
unicode-width = "0.2"

[features]
default = []
# Device-to-device sync of agent progress, commands, handoff and jobs.
sync = ["dep:nostr-sdk", "dep:nostr", "dep:nostr-memory", "dep:tokio", "dep:bitcoin_hashes", "dep:qrcode"]

[dev-dependencies]
tempfile = "3.27.0"
